# Settings every process shares. A service adds its own config.default.yaml next to its main.go; an environment variable of the same name overrides both.
# The product name people see. Renaming the product starts here; internal identifiers follow with tools/rename.
BRAND_NAME: Quotify
QUOTIFY_ENV: local
QUOTIFY_VERSION: dev
QUOTIFY_LOG_LEVEL: info
QUOTIFY_METRICS_ADDR: ":9100"
QUOTIFY_MIGRATE_ONLY: "false"
# Demo mode: the mock provider only, a banner in the console. See docs/phases/phase-26-demo-and-mail.md.
QUOTIFY_DEMO: "false"
