version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog (pkg/logx)
            - pkg: go.uber.org/zap
              desc: use log/slog (pkg/logx)
            # Phase 01: services may not import other services' packages, and only internal/{worker,relay,consumer,scheduler}
            # may take the _system Postgres pool (docs/11-repo-layout.md).
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use slog (pkg/logx)
        # ADR 0010: no floating point in quantity, money and event-validation code. The exclusion below limits
        # this pattern to those packages (rating included).
        - pattern: ^float(32|64)$
          msg: no floating point in money and quantity code (ADR 0010)
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      - linters: [forbidigo]
        text: "no floating point"
        path-except: (^|/)(pkg/(quantity|money)|services/ingest-svc/internal/domain|services/billing-svc/internal/rating)/
      # Methods implementing generated gRPC interfaces must keep protoc's names (ResolveApiKey, CreateApiKey).
      - linters: [revive]
        text: "var-naming: method \\w*(Api|Url)\\w* should be"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/0furkancolak/quotify
