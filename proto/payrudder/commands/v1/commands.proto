syntax = "proto3";

package payrudder.commands.v1;

import "google/protobuf/timestamp.proto";
import "payrudder/plans/v1/resources.proto";

// CommandEnvelope is a command from billing-svc to a worker, published to the billing.commands exchange.
// Workers dedup on command_id and never infer the environment: it is stamped from the tenant by billing-svc.
//
// Evolution rules (ADR 0007): add fields only, never reuse a number, never change a type.
message CommandEnvelope {
  // uuidv5(saga_id|step|attempt).
  string command_id = 1;
  string saga_id = 2;
  string tenant_id = 3;
  // Monotonic per saga; part of the command id.
  int32 attempt = 4;
  google.protobuf.Timestamp issued_at = 5;
  payrudder.plans.v1.Environment environment = 6;
  oneof command {
    RenderInvoicePdf render_invoice_pdf = 10;
    ChargePayment charge_payment = 11;
    RefundPayment refund_payment = 12;
    QueryPaymentStatus query_payment_status = 13;
    SendNotification send_notification = 14;
    IssueEInvoice issue_e_invoice = 15;
  }
}

// ReplyEnvelope is a worker's answer, published to the billing.replies exchange.
message ReplyEnvelope {
  string command_id = 1;
  string saga_id = 2;
  string tenant_id = 3;
  // uuidv5(command_id|reply kind): the same command always yields the same reply id, so redelivered replies dedup.
  string reply_id = 4;
  oneof reply {
    PdfRendered pdf_rendered = 10;
    PdfFailed pdf_failed = 11;
    PaymentSucceeded payment_succeeded = 12;
    PaymentDeclined payment_declined = 13;
    PaymentErrored payment_errored = 14;
    PaymentRefunded payment_refunded = 15;
    PaymentStatus payment_status = 16;
    NotificationSent notification_sent = 17;
    EInvoiceResult e_invoice_result = 18;
  }
}

// InvoiceLine is one line of the invoice snapshot a command carries, so workers need no access to billing's database.
message InvoiceLineSnapshot {
  int32 line_no = 1;
  string kind = 2;
  string description = 3;
  // Display quantity, an exact decimal in meter units ("1.250"); empty for a base fee.
  string quantity = 4;
  string unit_label = 5;
  int64 amount_minor = 6;
}

message InvoiceSnapshot {
  string invoice_id = 1;
  // Bumped when the invoice is corrected; part of the PDF object key.
  int32 version = 2;
  string number = 3;
  string period_id = 4;
  string currency = 5;
  // Minor-unit exponent of the currency (2 for USD, 0 for JPY).
  int32 currency_exponent = 6;
  string tenant_name = 7;
  string customer_name = 8;
  string customer_email = 9;
  google.protobuf.Timestamp issued_at = 10;
  repeated InvoiceLineSnapshot lines = 11;
  int64 subtotal_minor = 12;
  int64 total_minor = 13;
  // Object key of the tenant's READY invoice_logo asset, if any.
  string logo_object_key = 14;
  // The seller's and the customer's postal address as printed lines (empty when none was entered).
  repeated string seller_address_lines = 15;
  repeated string customer_address_lines = 16;
  // Where and how to pay, for an invoice whose provider is a bank transfer; unset otherwise.
  PaymentInstructions payment_instructions = 17;
  // Structured parties for e-invoices; empty on snapshots made before.
  PartySnapshot seller = 18;
  PartySnapshot buyer = 19;
  // The tenant's e_invoice_on when the draft was made: "off", "finalized" or "paid".
  string e_invoice_on = 20;
}

// PartySnapshot is a seller or buyer with the legal data an e-invoice needs.
message PartySnapshot {
  string name = 1;
  string tax_id = 2;
  string tax_office = 3;
  string registration_no = 4;
  string trade_registry_no = 5;
  string line1 = 6;
  string line2 = 7;
  string city = 8;
  string region = 9;
  string postal_code = 10;
  string country = 11;
  string email = 12;
  bool e_invoice_registered = 13;
}

// IssueEInvoice asks payments-worker to issue the legal e-document of an invoice or credit note. The command is the frozen request: a resend carries the
// same document, so what the authority holds never changes. The reply is an EInvoiceResult.
message IssueEInvoice {
  // "issue" or "cancel".
  string action = 1;
  // The einvoice_documents row; its uuidv5 form is the UBL UUID.
  string document_id = 2;
  // "invoice" or "credit_note".
  string kind = 3;
  // For an invoice, the invoice. For a credit note, a snapshot whose number is the credit note's, whose lines are the credited lines and whose totals are the credited
  // amounts.
  InvoiceSnapshot document = 4;
  // Credit note only: the invoice it corrects, its document id (to find its legal number) and Payrudder number and date.
  string original_document_id = 5;
  string original_number = 6;
  google.protobuf.Timestamp original_issued_at = 7;
  string reason = 8;
  // cancel only: the external id at the provider and the reason.
  string external_id = 9;
  string provider = 10;
}

// EInvoiceResult is the worker's answer to IssueEInvoice.
message EInvoiceResult {
  // issued, cancelled, or failed.
  string state = 1;
  // For failed: retryable (a timeout, the original not issued yet) or a permanent refusal that waits for the operator.
  bool retryable = 2;
  string error_key = 3;
  string error_message = 4;
  string legal_number = 5;
  string external_id = 6;
  string document_type = 7;
  string provider = 8;
  string xml_object_key = 9;
  string pdf_object_key = 10;
}

// PaymentInstructions are the tenant's bank details and the reference the customer puts on the transfer.
message PaymentInstructions {
  string bank_name = 1;
  string account_holder = 2;
  // Normalised: capitals, no spaces.
  string iban = 3;
  string bic = 4;
  string reference = 5;
}

message RenderInvoicePdf {
  InvoiceSnapshot invoice = 1;
}

message ChargePayment {
  string invoice_id = 1;
  int64 amount_minor = 2;
  string currency = 3;
  // Opaque PSP token; in sandbox one of the pm_sandbox_* scenario tokens.
  string payment_method = 4;
  // 0 for the first charge, then 1..3 for dunning retries.
  int32 dunning_attempt = 5;
  // invoice_id:charge:dunning_attempt. Stable across retries of the same charge, so the PSP never charges twice.
  string idempotency_key = 6;
  // The payment provider of the customer's subscription. Empty means the tenant's default provider account.
  string provider = 7;
  // The number of the invoice, for providers that print a payment reference on it (a bank transfer).
  string invoice_number = 8;
}

message RefundPayment {
  string invoice_id = 1;
  int64 amount_minor = 2;
  string currency = 3;
  string psp_charge_id = 4;
  string idempotency_key = 5;
}

message QueryPaymentStatus {
  string invoice_id = 1;
  // The idempotency key of the charge in doubt.
  string idempotency_key = 2;
}

message SendNotification {
  // Versioned template name, e.g. "invoice_paid.v1".
  string template = 1;
  string to = 2;
  map<string, string> data = 3;
}

message PdfRendered {
  string object_key = 1;
  string sha256 = 2;
  int64 size_bytes = 3;
}

message PdfFailed {
  string reason = 1;
  // Error key (docs/error-keys.md) for a client to translate; reason is for logs.
  string error_key = 2;
}

message PaymentSucceeded {
  string psp_charge_id = 1;
}

message PaymentDeclined {
  string decline_code = 1;
}

message PaymentErrored {
  bool retryable = 1;
  string code = 2;
  string message = 3;
  // Error key (docs/error-keys.md) for a client to translate; code and message are for logs.
  string error_key = 4;
}

message PaymentRefunded {
  string psp_refund_id = 1;
}

message PaymentStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    // The PSP has no charge for the key.
    STATE_NOT_FOUND = 1;
    STATE_SUCCEEDED = 2;
    STATE_DECLINED = 3;
    // The charge was accepted but has not settled (a bank transfer that has not arrived yet). Ask again later.
    STATE_PENDING = 4;
  }
  State state = 1;
  string psp_charge_id = 2;
  string decline_code = 3;
}

message NotificationSent {
  // Empty when the mail was not sent.
  string message_id = 1;
  // True when the tenant switched this category of mail off: nothing was sent and none will be.
  bool suppressed = 2;
}
