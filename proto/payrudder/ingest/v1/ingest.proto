syntax = "proto3";

package payrudder.ingest.v1;

import "google/protobuf/timestamp.proto";

// IngestService accepts usage events durably and exactly once per idempotency key. The tenant comes from gRPC
// metadata (set by the gateway), never from a request body.
service IngestService {
  // IngestEvents validates, dedups and enqueues a batch. It answers per event, in request order; a structurally
  // valid batch never fails as a whole because one event is bad.
  rpc IngestEvents(IngestEventsRequest) returns (IngestEventsResponse);
  // GetOutboxWatermark is internal: billing-svc uses it for the period-close watermark.
  rpc GetOutboxWatermark(GetOutboxWatermarkRequest) returns (GetOutboxWatermarkResponse);
  // ListRejectedEvents lists the tenant's recently rejected events, newest first (plan 18): the last 14 days, at most 10 000 of them.
  rpc ListRejectedEvents(ListRejectedEventsRequest) returns (ListRejectedEventsResponse);
  // GetRejectedEventSummary counts the rejected events of the last 24 hours, by error code and by hour.
  rpc GetRejectedEventSummary(GetRejectedEventSummaryRequest) returns (GetRejectedEventSummaryResponse);
}

message IngestEventsRequest {
  // 1..500 events.
  repeated IncomingEvent events = 1;
  // Who is calling, for the record of a correction: the signed-in person's address, or "key:<api key id>". The gateway sets it; nothing else reads it.
  string actor = 2;
}

message IncomingEvent {
  // 1..128 chars of [A-Za-z0-9_.:-]. Required for live keys; sandbox keys may omit it.
  string idempotency_key = 1;
  string customer_external_id = 2;
  string meter_code = 3;
  // Exact decimal string, >= 0, at most meter.quantity_scale decimal places.
  string quantity = 4;
  google.protobuf.Timestamp event_time = 5;
  // At most 32 entries, 4 KiB in total.
  map<string, string> properties = 6;
  // A correction (ADR 0027): the idempotency key of the event this one corrects. Then `quantity` is the quantity that event should have had (0 cancels it), `reason` is
  // required, customer and meter must be the original's, and event_time and properties are omitted (it lands at the original's time).
  string corrects = 7;
  // 1..500 characters; only with `corrects`.
  string reason = 8;
}

message IngestEventsResponse {
  // Same order as the request.
  repeated EventResult results = 1;
}

message EventResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACCEPTED = 1;
    STATUS_DUPLICATE = 2;
    STATUS_REJECTED = 3;
  }
  Status status = 1;
  // Set for ACCEPTED and DUPLICATE (the original id for a duplicate).
  string event_id = 2;
  // UNKNOWN_METER, UNKNOWN_CUSTOMER, EVENT_TOO_OLD, EVENT_IN_FUTURE, INVALID_EVENT_TIME, INVALID_QUANTITY, INVALID_QUANTITY_PRECISION,
  // IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REUSED, INVALID_PROPERTIES and, for a correction, INVALID_CORRECTION,
  // CORRECTION_UNKNOWN_EVENT, CORRECTION_MISMATCH, CORRECTION_UNSUPPORTED_METER, CORRECTION_OF_CORRECTION.
  string error_code = 3;
  string error_message = 4;
}

message GetOutboxWatermarkRequest {}

message GetOutboxWatermarkResponse {
  // Unset when the outbox is empty.
  google.protobuf.Timestamp oldest_unpublished_ingested_at = 1;
  google.protobuf.Timestamp server_now = 2;
}

// RejectedEvent is the record of one rejection. It holds what the developer sent to identify the event (never its properties) and what the API answered.
message RejectedEvent {
  string id = 1;
  string error_code = 2;
  string error_message = 3;
  // As sent; may name a meter that does not exist.
  string meter_code = 4;
  // The customer id the developer sent (customer_external_id); may name a customer that does not exist.
  string customer_external_id = 5;
  // Unset when the event carried none (or none that could be read).
  google.protobuf.Timestamp event_time = 6;
  google.protobuf.Timestamp received_time = 7;
  // As sent; empty when the event had none.
  string idempotency_key = 8;
}

message ListRejectedEventsRequest {
  // Empty: every code.
  string error_code = 1;
  // Empty: every meter.
  string meter_code = 2;
  // 1..200, default 50.
  int32 page_size = 3;
  string page_token = 4;
}

message ListRejectedEventsResponse {
  repeated RejectedEvent events = 1;
  string next_page_token = 2;
}

message GetRejectedEventSummaryRequest {}

message GetRejectedEventSummaryResponse {
  message CodeCount {
    string error_code = 1;
    int32 count = 2;
  }
  message HourCount {
    // The start of the hour (UTC).
    google.protobuf.Timestamp hour = 1;
    int32 rejected = 2;
  }
  // Rejected events of the last 24 hours.
  int32 total = 1;
  // Most frequent first.
  repeated CodeCount by_code = 2;
  // 24 buckets, oldest first, the last one is the current hour.
  repeated HourCount hourly = 3;
}
