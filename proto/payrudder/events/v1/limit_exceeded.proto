syntax = "proto3";

package payrudder.events.v1;

import "google/protobuf/timestamp.proto";

// LimitExceeded says a customer's usage of a meter reached an alert threshold of its entitlement. It is published
// by limits-svc on usage.limit-exceeded.v1 (key: tenant_id), once per (customer, meter, window, threshold).
//
// Evolution rules (ADR 0007): add fields only, never reuse a number, never change a type.
message LimitExceeded {
  // uuidv5(tenant|customer|meter|period|threshold): deterministic, so consumers dedup even if limits-svc lost its
  // own "already fired" marker.
  string event_id = 1;
  string tenant_id = 2;
  string customer_id = 3;
  string meter_code = 4;
  // "2026-11".
  string period_id = 5;
  int32 threshold_pct = 6;
  // Scaled units (ADR 0010).
  int64 limit_units = 7;
  int64 used_units = 8;
  google.protobuf.Timestamp detected_at = 9;
  uint32 quantity_scale = 10;
  // The window of the quota: "month" (also when empty), "hour", "day", "week", "year" or "lifetime".
  string window = 11;
  // The window the usage was counted in: "2026-11" for a month (= period_id), "2026-11-05T13", "2026-11-05", "2026-W45", "2026" (year) or "all" (lifetime). period_id is the
  // billing period the window starts in (the current one for the lifetime window). event_id is uuidv5(tenant|customer|meter|window_id|threshold).
  string window_id = 12;
}
