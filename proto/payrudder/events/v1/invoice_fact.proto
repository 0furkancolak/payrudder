syntax = "proto3";

package payrudder.events.v1;

import "google/protobuf/timestamp.proto";

// InvoiceFact is a fact about an invoice, published by billing-svc on billing.invoices.v1 (key: tenant_id).
// Consumers dedup on (invoice_id, version).
//
// Evolution rules (ADR 0007): add fields only, never reuse a number, never change a type.
message InvoiceFact {
  string invoice_id = 1;
  string tenant_id = 2;
  string customer_id = 3;
  string period_id = 4;
  // Bumped per fact kind transition of the invoice (finalized = 1, paid = 2, ...).
  int64 version = 5;
  int64 total_minor = 6;
  string currency = 7;
  string number = 8;
  google.protobuf.Timestamp occurred_at = 9;
  oneof kind {
    Finalized finalized = 10;
    Paid paid = 11;
    Voided voided = 12;
    Corrected corrected = 13;
  }

  message Finalized {}
  message Paid {
    string psp_charge_id = 1;
  }
  message Voided {
    string reason = 1;
  }
  message Corrected {
    string original_invoice_id = 1;
  }
}
