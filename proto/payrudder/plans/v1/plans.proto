syntax = "proto3";

package payrudder.plans.v1;

import "google/protobuf/timestamp.proto";
import "payrudder/plans/v1/resources.proto";

// PlansService is the tenant-facing control plane. Every call carries the tenant in metadata (set by the gateway).
service PlansService {
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
  // GetCustomer looks a customer up by external_id.
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  // ResolveCustomer is the internal hot-path lookup (external_id → internal id). Callers cache it.
  rpc ResolveCustomer(ResolveCustomerRequest) returns (ResolveCustomerResponse);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  // SetPaymentMethod sets the PSP token. Sandbox tenants accept only pm_sandbox_* tokens.
  rpc SetPaymentMethod(SetPaymentMethodRequest) returns (SetPaymentMethodResponse);
  // SetCustomerAddress replaces the customer's billing address. An empty address clears it (the country is kept unless the address names one).
  rpc SetCustomerAddress(SetCustomerAddressRequest) returns (SetCustomerAddressResponse);
  // SetCustomerContact replaces the customer's name and e-mail address, which invoices, receipts and dunning mails carry.
  rpc SetCustomerContact(SetCustomerContactRequest) returns (SetCustomerContactResponse);
  // BlockCustomer stops new subscriptions for a customer (what exists runs on); UnblockCustomer lifts it. Blocking twice keeps the first time.
  rpc BlockCustomer(BlockCustomerRequest) returns (BlockCustomerResponse);
  rpc UnblockCustomer(UnblockCustomerRequest) returns (UnblockCustomerResponse);
  // SetCustomerTax replaces the customer's tax id, tax office and e-fatura registration flag (used on e-invoices).
  rpc SetCustomerTax(SetCustomerTaxRequest) returns (SetCustomerTaxResponse);

  // CreateMeter creates version 1 of a code, or the next version of an existing code.
  rpc CreateMeter(CreateMeterRequest) returns (CreateMeterResponse);
  // GetMeter returns the latest version of a code.
  rpc GetMeter(GetMeterRequest) returns (GetMeterResponse);
  rpc ListMeters(ListMetersRequest) returns (ListMetersResponse);

  // SetEntitlementOverride gives one customer its own limit on a meter, in place of its plan version's (or where the plan has none).
  // limits-svc applies it to the customer's current and future subscriptions within seconds.
  rpc SetEntitlementOverride(SetEntitlementOverrideRequest) returns (SetEntitlementOverrideResponse);
  // DeleteEntitlementOverride returns the customer to its plan version's entitlement on the meter.
  rpc DeleteEntitlementOverride(DeleteEntitlementOverrideRequest) returns (DeleteEntitlementOverrideResponse);
  rpc ListEntitlementOverrides(ListEntitlementOverridesRequest) returns (ListEntitlementOverridesResponse);

  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  // PublishPlanVersion appends an immutable version.
  rpc PublishPlanVersion(PublishPlanVersionRequest) returns (PublishPlanVersionResponse);
  rpc GetPlanVersion(GetPlanVersionRequest) returns (GetPlanVersionResponse);

  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  // ListSubscriptions pages through subscriptions, newest first, of one customer or all.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  // GetRoutingRules returns the ordered rules that choose a customer's payment provider from country and currency.
  rpc GetRoutingRules(GetRoutingRulesRequest) returns (GetRoutingRulesResponse);
  // SetRoutingRules replaces the rules. Existing subscriptions keep the provider they were created with.
  rpc SetRoutingRules(SetRoutingRulesRequest) returns (SetRoutingRulesResponse);
  // GetMailSettings returns, for every mail category, whether Payrudder's outgoing e-mail of that kind is on for the tenant. Every category is on until switched off.
  rpc GetMailSettings(GetMailSettingsRequest) returns (GetMailSettingsResponse);
  // SetMailSettings switches the categories listed on or off; categories not listed keep their setting. Notifier drops a mail of a category that is off.
  rpc SetMailSettings(SetMailSettingsRequest) returns (SetMailSettingsResponse);
  // PreviewRouting says where a customer in a country paying in a currency would go, without creating anything.
  rpc PreviewRouting(PreviewRoutingRequest) returns (PreviewRoutingResponse);
  // StartProviderMigration moves a subscription to another payment provider without charging the customer twice. The old subscription ends
  // only when the new one takes over (CompleteProviderMigration), or at the cutover time given.
  rpc StartProviderMigration(StartProviderMigrationRequest) returns (StartProviderMigrationResponse);
  // CompleteProviderMigration is the target provider's confirmation that the customer subscribed there: the cutover happens now.
  rpc CompleteProviderMigration(CompleteProviderMigrationRequest) returns (CompleteProviderMigrationResponse);
  rpc AbortProviderMigration(AbortProviderMigrationRequest) returns (AbortProviderMigrationResponse);
  rpc GetProviderMigration(GetProviderMigrationRequest) returns (GetProviderMigrationResponse);
  // GetSubscriptionReport counts the tenant's subscriptions and their monthly recurring revenue at the end of a month, with the new and the churned of that month,
  // by payment provider, customer country and currency. Currencies are never added together.
  rpc GetSubscriptionReport(GetSubscriptionReportRequest) returns (GetSubscriptionReportResponse);
  // GetCustomerStats counts the tenant's customers and how many were created in two ranges (the period of a dashboard and the one before it).
  rpc GetCustomerStats(GetCustomerStatsRequest) returns (GetCustomerStatsResponse);
  // SyncProviderSubscription records what a payment provider says about a subscription it runs: links it to ours and follows its status.
  // Internal: called by payments-worker, not exposed by the gateway.
  rpc SyncProviderSubscription(SyncProviderSubscriptionRequest) returns (SyncProviderSubscriptionResponse);
  // PauseSubscription stops the fixed fee from the call until ResumeSubscription. Usage is still metered and billed.
  rpc PauseSubscription(PauseSubscriptionRequest) returns (PauseSubscriptionResponse);
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (ResumeSubscriptionResponse);
  // ScheduleCancellation ends the subscription at the end of its current billing period.
  rpc ScheduleCancellation(ScheduleCancellationRequest) returns (ScheduleCancellationResponse);
  // ChangePlan ends the subscription and starts a new one on another plan version. The fixed fee of the month is split
  // between the two plans in proportion to the time on each.
  rpc ChangePlan(ChangePlanRequest) returns (ChangePlanResponse);
  // ListSubscriptionsForPeriod streams subscriptions overlapping [period_start, period_end). Used by billing-svc.
  // ListSubscriptionsFeeDue lists advance-billed subscriptions whose next fee period has started, with the period and the fee. Used by billing-svc.
  // PreviewSubscriptionChange prices a change of plan or interval without making it. ChangeSubscription makes it with the same calculation.
  rpc PreviewSubscriptionChange(PreviewSubscriptionChangeRequest) returns (PreviewSubscriptionChangeResponse);
  rpc ChangeSubscription(ChangeSubscriptionRequest) returns (ChangeSubscriptionResponse);
  // SchedulePriceChange moves every subscription on one plan version to another at its next renewal, if that renewal is at least notice_days away, and mails
  // each customer. The others are listed with why they were not scheduled; running it again later picks up the ones whose renewal was too close.
  rpc SchedulePriceChange(SchedulePriceChangeRequest) returns (SchedulePriceChangeResponse);
  rpc CancelScheduledChange(CancelScheduledChangeRequest) returns (CancelScheduledChangeResponse);
  // ApplyScheduledChanges applies the changes whose effective time has come. Used by billing-svc's tick.
  rpc ApplyScheduledChanges(ApplyScheduledChangesRequest) returns (ApplyScheduledChangesResponse);
  // ListSubscriptionAdjustments lists the money changes moved that billing-svc has not yet invoiced or credited.
  rpc ListSubscriptionAdjustments(ListSubscriptionAdjustmentsRequest) returns (ListSubscriptionAdjustmentsResponse);
  rpc MarkSubscriptionAdjustmentBilled(MarkSubscriptionAdjustmentBilledRequest) returns (MarkSubscriptionAdjustmentBilledResponse);
  // GetTaxRates and SetTaxRates hold the tax Payrudder adds to the invoices it raises, by customer country. The list is replaced as a whole.
  rpc GetTaxRates(GetTaxRatesRequest) returns (GetTaxRatesResponse);
  rpc SetTaxRates(SetTaxRatesRequest) returns (SetTaxRatesResponse);
  rpc CreateCoupon(CreateCouponRequest) returns (CreateCouponResponse);
  rpc ListCoupons(ListCouponsRequest) returns (ListCouponsResponse);
  // DeactivateCoupon stops new redemptions; subscriptions that redeemed it keep it.
  rpc DeactivateCoupon(DeactivateCouponRequest) returns (DeactivateCouponResponse);
  // ApplyCoupon redeems a coupon on a subscription that has none; RemoveCoupon takes it off (the redemption count is not given back).
  rpc ApplyCoupon(ApplyCouponRequest) returns (ApplyCouponResponse);
  rpc RemoveCoupon(RemoveCouponRequest) returns (RemoveCouponResponse);
  // CreatePromotionCodes makes codes for a coupon: the ones named, or count random ones, all with the same limit, expiry and restrictions.
  rpc CreatePromotionCodes(CreatePromotionCodesRequest) returns (CreatePromotionCodesResponse);
  rpc ListPromotionCodes(ListPromotionCodesRequest) returns (ListPromotionCodesResponse);
  // DeactivatePromotionCode stops new redemptions of one code; the coupon and its other codes are not touched.
  rpc DeactivatePromotionCode(DeactivatePromotionCodeRequest) returns (DeactivatePromotionCodeResponse);
  rpc ListCouponRedemptions(ListCouponRedemptionsRequest) returns (ListCouponRedemptionsResponse);
  // RedeemPromotion checks a typed code (or the coupon waiting for the customer when code is empty) against a purchase and, unless preview is set, claims it.
  // Claiming is idempotent per (target, target_id): asking again for the same purchase returns the same redemption. billing-svc calls it when an invoice is made.
  rpc RedeemPromotion(RedeemPromotionRequest) returns (RedeemPromotionResponse);
  // ReversePromotion gives a redemption back after a void or a full refund. Reversing a purchase that used no coupon, or twice, does nothing.
  rpc ReversePromotion(ReversePromotionRequest) returns (ReversePromotionResponse);
  // GrantCustomerCoupon puts a coupon in wait for a customer: their next eligible checkout without a typed code uses it. One grant per (customer, source, source_ref).
  rpc GrantCustomerCoupon(GrantCustomerCouponRequest) returns (GrantCustomerCouponResponse);
  rpc ListSubscriptionsFeeDue(ListSubscriptionsFeeDueRequest) returns (ListSubscriptionsFeeDueResponse);
  // AdvanceSubscriptionFee records that the fee period starting at period_start has been dealt with (invoiced or waived). Idempotent.
  rpc AdvanceSubscriptionFee(AdvanceSubscriptionFeeRequest) returns (AdvanceSubscriptionFeeResponse);
  rpc ListSubscriptionsForPeriod(ListSubscriptionsForPeriodRequest) returns (stream ListSubscriptionsForPeriodResponse);
}

message CreateCustomerRequest {
  string external_id = 1;
  string name = 2;
  string email = 3;
  string payment_method = 4;
  string country = 5;
  string billing_currency = 6;
  // The billing address. If it has a country, that is the customer's country (country above must be empty or equal).
  Address address = 7;
  // The code of the affiliate whose link or code brought this customer (phase 47), as the tenant's own sign-up saw it. Optional; a code that cannot attribute
  // (unknown, expired, self-referral) does not fail the creation.
  string referral_code = 8;
  // When the visitor followed that link; empty is now.
  google.protobuf.Timestamp referral_touch_time = 9;
  // The language of the customer's mails and pages, and whether it is a person or a business; both optional (see Customer).
  string locale = 10;
  string customer_type = 11;
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message GetCustomerRequest {
  // Either external_id, or the internal id (internal callers that only hold the id, e.g. notifier).
  string external_id = 1;
  string id = 2;
}

message GetCustomerResponse {
  Customer customer = 1;
}

message ResolveCustomerRequest {
  string external_id = 1;
}

message ResolveCustomerResponse {
  Customer customer = 1;
}

message ListCustomersRequest {
  // 1..500, default 100.
  int32 page_size = 1;
  string page_token = 2;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  string next_page_token = 2;
}

message SetPaymentMethodRequest {
  string external_id = 1;
  string payment_method = 2;
}

message SetPaymentMethodResponse {
  Customer customer = 1;
}

message SetCustomerAddressRequest {
  string external_id = 1;
  Address address = 2;
}

message SetCustomerAddressResponse {
  Customer customer = 1;
}

message SetCustomerContactRequest {
  string external_id = 1;
  string name = 2;
  string email = 3;
  string locale = 4;
  string customer_type = 5;
}

message SetCustomerContactResponse {
  Customer customer = 1;
}

message BlockCustomerRequest {
  string external_id = 1;
  // The seller's note, at most 500 characters.
  string reason = 2;
}

message BlockCustomerResponse {
  Customer customer = 1;
}

message UnblockCustomerRequest {
  string external_id = 1;
}

message UnblockCustomerResponse {
  Customer customer = 1;
}

message SetCustomerTaxRequest {
  string external_id = 1;
  string tax_id = 2;
  string tax_office = 3;
  bool e_invoice_registered = 4;
}

message SetCustomerTaxResponse {
  Customer customer = 1;
}

message CreateMeterRequest {
  string code = 1;
  Aggregation aggregation = 2;
  string value_property = 3;
  map<string, FilterValues> filter = 4;
  uint32 quantity_scale = 5;
  string unit_label = 6;
  // Free-form, at most 64 characters. A new version may change it.
  string category = 7;
}

message CreateMeterResponse {
  Meter meter = 1;
}

message GetMeterRequest {
  string code = 1;
}

message GetMeterResponse {
  Meter meter = 1;
}

message ListMetersRequest {}

message ListMetersResponse {
  // Latest version of each code.
  repeated Meter meters = 1;
}

message SetEntitlementOverrideRequest {
  string customer_external_id = 1;
  string meter_code = 2;
  string limit = 3;
  repeated int32 alert_thresholds_pct = 4;
  QuotaWindow window = 5;
  QuotaMode mode = 6;
}

message SetEntitlementOverrideResponse {
  EntitlementOverride override = 1;
}

message DeleteEntitlementOverrideRequest {
  string customer_external_id = 1;
  string meter_code = 2;
}

message DeleteEntitlementOverrideResponse {}

message ListEntitlementOverridesRequest {
  string customer_external_id = 1;
}

message ListEntitlementOverridesResponse {
  // Ordered by meter code.
  repeated EntitlementOverride overrides = 1;
}

message CreatePlanRequest {
  string code = 1;
  string name = 2;
}

message CreatePlanResponse {
  Plan plan = 1;
}

message ListPlansRequest {}

message ListPlansResponse {
  repeated Plan plans = 1;
}

message PublishPlanVersionRequest {
  string plan_code = 1;
  int64 base_fee_minor = 2;
  repeated Price prices = 3;
  repeated Entitlement entitlements = 4;
  // Fixed fees in other currencies (each different from the tenant's, no duplicates).
  repeated CurrencyFee fees = 5;
  // Usage prices in those currencies. A currency with prices must have a fee above, and prices must cover exactly the
  // meters in `prices`.
  repeated CurrencyPrices currency_prices = 6;
  // 0..365. The trial a new subscription to this version gets unless its request says otherwise. 0 = none.
  int32 trial_days = 7;
}

message PublishPlanVersionResponse {
  PlanVersion plan_version = 1;
}

message GetPlanVersionRequest {
  // Either plan_version_id, or plan_code + version (0 = latest).
  string plan_version_id = 1;
  string plan_code = 2;
  int32 version = 3;
}

message GetPlanVersionResponse {
  PlanVersion plan_version = 1;
}

message CreateSubscriptionRequest {
  string customer_external_id = 1;
  string plan_code = 2;
  // 0 = latest published version.
  int32 plan_version = 3;
  // Unset = now.
  google.protobuf.Timestamp start_time = 4;
  // 0..365. Unset = the plan version's own default (PlanVersion.trial_days); 0 = no trial whatever the default is.
  optional int32 trial_days = 5;
  // Unspecified = month.
  SubscriptionInterval interval = 6;
  // Unset = the customer's billing currency, else the tenant's. The plan version must have a fee in it.
  string currency = 7;
  // The payment provider that sells it (a name such as "paddle"); empty is the tenant's default.
  string provider = 8;
  // Unspecified = in advance (the fee is invoiced at the start of each period), except for a provider that runs renewals itself.
  FeeTiming fee_timing = 9;
  // A coupon to redeem on the new subscription.
  string coupon_code = 10;
  // Seats (licences): the plan's fixed fee is multiplied by it. 0 = 1. Only for a subscription Payrudder runs and bills in advance.
  int32 quantity = 11;
}

message CreateSubscriptionResponse {
  Subscription subscription = 1;
}

message CancelSubscriptionRequest {
  string subscription_id = 1;
  // Unset = now.
  google.protobuf.Timestamp end_time = 2;
  // Credit the customer's balance with the unused part of the fee that was paid in advance for the current period. Only for a subscription billed in
  // advance that Payrudder runs, ended now (not later), and without a coupon. Off by default: the customer keeps what they paid for.
  bool credit_unused = 3;
}

message CancelSubscriptionResponse {
  Subscription subscription = 1;
  // What was credited (minor units of the subscription's currency); 0 when credit_unused was off or nothing was prepaid.
  int64 credited_minor = 2;
}

message ListSubscriptionsForPeriodRequest {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
}

message ListSubscriptionsForPeriodResponse {
  Subscription subscription = 1;
}

message GetSubscriptionRequest {
  string subscription_id = 1;
}

message GetSubscriptionResponse {
  Subscription subscription = 1;
}

message PauseSubscriptionRequest {
  string subscription_id = 1;
}

message PauseSubscriptionResponse {
  Subscription subscription = 1;
}

message ResumeSubscriptionRequest {
  string subscription_id = 1;
}

message ResumeSubscriptionResponse {
  Subscription subscription = 1;
}

message ScheduleCancellationRequest {
  string subscription_id = 1;
  // false withdraws a scheduled cancellation.
  bool cancel = 2;
}

message ScheduleCancellationResponse {
  Subscription subscription = 1;
}

message ChangePlanRequest {
  string subscription_id = 1;
  string plan_code = 2;
  // 0 = latest published version.
  int32 plan_version = 3;
  // Unset = now.
  google.protobuf.Timestamp change_time = 4;
}

message ChangePlanResponse {
  // The new subscription. The old one ends at change_time.
  Subscription subscription = 1;
  // What the fixed fee of the current billing month will be split into on its invoice, in the subscription's currency:
  // the old plan's share up to change_time and the new plan's share from it. Informational; billing recomputes them.
  int64 old_plan_fee_minor = 2;
  int64 new_plan_fee_minor = 3;
}

message SyncProviderSubscriptionRequest {
  string subscription_id = 1;
  string provider = 2;
  string provider_ref = 3;
  // "payrudder" or "provider", from the provider's capabilities.
  string owner = 4;
  // The provider's status word: active, trialing, past_due, paused or canceled. Empty links without changing the state.
  string provider_status = 5;
  // When the provider says it happened; an event older than the last one applied is ignored.
  google.protobuf.Timestamp occurred_at = 6;
  // The plan version and interval the provider now bills the subscription for, when the provider says (a change made at the provider, or by Payrudder through it).
  // If they differ from the subscription's, it moves to them at occurred_at with no money (the provider has billed the change). Only for owner "provider".
  string plan_version_id = 7;
  SubscriptionInterval interval = 8;
}

message SyncProviderSubscriptionResponse {
  Subscription subscription = 1;
}

// RoutingRule sends customers who match to a provider. An empty country or currency matches any. The first matching rule wins; a rule with
// neither is the catch-all and must be last. No match means the tenant's default provider account.
message RoutingRule {
  // ISO 3166-1 alpha-2, e.g. "TR". Empty = any country.
  string country = 1;
  // ISO 4217, e.g. "TRY". Empty = any currency.
  string currency = 2;
  // A provider name from the catalogue: iyzico or paddle.
  string provider = 3;
}

// MailCategorySetting is one kind of mail and whether it is sent. Categories: invoice_issued, payment_receipts, payment_failed, usage_alerts, system.
message MailCategorySetting {
  string category = 1;
  bool enabled = 2;
}

message GetMailSettingsRequest {}

message GetMailSettingsResponse {
  // Every category, in a fixed order.
  repeated MailCategorySetting categories = 1;
}

message SetMailSettingsRequest {
  // The categories to change. An unknown category is rejected (plans.mail.unknown_category); a category listed twice takes its last value.
  repeated MailCategorySetting categories = 1;
}

message SetMailSettingsResponse {
  repeated MailCategorySetting categories = 1;
}

message GetRoutingRulesRequest {}

message GetRoutingRulesResponse {
  repeated RoutingRule rules = 1;
}

message SetRoutingRulesRequest {
  repeated RoutingRule rules = 1;
}

message SetRoutingRulesResponse {
  repeated RoutingRule rules = 1;
}

message PreviewRoutingRequest {
  string country = 1;
  string currency = 2;
}

message PreviewRoutingResponse {
  // Empty when no rule matches: the tenant's default provider account.
  string provider = 1;
  // Position of the matching rule, -1 when none matched.
  int32 rule_index = 2;
  // "payrudder" or "provider": who renews and retries a subscription sold through it; empty when no provider is chosen.
  string owner = 3;
  // Whether the chosen provider can charge in the currency (always true when no provider is chosen).
  bool can_charge = 4;
}

// ProviderMigration is a subscription on its way from one payment provider to another.
message ProviderMigration {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Waiting for the target provider: the old subscription is untouched.
    STATE_STARTED = 1;
    // The new subscription has taken over from cutover_time.
    STATE_COMPLETED = 2;
    // Given up before the cutover: the old subscription is as it was.
    STATE_ABORTED = 3;
  }
  string id = 1;
  string subscription_id = 2;
  string new_subscription_id = 3;
  string from_provider = 4;
  string to_provider = 5;
  State state = 6;
  google.protobuf.Timestamp cutover_time = 7;
  google.protobuf.Timestamp create_time = 8;
}

message StartProviderMigrationRequest {
  string subscription_id = 1;
  string to_provider = 2;
  // When the new subscription takes over, for a target Payrudder runs itself. Unset = now. Required when the old subscription is run by a provider,
  // since its paid period must not be cut short (the end of that period).
  google.protobuf.Timestamp cutover_time = 3;
}

message StartProviderMigrationResponse {
  ProviderMigration migration = 1;
}

message CompleteProviderMigrationRequest {
  string migration_id = 1;
  // The target provider's id of the new subscription.
  string provider_ref = 2;
  // Unset = now.
  google.protobuf.Timestamp cutover_time = 3;
}

message CompleteProviderMigrationResponse {
  ProviderMigration migration = 1;
  // The subscription that took over.
  Subscription subscription = 2;
  // What the old subscription was at its provider, so the caller can release it there: empty when Payrudder ran it.
  string source_provider = 3;
  string source_provider_ref = 4;
}

message AbortProviderMigrationRequest {
  string migration_id = 1;
}

message AbortProviderMigrationResponse {
  ProviderMigration migration = 1;
}

message GetProviderMigrationRequest {
  string migration_id = 1;
}

message GetProviderMigrationResponse {
  ProviderMigration migration = 1;
}

message GetSubscriptionReportRequest {
  // YYYY-MM in the tenant's time zone. Empty = the current month.
  string month = 1;
  // Which of provider, country and plan to split by; currency is always a split.
  repeated string group_by = 2;
}

message SubscriptionReportRow {
  // Empty when the report is not split by it ("none" provider is the tenant's default account).
  string provider = 1;
  string country = 2;
  string currency = 3;
  // At the last instant of the month, by what the subscription was then.
  int64 active = 4;
  int64 trialing = 5;
  int64 paused = 6;
  int64 past_due = 7;
  // Fixed fees per month of the active and past due subscriptions, in minor units of the currency. Usage is not recurring and is not in it.
  int64 mrr_minor = 8;
  // Subscriptions that started in the month (a plan change or a provider migration is not new) and their fixed fee.
  int64 new_subscriptions = 9;
  int64 new_mrr_minor = 10;
  // Subscriptions that ended in the month with no successor (a plan change or a provider migration is not churn) and the fixed fee they paid.
  int64 churned = 11;
  int64 churned_mrr_minor = 12;
  // The package code, when the report is split by plan; empty otherwise.
  string plan_code = 13;
}

message GetSubscriptionReportResponse {
  string month = 1;
  repeated SubscriptionReportRow rows = 2;
}

message GetCustomerStatsRequest {
  // Customers created in [from_time, to_time) and in [prev_from_time, prev_to_time). An unset pair counts none.
  google.protobuf.Timestamp from_time = 1;
  google.protobuf.Timestamp to_time = 2;
  google.protobuf.Timestamp prev_from_time = 3;
  google.protobuf.Timestamp prev_to_time = 4;
}

message GetCustomerStatsResponse {
  int64 total = 1;
  int64 new_in_range = 2;
  int64 new_in_previous = 3;
}

message ListSubscriptionsRequest {
  // Optional: only this customer's.
  string customer_external_id = 1;
  // 1..200, default 50.
  int32 page_size = 2;
  string page_token = 3;
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  string next_page_token = 2;
}

message ListSubscriptionsFeeDueRequest {
  google.protobuf.Timestamp now = 1;
  // Resume after this subscription id (the last of the previous page); empty for the first page.
  string after = 2;
  // 1..500, default 100.
  int32 page_size = 3;
}

message FeeDue {
  Subscription subscription = 1;
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
  // The fee of the period in the subscription's currency and interval; 0 when the plan version has none.
  int64 fee_minor = 4;
  // What the subscription's coupon takes off this period's fee (0 when none applies), and the coupon.
  int64 discount_minor = 5;
  string coupon_code = 6;
}

message ListSubscriptionsFeeDueResponse {
  repeated FeeDue due = 1;
}

message AdvanceSubscriptionFeeRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp period_start = 2;
}

message AdvanceSubscriptionFeeResponse {}

enum ChangeTiming {
  CHANGE_TIMING_UNSPECIFIED = 0;
  CHANGE_TIMING_IMMEDIATELY = 1;
  CHANGE_TIMING_PERIOD_END = 2;
}

enum ChangeProration {
  CHANGE_PRORATION_UNSPECIFIED = 0;
  // Credit the unused old time; within the interval charge the new plan for the rest of the period and keep the cycle.
  CHANGE_PRORATION_PRORATE = 1;
  // Credit the unused old time and start a new cycle now, charging the new fee in full.
  CHANGE_PRORATION_FULL = 2;
  // Move no money now; the new plan is billed from the next period.
  CHANGE_PRORATION_NONE = 3;
}

message ChangeSubscriptionRequest {
  string subscription_id = 1;
  // Empty keeps the plan (to change the interval only).
  string plan_code = 2;
  // 0 = latest published version.
  int32 plan_version = 3;
  // Unspecified keeps the interval.
  SubscriptionInterval interval = 4;
  // Unspecified: an upgrade or monthly-to-yearly is immediate, a downgrade or yearly-to-monthly waits for the end of the paid period.
  ChangeTiming timing = 5;
  // Unspecified: prorate.
  ChangeProration proration = 6;
  // Unset = now. Only for immediate changes.
  google.protobuf.Timestamp change_time = 7;
  // The new quantity. 0 keeps it. A change of quantity alone is immediate and prorated unless timing says otherwise.
  int32 quantity = 8;
}

message SchedulePriceChangeRequest {
  string plan_code = 1;
  // The version the subscriptions are on now.
  int32 from_version = 2;
  // The version they move to. 0 = the latest published one.
  int32 to_version = 3;
  // How many days before the renewal the customer must be told at the least. 0 = 30. At least 14.
  int32 notice_days = 4;
  // Only count, change nothing and mail nobody.
  bool dry_run = 5;
}

message PriceChangeSkipped {
  string subscription_id = 1;
  string customer_external_id = 2;
  // renews_soon, has_pending_change, run_by_provider, not_changeable.
  string reason = 3;
}

message SchedulePriceChangeResponse {
  int32 scheduled = 1;
  repeated string scheduled_subscription_ids = 2;
  repeated PriceChangeSkipped skipped = 3;
  int32 to_version = 4;
  int32 notice_days = 5;
}

message ChangeQuote {
  ChangeTiming timing = 1;
  ChangeProration proration = 2;
  google.protobuf.Timestamp effective_time = 3;
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end = 5;
  // The unused, prepaid part of the old fee.
  int64 credit_minor = 6;
  // What the new plan costs from the change (the period's rest, or in full for a new cycle).
  int64 charge_minor = 7;
  // charge - credit: positive is invoiced, negative goes to the customer's credit balance.
  int64 net_minor = 8;
  string currency = 9;
  google.protobuf.Timestamp next_renewal_time = 10;
  int64 next_renewal_minor = 11;
  string plan_code = 12;
  int32 plan_version = 13;
  SubscriptionInterval interval = 14;
  // The quantity after the change.
  int32 quantity = 15;
}

message PreviewSubscriptionChangeRequest {
  ChangeSubscriptionRequest change = 1;
}

message PreviewSubscriptionChangeResponse {
  ChangeQuote quote = 1;
}

message ChangeSubscriptionResponse {
  // The subscription the customer is on after the call: the new one for an immediate change, the unchanged one (with scheduled_change) otherwise.
  Subscription subscription = 1;
  ChangeQuote quote = 2;
  bool scheduled = 3;
}

message CancelScheduledChangeRequest {
  string subscription_id = 1;
}

message CancelScheduledChangeResponse {
  Subscription subscription = 1;
}

message ApplyScheduledChangesRequest {
  google.protobuf.Timestamp now = 1;
}

message ApplyScheduledChangesResponse {
  int32 applied = 1;
}

message Adjustment {
  string id = 1;
  // The subscription the change created.
  Subscription subscription = 2;
  int64 credit_minor = 3;
  int64 charge_minor = 4;
  google.protobuf.Timestamp from_time = 5;
  google.protobuf.Timestamp to_time = 6;
  string old_plan_code = 7;
}

message ListSubscriptionAdjustmentsRequest {
  // 1..500, default 100.
  int32 page_size = 1;
}

message ListSubscriptionAdjustmentsResponse {
  repeated Adjustment adjustments = 1;
}

message MarkSubscriptionAdjustmentBilledRequest {
  string adjustment_id = 1;
}

message MarkSubscriptionAdjustmentBilledResponse {}

message CreateCouponRequest {
  Coupon coupon = 1;
}

message CreateCouponResponse {
  Coupon coupon = 1;
}

message ListCouponsRequest {}

message ListCouponsResponse {
  repeated Coupon coupons = 1;
}

message DeactivateCouponRequest {
  string code = 1;
}

message DeactivateCouponResponse {
  Coupon coupon = 1;
}

message ApplyCouponRequest {
  string subscription_id = 1;
  string code = 2;
}

message ApplyCouponResponse {
  Subscription subscription = 1;
}

message RemoveCouponRequest {
  string subscription_id = 1;
}

message RemoveCouponResponse {
  Subscription subscription = 1;
}

message CreatePromotionCodesRequest {
  string coupon_code = 1;
  // What every new code shares: limits and restrictions. Its id, code, redeemed and coupon_code are ignored.
  PromotionCode template = 2;
  // The codes to make, 2-40 letters, digits, - or _. Case does not matter: SUMMER and summer are one code.
  repeated string codes = 3;
  // Or: how many random codes to make (1-1000). Both may not be given.
  int32 count = 4;
  // Random codes are prefix + 8 characters (no 0, O, 1, I, L).
  string prefix = 5;
}

message CreatePromotionCodesResponse {
  repeated PromotionCode codes = 1;
}

message ListPromotionCodesRequest {
  // Empty means every coupon.
  string coupon_code = 1;
  // active, inactive or empty for both.
  string state = 2;
  string search = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListPromotionCodesResponse {
  repeated PromotionCode codes = 1;
  string next_page_token = 2;
  int32 total = 3;
}

message DeactivatePromotionCodeRequest {
  string code = 1;
}

message DeactivatePromotionCodeResponse {
  PromotionCode code = 1;
}

message ListCouponRedemptionsRequest {
  string coupon_code = 1;
  string promotion_code = 2;
  string customer_external_id = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListCouponRedemptionsResponse {
  repeated CouponRedemption redemptions = 1;
  string next_page_token = 2;
  int32 total = 3;
}

message RedeemPromotionRequest {
  // What the customer typed. Empty: use the coupon waiting for the customer, if any.
  string code = 1;
  string customer_external_id = 2;
  CouponTarget target = 3;
  // The purchase this redemption belongs to (the invoice id). Asking twice for the same one is one redemption.
  string target_id = 4;
  // The price before the discount, in minor units, and its currency.
  int64 amount_minor = 5;
  string currency = 6;
  // The plan code (SUBSCRIPTION) or the credit pack id (CREDIT_PURCHASE), for the codes restricted to some.
  string item = 7;
  // The credits sold (CREDIT_PURCHASE), for a bonus coupon.
  int64 credits = 8;
  // The customer has paid for something before (billing-svc knows; plans-svc knows only subscriptions).
  bool prior_purchases = 9;
  // Check only: claim nothing, write nothing.
  bool preview = 10;
  // The invoice the redemption ends up on, if known when claiming.
  string invoice_id = 11;
}

message RedeemPromotionResponse {
  // False when nothing applies (no code typed and nothing waiting).
  bool applied = 1;
  string redemption_id = 2;
  string coupon_code = 3;
  string coupon_name = 4;
  string promotion_code = 5;
  int64 discount_minor = 6;
  int64 bonus_credits = 7;
  // amount_minor - discount_minor.
  int64 total_minor = 8;
  string currency = 9;
}

message ReversePromotionRequest {
  CouponTarget target = 1;
  string target_id = 2;
}

message ReversePromotionResponse {
  bool reversed = 1;
}

message GrantCustomerCouponRequest {
  string customer_external_id = 1;
  string coupon_code = 2;
  string source = 3;
  string source_ref = 4;
}

message GrantCustomerCouponResponse {
  // False when the same (customer, source, source_ref) had been granted already.
  bool granted = 1;
}

// TaxRate is a tax added on top of the price for customers in a country.
message TaxRate {
  // ISO 3166-1 alpha-2, or empty for every country without a rate of its own.
  string country = 1;
  // Shown on the invoice, e.g. "VAT".
  string name = 2;
  // 2000 is 20 %. Zero is a rate that adds nothing (and says so on no invoice).
  int32 rate_bps = 3;
}

message GetTaxRatesRequest {}

message GetTaxRatesResponse {
  repeated TaxRate rates = 1;
}

message SetTaxRatesRequest {
  repeated TaxRate rates = 1;
}

message SetTaxRatesResponse {
  repeated TaxRate rates = 1;
}
