syntax = "proto3";

package payrudder.plans.v1;

import "google/protobuf/timestamp.proto";

// AffiliateService is the partner program of a tenant (phase 47): the program's rules, its affiliates, who they brought. The tenant comes from gRPC metadata,
// so a sandbox key sees the sandbox program and a live key the live one.
service AffiliateService {
  // GetAffiliateProgram returns the program, or NotFound (affiliate.program.not_set) before one is set.
  rpc GetAffiliateProgram(GetAffiliateProgramRequest) returns (GetAffiliateProgramResponse);
  // SetAffiliateProgram creates or replaces the program. Changing it affects commissions earned from then on, never those already earned.
  rpc SetAffiliateProgram(SetAffiliateProgramRequest) returns (SetAffiliateProgramResponse);
  rpc CreateAffiliate(CreateAffiliateRequest) returns (CreateAffiliateResponse);
  rpc ListAffiliates(ListAffiliatesRequest) returns (ListAffiliatesResponse);
  rpc GetAffiliate(GetAffiliateRequest) returns (GetAffiliateResponse);
  // UpdateAffiliate changes the name, payout details and status (approve a pending one, suspend, reinstate).
  rpc UpdateAffiliate(UpdateAffiliateRequest) returns (UpdateAffiliateResponse);
  // LinkAffiliatePromotionCode makes a promotion code the affiliate's: a customer who redeems it is attributed to them.
  rpc LinkAffiliatePromotionCode(LinkAffiliatePromotionCodeRequest) returns (LinkAffiliatePromotionCodeResponse);
  // AttributeCustomer says that a customer came through an affiliate's link or code. First touch wins: a customer who has an attribution keeps it.
  // Idempotent; a refusal is a normal answer (attributed=false and a reason), not an error.
  rpc AttributeCustomer(AttributeCustomerRequest) returns (AttributeCustomerResponse);
  rpc ListAffiliateReferrals(ListAffiliateReferralsRequest) returns (ListAffiliateReferralsResponse);
  // ListAffiliateCommissions lists commissions and the reversal rows that net against them, newest first.
  rpc ListAffiliateCommissions(ListAffiliateCommissionsRequest) returns (ListAffiliateCommissionsResponse);
  // ReverseAffiliateCommission takes a commission back for a chargeback, or by hand. Refunds, voids and credit notes are reversed on their own.
  // Idempotent per (invoice, reason, reference).
  rpc ReverseAffiliateCommission(ReverseAffiliateCommissionRequest) returns (ReverseAffiliateCommissionResponse);
  // GetAffiliateBalances is what each affiliate has per currency: pending, available for a payout, paid out and taken back.
  rpc GetAffiliateBalances(GetAffiliateBalancesRequest) returns (GetAffiliateBalancesResponse);
  // GetAffiliateFunnel counts clicks, referred customers, paying customers and commissions over a period.
  rpc GetAffiliateFunnel(GetAffiliateFunnelRequest) returns (GetAffiliateFunnelResponse);
  rpc ListAffiliatePayouts(ListAffiliatePayoutsRequest) returns (ListAffiliatePayoutsResponse);
  // CreateAffiliatePayouts puts the approved commissions (and the negative rows that net earlier payments taken back) of one affiliate, or of all, into open
  // payouts, one per currency. A batch below the program's minimum, or not above zero, is skipped and said so.
  rpc CreateAffiliatePayouts(CreateAffiliatePayoutsRequest) returns (CreateAffiliatePayoutsResponse);
  // MarkAffiliatePayoutPaid records that the owner paid an open payout (by hand or bank transfer; nothing moves here) and posts it to the journal.
  rpc MarkAffiliatePayoutPaid(MarkAffiliatePayoutPaidRequest) returns (MarkAffiliatePayoutPaidResponse);
  // CancelAffiliatePayout releases an open payout's commissions to be paid in another.
  rpc CancelAffiliatePayout(CancelAffiliatePayoutRequest) returns (CancelAffiliatePayoutResponse);
  // ListAffiliateJournal lists the postings of paid payouts with debit and credit totals per currency.
  rpc ListAffiliateJournal(ListAffiliateJournalRequest) returns (ListAffiliateJournalResponse);
}

// AffiliatePublicService is for the public link and cookie of the hosted pages. It holds no tenant: the code finds it. Only the gateway calls it.
service AffiliatePublicService {
  // TrackAffiliateClick counts one visit on the link of a code (aggregated per day, no visitor kept) and says what the page should do about it.
  rpc TrackAffiliateClick(TrackAffiliateClickRequest) returns (TrackAffiliateClickResponse);
}

message AffiliateProgram {
  // draft (not live yet), active, paused (no new attributions or commissions).
  string status = 1;
  // percent_bps or fixed.
  string commission_kind = 2;
  // Basis points (1000 = 10 %) of the net, pre-tax amount paid, or minor units of currency for a fixed commission.
  int64 commission_value = 3;
  // The currency of a fixed commission; a percentage follows the currency of each invoice.
  string currency = 4;
  // first_invoices, months or lifetime.
  string commission_term = 5;
  // N invoices or N months; 0 for lifetime.
  int32 commission_term_value = 6;
  int32 attribution_window_days = 7;
  // How long a commission waits (the refund window) before it can be paid.
  int32 hold_days = 8;
  int64 min_payout_minor = 9;
  // Code of the coupon a referred customer gets on their next checkout; empty for none.
  string referred_coupon_code = 10;
  int32 daily_click_cap = 11;
  // Where /r/<code> sends the visitor afterwards; empty shows a plain page.
  string landing_url = 12;
  // A partner who applies is active at once instead of waiting for approval.
  bool auto_approve = 13;
  google.protobuf.Timestamp create_time = 14;
  google.protobuf.Timestamp update_time = 15;
}

message GetAffiliateProgramRequest {}
message GetAffiliateProgramResponse {
  AffiliateProgram program = 1;
}

message SetAffiliateProgramRequest {
  AffiliateProgram program = 1;
}
message SetAffiliateProgramResponse {
  AffiliateProgram program = 1;
}

message Affiliate {
  string id = 1;
  string code = 2;
  string email = 3;
  string name = 4;
  // pending, active or suspended.
  string status = 5;
  // manual or bank_transfer.
  string payout_method = 6;
  string payout_details = 7;
  // owner (made by the owner) or application (the partner applied).
  string source = 8;
  // The partner has signed in and claimed this affiliate.
  bool signed_in = 9;
  int64 clicks = 10;
  int64 referrals = 11;
  google.protobuf.Timestamp approve_time = 12;
  google.protobuf.Timestamp create_time = 13;
}

message CreateAffiliateRequest {
  string email = 1;
  string name = 2;
  // Empty makes a random one.
  string code = 3;
  string payout_method = 4;
  string payout_details = 5;
  // An affiliate the owner makes is active; set true to leave it pending.
  bool pending = 6;
}
message CreateAffiliateResponse {
  Affiliate affiliate = 1;
}

message ListAffiliatesRequest {
  // pending, active, suspended or empty for all.
  string status = 1;
  string search = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListAffiliatesResponse {
  repeated Affiliate affiliates = 1;
  string next_page_token = 2;
  int32 total = 3;
}

message GetAffiliateRequest {
  string id = 1;
}
message GetAffiliateResponse {
  Affiliate affiliate = 1;
}

message UpdateAffiliateRequest {
  string id = 1;
  string name = 2;
  string payout_method = 3;
  string payout_details = 4;
  // active, suspended or empty to leave it. A suspended affiliate earns nothing new but keeps what was approved.
  string status = 5;
}
message UpdateAffiliateResponse {
  Affiliate affiliate = 1;
}

message LinkAffiliatePromotionCodeRequest {
  string affiliate_id = 1;
  string promotion_code = 2;
}
message LinkAffiliatePromotionCodeResponse {
  Affiliate affiliate = 1;
}

message AttributeCustomerRequest {
  // Either the customer's external id or, for Payrudder's own services, the internal id.
  string customer_external_id = 1;
  string customer_id = 2;
  // The affiliate's code.
  string code = 3;
  // link, code or api. Empty is api.
  string source = 4;
  // When the visitor followed the link; empty is now. Older than the attribution window is refused.
  google.protobuf.Timestamp touch_time = 5;
}
message AttributeCustomerResponse {
  bool attributed = 1;
  // Why not: already_attributed, unknown_code, program_inactive, affiliate_inactive, expired, same_email, same_domain, same_payment_method.
  string reason = 2;
}

message ListAffiliateReferralsRequest {
  // Empty lists every affiliate's.
  string affiliate_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message AffiliateReferral {
  string affiliate_id = 1;
  string affiliate_code = 2;
  string customer_external_id = 3;
  // The customer's e-mail address, masked (j***@example.com).
  string customer_email_masked = 4;
  string source = 5;
  google.protobuf.Timestamp attribute_time = 6;
}
message ListAffiliateReferralsResponse {
  repeated AffiliateReferral referrals = 1;
  string next_page_token = 2;
  int32 total = 3;
}

message TrackAffiliateClickRequest {
  string code = 1;
}
message TrackAffiliateClickResponse {
  // The code belongs to an active affiliate of an active program. When false nothing was counted and no cookie should be set.
  bool valid = 1;
  // The code as stored (its case), for the cookie.
  string code = 2;
  int32 attribution_window_days = 3;
  string landing_url = 4;
  // The click was counted; false once the affiliate's daily cap is reached (the cookie is still set, the visitor is not turned away).
  bool counted = 5;
}

message AffiliateCommission {
  string id = 1;
  string affiliate_id = 2;
  string affiliate_code = 3;
  string customer_external_id = 4;
  // commission, or reversal (a negative row netting a commission that was paid already).
  string kind = 5;
  string invoice_id = 6;
  string invoice_number = 7;
  string currency = 8;
  // What the invoice came to, tax included.
  int64 invoice_total_minor = 9;
  // The base: the net, pre-tax amount actually paid.
  int64 net_minor = 10;
  // The commission; negative on a reversal row.
  int64 amount_minor = 11;
  // How much of the commission has been taken back.
  int64 reversed_minor = 12;
  // pending (in the hold), approved (can be paid out), paid, or reversed (nothing left).
  string status = 13;
  string parent_id = 14;
  google.protobuf.Timestamp earn_time = 15;
  google.protobuf.Timestamp approve_after_time = 16;
  google.protobuf.Timestamp approve_time = 17;
  google.protobuf.Timestamp pay_time = 18;
  string payout_id = 19;
}

message ListAffiliateCommissionsRequest {
  string affiliate_id = 1;
  string status = 2;
  // commission or reversal, or empty for both.
  string kind = 3;
  string invoice_id = 4;
  string payout_id = 5;
  google.protobuf.Timestamp from_time = 6;
  google.protobuf.Timestamp to_time = 7;
  int32 page_size = 8;
  string page_token = 9;
}
message ListAffiliateCommissionsResponse {
  repeated AffiliateCommission commissions = 1;
  string next_page_token = 2;
  int32 total = 3;
}

message ReverseAffiliateCommissionRequest {
  string invoice_id = 1;
  // chargeback or manual.
  string reason = 2;
  // Names this reversal: the same (invoice, reason, reference) takes back once. Required for manual.
  string reference = 3;
  // How much of the commission to take back; 0 is all that is left.
  int64 amount_minor = 4;
  string note = 5;
}
message ReverseAffiliateCommissionResponse {
  // How much this call took back (0 on a repeat, or when nothing was left).
  int64 reversed_minor = 1;
  AffiliateCommission commission = 2;
}

message AffiliateBalance {
  string affiliate_id = 1;
  string currency = 2;
  int64 pending_minor = 3;
  int64 approved_minor = 4;
  int64 paid_minor = 5;
  int64 reversed_minor = 6;
}
message GetAffiliateBalancesRequest {
  // Empty for every affiliate.
  string affiliate_id = 1;
}
message GetAffiliateBalancesResponse {
  repeated AffiliateBalance balances = 1;
}

message GetAffiliateFunnelRequest {
  // Dates as YYYY-MM-DD, both included (UTC). Empty from is 30 days before to; empty to is today.
  string from_date = 1;
  string to_date = 2;
  string affiliate_id = 3;
}
message AffiliateFunnelAmount {
  string currency = 1;
  int64 earned_minor = 2;
  int64 reversed_minor = 3;
}
message GetAffiliateFunnelResponse {
  string from_date = 1;
  string to_date = 2;
  int64 clicks = 3;
  // Customers attributed in the period.
  int64 referrals = 4;
  // Customers with a commission earned in the period.
  int64 paying_customers = 5;
  repeated AffiliateFunnelAmount commissions = 6;
}

message AffiliatePayout {
  string id = 1;
  string affiliate_id = 2;
  string affiliate_code = 3;
  string currency = 4;
  // What the payout is worth: for an open one, its commissions as they stand now (a refund since lowers it); for a paid one, what was paid.
  int64 total_minor = 5;
  int32 commission_count = 6;
  // manual or bank_transfer.
  string method = 7;
  string payout_details = 8;
  // The owner's note when marking it paid, e.g. the bank transfer reference.
  string reference = 9;
  // open, paid or cancelled.
  string status = 10;
  // A payout of a sandbox environment is fake: nothing was or will be paid.
  bool fake = 11;
  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp pay_time = 13;
  google.protobuf.Timestamp cancel_time = 14;
}

message ListAffiliatePayoutsRequest {
  string affiliate_id = 1;
  // open, paid, cancelled or empty.
  string status = 2;
  string id = 3;
  int32 page_size = 4;
  string page_token = 5;
}
message ListAffiliatePayoutsResponse {
  repeated AffiliatePayout payouts = 1;
  string next_page_token = 2;
  int32 total = 3;
}

message CreateAffiliatePayoutsRequest {
  // Empty takes every active affiliate's.
  string affiliate_id = 1;
  // Empty takes every currency.
  string currency = 2;
}
message SkippedAffiliatePayout {
  string affiliate_id = 1;
  string currency = 2;
  int64 total_minor = 3;
  // below_minimum or not_positive.
  string reason = 4;
}
message CreateAffiliatePayoutsResponse {
  repeated AffiliatePayout payouts = 1;
  repeated SkippedAffiliatePayout skipped = 2;
}

message MarkAffiliatePayoutPaidRequest {
  string id = 1;
  string reference = 2;
}
message MarkAffiliatePayoutPaidResponse {
  AffiliatePayout payout = 1;
}

message CancelAffiliatePayoutRequest {
  string id = 1;
}
message CancelAffiliatePayoutResponse {
  AffiliatePayout payout = 1;
}

message AffiliateJournalEntry {
  string id = 1;
  string payout_id = 2;
  string affiliate_id = 3;
  google.protobuf.Timestamp post_time = 4;
  string currency = 5;
  // commission_expense, commissions_payable or cash.
  string account = 6;
  int64 debit_minor = 7;
  int64 credit_minor = 8;
  string memo = 9;
  // Posted by a sandbox payout: fake.
  bool fake = 10;
}
message AffiliateJournalTotal {
  string currency = 1;
  int64 debit_minor = 2;
  int64 credit_minor = 3;
}
message ListAffiliateJournalRequest {
  string payout_id = 1;
  string currency = 2;
  google.protobuf.Timestamp from_time = 3;
  google.protobuf.Timestamp to_time = 4;
  int32 page_size = 5;
  string page_token = 6;
}
message ListAffiliateJournalResponse {
  repeated AffiliateJournalEntry entries = 1;
  // Over the whole filter, not only this page: the books balance when debits equal credits in every currency.
  repeated AffiliateJournalTotal totals = 2;
  string next_page_token = 3;
  int32 total = 4;
}
