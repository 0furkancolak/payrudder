syntax = "proto3";

package payrudder.plans.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "payrudder/plans/v1/resources.proto";

// AdminService is operator-only (the gateway checks the operator token), except ResolveApiKey,
// which only the gateway calls.
service AdminService {
  // CreateAccount creates the account and its sandbox + live tenants with the chosen settings.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // CreateApp adds an application to an account: a sandbox and a live tenant with the chosen settings.
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse);
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  // ListTenants pages through every tenant ordered by id; billing-svc's scheduler walks it.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // UpdateTenantSettings changes grace period and tier. Currency and time zone are immutable.
  rpc UpdateTenantSettings(UpdateTenantSettingsRequest) returns (UpdateTenantSettingsResponse);
  // CreateApiKey returns the plaintext key once. The key environment must match the tenant's.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  // RevokeApiKey revokes the key and evicts it from the gateway cache.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  // ResolveApiKey returns what the gateway needs to authenticate a key with this prefix.
  rpc ResolveApiKey(ResolveApiKeyRequest) returns (ResolveApiKeyResponse);
  // TouchApiKey records that a key was used just now (the gateway calls it at most every few minutes per key and replica).
  rpc TouchApiKey(TouchApiKeyRequest) returns (TouchApiKeyResponse);
  // SetTenantStatus is the operator's hand on a tenant's life: suspend, freeze or ban an active tenant, reinstate one that was, or activate an inactive live tenant
  // without the go-live checklist. Every change is recorded with its reason and who made it. Suspending or banning stops the tenant's keys at once. Where
  // PAYRUDDER_TENANT_BAN_APPROVAL is on, a ban waits (plans.tenant.approval_pending) until a second operator asks for the same.
  rpc SetTenantStatus(SetTenantStatusRequest) returns (SetTenantStatusResponse);
  // ListTenantStatusEvents returns the changes of a tenant's status (and the requests waiting for a second operator), newest first, the latest 100.
  rpc ListTenantStatusEvents(ListTenantStatusEventsRequest) returns (ListTenantStatusEventsResponse);
  // ListPlatformBlocklist returns the operator's platform-wide blocklist, newest first (at most 1000 entries). It holds the same gates as an app's own list for every app
  // except the platform's own (the SaaS customers), and an app is never told which list refused a customer.
  rpc ListPlatformBlocklist(ListPlatformBlocklistRequest) returns (ListPlatformBlocklistResponse);
  // AddPlatformBlocklistEntry adds an entry to the platform-wide list (adding one that is there returns it). It is recorded in the audit log without the value.
  rpc AddPlatformBlocklistEntry(AddPlatformBlocklistEntryRequest) returns (AddPlatformBlocklistEntryResponse);
  // RemovePlatformBlocklistEntry removes an entry. An entry that is not there is NOT_FOUND.
  rpc RemovePlatformBlocklistEntry(RemovePlatformBlocklistEntryRequest) returns (RemovePlatformBlocklistEntryResponse);

  // GetTenantLifecycle returns a live tenant's retention deadline (a banned tenant's data is kept until then; a job marks it due and deletes nothing) and the status change
  // scheduled for it.
  rpc GetTenantLifecycle(GetTenantLifecycleRequest) returns (GetTenantLifecycleResponse);
  // ScheduleTenantStatus schedules a suspension or a freeze of an active live tenant at a future time; the sweeper applies it as the operator "system" (a ban is never
  // scheduled). One schedule per tenant: a new one replaces the old. The owners are told by the mail of the change when it is applied.
  rpc ScheduleTenantStatus(ScheduleTenantStatusRequest) returns (ScheduleTenantStatusResponse);
  // CancelScheduledTenantStatus drops the schedule (nothing scheduled is not an error).
  rpc CancelScheduledTenantStatus(CancelScheduledTenantStatusRequest) returns (CancelScheduledTenantStatusResponse);
  // ListTenantAppeals returns the owners' appeals, newest first (the latest 200), of one tenant or of all, of one status or of all.
  rpc ListTenantAppeals(ListTenantAppealsRequest) returns (ListTenantAppealsResponse);
  // DecideTenantAppeal accepts or rejects an open appeal. Accepting reinstates the tenant (active). Both mail the owners with the operator's answer and are audited.
  rpc DecideTenantAppeal(DecideTenantAppealRequest) returns (DecideTenantAppealResponse);
  // GetPriceChangePause says whether the operator has paused every price change of the platform (the kill switch of plan 15).
  rpc GetPriceChangePause(GetPriceChangePauseRequest) returns (GetPriceChangePauseResponse);
  // SetPriceChangePause pauses or resumes every price change of every tenant: while it is on, no run or retry schedules a subscription (409 plans.price_change.paused;
  // a dry run still counts), a run in progress stops at its next batch, and the notifier holds the mail of the price changes already scheduled. A change that is
  // already scheduled is still applied at its renewal; withdraw the price change to stop that.
  rpc SetPriceChangePause(SetPriceChangePauseRequest) returns (SetPriceChangePauseResponse);
  // GetPriceChangeNotice returns the notice rules of price changes: the notice a run uses when it names none and the least notice per country (plan 15). The rows are
  // not legal advice and nobody has checked them.
  rpc GetPriceChangeNotice(GetPriceChangeNoticeRequest) returns (GetPriceChangeNoticeResponse);
  // SetPriceChangeNotice replaces the notice rules in one step (operator only).
  rpc SetPriceChangeNotice(SetPriceChangeNoticeRequest) returns (SetPriceChangeNoticeResponse);
}

message CreateAccountRequest {
  string name = 1;
  // Required, ISO 4217 from the supported list. No default.
  string currency = 2;
  // Required, IANA name. No default.
  string timezone = 3;
  // Required, 0..7 days.
  google.protobuf.Duration grace_period = 4;
  TenantTier tier = 5;
}

message CreateAccountResponse {
  Account account = 1;
}

message CreateAppRequest {
  string account_id = 1;
  string name = 2;
  // Empty: the name in lower case with dashes.
  string slug = 3;
  // As in CreateAccountRequest: no defaults.
  string currency = 4;
  string timezone = 5;
  google.protobuf.Duration grace_period = 6;
  TenantTier tier = 7;
  // The region of the app's tenants (see Tenant.region); empty takes the deployment's default (PAYRUDDER_DEFAULT_REGION of plans-svc, itself empty: not pinned).
  string region = 8;
}

message CreateAppResponse {
  App app = 1;
}

message ListAppsRequest {
  string account_id = 1;
}

message ListAppsResponse {
  repeated App apps = 1;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {
  // 1..1000, default 500.
  int32 page_size = 1;
  string page_token = 2;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
}

message UpdateTenantSettingsRequest {
  string tenant_id = 1;
  // Unset leaves the value unchanged.
  google.protobuf.Duration grace_period = 2;
  TenantTier tier = 3;
  // Sets the invoice logo (an invoice_logo asset of assets-svc); empty leaves it unchanged. clear_invoice_logo removes it.
  string invoice_logo_asset_id = 4;
  bool clear_invoice_logo = 5;
  // Replaces the seller address printed on the tenant's invoices; unset leaves it unchanged.
  Address address = 6;
  // Replaces the bank transfer details printed on invoices (payments-worker sets them with the tenant's bank transfer account); unset leaves them unchanged.
  BankTransferDetails bank_transfer = 7;
  bool clear_bank_transfer = 8;
  // Replaces the seller's company data; unset leaves it unchanged.
  LegalInfo legal = 9;
  // "off", "finalized" or "paid"; empty leaves it unchanged.
  string e_invoice_on = 10;
  // The language of the tenant's documents and mails for a customer who has none: en, tr, de, fr, es or ar; empty leaves it unchanged.
  string default_language = 11;
}

message UpdateTenantSettingsResponse {
  Tenant tenant = 1;
}

message CreateApiKeyRequest {
  string tenant_id = 1;
  // The older way to choose a role; use role and permissions. Unset, with no role either, is admin.
  ApiKey.Scope scope = 2;
  // admin (default), billing, read_only, ingest_only or custom.
  string role = 3;
  // For custom: the permissions. For a fixed role: optional, and a subset of the role's own.
  repeated string permissions = 4;
  // Optional own rate limit of the key, 1 to 100 (percent of the tenant's limit per route class); 0 = none. Anything else is plans.api_key.bad_rate_percent.
  int32 rate_percent = 5;
}

message CreateApiKeyResponse {
  ApiKey api_key = 1;
  // qk_{test|live}_{prefix}_{secret}. Shown once, never stored.
  string plaintext = 2;
}

message RevokeApiKeyRequest {
  string api_key_id = 1;
}

message RevokeApiKeyResponse {
  ApiKey api_key = 1;
}

message ResolveApiKeyRequest {
  string prefix = 1;
}

message ResolveApiKeyResponse {
  string api_key_id = 1;
  string tenant_id = 2;
  ApiKey.Status status = 3;
  // sha256(secret)
  bytes key_hash = 4;
  Environment environment = 5;
  TenantTier tier = 6;
  string timezone = 7;
  TenantStatus tenant_status = 8;
  ApiKey.Scope scope = 9;
  // Set for a key that ends although it is not revoked (the old key of a rotation).
  google.protobuf.Timestamp expire_time = 10;
  string role = 11;
  // The permissions the gateway enforces. The role admin always lists every permission that exists.
  repeated string permissions = 12;
  // The key's own rate limit (percent of the tenant's limit), 0 = none.
  int32 rate_percent = 13;
}

message TouchApiKeyRequest {
  string api_key_id = 1;
}

message TouchApiKeyResponse {}

message SetTenantStatusRequest {
  string tenant_id = 1;
  // ACTIVE, SUSPENDED, FROZEN or BANNED.
  TenantStatus status = 2;
  // Required for every change except reinstating a suspended or frozen tenant. At most 500 characters.
  string reason = 3;
  // Why: nonpayment, fraud, abuse, legal, request or other. Optional.
  string category = 4;
  // Who asks; set by the gateway from the signed-in operator (or the machine token's header).
  string actor = 5;
}

message SetTenantStatusResponse {
  Tenant tenant = 1;
}

message ListPlatformBlocklistRequest {}

message ListPlatformBlocklistResponse {
  repeated BlocklistEntry entries = 1;
}

message AddPlatformBlocklistEntryRequest {
  string kind = 1;
  string value = 2;
  string note = 3;
  string actor = 4;
}

message AddPlatformBlocklistEntryResponse {
  BlocklistEntry entry = 1;
}

message RemovePlatformBlocklistEntryRequest {
  string id = 1;
  string actor = 2;
}

message RemovePlatformBlocklistEntryResponse {}

message GetTenantLifecycleRequest {
  string tenant_id = 1;
}

message GetTenantLifecycleResponse {
  TenantLifecycle lifecycle = 1;
}

message ScheduleTenantStatusRequest {
  string tenant_id = 1;
  // "suspended" or "frozen".
  string status = 2;
  google.protobuf.Timestamp schedule_time = 3;
  string category = 4;
  string reason = 5;
  string actor = 6;
}

message ScheduleTenantStatusResponse {
  TenantLifecycle lifecycle = 1;
}

message CancelScheduledTenantStatusRequest {
  string tenant_id = 1;
  string actor = 2;
}

message CancelScheduledTenantStatusResponse {
  TenantLifecycle lifecycle = 1;
}

message ListTenantAppealsRequest {
  // Empty: every tenant.
  string tenant_id = 1;
  // "open", "accepted" or "rejected"; empty: every status.
  string status = 2;
}

message ListTenantAppealsResponse {
  repeated TenantAppeal appeals = 1;
  // The names of the tenants' apps, by tenant id, for the list across tenants.
  map<string, string> app_names = 2;
}

message DecideTenantAppealRequest {
  string appeal_id = 1;
  // "accepted" or "rejected".
  string decision = 2;
  string answer = 3;
  string actor = 4;
}

message DecideTenantAppealResponse {
  TenantAppeal appeal = 1;
}

message ListTenantStatusEventsRequest {
  string tenant_id = 1;
}

message ListTenantStatusEventsResponse {
  repeated TenantStatusEvent events = 1;
}

// One change of a tenant's status, or the request of a change that waits for a second operator. Events are never changed or deleted.
message TenantStatusEvent {
  string id = 1;
  // "changed" (it happened) or "requested" (it waits for a second operator).
  string kind = 2;
  TenantStatus from_status = 3;
  TenantStatus to_status = 4;
  string category = 5;
  string reason = 6;
  string actor = 7;
  // The second operator of a change that needed one.
  string approved_by = 8;
  google.protobuf.Timestamp create_time = 9;
}

message GetPriceChangePauseRequest {}

message GetPriceChangePauseResponse {
  PriceChangePause pause = 1;
}

message SetPriceChangePauseRequest {
  bool paused = 1;
  // Why, kept with the setting and shown to the next operator. At most 500 characters.
  string reason = 2;
  // Who asks. The gateway sets it; a value in the request is overwritten.
  string actor = 3;
}

message SetPriceChangePauseResponse {
  PriceChangePause pause = 1;
}

// The platform-wide pause of price changes. Never set: not paused, and no one has touched it.
message PriceChangePause {
  bool paused = 1;
  string reason = 2;
  string updated_by = 3;
  google.protobuf.Timestamp update_time = 4;
}

message GetPriceChangeNoticeRequest {}
message GetPriceChangeNoticeResponse {
  PriceChangeNotice notice = 1;
}

message SetPriceChangeNoticeRequest {
  // The notice a run uses when its request names none: 14 to 365 days.
  int32 default_notice_days = 1;
  // The whole table; rows not listed are removed. Each country once; '*' is the floor for any country without a row (14 when it has none).
  repeated PriceChangeNoticeRule rules = 2;
  // Who asks. The gateway sets it; a value in the request is overwritten.
  string actor = 3;
}
message SetPriceChangeNoticeResponse {
  PriceChangeNotice notice = 1;
}

// The notice rules of price changes. UNVERIFIED and not legal advice: the code's floor of 14 days is a guess, and a country's row is whatever the operator typed.
message PriceChangeNotice {
  int32 default_notice_days = 1;
  repeated PriceChangeNoticeRule rules = 2;
  string updated_by = 3;
  google.protobuf.Timestamp update_time = 4;
}

message PriceChangeNoticeRule {
  // An ISO 3166-1 alpha-2 code in capitals, or '*' for any other country.
  string country = 1;
  // The least notice before a price starts for a customer in that country: 14 to 365 days (a country row can raise the floor, never lower the code's 14).
  int32 min_notice_days = 2;
  // Free text for the next operator (a source, a date, who checked it). At most 200 characters.
  string note = 3;
}
