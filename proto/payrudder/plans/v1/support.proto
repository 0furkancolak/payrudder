syntax = "proto3";

package payrudder.plans.v1;

import "google/protobuf/timestamp.proto";

// SupportService is the help desk between the people who run apps on Payrudder and the operator. A person opens a ticket on behalf of their account (and
// optionally one of its apps), both sides write to a thread, and the operator keeps the ticket's status, priority and assignee, plus notes the person never
// sees. Every ticket has a first-response deadline that follows its priority and counts business hours (Monday to Friday, 09:00 to 18:00 in the time zone of the
// ticket's app). Mail goes out on a new ticket (to the operators), on the operator's public answer and on a change of status (to the person who opened it), in the
// language of the person; a ticket that waited for the person for seven days closes by itself; an account has at most 20 tickets waiting at once. When the person
// answers the operator, the operators are mailed once (not again until the operator has answered). The operator's side also has tags on tickets, an assignee chosen
// from the operators, canned replies (snippets the operators share), and a report of the queue and of the first-answer times.
//
// The "My" calls take the signed-in user's id, resolved by the gateway, and see the tickets of every account the user belongs to. The operator calls need the
// operator context and see all tickets.
service SupportService {
  rpc OpenMySupportTicket(OpenMySupportTicketRequest) returns (OpenMySupportTicketResponse);
  rpc ListMySupportTickets(ListMySupportTicketsRequest) returns (ListMySupportTicketsResponse);
  // GetMySupportTicket returns the ticket with its thread, without the operator's internal notes.
  rpc GetMySupportTicket(GetMySupportTicketRequest) returns (GetMySupportTicketResponse);
  rpc ReplyMySupportTicket(ReplyMySupportTicketRequest) returns (ReplyMySupportTicketResponse);
  // SetMySupportTicketStatus lets the person mark the ticket solved or reopen it.
  rpc SetMySupportTicketStatus(SetMySupportTicketStatusRequest) returns (SetMySupportTicketStatusResponse);

  rpc ListSupportTickets(ListSupportTicketsRequest) returns (ListSupportTicketsResponse);
  // GetSupportTicket returns the ticket with its whole thread, internal notes included.
  rpc GetSupportTicket(GetSupportTicketRequest) returns (GetSupportTicketResponse);
  // ReplySupportTicket adds the operator's answer (the person sees it) or an internal note (they do not).
  rpc ReplySupportTicket(ReplySupportTicketRequest) returns (ReplySupportTicketResponse);
  rpc UpdateSupportTicket(UpdateSupportTicketRequest) returns (UpdateSupportTicketResponse);

  // CountMySupportUnread is the number of tickets the person opened that have an answer or a status change they have not read: the badge on the help page's link.
  rpc CountMySupportUnread(CountMySupportUnreadRequest) returns (CountMySupportUnreadResponse);
  // GetSupportReport counts the queue (what waits for the operator, what is late, tickets by status and priority) and reports the first-answer times of the last 30 days.
  rpc GetSupportReport(GetSupportReportRequest) returns (GetSupportReportResponse);
  // ListSupportOperators lists the addresses a ticket can be assigned to (PAYRUDDER_OPERATOR_EMAILS), with the name of the ones that have a user.
  rpc ListSupportOperators(ListSupportOperatorsRequest) returns (ListSupportOperatorsResponse);
  // The canned replies: titled texts the operators share and paste into an answer.
  rpc ListSupportCannedReplies(ListSupportCannedRepliesRequest) returns (ListSupportCannedRepliesResponse);
  // SaveSupportCannedReply makes a canned reply, or changes the one named by id.
  rpc SaveSupportCannedReply(SaveSupportCannedReplyRequest) returns (SaveSupportCannedReplyResponse);
  rpc DeleteSupportCannedReply(DeleteSupportCannedReplyRequest) returns (DeleteSupportCannedReplyResponse);
}

message SupportTicket {
  string id = 1;
  // A short, human number: "#1042".
  int64 number = 2;
  string account_id = 3;
  string account_name = 4;
  // Empty when the ticket is about the account as a whole.
  string app_id = 5;
  string app_name = 6;
  string opened_by = 7;
  string opened_by_name = 8;
  string subject = 9;
  // billing, integration, bug, question or other.
  string category = 10;
  // low, normal, high or urgent.
  string priority = 11;
  // open (waiting for the operator), pending (waiting for the person), solved or closed.
  string status = 12;
  string assignee = 13;
  google.protobuf.Timestamp create_time = 14;
  google.protobuf.Timestamp update_time = 15;
  google.protobuf.Timestamp last_message_time = 16;
  // Who wrote last: customer or operator.
  string last_author = 17;
  // When the operator should have answered at the latest, and when they first did (unset until then).
  google.protobuf.Timestamp first_response_due = 18;
  google.protobuf.Timestamp first_response_time = 19;
  // True when the first answer is overdue (or was late).
  bool sla_breached = 20;
  google.protobuf.Timestamp solve_time = 21;
  int32 message_count = 22;
  // True for the person who opened the ticket when there is an answer or a status change by the operator they have not read yet. Always false for the operator
  // and for the other members of the account.
  bool unread = 23;
  // The operator's own labels ("refund", "vat"), at most five, lower case. Never shown to the person who opened the ticket: the "My" calls leave it empty.
  repeated string tags = 24;
}

// SupportEvent is one change of a ticket's status, priority or assignee, in the order they happened. The history is never edited.
message SupportEvent {
  string id = 1;
  // status, priority, assignee or tags (a list joined by commas).
  string kind = 2;
  // Who changed it: customer, operator or system (the job that closes tickets nobody answered).
  string actor_kind = 3;
  string actor_name = 4;
  string from_value = 5;
  string to_value = 6;
  google.protobuf.Timestamp create_time = 7;
}

message SupportMessage {
  string id = 1;
  // customer, operator or system.
  string author_kind = 2;
  string author_name = 3;
  string body = 4;
  // An operator's note the person does not see.
  bool internal = 5;
  google.protobuf.Timestamp create_time = 6;
}

message OpenMySupportTicketRequest {
  string user_id = 1;
  string account_id = 2;
  // Optional: an app of that account.
  string app_id = 3;
  string subject = 4;
  string category = 5;
  string priority = 6;
  string body = 7;
}
message OpenMySupportTicketResponse {
  SupportTicket ticket = 1;
}

message ListMySupportTicketsRequest {
  string user_id = 1;
  // Optional: open, pending, solved, closed, or "active" for open and pending.
  string status = 2;
}
message ListMySupportTicketsResponse {
  repeated SupportTicket tickets = 1;
}

message GetMySupportTicketRequest {
  string user_id = 1;
  string ticket_id = 2;
}
message GetMySupportTicketResponse {
  SupportTicket ticket = 1;
  repeated SupportMessage messages = 2;
  // The changes of status, priority and assignee; reading the ticket as the person who opened it clears its "unread" mark.
  repeated SupportEvent events = 3;
}

message ReplyMySupportTicketRequest {
  string user_id = 1;
  string ticket_id = 2;
  string body = 3;
}
message ReplyMySupportTicketResponse {
  SupportTicket ticket = 1;
}

message SetMySupportTicketStatusRequest {
  string user_id = 1;
  string ticket_id = 2;
  // solved, or open to reopen.
  string status = 3;
}
message SetMySupportTicketStatusResponse {
  SupportTicket ticket = 1;
}

message ListSupportTicketsRequest {
  // All optional. status may be "active" (open and pending).
  string status = 1;
  string priority = 2;
  string assignee = 3;
  // Matches the subject and the number, case-insensitively.
  string search = 4;
  // Only tickets whose first answer is overdue.
  bool sla_breached = 5;
  // Only tickets that carry this tag.
  string tag = 6;
}
message ListSupportTicketsResponse {
  // Newest activity first, at most 200.
  repeated SupportTicket tickets = 1;
}

message GetSupportTicketRequest {
  string ticket_id = 1;
}
message GetSupportTicketResponse {
  SupportTicket ticket = 1;
  repeated SupportMessage messages = 2;
  repeated SupportEvent events = 3;
}

message ReplySupportTicketRequest {
  string ticket_id = 1;
  string body = 2;
  // A note for the operator's team: the person never sees it and it does not count as an answer.
  bool internal = 3;
  // Who is answering, as shown to the person.
  string author_name = 4;
}
message ReplySupportTicketResponse {
  SupportTicket ticket = 1;
}

message UpdateSupportTicketRequest {
  string ticket_id = 1;
  // Each is applied only when set.
  optional string status = 2;
  optional string priority = 3;
  // An address from ListSupportOperators, or empty to take the ticket off its assignee. A ticket keeps an assignee that is no longer on the list until it is changed.
  optional string assignee = 4;
  // Who is changing it, as shown in the ticket's history.
  string author_name = 5;
  // With set_tags the ticket's tags become exactly these (at most five, each lower case letters, digits and hyphens, at most 30 characters); without it they stay.
  bool set_tags = 6;
  repeated string tags = 7;
}
message UpdateSupportTicketResponse {
  SupportTicket ticket = 1;
}

message CountMySupportUnreadRequest {
  string user_id = 1;
}
message CountMySupportUnreadResponse {
  int32 unread = 1;
}

message GetSupportReportRequest {}
message GetSupportReportResponse {
  // Tickets waiting for the operator (open), and how many of them are past their first-answer deadline.
  int32 waiting = 1;
  int32 breached = 2;
  // Every ticket by status, and the tickets still waiting (open or pending) by priority.
  repeated SupportCount by_status = 3;
  repeated SupportCount by_priority = 4;
  // The tickets opened in the last window_days days: how many, how many have a first answer, how many of those came in time, and how long the first answer took (seconds,
  // wall clock). Zero when none was answered.
  int32 window_days = 5;
  int32 opened = 6;
  int32 answered = 7;
  int32 answered_on_time = 8;
  int64 median_first_answer_seconds = 9;
  int64 average_first_answer_seconds = 10;
}
message SupportCount {
  string value = 1;
  int32 count = 2;
}

message SupportOperator {
  string email = 1;
  // The name of the user with that address; empty when nobody has signed up with it.
  string name = 2;
}
message ListSupportOperatorsRequest {}
message ListSupportOperatorsResponse {
  repeated SupportOperator operators = 1;
}

message SupportCannedReply {
  string id = 1;
  string title = 2;
  string body = 3;
  string updated_by = 4;
  google.protobuf.Timestamp update_time = 5;
}
message ListSupportCannedRepliesRequest {}
message ListSupportCannedRepliesResponse {
  // By title.
  repeated SupportCannedReply replies = 1;
}
message SaveSupportCannedReplyRequest {
  // Empty makes a new one.
  string id = 1;
  string title = 2;
  string body = 3;
  // Who saves it, as kept with it. The gateway sets it.
  string author_name = 4;
}
message SaveSupportCannedReplyResponse {
  SupportCannedReply reply = 1;
}
message DeleteSupportCannedReplyRequest {
  string id = 1;
}
message DeleteSupportCannedReplyResponse {}
