syntax = "proto3";

package quotify.plans.v1;

import "google/protobuf/duration.proto";
import "quotify/plans/v1/resources.proto";

// AdminService is operator-only (the gateway checks the operator token), except ResolveApiKey,
// which only the gateway calls.
service AdminService {
  // CreateAccount creates the account and its sandbox + live tenants with the chosen settings.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // CreateApp adds an application to an account: a sandbox and a live tenant with the chosen settings.
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse);
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  // ListTenants pages through every tenant ordered by id; billing-svc's scheduler walks it.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // UpdateTenantSettings changes grace period and tier. Currency and time zone are immutable.
  rpc UpdateTenantSettings(UpdateTenantSettingsRequest) returns (UpdateTenantSettingsResponse);
  // CreateApiKey returns the plaintext key once. The key environment must match the tenant's.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  // RevokeApiKey revokes the key and evicts it from the gateway cache.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  // ResolveApiKey returns what the gateway needs to authenticate a key with this prefix.
  rpc ResolveApiKey(ResolveApiKeyRequest) returns (ResolveApiKeyResponse);
}

message CreateAccountRequest {
  string name = 1;
  // Required, ISO 4217 from the supported list. No default.
  string currency = 2;
  // Required, IANA name. No default.
  string timezone = 3;
  // Required, 0..7 days.
  google.protobuf.Duration grace_period = 4;
  TenantTier tier = 5;
}

message CreateAccountResponse {
  Account account = 1;
}

message CreateAppRequest {
  string account_id = 1;
  string name = 2;
  // Empty: the name in lower case with dashes.
  string slug = 3;
  // As in CreateAccountRequest: no defaults.
  string currency = 4;
  string timezone = 5;
  google.protobuf.Duration grace_period = 6;
  TenantTier tier = 7;
}

message CreateAppResponse {
  App app = 1;
}

message ListAppsRequest {
  string account_id = 1;
}

message ListAppsResponse {
  repeated App apps = 1;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {
  // 1..1000, default 500.
  int32 page_size = 1;
  string page_token = 2;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
}

message UpdateTenantSettingsRequest {
  string tenant_id = 1;
  // Unset leaves the value unchanged.
  google.protobuf.Duration grace_period = 2;
  TenantTier tier = 3;
  // Sets the invoice logo (an invoice_logo asset of assets-svc); empty leaves it unchanged. clear_invoice_logo removes it.
  string invoice_logo_asset_id = 4;
  bool clear_invoice_logo = 5;
  // Replaces the seller address printed on the tenant's invoices; unset leaves it unchanged.
  Address address = 6;
  // Replaces the bank transfer details printed on invoices (payments-worker sets them with the tenant's bank transfer account); unset leaves them unchanged.
  BankTransferDetails bank_transfer = 7;
  bool clear_bank_transfer = 8;
  // Replaces the seller's company data; unset leaves it unchanged.
  LegalInfo legal = 9;
  // "off", "finalized" or "paid"; empty leaves it unchanged.
  string e_invoice_on = 10;
}

message UpdateTenantSettingsResponse {
  Tenant tenant = 1;
}

message CreateApiKeyRequest {
  string tenant_id = 1;
}

message CreateApiKeyResponse {
  ApiKey api_key = 1;
  // qk_{test|live}_{prefix}_{secret}. Shown once, never stored.
  string plaintext = 2;
}

message RevokeApiKeyRequest {
  string api_key_id = 1;
}

message RevokeApiKeyResponse {
  ApiKey api_key = 1;
}

message ResolveApiKeyRequest {
  string prefix = 1;
}

message ResolveApiKeyResponse {
  string api_key_id = 1;
  string tenant_id = 2;
  ApiKey.Status status = 3;
  // sha256(secret)
  bytes key_hash = 4;
  Environment environment = 5;
  TenantTier tier = 6;
  string timezone = 7;
}
