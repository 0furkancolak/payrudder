syntax = "proto3";

package quotify.plans.v1;

import "google/protobuf/timestamp.proto";

// WebhookService lets a tenant receive what happens in its account at HTTPS endpoints of its own. The tenant comes from gRPC metadata.
service WebhookService {
  // CreateWebhookEndpoint registers an endpoint. The response carries the signing secret, once: it cannot be read again, only rotated.
  rpc CreateWebhookEndpoint(CreateWebhookEndpointRequest) returns (CreateWebhookEndpointResponse);
  rpc ListWebhookEndpoints(ListWebhookEndpointsRequest) returns (ListWebhookEndpointsResponse);
  // UpdateWebhookEndpoint replaces the url, description, event types and active flag of an endpoint.
  rpc UpdateWebhookEndpoint(UpdateWebhookEndpointRequest) returns (UpdateWebhookEndpointResponse);
  rpc DeleteWebhookEndpoint(DeleteWebhookEndpointRequest) returns (DeleteWebhookEndpointResponse);
  // RotateWebhookSecret makes a new secret and returns it once. Deliveries are signed with both for 24 hours, so a receiver can switch over without losing one.
  rpc RotateWebhookSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse);
  // SendTestWebhook delivers a "ping" event to one endpoint.
  rpc SendTestWebhook(SendTestWebhookRequest) returns (SendTestWebhookResponse);
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse);
  // RedeliverWebhook sends a delivery again from the start, whatever became of it.
  rpc RedeliverWebhook(RedeliverWebhookRequest) returns (RedeliverWebhookResponse);
  // RecordTenantEvent is for Quotify's own services: it records an event that happened elsewhere (billing-svc) and queues it for the tenant's endpoints.
  // Idempotent per event_id.
  rpc RecordTenantEvent(RecordTenantEventRequest) returns (RecordTenantEventResponse);
}

message WebhookEndpoint {
  string id = 1;
  string url = 2;
  string description = 3;
  // Empty means every event type.
  repeated string event_types = 4;
  bool active = 5;
  // Only in the response of Create and Rotate.
  string secret = 6;
  google.protobuf.Timestamp create_time = 7;
}

message CreateWebhookEndpointRequest {
  string url = 1;
  string description = 2;
  repeated string event_types = 3;
}
message CreateWebhookEndpointResponse { WebhookEndpoint endpoint = 1; }

message ListWebhookEndpointsRequest {}
message ListWebhookEndpointsResponse { repeated WebhookEndpoint endpoints = 1; }

message UpdateWebhookEndpointRequest {
  string id = 1;
  string url = 2;
  string description = 3;
  repeated string event_types = 4;
  bool active = 5;
}
message UpdateWebhookEndpointResponse { WebhookEndpoint endpoint = 1; }

message DeleteWebhookEndpointRequest { string id = 1; }
message DeleteWebhookEndpointResponse {}

message RotateWebhookSecretRequest { string id = 1; }
message RotateWebhookSecretResponse { WebhookEndpoint endpoint = 1; }

message SendTestWebhookRequest { string id = 1; }
message SendTestWebhookResponse { WebhookDelivery delivery = 1; }

enum WebhookDeliveryState {
  WEBHOOK_DELIVERY_STATE_UNSPECIFIED = 0;
  WEBHOOK_DELIVERY_STATE_PENDING = 1;
  WEBHOOK_DELIVERY_STATE_DELIVERED = 2;
  WEBHOOK_DELIVERY_STATE_FAILED = 3;
}

message WebhookDelivery {
  string id = 1;
  string event_id = 2;
  string event_type = 3;
  string endpoint_id = 4;
  WebhookDeliveryState state = 5;
  int32 attempts = 6;
  // While pending: when the next attempt is due.
  google.protobuf.Timestamp next_attempt_time = 7;
  // The HTTP status of the last attempt, 0 if none reached the endpoint.
  int32 last_status = 8;
  string last_error = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp delivered_time = 11;
}

message ListWebhookDeliveriesRequest {
  string endpoint_id = 1;
  WebhookDeliveryState state = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  string next_page_token = 2;
}

message RedeliverWebhookRequest { string delivery_id = 1; }
message RedeliverWebhookResponse { WebhookDelivery delivery = 1; }

message RecordTenantEventRequest {
  string event_id = 1;
  string type = 2;
  // The event's data as a JSON object.
  string data_json = 3;
  google.protobuf.Timestamp occurred_time = 4;
}
message RecordTenantEventResponse {
  // How many endpoints the event was queued for (0 on a repeat).
  int32 queued = 1;
}
