// Temporary service proving the Phase 00 skeleton: gRPC in, Kafka out and back, one trace.
// Deleted at the end of Phase 01.
syntax = "proto3";

package quotify.hello.v1;

import "google/protobuf/timestamp.proto";

service HelloService {
  // SayHello produces a HelloEvent to Kafka (with trace headers) and returns where it landed.
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
}

message SayHelloRequest {
  string name = 1;
}

message SayHelloResponse {
  string message = 1;
  int32 partition = 2;
  int64 offset = 3;
}

// HelloEvent is the Kafka record value on topic hello.events.v1.
message HelloEvent {
  string event_id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}
