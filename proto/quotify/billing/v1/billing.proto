syntax = "proto3";

package quotify.billing.v1;

import "google/protobuf/timestamp.proto";

// BillingService serves invoices. The tenant comes from gRPC metadata, never from a request body.
service BillingService {
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  // GetInvoicePdfUrl returns a presigned link to the invoice PDF (valid for 5 minutes).
  rpc GetInvoicePdfUrl(GetInvoicePdfUrlRequest) returns (GetInvoicePdfUrlResponse);
  // GetRevenueReport sums the tenant's invoices by period, payment provider, customer country and currency. Currencies are never added together.
  rpc GetRevenueReport(GetRevenueReportRequest) returns (GetRevenueReportResponse);
  // GetDunningReport lists the invoices whose payment has not gone through: declined, unknown or given up.
  rpc GetDunningReport(GetDunningReportRequest) returns (GetDunningReportResponse);
  rpc GetCreditNote(GetCreditNoteRequest) returns (GetCreditNoteResponse);
  rpc ListCreditNotes(ListCreditNotesRequest) returns (ListCreditNotesResponse);
  // CreateInvoiceLink makes an unguessable link to a finalized invoice, for the tenant to send to its customer. The token is returned once.
  rpc CreateInvoiceLink(CreateInvoiceLinkRequest) returns (CreateInvoiceLinkResponse);
  // RevokeInvoiceLinks makes every link to an invoice stop working.
  rpc RevokeInvoiceLinks(RevokeInvoiceLinksRequest) returns (RevokeInvoiceLinksResponse);
  // GetDunningSettings returns the tenant's retry delays; defaults_in_use is true when none were set.
  rpc GetDunningSettings(GetDunningSettingsRequest) returns (GetDunningSettingsResponse);
  // SetDunningSettings replaces the delays between a declined charge and each retry (0 to 6 entries; none means a declined charge is given up at once).
  rpc SetDunningSettings(SetDunningSettingsRequest) returns (SetDunningSettingsResponse);
}

// HostedInvoiceService is called by the gateway on behalf of a visitor who holds an invoice link. It has no tenant: the token is the credential.
service HostedInvoiceService {
  rpc GetHostedInvoice(GetHostedInvoiceRequest) returns (GetHostedInvoiceResponse);
  rpc GetHostedInvoicePdfUrl(GetHostedInvoicePdfUrlRequest) returns (GetHostedInvoicePdfUrlResponse);
}

// SandboxService is for sandbox tenants only (FAILED_PRECONDITION otherwise).
service SandboxService {
  // ClosePeriodNow lowers the period's cutoff (aggregator early close), then runs the normal close and saga.
  rpc ClosePeriodNow(ClosePeriodNowRequest) returns (ClosePeriodNowResponse);
}

// BillingAdminService is for operators.
service BillingAdminService {
  // ClosePeriod schedules the close of a period now. Idempotent per (tenant, period).
  rpc ClosePeriod(ClosePeriodRequest) returns (ClosePeriodResponse);
  rpc GetBillingRun(GetBillingRunRequest) returns (GetBillingRunResponse);
  // RetryInvoiceSaga resumes a saga stuck in a *_FAILED state (or PAYMENT_UNKNOWN).
  rpc RetryInvoiceSaga(RetryInvoiceSagaRequest) returns (RetryInvoiceSagaResponse);
  // VoidInvoice voids an invoice, refunding it first if it was paid.
  rpc VoidInvoice(VoidInvoiceRequest) returns (VoidInvoiceResponse);
  // CreateCreditNote corrects a paid invoice without editing it: a numbered credit note whose amount is added to the customer's credit balance, which pays their
  // next invoice in that currency. The notes of an invoice never add up to more than the invoice.
  rpc CreateCreditNote(CreateCreditNoteRequest) returns (CreateCreditNoteResponse);
  // RetryCreditNoteRefund asks the provider again for a refund that failed.
  rpc RetryCreditNoteRefund(RetryCreditNoteRefundRequest) returns (RetryCreditNoteRefundResponse);
  // StartRerating prices a closed period again under another plan version, on the same usage, and bills the difference:
  // a CORRECTION invoice where the customer owes more, a credit balance (applied to the next regular invoice) where less.
  // Idempotent per (tenant, period, plan version).
  rpc StartRerating(StartReratingRequest) returns (StartReratingResponse);
  rpc GetReratingJob(GetReratingJobRequest) returns (GetReratingJobResponse);
  // GetInvoiceSaga returns the saga of an invoice with its append-only transition log (saga_events).
  rpc GetInvoiceSaga(GetInvoiceSagaRequest) returns (GetInvoiceSagaResponse);
  // ListDeadLetters shows the depth of every RabbitMQ dead-letter queue and, for one queue, a peek at its messages.
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse);
  // RedriveDeadLetters moves dead letters of one queue back to where they came from, with the retry counter reset.
  rpc RedriveDeadLetters(RedriveDeadLettersRequest) returns (RedriveDeadLettersResponse);
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_SCHEDULED = 1;
  RUN_STATUS_WAITING_WATERMARK = 2;
  RUN_STATUS_RATING = 3;
  RUN_STATUS_INVOICING = 4;
  RUN_STATUS_COMPLETED = 5;
  RUN_STATUS_FAILED = 6;
}

message BillingRun {
  string tenant_id = 1;
  string period_id = 2;
  RunStatus status = 3;
  google.protobuf.Timestamp cutoff_time = 4;
  int32 generation = 5;
  int32 invoice_count = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp complete_time = 8;
  string last_error = 9;
}

message InvoiceLine {
  int32 line_no = 1;
  // BASE_FEE, USAGE, LATE_USAGE, CREDIT, CORRECTION, DISCOUNT (a coupon, negative) or TAX.
  string kind = 2;
  string meter_code = 3;
  string origin_period_id = 4;
  // Exact decimal in meter units; empty for a base fee.
  string quantity = 5;
  int64 amount_minor = 6;
  string description = 7;
  // The service period the line covers, when it says.
  google.protobuf.Timestamp service_from = 8;
  google.protobuf.Timestamp service_to = 9;
}

message Invoice {
  string id = 1;
  string customer_id = 2;
  string customer_external_id = 3;
  string period_id = 4;
  // REGULAR (a month's usage), CORRECTION (a re-rating), or FEE (a fixed fee in advance, or what a plan change moved).
  string kind = 5;
  // Empty until finalized, e.g. INV-2026-000123 (live) or SBX-2026-000123 (sandbox).
  string number = 6;
  string plan_version_id = 7;
  string currency = 8;
  int64 subtotal_minor = 9;
  int64 total_minor = 10;
  // draft, open, paid, uncollectible or void.
  string status = 11;
  // Saga state, e.g. COMPLETED.
  string saga_state = 12;
  string pdf_object_key = 13;
  google.protobuf.Timestamp create_time = 14;
  google.protobuf.Timestamp finalize_time = 15;
  repeated InvoiceLine lines = 16;
}

message GetInvoiceRequest {
  string invoice_id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}

message ListInvoicesRequest {
  // Optional filters.
  string customer_id = 1;
  string period_id = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListInvoicesResponse {
  // Without lines.
  repeated Invoice invoices = 1;
  string next_page_token = 2;
}

message GetInvoicePdfUrlRequest {
  string invoice_id = 1;
}

message GetInvoicePdfUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message ClosePeriodNowRequest {
  // Empty = the current period in the tenant's time zone.
  string period_id = 1;
}

message ClosePeriodNowResponse {
  BillingRun run = 1;
}

message ClosePeriodRequest {
  string tenant_id = 1;
  string period_id = 2;
}

message ClosePeriodResponse {
  BillingRun run = 1;
}

message GetBillingRunRequest {
  string tenant_id = 1;
  string period_id = 2;
}

message GetBillingRunResponse {
  BillingRun run = 1;
}

message InvoiceSaga {
  string id = 1;
  string invoice_id = 2;
  string state = 3;
  int32 version = 4;
  int32 attempt = 5;
  int32 dunning_attempt = 6;
  string last_error = 7;
}

message RetryInvoiceSagaRequest {
  string tenant_id = 1;
  string invoice_id = 2;
}

message RetryInvoiceSagaResponse {
  InvoiceSaga saga = 1;
}

message VoidInvoiceRequest {
  string tenant_id = 1;
  string invoice_id = 2;
  string reason = 3;
}

message VoidInvoiceResponse {
  InvoiceSaga saga = 1;
}

enum ReratingStatus {
  RERATING_STATUS_UNSPECIFIED = 0;
  RERATING_STATUS_RUNNING = 1;
  RERATING_STATUS_COMPLETED = 2;
  RERATING_STATUS_FAILED = 3;
}

message ReratingJob {
  string id = 1;
  string tenant_id = 2;
  string period_id = 3;
  // The plan version customers of the same plan are priced under.
  string plan_version_id = 4;
  // The aggregate generation whose usage was priced (the tenant's active one when the job started).
  int32 generation = 5;
  ReratingStatus status = 6;
  // Customers whose plan is the target's plan and who had an invoice for the period.
  int32 customers_rated = 7;
  int32 corrections = 8;
  int32 credits = 9;
  // Sum of the CORRECTION invoices, and of the credit balances created, in minor units.
  int64 correction_total_minor = 10;
  int64 credit_total_minor = 11;
  string last_error = 12;
  google.protobuf.Timestamp create_time = 13;
  google.protobuf.Timestamp complete_time = 14;
}

message StartReratingRequest {
  string tenant_id = 1;
  string period_id = 2;
  string plan_version_id = 3;
}

message StartReratingResponse {
  ReratingJob job = 1;
  // False when the job already existed (the request was a repeat).
  bool created = 2;
}

message GetReratingJobRequest {
  string tenant_id = 1;
  string job_id = 2;
}

message GetReratingJobResponse {
  ReratingJob job = 1;
}

message SagaEvent {
  int32 seq = 1;
  string from_state = 2;
  string to_state = 3;
  // For example "reply:PaymentDeclined" or "sweep:step timed out".
  string cause = 4;
  string command_id = 5;
  google.protobuf.Timestamp at = 6;
}

message GetInvoiceSagaRequest {
  string tenant_id = 1;
  string invoice_id = 2;
}

message GetInvoiceSagaResponse {
  InvoiceSaga saga = 1;
  repeated SagaEvent events = 2;
}

message DeadLetterQueue {
  // The command or reply queue the messages came from, for example payment.charge.
  string queue = 1;
  int64 messages = 2;
}

message DeadLetter {
  string message_id = 1;
  // How many times it was delivered before it died.
  int64 delivery_count = 2;
  string reason = 3;
  int32 body_bytes = 4;
}

message ListDeadLettersRequest {
  // Empty: only the depths. Set: also peek at up to limit messages of that queue.
  string queue = 1;
  int32 limit = 2;
}

message ListDeadLettersResponse {
  repeated DeadLetterQueue queues = 1;
  repeated DeadLetter messages = 2;
}

message RedriveDeadLettersRequest {
  string queue = 1;
  // 1..1000, default 100.
  int32 limit = 2;
}

message RedriveDeadLettersResponse {
  int32 redriven = 1;
}

message GetRevenueReportRequest {
  // YYYY-MM, inclusive. Empty from = the earliest period, empty to = the latest.
  string from_period = 1;
  string to_period = 2;
  // Which of period, provider and country to split by; currency is always a split. Empty = period and currency.
  repeated string group_by = 3;
}

message RevenueRow {
  // Empty when the report is not split by it.
  string period = 1;
  string provider = 2;
  string country = 3;
  string currency = 4;
  int64 invoices = 5;
  // Finalized invoices that are not void: open + paid + uncollectible.
  int64 billed_minor = 6;
  // Paid invoices.
  int64 collected_minor = 7;
  // Invoices that were refunded (a voided paid invoice), whatever their final status.
  int64 refunded_minor = 8;
  // Open invoices: finalized, not paid, not given up.
  int64 outstanding_minor = 9;
  int64 uncollectible_minor = 10;
  int64 void_minor = 11;
  // Credit notes issued against these invoices (they stay in billed and collected: an invoice is not edited).
  int64 credited_minor = 12;
}

message GetRevenueReportResponse {
  repeated RevenueRow rows = 1;
}

message GetDunningReportRequest {
  // At most this many invoices, oldest first. Default 100, at most 500.
  int32 limit = 1;
}

message DunningInvoice {
  string invoice_id = 1;
  string number = 2;
  string customer_external_id = 3;
  string period = 4;
  string provider = 5;
  string currency = 6;
  int64 total_minor = 7;
  // The saga state: PAYMENT_DECLINED (retrying), PAYMENT_UNKNOWN (outcome unknown), UNCOLLECTIBLE (given up).
  string state = 8;
  // Retries done so far (0 = only the first charge).
  int32 dunning_attempt = 9;
  google.protobuf.Timestamp next_attempt_time = 10;
  string last_error = 11;
}

message DunningSummary {
  string state = 1;
  string provider = 2;
  string currency = 3;
  int64 invoices = 4;
  int64 total_minor = 5;
}

message GetDunningReportResponse {
  repeated DunningInvoice invoices = 1;
  // Counts and sums of every unpaid invoice (not limited), by state, provider and currency.
  repeated DunningSummary summary = 2;
}

// CreditNote is a numbered correction of a paid invoice.
message CreditNote {
  string id = 1;
  // CN-2026-000007 (live) or SBX-CN-2026-000007 (sandbox).
  string number = 2;
  string invoice_id = 3;
  string invoice_number = 4;
  string customer_id = 5;
  string customer_external_id = 6;
  string currency = 7;
  int64 total_minor = 8;
  string reason = 9;
  google.protobuf.Timestamp create_time = 10;
  // Where the amount went: the customer's credit balance, or back to their card.
  CreditNoteDisposition disposition = 11;
  // For a refund to the card: requested until the provider answers, then refunded or failed.
  RefundState refund_state = 12;
  string refund_error = 13;
}

enum CreditNoteDisposition {
  CREDIT_NOTE_DISPOSITION_UNSPECIFIED = 0;
  CREDIT_NOTE_DISPOSITION_CREDIT = 1;
  CREDIT_NOTE_DISPOSITION_REFUND = 2;
}

enum RefundState {
  REFUND_STATE_UNSPECIFIED = 0;
  REFUND_STATE_REQUESTED = 1;
  REFUND_STATE_REFUNDED = 2;
  REFUND_STATE_FAILED = 3;
}

message CreateCreditNoteRequest {
  string tenant_id = 1;
  string invoice_id = 2;
  // 0 = whatever is left of the invoice after earlier credit notes.
  int64 amount_minor = 3;
  string reason = 4;
  // Return the amount to the card the invoice was paid with instead of adding it to the credit balance. The refund is asked of the payment provider; the
  // note says whether it went through.
  bool refund_to_card = 5;
}

message RetryCreditNoteRefundRequest {
  string tenant_id = 1;
  string credit_note_id = 2;
}

message RetryCreditNoteRefundResponse {
  CreditNote credit_note = 1;
}

message CreateCreditNoteResponse {
  CreditNote credit_note = 1;
}

message GetCreditNoteRequest {
  string credit_note_id = 1;
}

message GetCreditNoteResponse {
  CreditNote credit_note = 1;
}

message ListCreditNotesRequest {
  // Only the notes of this invoice.
  string invoice_id = 1;
  // Only the notes of this customer.
  string customer_external_id = 2;
  // 1..200, default 50.
  int32 page_size = 3;
  string page_token = 4;
}

message ListCreditNotesResponse {
  repeated CreditNote credit_notes = 1;
  string next_page_token = 2;
}

message DunningSettings {
  // Delay before retry 1..n, in hours (minutes for a sandbox tenant). Each is 1..720.
  repeated int32 retry_hours = 1;
  // True when the tenant has set nothing and the service-wide defaults apply.
  bool defaults_in_use = 2;
  google.protobuf.Timestamp update_time = 3;
}
message GetDunningSettingsRequest {}
message GetDunningSettingsResponse { DunningSettings settings = 1; }
message SetDunningSettingsRequest { repeated int32 retry_hours = 1; }
message SetDunningSettingsResponse { DunningSettings settings = 1; }

message CreateInvoiceLinkRequest {
  string invoice_id = 1;
  // 1..365; 0 means 90.
  int32 expires_in_days = 2;
}
message CreateInvoiceLinkResponse {
  // The secret part of the link; shown once.
  string token = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message RevokeInvoiceLinksRequest { string invoice_id = 1; }
message RevokeInvoiceLinksResponse { int32 revoked = 1; }

message GetHostedInvoiceRequest { string token = 1; }
message GetHostedInvoiceResponse {
  Invoice invoice = 1;
  // Who issued the invoice and who it is for, as printed on it.
  string seller_name = 2;
  string customer_name = 3;
  bool pdf_available = 4;
  google.protobuf.Timestamp expire_time = 5;
  // Decimal places of the invoice currency, to print minor units.
  int32 currency_exponent = 6;
}

message GetHostedInvoicePdfUrlRequest { string token = 1; }
message GetHostedInvoicePdfUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expire_time = 2;
}
