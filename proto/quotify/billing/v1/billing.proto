syntax = "proto3";

package quotify.billing.v1;

import "google/protobuf/timestamp.proto";

// BillingService serves invoices. The tenant comes from gRPC metadata, never from a request body.
service BillingService {
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  // GetInvoicePdfUrl returns a presigned link to the invoice PDF (valid for 5 minutes).
  rpc GetInvoicePdfUrl(GetInvoicePdfUrlRequest) returns (GetInvoicePdfUrlResponse);
}

// SandboxService is for sandbox tenants only (FAILED_PRECONDITION otherwise).
service SandboxService {
  // ClosePeriodNow lowers the period's cutoff (aggregator early close), then runs the normal close and saga.
  rpc ClosePeriodNow(ClosePeriodNowRequest) returns (ClosePeriodNowResponse);
}

// BillingAdminService is for operators.
service BillingAdminService {
  // ClosePeriod schedules the close of a period now. Idempotent per (tenant, period).
  rpc ClosePeriod(ClosePeriodRequest) returns (ClosePeriodResponse);
  rpc GetBillingRun(GetBillingRunRequest) returns (GetBillingRunResponse);
  // RetryInvoiceSaga resumes a saga stuck in a *_FAILED state (or PAYMENT_UNKNOWN).
  rpc RetryInvoiceSaga(RetryInvoiceSagaRequest) returns (RetryInvoiceSagaResponse);
  // VoidInvoice voids an invoice, refunding it first if it was paid.
  rpc VoidInvoice(VoidInvoiceRequest) returns (VoidInvoiceResponse);
  // StartRerating prices a closed period again under another plan version, on the same usage, and bills the difference:
  // a CORRECTION invoice where the customer owes more, a credit balance (applied to the next regular invoice) where less.
  // Idempotent per (tenant, period, plan version).
  rpc StartRerating(StartReratingRequest) returns (StartReratingResponse);
  rpc GetReratingJob(GetReratingJobRequest) returns (GetReratingJobResponse);
  // GetInvoiceSaga returns the saga of an invoice with its append-only transition log (saga_events).
  rpc GetInvoiceSaga(GetInvoiceSagaRequest) returns (GetInvoiceSagaResponse);
  // ListDeadLetters shows the depth of every RabbitMQ dead-letter queue and, for one queue, a peek at its messages.
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse);
  // RedriveDeadLetters moves dead letters of one queue back to where they came from, with the retry counter reset.
  rpc RedriveDeadLetters(RedriveDeadLettersRequest) returns (RedriveDeadLettersResponse);
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_SCHEDULED = 1;
  RUN_STATUS_WAITING_WATERMARK = 2;
  RUN_STATUS_RATING = 3;
  RUN_STATUS_INVOICING = 4;
  RUN_STATUS_COMPLETED = 5;
  RUN_STATUS_FAILED = 6;
}

message BillingRun {
  string tenant_id = 1;
  string period_id = 2;
  RunStatus status = 3;
  google.protobuf.Timestamp cutoff_time = 4;
  int32 generation = 5;
  int32 invoice_count = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp complete_time = 8;
  string last_error = 9;
}

message InvoiceLine {
  int32 line_no = 1;
  // BASE_FEE, USAGE, LATE_USAGE, CREDIT or CORRECTION.
  string kind = 2;
  string meter_code = 3;
  string origin_period_id = 4;
  // Exact decimal in meter units; empty for a base fee.
  string quantity = 5;
  int64 amount_minor = 6;
  string description = 7;
}

message Invoice {
  string id = 1;
  string customer_id = 2;
  string customer_external_id = 3;
  string period_id = 4;
  // REGULAR or CORRECTION.
  string kind = 5;
  // Empty until finalized, e.g. INV-2026-000123 (live) or SBX-2026-000123 (sandbox).
  string number = 6;
  string plan_version_id = 7;
  string currency = 8;
  int64 subtotal_minor = 9;
  int64 total_minor = 10;
  // draft, open, paid, uncollectible or void.
  string status = 11;
  // Saga state, e.g. COMPLETED.
  string saga_state = 12;
  string pdf_object_key = 13;
  google.protobuf.Timestamp create_time = 14;
  google.protobuf.Timestamp finalize_time = 15;
  repeated InvoiceLine lines = 16;
}

message GetInvoiceRequest {
  string invoice_id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}

message ListInvoicesRequest {
  // Optional filters.
  string customer_id = 1;
  string period_id = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListInvoicesResponse {
  // Without lines.
  repeated Invoice invoices = 1;
  string next_page_token = 2;
}

message GetInvoicePdfUrlRequest {
  string invoice_id = 1;
}

message GetInvoicePdfUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message ClosePeriodNowRequest {
  // Empty = the current period in the tenant's time zone.
  string period_id = 1;
}

message ClosePeriodNowResponse {
  BillingRun run = 1;
}

message ClosePeriodRequest {
  string tenant_id = 1;
  string period_id = 2;
}

message ClosePeriodResponse {
  BillingRun run = 1;
}

message GetBillingRunRequest {
  string tenant_id = 1;
  string period_id = 2;
}

message GetBillingRunResponse {
  BillingRun run = 1;
}

message InvoiceSaga {
  string id = 1;
  string invoice_id = 2;
  string state = 3;
  int32 version = 4;
  int32 attempt = 5;
  int32 dunning_attempt = 6;
  string last_error = 7;
}

message RetryInvoiceSagaRequest {
  string tenant_id = 1;
  string invoice_id = 2;
}

message RetryInvoiceSagaResponse {
  InvoiceSaga saga = 1;
}

message VoidInvoiceRequest {
  string tenant_id = 1;
  string invoice_id = 2;
  string reason = 3;
}

message VoidInvoiceResponse {
  InvoiceSaga saga = 1;
}

enum ReratingStatus {
  RERATING_STATUS_UNSPECIFIED = 0;
  RERATING_STATUS_RUNNING = 1;
  RERATING_STATUS_COMPLETED = 2;
  RERATING_STATUS_FAILED = 3;
}

message ReratingJob {
  string id = 1;
  string tenant_id = 2;
  string period_id = 3;
  // The plan version customers of the same plan are priced under.
  string plan_version_id = 4;
  // The aggregate generation whose usage was priced (the tenant's active one when the job started).
  int32 generation = 5;
  ReratingStatus status = 6;
  // Customers whose plan is the target's plan and who had an invoice for the period.
  int32 customers_rated = 7;
  int32 corrections = 8;
  int32 credits = 9;
  // Sum of the CORRECTION invoices, and of the credit balances created, in minor units.
  int64 correction_total_minor = 10;
  int64 credit_total_minor = 11;
  string last_error = 12;
  google.protobuf.Timestamp create_time = 13;
  google.protobuf.Timestamp complete_time = 14;
}

message StartReratingRequest {
  string tenant_id = 1;
  string period_id = 2;
  string plan_version_id = 3;
}

message StartReratingResponse {
  ReratingJob job = 1;
  // False when the job already existed (the request was a repeat).
  bool created = 2;
}

message GetReratingJobRequest {
  string tenant_id = 1;
  string job_id = 2;
}

message GetReratingJobResponse {
  ReratingJob job = 1;
}

message SagaEvent {
  int32 seq = 1;
  string from_state = 2;
  string to_state = 3;
  // For example "reply:PaymentDeclined" or "sweep:step timed out".
  string cause = 4;
  string command_id = 5;
  google.protobuf.Timestamp at = 6;
}

message GetInvoiceSagaRequest {
  string tenant_id = 1;
  string invoice_id = 2;
}

message GetInvoiceSagaResponse {
  InvoiceSaga saga = 1;
  repeated SagaEvent events = 2;
}

message DeadLetterQueue {
  // The command or reply queue the messages came from, for example payment.charge.
  string queue = 1;
  int64 messages = 2;
}

message DeadLetter {
  string message_id = 1;
  // How many times it was delivered before it died.
  int64 delivery_count = 2;
  string reason = 3;
  int32 body_bytes = 4;
}

message ListDeadLettersRequest {
  // Empty: only the depths. Set: also peek at up to limit messages of that queue.
  string queue = 1;
  int32 limit = 2;
}

message ListDeadLettersResponse {
  repeated DeadLetterQueue queues = 1;
  repeated DeadLetter messages = 2;
}

message RedriveDeadLettersRequest {
  string queue = 1;
  // 1..1000, default 100.
  int32 limit = 2;
}

message RedriveDeadLettersResponse {
  int32 redriven = 1;
}
