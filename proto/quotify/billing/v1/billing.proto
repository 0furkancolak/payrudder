syntax = "proto3";

package quotify.billing.v1;

import "google/protobuf/timestamp.proto";

// BillingService serves invoices. The tenant comes from gRPC metadata, never from a request body.
service BillingService {
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  // GetInvoicePdfUrl returns a presigned link to the invoice PDF (valid for 5 minutes).
  rpc GetInvoicePdfUrl(GetInvoicePdfUrlRequest) returns (GetInvoicePdfUrlResponse);
  // GetRevenueReport sums the tenant's invoices by period, payment provider, customer country and currency. Currencies are never added together.
  rpc GetRevenueReport(GetRevenueReportRequest) returns (GetRevenueReportResponse);
  // GetDunningReport lists the invoices whose payment has not gone through: declined, unknown or given up.
  rpc GetDunningReport(GetDunningReportRequest) returns (GetDunningReportResponse);
  rpc GetCreditNote(GetCreditNoteRequest) returns (GetCreditNoteResponse);
  rpc ListCreditNotes(ListCreditNotesRequest) returns (ListCreditNotesResponse);
  // GetEInvoice returns one e-document (the legal copy of an invoice or credit note) and its state.
  rpc GetEInvoice(GetEInvoiceRequest) returns (GetEInvoiceResponse);
  // ListEInvoices lists the tenant's e-documents, newest first.
  rpc ListEInvoices(ListEInvoicesRequest) returns (ListEInvoicesResponse);
  // GetEInvoiceFileUrl returns a presigned link (5 minutes) to the document's UBL XML or PDF.
  rpc GetEInvoiceFileUrl(GetEInvoiceFileUrlRequest) returns (GetEInvoiceFileUrlResponse);
  // CreateInvoiceLink makes an unguessable link to a finalized invoice, for the tenant to send to its customer. The token is returned once.
  rpc CreateInvoiceLink(CreateInvoiceLinkRequest) returns (CreateInvoiceLinkResponse);
  // RevokeInvoiceLinks makes every link to an invoice stop working.
  rpc RevokeInvoiceLinks(RevokeInvoiceLinksRequest) returns (RevokeInvoiceLinksResponse);
  // CreatePaymentLink makes a payment link (phase 34): for an open invoice, or ad hoc for a fixed amount. The token is returned once. Idempotent per idempotency_key.
  rpc CreatePaymentLink(CreatePaymentLinkRequest) returns (CreatePaymentLinkResponse);
  rpc GetPaymentLink(GetPaymentLinkRequest) returns (GetPaymentLinkResponse);
  rpc ListPaymentLinks(ListPaymentLinksRequest) returns (ListPaymentLinksResponse);
  // RevokePaymentLink stops a link (and the links it handed out) from working. An ad-hoc invoice nobody has paid is voided.
  rpc RevokePaymentLink(RevokePaymentLinkRequest) returns (RevokePaymentLinkResponse);
  // CreatePortalLink makes the link to a customer's payment-history page. The token is returned once.
  rpc CreatePortalLink(CreatePortalLinkRequest) returns (CreatePortalLinkResponse);
  rpc RevokePortalLinks(RevokePortalLinksRequest) returns (RevokePortalLinksResponse);
  // SettleInvoicePayment is called by payments-worker when a provider confirmed a payment made on a hosted page. It moves the invoice's saga to paid.
  rpc SettleInvoicePayment(SettleInvoicePaymentRequest) returns (SettleInvoicePaymentResponse);
  // GetDunningSettings returns the tenant's retry delays; defaults_in_use is true when none were set.
  rpc GetDunningSettings(GetDunningSettingsRequest) returns (GetDunningSettingsResponse);
  // SetDunningSettings replaces the delays between a declined charge and each retry (0 to 6 entries; none means a declined charge is given up at once).
  rpc SetDunningSettings(SetDunningSettingsRequest) returns (SetDunningSettingsResponse);

  // ListCreditPacks lists the credit packs the tenant sells.
  rpc ListCreditPacks(ListCreditPacksRequest) returns (ListCreditPacksResponse);
  // CreateCreditPack adds a pack: a number of credits for a price in one currency.
  rpc CreateCreditPack(CreateCreditPackRequest) returns (CreateCreditPackResponse);
  // SetCreditPackActive withdraws a pack from sale or puts it back. Credits already sold are not touched.
  rpc SetCreditPackActive(SetCreditPackActiveRequest) returns (SetCreditPackActiveResponse);
  // GetCreditBalance returns what a customer can spend now and when some of it runs out.
  rpc GetCreditBalance(GetCreditBalanceRequest) returns (GetCreditBalanceResponse);
  // GrantCredits adds credits to a customer (a promotion, a goodwill gesture, a manual sale). With the same idempotency key a repeat does nothing.
  rpc GrantCredits(GrantCreditsRequest) returns (GrantCreditsResponse);
  // ConsumeCredits takes credits from a customer, the ones that expire first. FAILED_PRECONDITION (billing.credits.insufficient) when the balance is too small;
  // nothing is taken then. With the same idempotency key a repeat returns the first result.
  rpc ConsumeCredits(ConsumeCreditsRequest) returns (ConsumeCreditsResponse);
  // ListCreditLedger lists a customer's credit changes, newest first.
  rpc ListCreditLedger(ListCreditLedgerRequest) returns (ListCreditLedgerResponse);

  // CreateExpense records money the tenant spent (or spends every month or year).
  rpc CreateExpense(CreateExpenseRequest) returns (CreateExpenseResponse);
  // UpdateExpense replaces the fields of an expense that has not been voided. A recurring expense changes as a whole, all its occurrences.
  rpc UpdateExpense(UpdateExpenseRequest) returns (UpdateExpenseResponse);
  // VoidExpense takes an expense out of every summary, with a reason. It stays listable (include_voided).
  rpc VoidExpense(VoidExpenseRequest) returns (VoidExpenseResponse);
  // ListExpenses lists the entries as recorded, newest first; a recurring expense is one entry.
  rpc ListExpenses(ListExpensesRequest) returns (ListExpensesResponse);
  // GetAccountingSummary adds up income (from paid invoices, tax and refunds) and expenses over a period, one block per currency. Currencies are never converted or added together.
  rpc GetAccountingSummary(GetAccountingSummaryRequest) returns (GetAccountingSummaryResponse);
  // GetCreditSettings returns the balance below which a customer's consume announces credits.low (0: off).
  rpc GetCreditSettings(GetCreditSettingsRequest) returns (GetCreditSettingsResponse);
  // SetCreditSettings sets that balance.
  rpc SetCreditSettings(SetCreditSettingsRequest) returns (SetCreditSettingsResponse);
}

// HostedInvoiceService is called by the gateway on behalf of a visitor who holds an invoice link. It has no tenant: the token is the credential.
service HostedInvoiceService {
  rpc GetHostedInvoice(GetHostedInvoiceRequest) returns (GetHostedInvoiceResponse);
  rpc GetHostedInvoicePdfUrl(GetHostedInvoicePdfUrlRequest) returns (GetHostedInvoicePdfUrlResponse);
  // GetHostedLogoUrl returns a short-lived link to the seller's logo, when the invoice has one.
  rpc GetHostedLogoUrl(GetHostedLogoUrlRequest) returns (GetHostedLogoUrlResponse);
  // StartLinkPayment is the first use of an ad-hoc link: it creates the invoice and hands out the invoice link the payer continues on.
  rpc StartLinkPayment(StartLinkPaymentRequest) returns (StartLinkPaymentResponse);
  // RequestHostedPayment asks to pay a payable invoice by a method. "mock" (sandbox and demo only) charges through the saga; any other method returns the
  // context the gateway needs to ask payments-worker for a provider checkout or payment instructions.
  rpc RequestHostedPayment(RequestHostedPaymentRequest) returns (RequestHostedPaymentResponse);
  // GetPortal returns a customer's page: who they are and their invoices.
  rpc GetPortal(GetPortalRequest) returns (GetPortalResponse);
  // StartPortalPurchase starts the purchase of a credit pack from a customer's portal: it makes (or finds) the credit-pack link and its invoice and returns the
  // token of the invoice link the customer pays on.
  rpc StartPortalPurchase(StartPortalPurchaseRequest) returns (StartPortalPurchaseResponse);
}

// SandboxService is for sandbox tenants only (FAILED_PRECONDITION otherwise).
service SandboxService {
  // ClosePeriodNow lowers the period's cutoff (aggregator early close), then runs the normal close and saga.
  rpc ClosePeriodNow(ClosePeriodNowRequest) returns (ClosePeriodNowResponse);
}

// BillingAdminService is for operators.
service BillingAdminService {
  // ClosePeriod schedules the close of a period now. Idempotent per (tenant, period).
  rpc ClosePeriod(ClosePeriodRequest) returns (ClosePeriodResponse);
  rpc GetBillingRun(GetBillingRunRequest) returns (GetBillingRunResponse);
  // RetryInvoiceSaga resumes a saga stuck in a *_FAILED state (or PAYMENT_UNKNOWN).
  rpc RetryInvoiceSaga(RetryInvoiceSagaRequest) returns (RetryInvoiceSagaResponse);
  // VoidInvoice voids an invoice, refunding it first if it was paid.
  rpc VoidInvoice(VoidInvoiceRequest) returns (VoidInvoiceResponse);
  // RecordInvoicePayment records money received outside a payment provider (a bank transfer, cash, other) against an open or uncollectible invoice. Partial
  // payments are recorded; the invoice is paid when they add up to the total. More than is outstanding is refused. Idempotent per (invoice, method, reference)
  // when a reference is given.
  rpc RecordInvoicePayment(RecordInvoicePaymentRequest) returns (RecordInvoicePaymentResponse);
  // CreateCreditNote corrects a paid invoice without editing it: a numbered credit note whose amount is added to the customer's credit balance, which pays their
  // next invoice in that currency. The notes of an invoice never add up to more than the invoice.
  rpc CreateCreditNote(CreateCreditNoteRequest) returns (CreateCreditNoteResponse);
  // RetryCreditNoteRefund asks the provider again for a refund that failed.
  rpc RetryCreditNoteRefund(RetryCreditNoteRefundRequest) returns (RetryCreditNoteRefundResponse);
  // RetryEInvoice sends a failed e-document again, with the seller's and buyer's data read afresh. Lines, amounts, number and date stay as they were.
  rpc RetryEInvoice(RetryEInvoiceRequest) returns (RetryEInvoiceResponse);
  // CancelEInvoice cancels an issued e-document where the provider and the law allow it.
  rpc CancelEInvoice(CancelEInvoiceRequest) returns (CancelEInvoiceResponse);
  // StartRerating prices a closed period again under another plan version, on the same usage, and bills the difference:
  // a CORRECTION invoice where the customer owes more, a credit balance (applied to the next regular invoice) where less.
  // Idempotent per (tenant, period, plan version).
  rpc StartRerating(StartReratingRequest) returns (StartReratingResponse);
  rpc GetReratingJob(GetReratingJobRequest) returns (GetReratingJobResponse);
  // GetInvoiceSaga returns the saga of an invoice with its append-only transition log (saga_events).
  rpc GetInvoiceSaga(GetInvoiceSagaRequest) returns (GetInvoiceSagaResponse);
  // ListDeadLetters shows the depth of every RabbitMQ dead-letter queue and, for one queue, a peek at its messages.
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse);
  // RedriveDeadLetters moves dead letters of one queue back to where they came from, with the retry counter reset.
  rpc RedriveDeadLetters(RedriveDeadLettersRequest) returns (RedriveDeadLettersResponse);
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_SCHEDULED = 1;
  RUN_STATUS_WAITING_WATERMARK = 2;
  RUN_STATUS_RATING = 3;
  RUN_STATUS_INVOICING = 4;
  RUN_STATUS_COMPLETED = 5;
  RUN_STATUS_FAILED = 6;
}

message BillingRun {
  string tenant_id = 1;
  string period_id = 2;
  RunStatus status = 3;
  google.protobuf.Timestamp cutoff_time = 4;
  int32 generation = 5;
  int32 invoice_count = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp complete_time = 8;
  string last_error = 9;
}

message InvoiceLine {
  int32 line_no = 1;
  // BASE_FEE, USAGE, LATE_USAGE, CREDIT, CORRECTION, DISCOUNT (a coupon, negative) or TAX.
  string kind = 2;
  string meter_code = 3;
  string origin_period_id = 4;
  // Exact decimal in meter units; empty for a base fee.
  string quantity = 5;
  int64 amount_minor = 6;
  string description = 7;
  // The service period the line covers, when it says.
  google.protobuf.Timestamp service_from = 8;
  google.protobuf.Timestamp service_to = 9;
}

message Invoice {
  string id = 1;
  string customer_id = 2;
  string customer_external_id = 3;
  string period_id = 4;
  // REGULAR (a month's usage), CORRECTION (a re-rating), FEE (a fixed fee in advance, or what a plan change moved) or LINK (made from an ad-hoc payment link).
  string kind = 5;
  // Empty until finalized, e.g. INV-2026-000123 (live) or SBX-2026-000123 (sandbox).
  string number = 6;
  string plan_version_id = 7;
  string currency = 8;
  int64 subtotal_minor = 9;
  int64 total_minor = 10;
  // draft, open, paid, uncollectible or void.
  string status = 11;
  // Saga state, e.g. COMPLETED.
  string saga_state = 12;
  string pdf_object_key = 13;
  google.protobuf.Timestamp create_time = 14;
  google.protobuf.Timestamp finalize_time = 15;
  repeated InvoiceLine lines = 16;
  // Payments recorded by hand (RecordInvoicePayment), oldest first. Only GetInvoice fills it.
  repeated InvoicePayment payments = 17;
}

// InvoicePayment is money received outside a payment provider and recorded by an operator.
message InvoicePayment {
  string id = 1;
  string invoice_id = 2;
  // bank_transfer, cash or other.
  string method = 3;
  int64 amount_minor = 4;
  string currency = 5;
  google.protobuf.Timestamp received_at = 6;
  // The bank's or the receipt's reference, empty when none was given.
  string reference = 7;
  string note = 8;
  // Who recorded it and when.
  string recorded_by = 9;
  google.protobuf.Timestamp recorded_at = 10;
}

message RecordInvoicePaymentRequest {
  string tenant_id = 1;
  string invoice_id = 2;
  // bank_transfer, cash or other.
  string method = 3;
  int64 amount_minor = 4;
  // Empty: now. Not in the future.
  google.protobuf.Timestamp received_at = 5;
  string reference = 6;
  string note = 7;
  // Who records it (the gateway passes X-Quotify-Actor; empty is "operator").
  string actor = 8;
}

message RecordInvoicePaymentResponse {
  InvoicePayment payment = 1;
  // True when this call changed nothing: the same (invoice, method, reference) was recorded before.
  bool duplicate = 2;
  // The sum of the payments recorded by hand, and what is left to pay.
  int64 paid_minor = 3;
  int64 outstanding_minor = 4;
  // True when the invoice is paid (by this payment or before).
  bool settled = 5;
}

message GetInvoiceRequest {
  string invoice_id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}

message ListInvoicesRequest {
  // Optional filters.
  string customer_id = 1;
  string period_id = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListInvoicesResponse {
  // Without lines.
  repeated Invoice invoices = 1;
  string next_page_token = 2;
}

message GetInvoicePdfUrlRequest {
  string invoice_id = 1;
}

message GetInvoicePdfUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message ClosePeriodNowRequest {
  // Empty = the current period in the tenant's time zone.
  string period_id = 1;
}

message ClosePeriodNowResponse {
  BillingRun run = 1;
}

message ClosePeriodRequest {
  string tenant_id = 1;
  string period_id = 2;
}

message ClosePeriodResponse {
  BillingRun run = 1;
}

message GetBillingRunRequest {
  string tenant_id = 1;
  string period_id = 2;
}

message GetBillingRunResponse {
  BillingRun run = 1;
}

message InvoiceSaga {
  string id = 1;
  string invoice_id = 2;
  string state = 3;
  int32 version = 4;
  int32 attempt = 5;
  int32 dunning_attempt = 6;
  string last_error = 7;
}

message RetryInvoiceSagaRequest {
  string tenant_id = 1;
  string invoice_id = 2;
}

message RetryInvoiceSagaResponse {
  InvoiceSaga saga = 1;
}

message VoidInvoiceRequest {
  string tenant_id = 1;
  string invoice_id = 2;
  string reason = 3;
}

message VoidInvoiceResponse {
  InvoiceSaga saga = 1;
}

enum ReratingStatus {
  RERATING_STATUS_UNSPECIFIED = 0;
  RERATING_STATUS_RUNNING = 1;
  RERATING_STATUS_COMPLETED = 2;
  RERATING_STATUS_FAILED = 3;
}

message ReratingJob {
  string id = 1;
  string tenant_id = 2;
  string period_id = 3;
  // The plan version customers of the same plan are priced under.
  string plan_version_id = 4;
  // The aggregate generation whose usage was priced (the tenant's active one when the job started).
  int32 generation = 5;
  ReratingStatus status = 6;
  // Customers whose plan is the target's plan and who had an invoice for the period.
  int32 customers_rated = 7;
  int32 corrections = 8;
  int32 credits = 9;
  // Sum of the CORRECTION invoices, and of the credit balances created, in minor units.
  int64 correction_total_minor = 10;
  int64 credit_total_minor = 11;
  string last_error = 12;
  google.protobuf.Timestamp create_time = 13;
  google.protobuf.Timestamp complete_time = 14;
}

message StartReratingRequest {
  string tenant_id = 1;
  string period_id = 2;
  string plan_version_id = 3;
}

message StartReratingResponse {
  ReratingJob job = 1;
  // False when the job already existed (the request was a repeat).
  bool created = 2;
}

message GetReratingJobRequest {
  string tenant_id = 1;
  string job_id = 2;
}

message GetReratingJobResponse {
  ReratingJob job = 1;
}

message SagaEvent {
  int32 seq = 1;
  string from_state = 2;
  string to_state = 3;
  // For example "reply:PaymentDeclined" or "sweep:step timed out".
  string cause = 4;
  string command_id = 5;
  google.protobuf.Timestamp at = 6;
}

message GetInvoiceSagaRequest {
  string tenant_id = 1;
  string invoice_id = 2;
}

message GetInvoiceSagaResponse {
  InvoiceSaga saga = 1;
  repeated SagaEvent events = 2;
}

message DeadLetterQueue {
  // The command or reply queue the messages came from, for example payment.charge.
  string queue = 1;
  int64 messages = 2;
}

message DeadLetter {
  string message_id = 1;
  // How many times it was delivered before it died.
  int64 delivery_count = 2;
  string reason = 3;
  int32 body_bytes = 4;
}

message ListDeadLettersRequest {
  // Empty: only the depths. Set: also peek at up to limit messages of that queue.
  string queue = 1;
  int32 limit = 2;
}

message ListDeadLettersResponse {
  repeated DeadLetterQueue queues = 1;
  repeated DeadLetter messages = 2;
}

message RedriveDeadLettersRequest {
  string queue = 1;
  // 1..1000, default 100.
  int32 limit = 2;
}

message RedriveDeadLettersResponse {
  int32 redriven = 1;
}

message GetRevenueReportRequest {
  // YYYY-MM, inclusive. Empty from = the earliest period, empty to = the latest.
  string from_period = 1;
  string to_period = 2;
  // Which of period, provider and country to split by; currency is always a split. Empty = period and currency.
  repeated string group_by = 3;
}

message RevenueRow {
  // Empty when the report is not split by it.
  string period = 1;
  string provider = 2;
  string country = 3;
  string currency = 4;
  int64 invoices = 5;
  // Finalized invoices that are not void: open + paid + uncollectible.
  int64 billed_minor = 6;
  // Paid invoices.
  int64 collected_minor = 7;
  // Invoices that were refunded (a voided paid invoice), whatever their final status.
  int64 refunded_minor = 8;
  // Open invoices: finalized, not paid, not given up.
  int64 outstanding_minor = 9;
  int64 uncollectible_minor = 10;
  int64 void_minor = 11;
  // Credit notes issued against these invoices (they stay in billed and collected: an invoice is not edited).
  int64 credited_minor = 12;
}

message GetRevenueReportResponse {
  repeated RevenueRow rows = 1;
}

message GetDunningReportRequest {
  // At most this many invoices, oldest first. Default 100, at most 500.
  int32 limit = 1;
}

message DunningInvoice {
  string invoice_id = 1;
  string number = 2;
  string customer_external_id = 3;
  string period = 4;
  string provider = 5;
  string currency = 6;
  int64 total_minor = 7;
  // The saga state: PAYMENT_DECLINED (retrying), PAYMENT_UNKNOWN (outcome unknown), PAYMENT_PENDING (waiting for a bank transfer), UNCOLLECTIBLE (given up).
  string state = 8;
  // Retries done so far (0 = only the first charge).
  int32 dunning_attempt = 9;
  google.protobuf.Timestamp next_attempt_time = 10;
  string last_error = 11;
}

message DunningSummary {
  string state = 1;
  string provider = 2;
  string currency = 3;
  int64 invoices = 4;
  int64 total_minor = 5;
}

message GetDunningReportResponse {
  repeated DunningInvoice invoices = 1;
  // Counts and sums of every unpaid invoice (not limited), by state, provider and currency.
  repeated DunningSummary summary = 2;
}

// CreditNote is a numbered correction of a paid invoice.
message CreditNote {
  string id = 1;
  // CN-2026-000007 (live) or SBX-CN-2026-000007 (sandbox).
  string number = 2;
  string invoice_id = 3;
  string invoice_number = 4;
  string customer_id = 5;
  string customer_external_id = 6;
  string currency = 7;
  int64 total_minor = 8;
  string reason = 9;
  google.protobuf.Timestamp create_time = 10;
  // Where the amount went: the customer's credit balance, or back to their card.
  CreditNoteDisposition disposition = 11;
  // For a refund to the card: requested until the provider answers, then refunded or failed.
  RefundState refund_state = 12;
  string refund_error = 13;
}

enum CreditNoteDisposition {
  CREDIT_NOTE_DISPOSITION_UNSPECIFIED = 0;
  CREDIT_NOTE_DISPOSITION_CREDIT = 1;
  CREDIT_NOTE_DISPOSITION_REFUND = 2;
}

enum RefundState {
  REFUND_STATE_UNSPECIFIED = 0;
  REFUND_STATE_REQUESTED = 1;
  REFUND_STATE_REFUNDED = 2;
  REFUND_STATE_FAILED = 3;
}

message CreateCreditNoteRequest {
  string tenant_id = 1;
  string invoice_id = 2;
  // 0 = whatever is left of the invoice after earlier credit notes.
  int64 amount_minor = 3;
  string reason = 4;
  // Return the amount to the card the invoice was paid with instead of adding it to the credit balance. The refund is asked of the payment provider; the
  // note says whether it went through.
  bool refund_to_card = 5;
}

message RetryCreditNoteRefundRequest {
  string tenant_id = 1;
  string credit_note_id = 2;
}

message RetryCreditNoteRefundResponse {
  CreditNote credit_note = 1;
}

message CreateCreditNoteResponse {
  CreditNote credit_note = 1;
}

message GetCreditNoteRequest {
  string credit_note_id = 1;
}

message GetCreditNoteResponse {
  CreditNote credit_note = 1;
}

message ListCreditNotesRequest {
  // Only the notes of this invoice.
  string invoice_id = 1;
  // Only the notes of this customer.
  string customer_external_id = 2;
  // 1..200, default 50.
  int32 page_size = 3;
  string page_token = 4;
}

message ListCreditNotesResponse {
  repeated CreditNote credit_notes = 1;
  string next_page_token = 2;
}

message DunningSettings {
  // Delay before retry 1..n, in hours (minutes for a sandbox tenant). Each is 1..720.
  repeated int32 retry_hours = 1;
  // True when the tenant has set nothing and the service-wide defaults apply.
  bool defaults_in_use = 2;
  google.protobuf.Timestamp update_time = 3;
}
message GetDunningSettingsRequest {}
message GetDunningSettingsResponse { DunningSettings settings = 1; }
message SetDunningSettingsRequest { repeated int32 retry_hours = 1; }
message SetDunningSettingsResponse { DunningSettings settings = 1; }

message CreateInvoiceLinkRequest {
  string invoice_id = 1;
  // 1..365; 0 means 90.
  int32 expires_in_days = 2;
}
message CreateInvoiceLinkResponse {
  // The secret part of the link; shown once.
  string token = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message RevokeInvoiceLinksRequest { string invoice_id = 1; }
message RevokeInvoiceLinksResponse { int32 revoked = 1; }

// A visitor holds either a link token (token) or a customer portal token (portal_token) together with the invoice of the portal they want (invoice_id).
message GetHostedInvoiceRequest {
  string token = 1;
  string portal_token = 2;
  string invoice_id = 3;
}
message GetHostedInvoiceResponse {
  Invoice invoice = 1;
  // Who issued the invoice and who it is for, as printed on it.
  string seller_name = 2;
  string customer_name = 3;
  bool pdf_available = 4;
  google.protobuf.Timestamp expire_time = 5;
  // Decimal places of the invoice currency, to print minor units.
  int32 currency_exponent = 6;
  repeated string seller_address_lines = 7;
  repeated string customer_address_lines = 8;
  // "invoice" or "adhoc". An ad-hoc link before its first use has no invoice (invoice is unset) and carries adhoc.
  string kind = 9;
  // open (waiting for the customer), processing (a payment is on its way), failed (the last attempt was declined), paid, void.
  string payment_state = 10;
  // The invoice can be paid on the page now.
  bool payable = 11;
  bool logo_available = 12;
  // "sandbox" or "live": a sandbox invoice offers the mock payment.
  string environment = 13;
  // What payments-worker needs to offer or start a payment.
  HostedPaymentContext payment = 14;
  HostedAdhoc adhoc = 15;
  // Where to send the money, for an invoice paid by bank transfer; unset otherwise.
  BankTransferInstructions payment_instructions = 16;
}

// BankTransferInstructions are the tenant's bank details and the reference the customer puts on the transfer.
message BankTransferInstructions {
  string bank_name = 1;
  string account_holder = 2;
  string iban = 3;
  string bic = 4;
  string reference = 5;
}

// HostedAdhoc is what a visitor sees of an ad-hoc link before paying.
message HostedAdhoc {
  string description = 1;
  int64 amount_minor = 2;
  string currency = 3;
  int32 currency_exponent = 4;
  // A single-use link that has been paid cannot be used again.
  bool consumed = 5;
  string seller_name = 6;
  bool logo_available = 7;
  string environment = 8;
  // Set for a credit-pack link: what the customer buys.
  HostedCreditPack pack = 9;
}
message HostedCreditPack {
  string name = 1;
  // Credits in all (the pack's credits times the quantity).
  int64 credits = 2;
  int32 quantity = 3;
  // 0: the credits never expire.
  int32 validity_days = 4;
}

// HostedPaymentContext is what payments-worker needs about an invoice to offer or start a payment.
message HostedPaymentContext {
  string tenant_id = 1;
  string invoice_id = 2;
  string saga_id = 3;
  string number = 4;
  int64 amount_minor = 5;
  string currency = 6;
  // The payment provider the invoice was routed to; empty is the tenant's default.
  string provider = 7;
  string country = 8;
  string customer_email = 9;
  string customer_name = 10;
  string description = 11;
  string environment = 12;
}

message GetHostedInvoicePdfUrlRequest {
  string token = 1;
  string portal_token = 2;
  string invoice_id = 3;
}
message GetHostedInvoicePdfUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expire_time = 2;
}

// EInvoiceDocument is the legal e-document of an invoice or a credit note and where it stands (docs/phases/phase-30-e-invoice.md).
message EInvoiceDocument {
  string id = 1;
  // "invoice" or "credit_note".
  string kind = 2;
  string invoice_id = 3;
  // Set for a credit note.
  string credit_note_id = 4;
  // Quotify's number of the invoice or credit note.
  string number = 5;
  // pending, issued, failed or cancelled.
  string status = 6;
  // e-fatura, e-arsiv or peppol; empty until the provider has been chosen.
  string document_type = 7;
  string provider = 8;
  string environment = 9;
  // The number the document was issued under; never reused.
  string legal_number = 10;
  string external_id = 11;
  int32 attempts = 12;
  google.protobuf.Timestamp next_attempt_at = 13;
  // Error key (docs/error-keys.md) and English text of the last failure.
  string last_error_key = 14;
  string last_error = 15;
  bool has_xml = 16;
  bool has_pdf = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp issued_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

message GetEInvoiceRequest {
  string id = 1;
}

message GetEInvoiceResponse {
  EInvoiceDocument document = 1;
}

message ListEInvoicesRequest {
  string invoice_id = 1;
  string credit_note_id = 2;
  // pending, issued, failed or cancelled; empty for all.
  string status = 3;
  // 1..200, default 50.
  int32 page_size = 4;
  string page_token = 5;
}

message ListEInvoicesResponse {
  repeated EInvoiceDocument documents = 1;
  string next_page_token = 2;
  int64 total = 3;
}

message GetEInvoiceFileUrlRequest {
  string id = 1;
  // "xml" or "pdf".
  string kind = 2;
}

message GetEInvoiceFileUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RetryEInvoiceRequest {
  string tenant_id = 1;
  string id = 2;
}

message CancelEInvoiceRequest {
  string tenant_id = 1;
  string id = 2;
  string reason = 3;
}

message RetryEInvoiceResponse {
  EInvoiceDocument document = 1;
}

message CancelEInvoiceResponse {
  EInvoiceDocument document = 1;
}

message GetHostedLogoUrlRequest {
  string token = 1;
  string portal_token = 2;
  string invoice_id = 3;
}
message GetHostedLogoUrlResponse { string url = 1; }

message StartLinkPaymentRequest { string token = 1; }
message StartLinkPaymentResponse {
  // The token of the invoice link the payer continues on; shown once, in the redirect.
  string invoice_token = 1;
}

message RequestHostedPaymentRequest {
  string token = 1;
  string portal_token = 2;
  string invoice_id = 3;
  // "mock" or the id of a method the gateway got from payments-worker (checkout, bank_transfer…).
  string method = 4;
}
message RequestHostedPaymentResponse {
  // "started" when billing took the payment on (mock); "provider" when the gateway has to continue with payments-worker using payment.
  string action = 1;
  HostedPaymentContext payment = 2;
}

message GetPortalRequest { string portal_token = 1; }
message PortalInvoice {
  string id = 1;
  string number = 2;
  string status = 3;
  string payment_state = 4;
  bool payable = 5;
  int64 total_minor = 6;
  string currency = 7;
  int32 currency_exponent = 8;
  google.protobuf.Timestamp issue_time = 9;
  string kind = 10;
  bool pdf_available = 11;
}
message GetPortalResponse {
  string customer_name = 1;
  string seller_name = 2;
  bool logo_available = 3;
  string environment = 4;
  google.protobuf.Timestamp expire_time = 5;
  repeated PortalInvoice invoices = 6;
  // For the gateway to look up the ledger rows of these invoices.
  string tenant_id = 7;
  string customer_id = 8;
  // Credits (phase 36): the spendable balance and its lots, the packs on sale, and whether this portal link can buy one.
  int64 credit_balance = 9;
  repeated PortalCreditLot credit_lots = 10;
  repeated PortalCreditPack credit_packs = 11;
  bool can_buy_credits = 12;
}
message PortalCreditLot {
  int64 granted = 1;
  int64 remaining = 2;
  // Unset when the credits never expire.
  google.protobuf.Timestamp expire_time = 3;
}
message PortalCreditPack {
  string id = 1;
  string name = 2;
  int64 credits = 3;
  int64 price_minor = 4;
  string currency = 5;
  int32 currency_exponent = 6;
  // 0: the credits never expire.
  int32 validity_days = 7;
}
message StartPortalPurchaseRequest {
  string portal_token = 1;
  string pack_id = 2;
  // 1..1000; 0 means 1.
  int32 quantity = 3;
}
message StartPortalPurchaseResponse {
  // The token of the invoice link the customer continues on; shown once, in the redirect.
  string invoice_token = 1;
}

// PaymentLink is a link the tenant handed out. The secret part is never stored, only its hash.
message PaymentLink {
  string id = 1;
  // "invoice" (pays an existing invoice), "adhoc" (a fixed amount; the invoice is made when the customer first uses it) or "credit_pack" (a credit pack for one
  // customer; the credits are granted once when the invoice is paid).
  string kind = 2;
  // active, paid (a single-use link that was paid), expired or revoked.
  string status = 3;
  string invoice_id = 4;
  string customer_external_id = 5;
  bool single_use = 6;
  int64 amount_minor = 7;
  string currency = 8;
  string description = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp expire_time = 11;
  google.protobuf.Timestamp revoke_time = 12;
  // How many invoices were paid through the link, and when last.
  int32 paid_count = 13;
  google.protobuf.Timestamp last_paid_time = 14;
  // How many invoices the link created (ad hoc).
  int32 use_count = 15;
  string idempotency_key = 16;
  // kind credit_pack: the pack, how many of it, and the credits one use grants (the pack's credits times the quantity, frozen when the link was made).
  string pack_id = 17;
  int32 quantity = 18;
  int64 credits = 19;
}

message CreatePaymentLinkRequest {
  // "invoice", "adhoc" or "credit_pack"; empty means "invoice" when invoice_id is set, else "adhoc".
  string kind = 1;
  // kind invoice: the finalized, unpaid invoice.
  string invoice_id = 2;
  // kind adhoc: a positive amount in minor units, its currency (the tenant's when empty) and what it is for.
  int64 amount_minor = 3;
  string currency = 4;
  string description = 5;
  // kind adhoc, optional: the invoice is made out to this customer (their name, address and country apply).
  string customer_external_id = 6;
  // Unset: true for an ad-hoc link, false for an invoice link.
  optional bool single_use = 7;
  // 1..365; 0 means 30 for an ad-hoc link and 90 for an invoice link.
  int32 expires_in_days = 8;
  // The same key from the same tenant returns the link made the first time (without the token, which is shown once).
  string idempotency_key = 9;
  // kind credit_pack: the pack to sell and how many of it (1..1000; 0 means 1). Amount and currency come from the pack, never from the request; the customer is
  // required (customer_external_id) and so is an active pack.
  string pack_id = 10;
  int32 quantity = 11;
}
message CreatePaymentLinkResponse {
  PaymentLink link = 1;
  // Empty when replayed.
  string token = 2;
  bool replayed = 3;
}

message GetPaymentLinkRequest { string link_id = 1; }
message GetPaymentLinkResponse { PaymentLink link = 1; }

message ListPaymentLinksRequest {
  // Optional filters: kind, status (active, paid, expired, revoked), invoice, customer.
  string kind = 1;
  string status = 2;
  string invoice_id = 3;
  string customer_external_id = 4;
  int32 page_size = 5;
  string page_token = 6;
}
message ListPaymentLinksResponse {
  repeated PaymentLink links = 1;
  string next_page_token = 2;
}

message RevokePaymentLinkRequest { string link_id = 1; }
message RevokePaymentLinkResponse { PaymentLink link = 1; }

message CreatePortalLinkRequest {
  string customer_external_id = 1;
  // 1..365; 0 means 30.
  int32 expires_in_days = 2;
}
message CreatePortalLinkResponse {
  string token = 1;
  google.protobuf.Timestamp expire_time = 2;
  string customer_id = 3;
}
message RevokePortalLinksRequest { string customer_external_id = 1; }
message RevokePortalLinksResponse { int32 revoked = 1; }

message SettleInvoicePaymentRequest {
  string invoice_id = 1;
  string provider = 2;
  string provider_ref = 3;
  int64 amount_minor = 4;
  string currency = 5;
}
message SettleInvoicePaymentResponse {
  // False when the invoice was already paid or is not waiting for a payment.
  bool settled = 1;
}

message CreditPack {
  string id = 1;
  string name = 2;
  int64 credits = 3;
  // Price in minor units of the currency.
  int64 price_minor = 4;
  string currency = 5;
  bool active = 6;
  google.protobuf.Timestamp create_time = 7;
  // 0: the credits bought never expire.
  int32 validity_days = 8;
}
message ListCreditPacksRequest { bool active_only = 1; }
message ListCreditPacksResponse { repeated CreditPack packs = 1; }
message CreateCreditPackRequest {
  string name = 1;
  int64 credits = 2;
  int64 price_minor = 3;
  string currency = 4;
  // 1..3650: the credits bought expire after this many days. 0: they never expire.
  int32 validity_days = 5;
}
message CreateCreditPackResponse { CreditPack pack = 1; }
message SetCreditPackActiveRequest {
  string id = 1;
  bool active = 2;
}
message SetCreditPackActiveResponse {}

message CreditLot {
  string id = 1;
  int64 granted = 2;
  int64 remaining = 3;
  // purchase, promo or manual.
  string source = 4;
  // Unset when the credits never expire.
  google.protobuf.Timestamp expire_time = 5;
  google.protobuf.Timestamp create_time = 6;
}
message GetCreditBalanceRequest { string customer_id = 1; }
message GetCreditBalanceResponse {
  int64 balance = 1;
  // Unset when none of the credits expires.
  google.protobuf.Timestamp next_expire_time = 2;
  // The lots that make up the balance, the ones that expire first at the top.
  repeated CreditLot lots = 3;
}

message GrantCreditsRequest {
  string customer_id = 1;
  int64 credits = 2;
  // promo or manual; purchases are granted by Quotify when a pack is paid.
  string source = 3;
  // Unset: the credits never expire.
  google.protobuf.Timestamp expire_time = 4;
  string reason = 5;
  string idempotency_key = 6;
}
message GrantCreditsResponse {
  int64 balance = 1;
  // True when the key had been used: nothing was added again.
  bool replayed = 2;
}

message ConsumeCreditsRequest {
  string customer_id = 1;
  int64 credits = 2;
  string reason = 3;
  // Required: a retried call must not charge twice.
  string idempotency_key = 4;
  // Only for the credits.low event, which names the customer the way the tenant knows them; the gateway fills it in.
  string customer_external_id = 5;
}
message ConsumeCreditsResponse {
  int64 balance = 1;
  bool replayed = 2;
}

message CreditLedgerEntry {
  string id = 1;
  string lot_id = 2;
  // grant, consume or expire.
  string kind = 3;
  // Positive for a grant, negative for consume and expire.
  int64 amount = 4;
  string reason = 5;
  string idempotency_key = 6;
  google.protobuf.Timestamp create_time = 7;
  // Where the credits it touched came from: purchase, promo or manual.
  string source = 8;
}
message ListCreditLedgerRequest {
  string customer_id = 1;
  // 1..200; 0 means 50.
  int32 page_size = 2;
  string page_token = 3;
}
message ListCreditLedgerResponse {
  repeated CreditLedgerEntry entries = 1;
  string next_page_token = 2;
}

// Dates are calendar days like 2026-10-21, and days are UTC days.
message Expense {
  string id = 1;
  // The app of the account the cost belongs to; empty for the whole tenant.
  string app_id = 2;
  string vendor = 3;
  // infrastructure, payment_fees, marketing, payroll, tax, software or other.
  string category = 4;
  // In minor units of the currency; above zero.
  int64 amount_minor = 5;
  string currency = 6;
  // The day of the expense, or of the first occurrence of a recurring one.
  string incurred_on = 7;
  string note = 8;
  // none, monthly or yearly.
  string recurring = 9;
  // Last day an occurrence may fall on; empty: no end.
  string recurring_until = 10;
  // Set when voided.
  google.protobuf.Timestamp void_time = 11;
  string void_reason = 12;
  google.protobuf.Timestamp create_time = 13;
  google.protobuf.Timestamp update_time = 14;
}
message CreateExpenseRequest {
  string app_id = 1;
  string vendor = 2;
  string category = 3;
  int64 amount_minor = 4;
  string currency = 5;
  string incurred_on = 6;
  string note = 7;
  string recurring = 8;
  string recurring_until = 9;
}
message CreateExpenseResponse { Expense expense = 1; }
message UpdateExpenseRequest {
  string id = 1;
  string app_id = 2;
  string vendor = 3;
  string category = 4;
  int64 amount_minor = 5;
  string currency = 6;
  string incurred_on = 7;
  string note = 8;
  string recurring = 9;
  string recurring_until = 10;
}
message UpdateExpenseResponse { Expense expense = 1; }
message VoidExpenseRequest {
  string id = 1;
  // Required, at most 200 characters.
  string reason = 2;
}
message VoidExpenseResponse { Expense expense = 1; }
message ListExpensesRequest {
  string category = 1;
  string app_id = 2;
  string currency = 3;
  // Only entries whose (first) date lies in the window.
  string from_date = 4;
  string to_date = 5;
  bool include_voided = 6;
  // 1..200; 0 means 50.
  int32 page_size = 7;
  string page_token = 8;
}
message ListExpensesResponse {
  repeated Expense expenses = 1;
  string next_page_token = 2;
}

message GetAccountingSummaryRequest {
  // Both days are inside the period. At most five years.
  string from_date = 1;
  string to_date = 2;
  // Limits the expenses to those booked to this app. Income is the tenant's own, which is one app environment, and is not filtered.
  string app_id = 3;
  // day or month; empty means day for up to 62 days and month beyond. Day is allowed for at most 366 days.
  string granularity = 4;
}
message AccountingCategoryTotal {
  string category = 1;
  int64 amount_minor = 2;
}
message AccountingPoint {
  // The day, or the first day of the month.
  string bucket = 1;
  int64 gross_income_minor = 2;
  int64 tax_minor = 3;
  int64 refunds_minor = 4;
  int64 net_income_minor = 5;
  int64 expenses_minor = 6;
  int64 profit_minor = 7;
}
// One currency of a summary. Every amount is in minor units of that currency.
message AccountingCurrency {
  string currency = 1;
  // Invoices that were paid in the period, tax included.
  int64 gross_income_minor = 2;
  // The tax lines of those invoices (collected for the tax office, not earned).
  int64 tax_minor = 3;
  // Credit notes against paid invoices plus whole invoices that were refunded, in the period.
  int64 refunds_minor = 4;
  // gross - tax - refunds.
  int64 net_income_minor = 5;
  // Every live expense occurrence in the period, provider fees included.
  int64 expenses_minor = 6;
  // The expenses of category payment_fees. Provider commission is not in the payment ledger, so this is what the tenant entered by hand.
  int64 provider_fees_minor = 7;
  // False when no payment_fees expense exists in the period: the commission is not recorded, which is not the same as zero.
  bool provider_fees_recorded = 8;
  // net income - expenses.
  int64 profit_minor = 9;
  int64 paid_invoices = 10;
  repeated AccountingCategoryTotal expense_by_category = 11;
  repeated AccountingPoint series = 12;
}
message GetAccountingSummaryResponse {
  string from_date = 1;
  string to_date = 2;
  string granularity = 3;
  string app_id = 4;
  repeated AccountingCurrency currencies = 5;
}

message GetCreditSettingsRequest {}
message GetCreditSettingsResponse {
  // 0: credits.low is off.
  int64 low_threshold = 1;
}
message SetCreditSettingsRequest {
  // A customer whose balance drops from at least this many credits to fewer triggers credits.low. 0 turns it off.
  int64 low_threshold = 1;
}
message SetCreditSettingsResponse {
  int64 low_threshold = 1;
}
