syntax = "proto3";

package quotify.events.v1;

import "google/protobuf/timestamp.proto";

// EntitlementState is the limit a customer has on one meter, published by plans-svc on plans.entitlements.v1
// (compacted; key: "{tenant_id}/{customer_id}/{meter_code}"). A tombstone (empty value) ends the entitlement.
//
// Evolution rules (ADR 0007): add fields only, never reuse a number, never change a type.
message EntitlementState {
  string tenant_id = 1;
  string customer_id = 2;
  string meter_code = 3;
  string plan_version_id = 4;
  // Scaled units of the meter (ADR 0010). 0 = unlimited.
  int64 limit_units = 5;
  repeated int32 alert_thresholds_pct = 6;
  google.protobuf.Timestamp valid_from = 7;
  // Unset = open-ended.
  google.protobuf.Timestamp valid_until = 8;
  uint32 quantity_scale = 9;
}
