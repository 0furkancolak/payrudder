[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payrudder"
version = "0.0.0"
description = "Python SDK for the Payrudder billing platform (tenant API and webhook verification)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Elastic-2.0" }
authors = [{ name = "Payrudder" }]
keywords = ["billing", "payrudder", "usage-based-billing", "sdk"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyyaml>=6",
  "types-PyYAML",
  "build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payrudder"]

[tool.hatch.build.targets.sdist]
include = ["src/payrudder", "README.md", "pyproject.toml", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "tools"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Generated from the OpenAPI spec: long lines, quoted forward references.
"src/payrudder/models.py" = ["E501", "UP037", "RUF", "F401"]
"src/payrudder/resources.py" = ["E501", "UP037", "RUF", "F401"]
"src/payrudder/_wire_tables.py" = ["E501", "Q"]
"src/payrudder/_opids.py" = ["E501"]
"tests/*" = ["E501"]
"tools/*" = ["E501", "RUF005"]

[tool.ruff.format]
exclude = [
  "src/payrudder/models.py",
  "src/payrudder/resources.py",
  "src/payrudder/_wire_tables.py",
  "src/payrudder/_opids.py",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "tools"]
