# Three worker nodes, so that pod anti-affinity, PDBs and node-level chaos mean something. Host ports are mapped through the
# control-plane node (a NodePort answers on every node): 8000 gateway, 8090 mock-psp, 8025 Mailpit, 9001 MinIO S3,
# 31092-31094 the three Redpanda brokers (advertised to clients outside the cluster as localhost:3109x).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: quotify
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8000, listenAddress: "127.0.0.1" }
      - { containerPort: 30090, hostPort: 8090, listenAddress: "127.0.0.1" }
      - { containerPort: 31025, hostPort: 8025, listenAddress: "127.0.0.1" }
      - { containerPort: 31900, hostPort: 9001, listenAddress: "127.0.0.1" }
      - { containerPort: 31092, hostPort: 31092, listenAddress: "127.0.0.1" }
      - { containerPort: 31093, hostPort: 31093, listenAddress: "127.0.0.1" }
      - { containerPort: 31094, hostPort: 31094, listenAddress: "127.0.0.1" }
  - role: worker
  - role: worker
  - role: worker
