# Three worker nodes, so that pod anti-affinity, PDBs and node-level chaos mean something. Host ports are mapped through the
# control-plane node (a NodePort answers on every node): 42800 gateway, 42890 mock-psp, 42825 Mailpit, 42901 MinIO S3,
# 42434 Postgres and 42123 ClickHouse (for the chaos suite),
# 31092-31094 the three Redpanda brokers (advertised to clients outside the cluster as localhost:3109x).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: quotify
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 42800, listenAddress: "127.0.0.1" }
      - { containerPort: 30090, hostPort: 42890, listenAddress: "127.0.0.1" }
      - { containerPort: 31025, hostPort: 42825, listenAddress: "127.0.0.1" }
      - { containerPort: 31900, hostPort: 42901, listenAddress: "127.0.0.1" }
      - { containerPort: 31432, hostPort: 42434, listenAddress: "127.0.0.1" }
      - { containerPort: 31123, hostPort: 42123, listenAddress: "127.0.0.1" }
      - { containerPort: 31092, hostPort: 31092, listenAddress: "127.0.0.1" }
      - { containerPort: 31093, hostPort: 31093, listenAddress: "127.0.0.1" }
      - { containerPort: 31094, hostPort: 31094, listenAddress: "127.0.0.1" }
  - role: worker
  - role: worker
  - role: worker
