{{- if .Values.rabbitmq.enabled }}
{{- $r := .Values.rabbitmq }}
{{- $defs := .Files.Get "files/definitions.json" | fromJson }}
{{- $_ := set $defs "users" (list (dict "name" $r.user "password" $r.password "tags" (list "administrator"))) }}
{{- $_ := set $defs "permissions" (list (dict "user" $r.user "vhost" "/" "configure" ".*" "write" ".*" "read" ".*")) }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "rabbitmq") | nindent 4 }}
stringData:
  RABBITMQ_ERLANG_COOKIE: {{ $r.erlangCookie | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "rabbitmq") | nindent 4 }}
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_peer_discovery_k8s].
  rabbitmq.conf: |
    default_queue_type = quorum
    vm_memory_high_watermark.absolute = 384MiB
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/definitions.json
    cluster_formation.peer_discovery_backend = k8s
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.k8s.service_name = rabbitmq-headless
    cluster_formation.k8s.hostname_suffix = .rabbitmq-headless.{{ .Release.Namespace }}.svc.cluster.local
    cluster_formation.node_cleanup.interval = 30
    cluster_formation.node_cleanup.only_log_warning = true
    cluster_partition_handling = pause_minority
  definitions.json: |
    {{- $defs | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
rules:
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: rabbitmq-peer-discovery }
subjects:
  - { kind: ServiceAccount, name: rabbitmq }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "rabbitmq") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "infra.selector" (dict "root" $ "name" "rabbitmq") | nindent 4 }}
  ports:
    - { name: amqp, port: 5672 }
    - { name: epmd, port: 4369 }
    - { name: dist, port: 25672 }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "rabbitmq") | nindent 4 }}
spec:
  selector:
    {{- include "infra.selector" (dict "root" $ "name" "rabbitmq") | nindent 4 }}
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
    - { name: metrics, port: 15692, targetPort: metrics }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "rabbitmq") | nindent 4 }}
spec:
  serviceName: rabbitmq-headless
  replicas: {{ $r.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "infra.selector" (dict "root" $ "name" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infra.labels" (dict "root" $ "name" "rabbitmq") | nindent 8 }}
      annotations:
        checksum/config: {{ toJson $defs | sha256sum | trunc 16 | quote }}
    spec:
      serviceAccountName: rabbitmq
      terminationGracePeriodSeconds: 120
      {{- if gt (int $r.replicas) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "infra.selector" (dict "root" $ "name" "rabbitmq") | nindent 14 }}
      {{- end }}
      securityContext: { fsGroup: 999 }
      containers:
        - name: rabbitmq
          image: {{ $r.image }}
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: RABBITMQ_USE_LONGNAME, value: "true" }
            - { name: RABBITMQ_NODENAME, value: "rabbit@$(POD_NAME).rabbitmq-headless.{{ .Release.Namespace }}.svc.cluster.local" }
            - { name: K8S_SERVICE_NAME, value: rabbitmq-headless }
          envFrom:
            - secretRef: { name: rabbitmq }
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: metrics, containerPort: 15692 }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: config, mountPath: /etc/rabbitmq/conf.d/20-payrudder.conf, subPath: rabbitmq.conf }
            - { name: config, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins }
            - { name: config, mountPath: /etc/rabbitmq/definitions.json, subPath: definitions.json }
          resources:
            {{- toYaml $r.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: rabbitmq }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "infra.storageClass" $ | nindent 8 }}
        resources: { requests: { storage: {{ $r.storage }} } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "infra.selector" (dict "root" $ "name" "rabbitmq") | nindent 6 }}
{{- end }}
