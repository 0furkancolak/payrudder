{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "infra.selector" (dict "root" $ "name" "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "infra.selector" (dict "root" $ "name" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infra.labels" (dict "root" $ "name" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "96mb"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "infra.storageClass" $ | nindent 8 }}
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
{{- end }}
