# Single-replica defaults (a laptop). values-ha.yaml raises Redpanda and RabbitMQ to three nodes.

storageClass: ""            # empty: the cluster default

postgres:
  enabled: true
  image: postgres:17.11-alpine
  storage: 2Gi
  adminPassword: postgres_local
  external:
    enabled: false           # NodePort 31432, for the chaos suite and psql from the host (kind maps it to 42434)
    nodePort: 31432
  # Role passwords: "<role>_local" unless listed here (mirror them in the payrudder chart's postgres.passwords).
  passwords: {}
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# Nightly pg_dump of every database on a volume of its own (and in S3-compatible storage when s3Url is set), and a weekly restore drill. Off by default on a laptop;
# a deployment turns it on. The result goes to pushgatewayUrl for the BackupStale and RestoreDrillFailed alerts. docs/runbooks/backup-restore.md.
backup:
  enabled: false
  schedule: "17 2 * * *"          # every night at 02:17
  verifySchedule: "47 3 * * 0"    # every Sunday at 03:47, after the backup
  keep: 7                         # dumps kept per database on the volume
  storage: 5Gi
  pushgatewayUrl: ""              # e.g. http://pushgateway:9091
  s3Url: ""                       # e.g. s3://my-bucket/payrudder (the volume is not the only copy then)
  s3Endpoint: ""                  # for MinIO and other S3-compatible storage
  s3SecretName: ""                # a Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
  # The object buckets (invoice PDFs, assets) copied to a second place every night with mc (deploy/backup/object-backup.sh; docs/runbooks/stateful-components.md). A delete in
  # the source never reaches the copy. Without targetUrl the copy is a prefix in the same MinIO: it guards against an emptied bucket, not against losing the volume.
  objects:
    enabled: false
    schedule: "37 2 * * *"
    image: cgr.dev/chainguard/minio-client@sha256:d8a93c5d335509ff353774eefec8f82fa2a2a975e800139702232d8be3dbe6b9
    buckets: "invoices assets"
    sourceUrl: ""                 # empty: http://minio:9000, with the root user of this chart's MinIO
    sourceSecretName: ""          # a Secret with OBJ_SOURCE_USER and OBJ_SOURCE_PASSWORD, for another source
    targetUrl: ""                 # another endpoint (an S3 in another account or region); empty: the same server
    targetSecretName: ""          # a Secret with OBJ_TARGET_USER and OBJ_TARGET_PASSWORD
    targetBucket: backups
    targetPrefix: objects
    pushgatewayHostPort: ""       # e.g. pushgateway:9091

# The alert rules and the Alertmanager route of the repository (deploy/prometheus/rules, deploy/alertmanager), for a cluster that already runs Prometheus and Alertmanager;
# this chart does not install them. Off by default. docs/runbooks/backup-restore.md#alerts. Rendered and checked with promtool and amtool by tests/helm; never run on a cluster.
monitoring:
  rules:
    enabled: false
    prometheusRule: true          # a PrometheusRule for the Prometheus Operator (needs its CRD)
    ruleLabels: {}                # the labels your Prometheus selects rules by, e.g. { release: kube-prometheus-stack }
    configMap: false              # a ConfigMap payrudder-alert-rules for a Prometheus that loads rule files
  alertmanager:
    enabled: false                # a Secret with the route (page, warn, Watchdog) and webhook receivers
    secretName: alertmanager-payrudder
    urlsSecretName: payrudder-alertmanager-urls   # you create it with webhook_url and watchdog_url; mount it in the Alertmanager

redpanda:
  enabled: true
  image: redpandadata/redpanda:v26.2.5
  replicas: 1
  replicationFactor: 1       # topics are created with this RF (use 3 with three brokers)
  storage: 2Gi
  memory: 512M               # --memory per broker
  external:                  # NodePorts 31092.. advertised as localhost:<port> (kind maps them to the host)
    enabled: false
    basePort: 31092
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 768Mi }

rabbitmq:
  enabled: true
  image: rabbitmq:4.2.9-management-alpine
  replicas: 1
  storage: 1Gi
  user: payrudder
  password: payrudder_local
  erlangCookie: payrudder-local-cookie-change-me
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }

redis:
  enabled: true
  image: redis:7.4.11-alpine
  storage: 256Mi
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

clickhouse:
  enabled: true
  image: clickhouse/clickhouse-server:25.8.33.6-alpine
  storage: 2Gi
  database: payrudder
  user: payrudder
  password: payrudder_local
  external:
    enabled: false           # NodePort 31123 (HTTP), for the A8 check of the chaos suite (kind maps it to 8123)
    nodePort: 31123
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

minio:
  enabled: true              # false: use an external S3 and set s3.endpoint in the payrudder chart
  image: cgr.dev/chainguard/minio@sha256:c93745c56fccdaf0e5dcb88999a96a65a136428beb045ef5d546255a80d747a7
  storage: 5Gi
  accessKey: payrudder
  secretKey: payrudder_local
  external:
    enabled: false           # NodePort 31900 (S3 API), advertised to clients as the public endpoint
    nodePort: 31900
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 384Mi }

mailpit:
  enabled: true
  image: axllent/mailpit:v1.31.6
  external:
    enabled: false           # NodePort 31025 (web/API)
    nodePort: 31025
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 96Mi }

topics:
  enabled: true              # post-install Job (rpk): the topics of docs/04-messaging.md
