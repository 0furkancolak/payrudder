# One replica of everything (a 2-3 GiB Docker VM): enough to check that the chart installs and the e2e tests pass.
global:
  environment: kind
  topologySpread: false
defaults:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 160Mi }
services:
  # The synchronous path of POST /v1/events (gateway -> ingest-svc -> plans-svc) keeps two replicas, so a rollout loses nothing.
  gateway:
    replicas: 2
  ingest-svc:
    replicas: 2
  plans-svc:
    replicas: 2
  # The e2e suite inspects mock-psp from the host, so on kind its NetworkPolicy lets everyone in (the default install allows only
  # payments-worker), and the sandbox dunning schedule and the saga sweeper run on seconds so that the payment scenarios finish.
  mockpsp:
    nodePort: 30090
    allowFrom: []
  billing-svc:
    env:
      PAYRUDDER_DUNNING_SANDBOX: 5s,5s,5s
      PAYRUDDER_SWEEP_INTERVAL: 2s
