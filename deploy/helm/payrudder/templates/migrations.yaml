{{- /* A pre-install/pre-upgrade Job per service that owns a schema. It runs the service's own image with PAYRUDDER_MIGRATE_ONLY,
so the migrations of the version being installed are the ones applied, before any new pod starts. Its migrator-role
Secret is a hook resource too (hooks run before the release's other resources exist) and is deleted with the Job. */}}
{{- range $name, $svc := .Values.services }}
{{- if and (include "payrudder.enabled" $svc) $svc.migrate }}
{{- $env := include "payrudder.secretEnv" (dict "root" $ "svc" $svc "migrate" true) | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-migrate
  labels:
    {{- include "payrudder.labels" (dict "root" $ "name" $name) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- range $k := keys $env | sortAlpha }}
  {{ $k }}: {{ get $env $k | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-migrate
  labels:
    {{- include "payrudder.labels" (dict "root" $ "name" $name) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 30
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "payrudder.selector" (dict "root" $ "name" (printf "%s-migrate" $name)) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ include "payrudder.image" (dict "root" $ "name" $name "svc" $svc) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            {{- include "payrudder.baseEnv" (dict "root" $ "name" $name "svc" $svc) | nindent 12 }}
            {{- include "payrudder.usesEnv" (dict "root" $ "svc" $svc) | nindent 12 }}
            {{- include "payrudder.staticEnv" (dict "root" $ "svc" $svc) | nindent 12 }}
            - { name: PAYRUDDER_MIGRATE_ON_START, value: "true" }
            - { name: PAYRUDDER_MIGRATE_ONLY, value: "true" }
          envFrom:
            - secretRef: { name: {{ $.Release.Name }}-{{ $name }}-migrate }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 192Mi }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
{{- end }}
{{- end }}
