{{- /* One Secret per service, named <release>-<service>-env: DSNs with passwords, broker and S3 credentials, the operator
token. The migrator role's DSN is not in it: see migrations.yaml. */}}
{{- if not .Values.secrets.existingSecrets }}
{{- range $name, $svc := .Values.services }}
{{- if include "payrudder.enabled" $svc }}
{{- $env := include "payrudder.secretEnv" (dict "root" $ "svc" $svc "migrate" false) | fromJson }}
{{- if $env }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-env
  labels:
    {{- include "payrudder.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := keys $env | sortAlpha }}
  {{ $k }}: {{ get $env $k | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
