# Copy to my-secrets.yaml, replace EVERY value (they are all guessable defaults), keep the file out of git, and pass it to both charts:
#   make k8s-install SECRETS=my-secrets.yaml REGISTRY=... TAG=...
# One file serves the payrudder chart and the payrudder-infra chart; each reads the keys it knows. Generate secrets with `openssl rand -base64 32`.
operatorToken: CHANGE-ME-at-least-32-characters-long-xxxxxxxxxxxx   # the machine credential of the operator API (scripts, payrudderctl); nobody types it into a page

global:
  publicURL: https://api.example.com   # REQUIRED outside a development environment: where customers reach the gateway; the hosted invoice links and the mail that asks a customer to confirm a payment start with it

auth:
  otpPepper: CHANGE-ME-32-characters-or-more-xxxxxxxxx   # REQUIRED: keys the hash of one-time sign-in and recovery codes: `openssl rand -hex 32` (plans-svc refuses to start on this placeholder)
  google:
    clientId: ""        # leave both empty to hide "Continue with Google"
    clientSecret: ""

errorTracking:
  url: ""   # optional: the DSN of a GlitchTip or Sentry project (https://<public key>@host/<project id>); empty: panics and unexpected errors are not sent anywhere

mail:
  eventsSecret: CHANGE-ME-16-characters-or-more-xxxxxxxxx   # signs the notifier's mail-events listener and the gateway's calls to it: `openssl rand -base64 32`; empty switches the console's mail page off
  webhookSecret: ""   # optional: the "whsec_..." signing secret of the mail provider's delivery webhook (https://<gateway>/inbound/mail-events); empty: bounces and complaints never reach the suppression list; needs eventsSecret

payments:
  secretsKey: CHANGE-ME-32-bytes-base64     # seals provider credentials and webhook secrets: `openssl rand -base64 32`; losing it loses them
  # While the key is being replaced (docs/runbooks/secrets-key-rotation.md; not otherwise): secretsKeyId: 2, secretsKeyPrevious: <the old key>, secretsKeyPreviousId: 1
  internalToken: CHANGE-ME-32-characters-or-more-xxxxxxxxx

rabbitmq:
  password: CHANGE-ME
  erlangCookie: CHANGE-ME-long-random-string   # payrudder-infra only
clickhouse:
  password: CHANGE-ME

# payrudder chart: the S3 credentials; payrudder-infra: the same pair as MinIO's root user.
s3:
  accessKey: CHANGE-ME-access-key
  secretKey: CHANGE-ME-secret-key-at-least-8
minio:
  accessKey: CHANGE-ME-access-key
  secretKey: CHANGE-ME-secret-key-at-least-8

postgres:
  adminPassword: CHANGE-ME
  # role -> password, in both charts. A role that is not listed gets "<role>_local": list every role (plans_app, plans_system, plans_migrator, billing_app, …).
  passwords: {}
