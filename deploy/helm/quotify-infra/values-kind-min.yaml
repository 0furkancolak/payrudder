# Trimmed requests for a small Docker VM.
redpanda:
  external: { enabled: true, basePort: 31092 }
  memory: 384M
  resources:
    requests: { cpu: 50m, memory: 384Mi }
    limits: { memory: 640Mi }
postgres:
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 384Mi }
rabbitmq:
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 384Mi }
clickhouse:
  resources:
    requests: { cpu: 25m, memory: 192Mi }
    limits: { memory: 768Mi }
minio:
  external: { enabled: true, nodePort: 31900 }
mailpit:
  external: { enabled: true, nodePort: 31025 }
