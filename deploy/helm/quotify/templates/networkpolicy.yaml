{{- if .Values.networkPolicy.enabled }}
{{- /* Default deny for ingress to the Quotify pods; then each service's port is opened to its callers only. The gateway's port is open to the world
(it is the only entry point). Metrics ports are open to pods labelled quotify.io/scrape=true (Prometheus). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: quotify
spec:
  # Only Quotify's own pods: the infrastructure of the quotify-infra chart shares the namespace and stays open to them.
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: quotify
  policyTypes: [Ingress]
{{- range $name, $svc := .Values.services }}
{{- if and (include "quotify.enabled" $svc) $svc.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $name }}
  labels:
    {{- include "quotify.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quotify.selector" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: {{ $svc.port }}, protocol: TCP }
      {{- if $svc.allowFrom }}
      from:
        {{- range $svc.allowFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- end }}
      {{- end }}
    - ports:
        - { port: {{ $svc.metricsPort }}, protocol: TCP }
      from:
        - podSelector:
            matchLabels:
              quotify.io/scrape: "true"
{{- end }}
{{- end }}
{{- end }}
