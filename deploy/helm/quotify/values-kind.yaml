# kind with three workers (deploy/kind/cluster.yaml): two replicas of the services that carry load, HPAs on the gateway and
# ingest-svc, a NodePort for the gateway and mock-psp so that the host reaches them on 8000 and 8090.
global:
  environment: kind
defaults:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 192Mi }
services:
  gateway:
    replicas: 2
    hpa: { enabled: true, max: 4, cpu: 70 }
  ingest-svc:
    replicas: 2
    hpa: { enabled: true, max: 4, cpu: 70 }
  aggregator:
    replicas: 2
  limits-svc:
    replicas: 2
    env:
      QUOTIFY_RECONCILE_INTERVAL: 1m
  plans-svc:
    replicas: 2
  # The e2e suite inspects mock-psp from the host, so on kind its NetworkPolicy lets everyone in (the default install allows only
  # payments-worker), and the sandbox dunning schedule and the saga sweeper run on seconds so that the payment scenarios finish.
  mockpsp:
    nodePort: 30090
    allowFrom: []
  billing-svc:
    env:
      QUOTIFY_DUNNING_SANDBOX: 5s,5s,5s
      QUOTIFY_SWEEP_INTERVAL: 2s
