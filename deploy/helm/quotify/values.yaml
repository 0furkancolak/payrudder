# Quotify services. Install quotify-infra first (Postgres, Kafka, RabbitMQ, Redis, ClickHouse, MinIO, Mailpit), or point
# the addresses below at managed equivalents and skip it: everything infrastructure-shaped is a value.

global:
  imageRegistry: ""        # e.g. "registry.example.com/" (trailing slash). Empty: images are loaded into the cluster (kind load).
  imageTag: dev
  imagePullPolicy: IfNotPresent
  environment: kind        # QUOTIFY_ENV: local | ci | kind
  allowedEnvironments: sandbox,live   # QUOTIFY_ALLOWED_ENVIRONMENTS of plans-svc and the gateway
  kafkaBrokers: redpanda:9092
  redisURL: redis://redis:6379/0
  otlpEndpoint: ""         # empty disables trace export
  topologySpread: true     # spread replicas of a service over nodes
  drainSeconds: 35         # a terminating pod keeps serving this long (CoreDNS caches a headless Service for 30 s)

postgres:
  host: postgres
  port: 5432
  sslmode: disable
  # role -> password. A role that is not listed gets "<role>_local", matching the infra chart's defaults.
  passwords: {}

rabbitmq:
  host: rabbitmq
  port: 5672
  user: quotify
  password: quotify_local

clickhouse:
  addr: clickhouse:9000
  database: quotify
  user: quotify
  password: quotify_local

s3:
  endpoint: http://minio:9000          # point this at an external S3 and set bootstrap.enabled=false: values only
  publicEndpoint: http://localhost:9001   # what a client outside the cluster uses in presigned URLs
  region: us-east-1
  forcePathStyle: true
  accessKey: quotify
  secretKey: quotify_local
  invoicesBucket: invoices
  assetsBucket: assets
  bootstrap:                           # pre-install Job: buckets and the sandbox expiry lifecycle rule (needs an S3 admin key)
    enabled: true
    image: cgr.dev/chainguard/minio-client@sha256:d8a93c5d335509ff353774eefec8f82fa2a2a975e800139702232d8be3dbe6b9

smtp:
  addr: mailpit:1025

operatorToken: local-operator-token-change-me-0123456789

secrets:
  # Use your own Secrets instead of the ones rendered from the values above. The Secret named here must hold, per service,
  # the keys listed in templates/secrets.yaml, under the name "<release>-<service>-env".
  existingSecrets: false

payments:
  # Provider for live tenants that have no provider account of their own. "mockpsp" in the local demo; empty means such live charges
  # reply PROVIDER_NOT_CONFIGURED. Tenants with their own iyzico or Paddle account are served by it whatever this says.
  liveProvider: mockpsp
  # Seals tenants' provider credentials (32 bytes, base64: `openssl rand -base64 32`) and is the secret between the gateway and payments-worker.
  # These are local defaults: set your own, or use secrets.existingSecrets. Without a secrets key, provider accounts and webhooks are off.
  secretsKey: bG9jYWwtZGV2LWtleS1jaGFuZ2UtbWUtMDEyMzQ1Njc=
  internalToken: local-internal-token-change-me-0123456789

networkPolicy:
  enabled: true

defaults:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 24Mi }
    limits: { memory: 192Mi }

# Services. kind: grpc (headless Service so that clients round-robin over every pod), http, or worker (no Service port).
# db: roles to build DSNs for ("app" and "system" at runtime, "migrator" for the pre-install Job).
# uses: secret-backed settings the service needs (rabbitmq, s3, clickhouse, operatorToken).
# allowFrom: the only workloads whose pods may open the service's port (NetworkPolicy).
services:
  gateway:
    kind: http
    port: 8000
    nodePort: 30080          # the only service reachable from outside; null for ClusterIP (put an Ingress in front)
    metricsPort: 9100
    replicas: 1
    uses: [operatorToken, paymentsToken]
    hpa: { enabled: false, max: 4, cpu: 70 }
    env:
      QUOTIFY_HTTP_ADDR: ":8000"
      QUOTIFY_PAYMENTS_URL: http://payments-worker:8095
      QUOTIFY_REDIS_URL: "{{ .Values.global.redisURL }}"
      QUOTIFY_ALLOWED_ENVIRONMENTS: "{{ .Values.global.allowedEnvironments }}"
      QUOTIFY_PLANS_ADDR: dns:///plans-svc:7001
      QUOTIFY_INGEST_ADDR: dns:///ingest-svc:7002
      QUOTIFY_AGGREGATOR_ADDR: dns:///aggregator:7003
      QUOTIFY_LIMITS_ADDR: dns:///limits-svc:7004
      QUOTIFY_BILLING_ADDR: dns:///billing-svc:7005
      QUOTIFY_ANALYTICS_ADDR: dns:///analytics-svc:7006
      QUOTIFY_ASSETS_ADDR: dns:///assets-svc:7007
  plans-svc:
    kind: grpc
    port: 7001
    metricsPort: 9101
    migrate: true
    db: { role: plans, name: plans_db, app: true, system: true }
    uses: [secretsKey]   # seals the signing secrets of tenants' webhook endpoints
    allowFrom: [gateway, ingest-svc, aggregator, limits-svc, billing-svc, notifier, payments-worker]
    env:
      QUOTIFY_GRPC_ADDR: ":7001"
      QUOTIFY_REDIS_URL: "{{ .Values.global.redisURL }}"
      QUOTIFY_KAFKA_BROKERS: "{{ .Values.global.kafkaBrokers }}"
      QUOTIFY_ALLOWED_ENVIRONMENTS: "{{ .Values.global.allowedEnvironments }}"
  ingest-svc:
    kind: grpc
    port: 7002
    metricsPort: 9102
    migrate: true
    replicas: 1
    hpa: { enabled: false, max: 4, cpu: 70 }
    db: { role: ingest, name: ingest_db, app: true, system: true }
    allowFrom: [gateway, billing-svc]
    env:
      QUOTIFY_GRPC_ADDR: ":7002"
      QUOTIFY_KAFKA_BROKERS: "{{ .Values.global.kafkaBrokers }}"
      QUOTIFY_PLANS_ADDR: dns:///plans-svc:7001
  aggregator:
    kind: grpc
    port: 7003
    metricsPort: 9103
    migrate: true
    db: { role: aggregator, name: aggregator_db, app: true, system: true }
    allowFrom: [gateway, billing-svc, limits-svc]
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 256Mi }
    env:
      QUOTIFY_GRPC_ADDR: ":7003"
      QUOTIFY_KAFKA_BROKERS: "{{ .Values.global.kafkaBrokers }}"
      QUOTIFY_PLANS_ADDR: dns:///plans-svc:7001
  limits-svc:
    kind: grpc
    port: 7004
    metricsPort: 9104
    allowFrom: [gateway]
    env:
      QUOTIFY_GRPC_ADDR: ":7004"
      QUOTIFY_REDIS_URL: "{{ .Values.global.redisURL }}"
      QUOTIFY_KAFKA_BROKERS: "{{ .Values.global.kafkaBrokers }}"
      QUOTIFY_PLANS_ADDR: dns:///plans-svc:7001
      QUOTIFY_AGGREGATOR_ADDR: dns:///aggregator:7003
      QUOTIFY_RECONCILE_INTERVAL: 5m
  billing-svc:
    kind: grpc
    port: 7005
    metricsPort: 9105
    migrate: true
    uses: [rabbitmq, s3]
    db: { role: billing, name: billing_db, app: true, system: true }
    allowFrom: [gateway, payments-worker]
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 256Mi }
    env:
      QUOTIFY_GRPC_ADDR: ":7005"
      QUOTIFY_KAFKA_BROKERS: "{{ .Values.global.kafkaBrokers }}"
      QUOTIFY_PLANS_ADDR: dns:///plans-svc:7001
      QUOTIFY_INGEST_ADDR: dns:///ingest-svc:7002
      QUOTIFY_AGGREGATOR_ADDR: dns:///aggregator:7003
      QUOTIFY_SCHEDULER_INTERVAL: 1m
      QUOTIFY_SWEEP_INTERVAL: 30s
      QUOTIFY_STEP_TIMEOUT: 2m
      QUOTIFY_WATERMARK_DELAY: 30s
      QUOTIFY_DUNNING_SANDBOX: 1m,3m,7m
      S3_BUCKET: "{{ .Values.s3.invoicesBucket }}"
  analytics-svc:
    kind: grpc
    port: 7006
    metricsPort: 9106
    migrate: true
    uses: [clickhouse]
    allowFrom: [gateway]
    env:
      QUOTIFY_GRPC_ADDR: ":7006"
      QUOTIFY_KAFKA_BROKERS: "{{ .Values.global.kafkaBrokers }}"
  assets-svc:
    kind: grpc
    port: 7007
    metricsPort: 9111
    migrate: true
    uses: [s3]
    db: { role: assets, name: assets_db, app: true, system: true }
    allowFrom: [gateway]
    env:
      QUOTIFY_GRPC_ADDR: ":7007"
      ASSETS_SWEEP_INTERVAL: 1m
      ASSETS_VERIFY_INTERVAL: 30s
      S3_BUCKET: "{{ .Values.s3.assetsBucket }}"
  invoice-worker:
    kind: worker
    metricsPort: 9107
    uses: [rabbitmq, s3]
    env:
      S3_BUCKET: "{{ .Values.s3.invoicesBucket }}"
      S3_ASSETS_BUCKET: "{{ .Values.s3.assetsBucket }}"
  payments-worker:
    kind: http               # consumes the payment commands and serves provider webhooks and the operator endpoints the gateway forwards to
    port: 8095
    metricsPort: 9108
    migrate: true
    uses: [rabbitmq, paymentsSecrets]
    db: { role: payments, name: payments_db, system: true }
    allowFrom: [gateway]
    env:
      MOCKPSP_URL: http://mockpsp:8090
      PAYMENTS_LIVE_PROVIDER: "{{ .Values.payments.liveProvider }}"
      PAYMENTS_HTTP_ADDR: ":8095"
      QUOTIFY_PLANS_ADDR: dns:///plans-svc:7001
      QUOTIFY_BILLING_ADDR: dns:///billing-svc:7005
  notifier:
    kind: worker
    metricsPort: 9109
    migrate: true
    uses: [rabbitmq]
    db: { role: notifier, name: notifier_db, system: true }
    env:
      QUOTIFY_KAFKA_BROKERS: "{{ .Values.global.kafkaBrokers }}"
      QUOTIFY_PLANS_ADDR: dns:///plans-svc:7001
      SMTP_ADDR: "{{ .Values.smtp.addr }}"
  mockpsp:
    enabled: true
    kind: http
    image: quotify/mockpsp
    port: 8090
    probePort: http          # mock-psp has no metrics port: /healthz answers on its API port
    readyPath: /healthz
    nodePort: null           # kind exposes it to the host for the e2e tests
    metricsPort: 9110
    migrate: true
    db: { role: mockpsp, name: mockpsp_db, app: true }
    allowFrom: [payments-worker]
    env:
      MOCKPSP_HTTP_ADDR: ":8090"
      MOCKPSP_DECLINE_RATE: "0"
      MOCKPSP_ERROR_RATE: "0"
      MOCKPSP_TIMEOUT_RATE: "0"
      MOCKPSP_LATENCY_MS: "0"
