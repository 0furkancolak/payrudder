# Copy to my-secrets.yaml, replace EVERY value (they are all guessable defaults), keep the file out of git, and pass it to both charts:
#   make k8s-install SECRETS=my-secrets.yaml REGISTRY=... TAG=...
# One file serves the quotify chart and the quotify-infra chart; each reads the keys it knows. Generate secrets with `openssl rand -base64 32`.
operatorToken: CHANGE-ME-at-least-32-characters-long-xxxxxxxxxxxx   # the machine credential of the operator API (scripts, quotifyctl); nobody types it into a page

auth:
  otpPepper: CHANGE-ME-32-characters-or-more-xxxxxxxxx   # keys the hash of one-time sign-in codes: `openssl rand -hex 32`
  google:
    clientId: ""        # leave both empty to hide "Continue with Google"
    clientSecret: ""

payments:
  secretsKey: CHANGE-ME-32-bytes-base64     # seals provider credentials and webhook secrets: `openssl rand -base64 32`; losing it loses them
  internalToken: CHANGE-ME-32-characters-or-more-xxxxxxxxx

rabbitmq:
  password: CHANGE-ME
  erlangCookie: CHANGE-ME-long-random-string   # quotify-infra only
clickhouse:
  password: CHANGE-ME

# quotify chart: the S3 credentials; quotify-infra: the same pair as MinIO's root user.
s3:
  accessKey: CHANGE-ME-access-key
  secretKey: CHANGE-ME-secret-key-at-least-8
minio:
  accessKey: CHANGE-ME-access-key
  secretKey: CHANGE-ME-secret-key-at-least-8

postgres:
  adminPassword: CHANGE-ME
  # role -> password, in both charts. A role that is not listed gets "<role>_local": list every role (plans_app, plans_system, plans_migrator, billing_app, …).
  passwords: {}
