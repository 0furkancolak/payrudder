global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Payrudder services expose /metrics on their metrics port (docs/10-local-dev.md).
  # Each service adds its target here when it joins the compose `app` profile.
  - job_name: payrudder
    static_configs:
      - targets: ["gateway:9100"]
        labels:
          service: gateway
      - targets: ["plans-svc:9101"]
        labels:
          service: plans-svc
      - targets: ["ingest-svc:9102"]
        labels:
          service: ingest-svc
      - targets: ["aggregator:9103"]
        labels:
          service: aggregator
      - targets: ["limits-svc:9104"]
        labels:
          service: limits-svc
      - targets: ["billing-svc:9105"]
        labels:
          service: billing-svc
      - targets: ["payments-worker:9108"]
        labels:
          service: payments-worker
      - targets: ["invoice-worker:9107"]
        labels:
          service: invoice-worker
      - targets: ["notifier:9109"]
        labels:
          service: notifier
      - targets: ["analytics-svc:9106"]
        labels:
          service: analytics-svc
      - targets: ["assets-svc:9111"]
        labels:
          service: assets-svc

  # Infrastructure (obs profile). Redpanda and RabbitMQ expose Prometheus natively; the rest through exporters.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  # Per-queue depths (the dlq_messages rule): the aggregated /metrics endpoint has no queue label.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
