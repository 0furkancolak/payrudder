# Railway overrides, read after 20-quotify.conf (deploy/rabbitmq/rabbitmq.conf).
# The definitions are rendered at start with the real password (entrypoint.sh).
definitions.local.path = /tmp/definitions.json
# Dual-stack listeners: Railway's private network is IPv6 (and IPv4 in newer environments).
listeners.tcp.1 = :::5672
management.tcp.ip = ::
management.tcp.port = 15672
# Unauthenticated metrics: the Railway health check (PORT=15692, path /metrics). Not published; reachable on the private network only.
prometheus.tcp.ip = ::
prometheus.tcp.port = 15692
