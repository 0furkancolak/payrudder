# Single-binary Tempo with local storage (local development only).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Service graph and span metrics are derived from the traces and written to Prometheus; Grafana draws the service map
# and the per-service RED panels from them (docs/08-observability.md#service-map).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
  processor:
    service_graphs:
      enable_messaging_system_latency_histogram: true
    span_metrics:
      enable_target_info: false

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
