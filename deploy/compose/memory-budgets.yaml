# Memory budgets of the Payrudder services, checked in CI (the e2e job) and by `make mem-budget`.
#
# After the smoke run (the stack is up and `make e2e` and the console's browser test have run), every service's memory as `docker stats` reports it
# (the container's working set, in practice its resident set) must be at or below budget_mib. A service that grows past its budget fails the build.
#
# budget_mib    the limit. Set from measured_mib plus headroom: 40 % or 16 MiB, whichever is more, rounded up to a multiple of 8 (the check prints the figure as
#               "suggested budget"). The compose container limit stays the hard ceiling; the budget is the early warning below it.
# measured_mib  what the run measured when the budget was last set (CI e2e job, ubuntu runner, Phase 33). Documentation only.
#
# How to change a budget: docs/benchmarks.md#memory-budgets.
services:
  admin-ui: { budget_mib: 200, measured_mib: 110.0 } # vite preview (Node); measured_mib is an estimate until the next CI run
  aggregator: { budget_mib: 40, measured_mib: 16.2 }
  analytics-svc: { budget_mib: 32, measured_mib: 12.5 }
  assets-svc: { budget_mib: 56, measured_mib: 13.7 }
  billing-svc: { budget_mib: 88, measured_mib: 25.4 }
  gateway: { budget_mib: 72, measured_mib: 45.8 }
  ingest-svc: { budget_mib: 72, measured_mib: 26.4 }
  invoice-worker: { budget_mib: 32, measured_mib: 11.8 }
  limits-svc: { budget_mib: 40, measured_mib: 16.3 }
  mockpsp: { budget_mib: 24, measured_mib: 4.0 }
  notifier: { budget_mib: 32, measured_mib: 12.9 }
  payments-worker: { budget_mib: 32, measured_mib: 13.4 }
  plans-svc: { budget_mib: 64, measured_mib: 19.6 }
