# Payrudder local stack. Ports and profiles: docs/10-local-dev.md
#   default (no profile): infrastructure       make up-infra
#   obs:   otel-collector, prometheus, tempo, loki, vector, grafana, postgres-exporter, redis-exporter
#   app:   Payrudder services                    make up
#   chaos: toxiproxy                           Phase 09
#   oidc:  mockoidc, a stand-in for Google    (development only)
#   init:  minio-init (one-shot, run by make)
# Host ports that often clash can be moved with PAYRUDDER_PG_HOST_PORT and PAYRUDDER_CONSOLE_HOST_PORT (.env).
# Images are pinned; testkit (pkg/testkit) uses the same versions.
name: payrudder

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

services:
  postgres:
    <<: *defaults
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=200", "-c", "wal_level=logical"]
    ports: ["${PAYRUDDER_PG_HOST_PORT:-42432}:5432"]
    volumes:
      - ./postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assets_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  redpanda:
    <<: *defaults
    image: redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:42092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:42092
      - --schema-registry-addr=0.0.0.0:18081
      # Topics come from `make topics` (partitions and retention per docs/04-messaging.md). Without this a typo or a
      # missed `make topics` would silently auto-create a 1-partition topic with default retention.
      - --set
      - redpanda.auto_create_topics_enabled=false
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports: ["42092:42092", "42081:18081", "42644:9644"]
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 768m } } }

  redpanda-console:
    <<: *defaults
    image: redpandadata/console:v3.12.0
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./console/config.yaml:/etc/console/config.yaml:ro
      - ../../proto:/etc/console/proto:ro
    ports: ["${PAYRUDDER_CONSOLE_HOST_PORT:-42080}:8080"]
    depends_on:
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/admin/health || wget -q -O /dev/null http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 192m } } }

  rabbitmq:
    <<: *defaults
    image: rabbitmq:4.2.9-management-alpine
    hostname: rabbitmq
    environment:
      # One scheduler and no busy-waiting: the default (one per core, spinning) costs CPU and RAM while idle.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none +A 4"
    ports: ["42672:5672", "42673:15672"]
    volumes:
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-payrudder.conf:ro
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
    deploy: { resources: { limits: { memory: 256m } } }

  redis:
    <<: *defaults
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "96mb"]
    ports: ["42379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 128m } } }

  clickhouse:
    <<: *defaults
    image: clickhouse/clickhouse-server:25.8.33.6-alpine
    environment:
      CLICKHOUSE_DB: payrudder
      CLICKHOUSE_USER: payrudder
      CLICKHOUSE_PASSWORD: payrudder_local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["42123:8123", "42900:9000"]
    volumes:
      - ../clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy: { resources: { limits: { memory: 512m } } }

  # S3-compatible object storage (ADR 0013). MinIO no longer publishes community images to Docker Hub/Quay;
  # Chainguard's build is used, pinned by digest because its free tier only publishes :latest.
  minio:
    <<: *defaults
    image: cgr.dev/chainguard/minio@sha256:c93745c56fccdaf0e5dcb88999a96a65a136428beb045ef5d546255a80d747a7
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: payrudder
      MINIO_ROOT_PASSWORD: payrudder_local
      # MinIO's equivalent of an AbortIncompleteMultipartUpload lifecycle rule (assets-svc backstop).
      MINIO_API_STALE_UPLOADS_EXPIRY: 48h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    ports: ["42901:9000", "42902:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      # The image has bash but no grep/curl: speak HTTP over /dev/tcp and check the status line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 384m } } }

  # One-shot: buckets + lifecycle rules. In its own profile so `up --wait` doesn't treat its exit as a failure;
  # the Makefile runs it with `compose run --rm minio-init` after the stack is healthy.
  minio-init:
    profiles: [init]
    image: cgr.dev/chainguard/minio-client@sha256:d8a93c5d335509ff353774eefec8f82fa2a2a975e800139702232d8be3dbe6b9
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MC_CONFIG_DIR: /tmp/mc
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        mc alias set local http://minio:9000 payrudder payrudder_local
        for b in invoices assets; do
          mc mb --ignore-existing "local/$$b"
          rules=$$(mc ilm rule ls --json "local/$$b" 2>/dev/null || true)
          if [[ $$rules != *environment* ]]; then
            mc ilm rule add --expire-days 30 --tags 'environment=sandbox' "local/$$b"
          fi
        done
        echo buckets ready
    restart: "no"

  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.31.6
    ports: ["42025:1025", "42825:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 96m } } }

  # --- obs profile -------------------------------------------------------------------------------
  otel-collector:
    <<: *defaults
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes: [../otel/collector.yaml:/etc/otelcol/collector.yaml:ro]
    environment:
      PAYRUDDER_TRACE_SAMPLE_PERCENT: "${PAYRUDDER_TRACE_SAMPLE_PERCENT:-100}"
    ports: ["42317:4317", "42318:4318", "42133:13133"]
    depends_on: [tempo]
    # Distroless image: no shell for an exec healthcheck. `--wait` treats it as ready once running; :13133 serves health.
    deploy: { resources: { limits: { memory: 128m } } }

  tempo:
    <<: *defaults
    profiles: [obs]
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    environment:
      GOMEMLIMIT: 200MiB
    ports: ["42200:3200"]
    # Distroless image: no exec healthcheck possible. :3200/ready serves readiness.
    deploy: { resources: { limits: { memory: 256m } } }

  loki:
    <<: *defaults
    profiles: [obs]
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "0"
    volumes:
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    environment:
      GOMEMLIMIT: 150MiB
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy: { resources: { limits: { memory: 192m } } }

  # Log shipper: container stdout (slog JSON) -> Loki. No ports; it only needs the Docker socket to read the logs.
  vector:
    <<: *defaults
    profiles: [obs]
    image: timberio/vector:0.50.0-alpine
    command: ["--config", "/etc/vector/vector.yaml", "--quiet"]
    volumes:
      - ../vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: { loki: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8686/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 64m } } }

  prometheus:
    <<: *defaults
    profiles: [obs]
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d", "--storage.tsdb.retention.size=768MB", "--web.enable-remote-write-receiver"]
    environment:
      GOMEMLIMIT: 200MiB
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
    ports: ["42990:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 256m } } }

  grafana:
    <<: *defaults
    profiles: [obs]
    image: grafana/grafana:13.0.11
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/services.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_LOG_LEVEL: warn
      GOMEMLIMIT: 150MiB
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["42300:3000"]
    depends_on: [prometheus, tempo, loki]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 256m } } }

  postgres-exporter:
    <<: *defaults
    profiles: [obs]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres_local@postgres:5432/postgres?sslmode=disable
    depends_on: { postgres: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 64m } } }

  redis-exporter:
    <<: *defaults
    profiles: [obs]
    image: oliver006/redis_exporter:v1.67.0-alpine
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: { redis: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 48m } } }

  # --- chaos profile -----------------------------------------------------------------------------
  toxiproxy:
    <<: *defaults
    profiles: [chaos]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports: ["42474:8474"]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- app profile -------------------------------------------------------------------------------
  # Local-only secrets: role passwords from postgres/01-databases.sh and a fixed operator token.
  plans-svc:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/plans-svc
    image: payrudder/plans-svc:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: plans-svc
      PAYRUDDER_GRPC_ADDR: ":7001"
      PAYRUDDER_METRICS_ADDR: ":9101"
      PAYRUDDER_PG_APP_DSN: postgres://plans_app:plans_app_local@postgres:5432/plans_db
      PAYRUDDER_PG_SYSTEM_DSN: postgres://plans_system:plans_system_local@postgres:5432/plans_db
      PAYRUDDER_PG_MIGRATOR_DSN: postgres://plans_migrator:plans_migrator_local@postgres:5432/plans_db
      PAYRUDDER_MIGRATE_ON_START: "true"
      PAYRUDDER_REDIS_URL: redis://redis:6379/0
      PAYRUDDER_KAFKA_BROKERS: redpanda:9092
      PAYRUDDER_ALLOWED_ENVIRONMENTS: ${PAYRUDDER_ALLOWED_ENVIRONMENTS:-sandbox,live}
      # Payrudder as a SaaS (phase 55, ADR 0024): the stack of make setup / make dev sells its own plans. The platform tenant is a sandbox one here, so the
      # mock provider can take the payments; a deployment of its own uses live. Set PAYRUDDER_SAAS=off for the plain product.
      PAYRUDDER_SAAS: ${PAYRUDDER_SAAS:-on}
      PAYRUDDER_SAAS_ENVIRONMENT: ${PAYRUDDER_SAAS_ENVIRONMENT:-sandbox}
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
      # Seals the signing secrets of tenants' webhook endpoints (the same key as payments-worker's; local default only).
      PAYRUDDER_SECRETS_KEY: ${PAYRUDDER_SECRETS_KEY:-bG9jYWwtZGV2LWtleS1jaGFuZ2UtbWUtMDEyMzQ1Njc=}
      # The local stack may deliver webhooks to http:// and private addresses (host.docker.internal, other containers). Never set this in production.
      PAYRUDDER_WEBHOOK_ALLOW_PRIVATE: ${PAYRUDDER_WEBHOOK_ALLOW_PRIVATE:-true}
      # Mail to people (e-mail verification, password reset, invitations) goes to Mailpit; its links open the console.
      SMTP_ADDR: mailpit:1025
      # Set both to send through Nafru Email instead of Mailpit (the sender every plan includes).
      NAFRU_BASE_URL: ${NAFRU_BASE_URL:-}
      NAFRU_API_KEY: ${NAFRU_API_KEY:-}
      PAYRUDDER_APP_URL: ${PAYRUDDER_APP_URL:-http://localhost:42301}
      # Keys the hash of one-time sign-in codes (a code has only a million values). Local stack only: generate your own with `openssl rand -hex 32`.
      PAYRUDDER_OTP_PEPPER: ${PAYRUDDER_OTP_PEPPER:-local-otp-pepper-change-me-0123456789}
      # The services a sandbox reset empties (phase 45 E).
      PAYRUDDER_INGEST_ADDR: dns:///ingest-svc:7002
      PAYRUDDER_AGGREGATOR_ADDR: dns:///aggregator:7003
      PAYRUDDER_ANALYTICS_ADDR: dns:///analytics-svc:7006
      PAYRUDDER_BILLING_ADDR: dns:///billing-svc:7005
      PAYRUDDER_PAYMENTS_URL: http://payments-worker:8095
      PAYRUDDER_PAYMENTS_INTERNAL_TOKEN: ${PAYRUDDER_PAYMENTS_INTERNAL_TOKEN:-local-internal-token-change-me-0123456789}
    ports: ["42701:7001", "42911:9101"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 96m } } }

  ingest-svc:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/ingest-svc
    image: payrudder/ingest-svc:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: ingest-svc
      PAYRUDDER_GRPC_ADDR: ":7002"
      PAYRUDDER_METRICS_ADDR: ":9102"
      PAYRUDDER_PG_APP_DSN: postgres://ingest_app:ingest_app_local@postgres:5432/ingest_db
      PAYRUDDER_PG_SYSTEM_DSN: postgres://ingest_system:ingest_system_local@postgres:5432/ingest_db
      PAYRUDDER_PG_MIGRATOR_DSN: postgres://ingest_migrator:ingest_migrator_local@postgres:5432/ingest_db
      PAYRUDDER_MIGRATE_ON_START: "true"
      PAYRUDDER_PLANS_ADDR: dns:///plans-svc:7001
      PAYRUDDER_KAFKA_BROKERS: redpanda:9092
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["42702:7002", "42912:9102"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      plans-svc: { condition: service_started }
    deploy: { resources: { limits: { memory: 128m } } }

  aggregator:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/aggregator
    image: payrudder/aggregator:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: aggregator
      PAYRUDDER_GRPC_ADDR: ":7003"
      PAYRUDDER_METRICS_ADDR: ":9103"
      PAYRUDDER_PG_APP_DSN: postgres://aggregator_app:aggregator_app_local@postgres:5432/aggregator_db
      PAYRUDDER_PG_SYSTEM_DSN: postgres://aggregator_system:aggregator_system_local@postgres:5432/aggregator_db
      PAYRUDDER_PG_MIGRATOR_DSN: postgres://aggregator_migrator:aggregator_migrator_local@postgres:5432/aggregator_db
      PAYRUDDER_MIGRATE_ON_START: "true"
      PAYRUDDER_PLANS_ADDR: dns:///plans-svc:7001
      PAYRUDDER_KAFKA_BROKERS: redpanda:9092
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["42703:7003", "42913:9103"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      plans-svc: { condition: service_started }
    deploy: { resources: { limits: { memory: 128m } } }

  limits-svc:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/limits-svc
    image: payrudder/limits-svc:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: limits-svc
      PAYRUDDER_GRPC_ADDR: ":7004"
      PAYRUDDER_METRICS_ADDR: ":9104"
      PAYRUDDER_REDIS_URL: redis://redis:6379/0
      PAYRUDDER_PLANS_ADDR: dns:///plans-svc:7001
      PAYRUDDER_AGGREGATOR_ADDR: dns:///aggregator:7003
      PAYRUDDER_KAFKA_BROKERS: redpanda:9092
      PAYRUDDER_RECONCILE_INTERVAL: ${PAYRUDDER_RECONCILE_INTERVAL:-5m}
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["42704:7004", "42914:9104"]
    depends_on:
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      plans-svc: { condition: service_started }
      aggregator: { condition: service_started }
    deploy: { resources: { limits: { memory: 96m } } }

  mockpsp:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: tools/mockpsp
    image: payrudder/mockpsp:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: mockpsp
      MOCKPSP_HTTP_ADDR: ":8090"
      PAYRUDDER_METRICS_ADDR: ":9110"
      PAYRUDDER_PG_APP_DSN: postgres://mockpsp_app:mockpsp_app_local@postgres:5432/mockpsp_db
      PAYRUDDER_PG_MIGRATOR_DSN: postgres://mockpsp_migrator:mockpsp_migrator_local@postgres:5432/mockpsp_db
      PAYRUDDER_MIGRATE_ON_START: "true"
      MOCKPSP_DECLINE_RATE: ${MOCKPSP_DECLINE_RATE:-0}
      MOCKPSP_ERROR_RATE: ${MOCKPSP_ERROR_RATE:-0}
      MOCKPSP_TIMEOUT_RATE: ${MOCKPSP_TIMEOUT_RATE:-0}
      MOCKPSP_LATENCY_MS: ${MOCKPSP_LATENCY_MS:-0}
    ports: ["42890:8090"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 96m } } }

  payments-worker:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/payments-worker
    image: payrudder/payments-worker:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: payments-worker
      PAYRUDDER_METRICS_ADDR: ":9108"
      PAYRUDDER_PG_SYSTEM_DSN: postgres://payments_system:payments_system_local@postgres:5432/payments_db
      PAYRUDDER_PG_MIGRATOR_DSN: postgres://payments_migrator:payments_migrator_local@postgres:5432/payments_db
      PAYRUDDER_MIGRATE_ON_START: "true"
      PAYRUDDER_RABBITMQ_URL: amqp://payrudder:payrudder_local@rabbitmq:5672/
      MOCKPSP_URL: http://mockpsp:8090
      # Live tenants use mock-psp in the local demo; sandbox tenants always do, whatever this says.
      PAYMENTS_LIVE_PROVIDER: ${PAYMENTS_LIVE_PROVIDER:-mockpsp}
      # The worker refuses to start with the mock as the live provider unless this says the stack is not production (ADR 0022). This compose file is the local stack.
      PAYMENTS_ALLOW_MOCK_LIVE: ${PAYMENTS_ALLOW_MOCK_LIVE:-true}
      # Demo mode: every tenant uses the mock provider, whatever accounts exist.
      PAYRUDDER_DEMO: ${PAYRUDDER_DEMO:-false}
      # Seals tenants' provider credentials (32 bytes, base64). This default is for the local stack only: generate your own with `openssl rand -base64 32`.
      PAYRUDDER_SECRETS_KEY: ${PAYRUDDER_SECRETS_KEY:-bG9jYWwtZGV2LWtleS1jaGFuZ2UtbWUtMDEyMzQ1Njc=}
      PAYMENTS_HTTP_ADDR: ":8095"
      PAYRUDDER_PLANS_ADDR: dns:///plans-svc:7001
      PAYRUDDER_BILLING_ADDR: dns:///billing-svc:7005
      PAYMENTS_INTERNAL_TOKEN: ${PAYRUDDER_PAYMENTS_INTERNAL_TOKEN:-local-internal-token-change-me-0123456789}
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
      # The UBL and PDF of e-invoices (phase 30) go to the invoices bucket, next to the invoice PDFs.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: invoices
      S3_ACCESS_KEY: payrudder
      S3_SECRET_KEY: payrudder_local
      S3_FORCE_PATH_STYLE: "true"
      # The local stack may point an e-invoice webhook account at http:// and private addresses. Never set this in production.
      EINVOICE_ALLOW_PRIVATE_URLS: ${EINVOICE_ALLOW_PRIVATE_URLS:-true}
    # The gateway reaches it by name in Docker; published so a service on the host (make dev) can too.
    ports: ["42895:8095"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      mockpsp: { condition: service_started }
      plans-svc: { condition: service_started }
      billing-svc: { condition: service_started }
    deploy: { resources: { limits: { memory: 96m } } }

  invoice-worker:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/invoice-worker
    image: payrudder/invoice-worker:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: invoice-worker
      PAYRUDDER_METRICS_ADDR: ":9107"
      PAYRUDDER_RABBITMQ_URL: amqp://payrudder:payrudder_local@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: invoices
      S3_ASSETS_BUCKET: assets
      S3_ACCESS_KEY: payrudder
      S3_SECRET_KEY: payrudder_local
      S3_FORCE_PATH_STYLE: "true"
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 96m } } }

  notifier:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/notifier
    image: payrudder/notifier:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: notifier
      PAYRUDDER_METRICS_ADDR: ":9109"
      PAYRUDDER_PG_SYSTEM_DSN: postgres://notifier_system:notifier_system_local@postgres:5432/notifier_db
      PAYRUDDER_PG_MIGRATOR_DSN: postgres://notifier_migrator:notifier_migrator_local@postgres:5432/notifier_db
      PAYRUDDER_MIGRATE_ON_START: "true"
      PAYRUDDER_RABBITMQ_URL: amqp://payrudder:payrudder_local@rabbitmq:5672/
      PAYRUDDER_KAFKA_BROKERS: redpanda:9092
      PAYRUDDER_PLANS_ADDR: dns:///plans-svc:7001
      SMTP_ADDR: mailpit:1025
      NAFRU_BASE_URL: ${NAFRU_BASE_URL:-}
      NAFRU_API_KEY: ${NAFRU_API_KEY:-}
      # The local stack may send a tenant's mail through an e-mail provider on http:// and a private address. Never set this in production.
      NOTIFIER_MAIL_ALLOW_PRIVATE: ${NOTIFIER_MAIL_ALLOW_PRIVATE:-true}
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      plans-svc: { condition: service_started }
    deploy: { resources: { limits: { memory: 96m } } }

  billing-svc:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/billing-svc
    image: payrudder/billing-svc:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: billing-svc
      PAYRUDDER_GRPC_ADDR: ":7005"
      PAYRUDDER_METRICS_ADDR: ":9105"
      PAYRUDDER_PG_APP_DSN: postgres://billing_app:billing_app_local@postgres:5432/billing_db
      PAYRUDDER_PG_SYSTEM_DSN: postgres://billing_system:billing_system_local@postgres:5432/billing_db
      PAYRUDDER_PG_MIGRATOR_DSN: postgres://billing_migrator:billing_migrator_local@postgres:5432/billing_db
      PAYRUDDER_MIGRATE_ON_START: "true"
      PAYRUDDER_PLANS_ADDR: dns:///plans-svc:7001
      PAYRUDDER_INGEST_ADDR: dns:///ingest-svc:7002
      PAYRUDDER_AGGREGATOR_ADDR: dns:///aggregator:7003
      PAYRUDDER_KAFKA_BROKERS: redpanda:9092
      PAYRUDDER_RABBITMQ_URL: amqp://payrudder:payrudder_local@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      # Presigned links are opened by clients on the host, where MinIO's S3 API is published on 42901.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:42901}
      S3_BUCKET: invoices
      S3_ACCESS_KEY: payrudder
      S3_SECRET_KEY: payrudder_local
      S3_FORCE_PATH_STYLE: "true"
      PAYRUDDER_SCHEDULER_INTERVAL: ${PAYRUDDER_SCHEDULER_INTERVAL:-1m}
      PAYRUDDER_SWEEP_INTERVAL: ${PAYRUDDER_SWEEP_INTERVAL:-30s}
      PAYRUDDER_STEP_TIMEOUT: ${PAYRUDDER_STEP_TIMEOUT:-2m}
      PAYRUDDER_WATERMARK_DELAY: ${PAYRUDDER_WATERMARK_DELAY:-30s}
      PAYRUDDER_DUNNING_SANDBOX: ${PAYRUDDER_DUNNING_SANDBOX:-1m,3m,7m}
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["42705:7005", "42915:9105"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      plans-svc: { condition: service_started }
      ingest-svc: { condition: service_started }
      aggregator: { condition: service_started }
      minio: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 128m } } }

  analytics-svc:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/analytics-svc
    image: payrudder/analytics-svc:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: analytics-svc
      PAYRUDDER_GRPC_ADDR: ":7006"
      PAYRUDDER_METRICS_ADDR: ":9106"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: payrudder
      CLICKHOUSE_USER: payrudder
      CLICKHOUSE_PASSWORD: payrudder_local
      PAYRUDDER_KAFKA_BROKERS: redpanda:9092
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["42706:7006", "42916:9106"]
    depends_on:
      clickhouse: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 96m } } }

  assets-svc:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/assets-svc
    image: payrudder/assets-svc:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: assets-svc
      PAYRUDDER_GRPC_ADDR: ":7007"
      PAYRUDDER_METRICS_ADDR: ":9111"
      PAYRUDDER_PG_APP_DSN: postgres://assets_app:assets_app_local@postgres:5432/assets_db
      PAYRUDDER_PG_SYSTEM_DSN: postgres://assets_system:assets_system_local@postgres:5432/assets_db
      PAYRUDDER_PG_MIGRATOR_DSN: postgres://assets_migrator:assets_migrator_local@postgres:5432/assets_db
      PAYRUDDER_MIGRATE_ON_START: "true"
      S3_ENDPOINT: http://minio:9000
      # Presigned part and download URLs are opened by clients on the host, where MinIO's S3 API is published on 42901.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:42901}
      S3_BUCKET: assets
      S3_ACCESS_KEY: payrudder
      S3_SECRET_KEY: payrudder_local
      S3_FORCE_PATH_STYLE: "true"
      ASSETS_VERIFY_INTERVAL: ${ASSETS_VERIFY_INTERVAL:-30s}
      ASSETS_SWEEP_INTERVAL: ${ASSETS_SWEEP_INTERVAL:-1m}
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["42707:7007", "42921:9111"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 96m } } }

  # A stand-in for Google (pkg/oidctest), only with `--profile oidc`: "Continue with Google" works without a Google client. Development only.
  # To use it: PAYRUDDER_GOOGLE_CLIENT_ID=mock-client-id PAYRUDDER_GOOGLE_CLIENT_SECRET=mock-client-secret PAYRUDDER_GOOGLE_ISSUER=http://mockoidc:8099
  # (the gateway reaches it by name; the browser goes to http://localhost:42899).
  mockoidc:
    <<: *defaults
    profiles: [oidc]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: pkg
        MAIN_PKG: ./oidctest/cmd/mockoidc
    image: payrudder/mockoidc:dev
    labels: { payrudder.dev-only: "true" }   # never deployed: no Railway service, no memory budget (tests/railway, tests/membudget)
    environment:
      MOCKOIDC_ADDR: ":8099"
      MOCKOIDC_ISSUER: http://mockoidc:8099
      MOCKOIDC_BROWSER_URL: http://localhost:42899
      MOCKOIDC_CLIENT_ID: mock-client-id
      MOCKOIDC_CLIENT_SECRET: mock-client-secret
      MOCKOIDC_REDIRECT_URI: ${PAYRUDDER_APP_URL:-http://localhost:42301}/gw/auth/google/callback
    ports: ["42899:8099"]
    deploy: { resources: { limits: { memory: 32m } } }

  # The console (web/admin) as `vite preview`, for the end-to-end tests and a one-command look (production runs it on Cloudflare Workers, docs/adr/0021-console-on-cloudflare-workers.md;
  # day-to-day development uses `npm run dev`, make dev). It reads and acts through the gateway only. People sign in with e-mail and password, a one-time code or Google.
  admin-ui:
    <<: *defaults
    profiles: [app]
    build:
      context: ../../web/admin
    image: payrudder/admin-ui:dev
    environment:
      GATEWAY_URL: http://gateway:8000
      PAYRUDDER_DEMO: ${PAYRUDDER_DEMO:-false}
      BRAND_NAME: ${BRAND_NAME:-Payrudder}
      # Local stack only: the operator playground's account form comes pre-filled.
      PREFILL_PLAYGROUND: "true"
    ports: ["42301:3001"]
    depends_on:
      gateway: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 256m } } }

  gateway:
    <<: *defaults
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE_DIR: services/gateway
    image: payrudder/gateway:dev
    environment:
      PAYRUDDER_ENV: local
      PAYRUDDER_SERVICE_NAME: gateway
      PAYRUDDER_HTTP_ADDR: ":8000"
      PAYRUDDER_METRICS_ADDR: ":9100"
      # Where customers reach the gateway: the hosted invoice links it hands out start with this.
      PAYRUDDER_PUBLIC_URL: ${PAYRUDDER_PUBLIC_URL:-http://localhost:42800}
      PAYRUDDER_PLANS_ADDR: dns:///plans-svc:7001
      PAYRUDDER_INGEST_ADDR: dns:///ingest-svc:7002
      PAYRUDDER_AGGREGATOR_ADDR: dns:///aggregator:7003
      PAYRUDDER_LIMITS_ADDR: dns:///limits-svc:7004
      PAYRUDDER_BILLING_ADDR: dns:///billing-svc:7005
      PAYRUDDER_ANALYTICS_ADDR: dns:///analytics-svc:7006
      PAYRUDDER_ASSETS_ADDR: dns:///assets-svc:7007
      PAYRUDDER_REDIS_URL: redis://redis:6379/0
      PAYRUDDER_OPERATOR_TOKEN: ${PAYRUDDER_OPERATOR_TOKEN:-local-operator-token-change-me-0123456789}
      PAYRUDDER_ALLOWED_ENVIRONMENTS: ${PAYRUDDER_ALLOWED_ENVIRONMENTS:-sandbox,live}
      PAYRUDDER_SAAS: ${PAYRUDDER_SAAS:-on}
      PAYRUDDER_PAYMENTS_URL: http://payments-worker:8095
      PAYRUDDER_PAYMENTS_INTERNAL_TOKEN: ${PAYRUDDER_PAYMENTS_INTERNAL_TOKEN:-local-internal-token-change-me-0123456789}
      # A proxy in front of the gateway (the console's Worker in production, `vite preview` here) passes the visitor's address; the sign-in limits count by it.
      PAYRUDDER_TRUST_FORWARDED_FOR: "true"
      # Optional: believe X-Forwarded-For from a public proxy that sends this value as X-Edge-Auth (the console Worker's EDGE_AUTH_SECRET), or from these CIDRs. Both empty here.
      PAYRUDDER_TRUSTED_PROXY_SECRET: ${PAYRUDDER_TRUSTED_PROXY_SECRET:-}
      PAYRUDDER_TRUSTED_PROXIES: ${PAYRUDDER_TRUSTED_PROXIES:-}
      # The operator console is for people: whoever signs in with one of these addresses (and has verified it) is a platform operator. The dev seed's
      # first user by default. The operator token above is the machine credential only (scripts, payrudderctl, tests); no page asks for it.
      PAYRUDDER_OPERATOR_EMAILS: ${PAYRUDDER_OPERATOR_EMAILS:-user1@example.com}
      # "Continue with Google": shown only when both are set. For a real client see docs/13-admin-ui.md; for the in-repo mock provider start the `oidc`
      # profile and set the three values listed in docs/10-local-dev.md.
      PAYRUDDER_APP_URL: ${PAYRUDDER_APP_URL:-http://localhost:42301}
      PAYRUDDER_GOOGLE_CLIENT_ID: ${PAYRUDDER_GOOGLE_CLIENT_ID:-}
      PAYRUDDER_GOOGLE_CLIENT_SECRET: ${PAYRUDDER_GOOGLE_CLIENT_SECRET:-}
      PAYRUDDER_GOOGLE_ISSUER: ${PAYRUDDER_GOOGLE_ISSUER:-https://accounts.google.com}
      PAYRUDDER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["42800:8000", "42910:9100"]
    depends_on:
      plans-svc: { condition: service_started }
      ingest-svc: { condition: service_started }
      aggregator: { condition: service_started }
      limits-svc: { condition: service_started }
      billing-svc: { condition: service_started }
      analytics-svc: { condition: service_started }
      assets-svc: { condition: service_started }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 96m } } }

volumes:
  postgres-data:
  redpanda-data:
  rabbitmq-data:
  redis-data:
  clickhouse-data:
  minio-data:
  tempo-data:
  loki-data:
