; PgBouncer in front of the compose Postgres (compose profile "pooler", docs/runbooks/scaling.md). Local development only: the credentials are the compose ones.
;
; Transaction pooling: a server connection belongs to a client only for the length of a transaction. That is why only the APP role of a service goes through it
; (compose.pooler.yaml): the system role LISTENs and takes session advisory locks, and the migrator sets search_path at connect time and takes goose's session lock; both
; need a connection of their own and keep their direct address (postgres:5432).
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Clients log in with their own role and password: PgBouncer reads the verifier from the cluster as auth_user and passes the SCRAM exchange through.
auth_user = postgres
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1
pool_mode = transaction
; Server connections per role and database. The services' pools hold 4 each by default (pgxx.DefaultMaxConns), so 8 replicas fit in 16 server connections.
default_pool_size = 16
max_client_conn = 1000
; PgBouncer 1.21 and later tracks the named prepared statements pgx uses by default. With 0 (or an older PgBouncer) set default_query_exec_mode=exec in the app DSN instead.
max_prepared_statements = 200
admin_users = postgres
; Do NOT add search_path here. The tenant migrations pass it at connect time and a transaction pooler would drop it, so the tables would be built in the wrong schema;
; refusing the start-up parameter is what stops that.
ignore_startup_parameters = extra_float_digits
