PAYRUDDER_REDIS_URL: "redis://localhost:42379/0"
PAYRUDDER_PLANS_ADDR: "dns:///localhost:42701"
PAYRUDDER_AGGREGATOR_ADDR: "dns:///localhost:42703"
PAYRUDDER_LIMIT_TOPIC: "usage.limit-exceeded.v1"
PAYRUDDER_CONSUMER_GROUP: "limits"
PAYRUDDER_POLL_RECORDS: "1000"
PAYRUDDER_CONSUMER_BACKOFF: "1s"
PAYRUDDER_CONSUMER_SESSION_TIMEOUT: "10s"
PAYRUDDER_RECONCILE_INTERVAL: "5m"
PAYRUDDER_UNIQUE_SET_CAP: "100000"
