# Public settings of this service and their defaults. An environment variable of the same name overrides each; secrets are never listed here.
PAYRUDDER_HTTP_ADDR: ":8000"
PAYRUDDER_PLANS_ADDR: "dns:///localhost:42701"
PAYRUDDER_INGEST_ADDR: "dns:///localhost:42702"
PAYRUDDER_AGGREGATOR_ADDR: "dns:///localhost:42703"
PAYRUDDER_LIMITS_ADDR: "dns:///localhost:42704"
PAYRUDDER_BILLING_ADDR: "dns:///localhost:42705"
PAYRUDDER_ANALYTICS_ADDR: "dns:///localhost:42706"
PAYRUDDER_ASSETS_ADDR: "dns:///localhost:42707"
PAYRUDDER_REDIS_URL: "redis://localhost:42379/0"
PAYRUDDER_GATEWAY_REPLICAS: "1"
PAYRUDDER_ALLOWED_ENVIRONMENTS: "sandbox,live"
# The console's public address: where the browser returns after "Continue with Google" and the default base of the Google redirect address (<it>/gw/auth/google/callback: the console forwards /gw/ to the gateway).
PAYRUDDER_APP_URL: "http://localhost:42301"
# The OpenID provider behind "Continue with Google". Google's own; development stacks may point it at the in-repo mock (tools/mockoidc). The button shows only when
# PAYRUDDER_GOOGLE_CLIENT_ID and PAYRUDDER_GOOGLE_CLIENT_SECRET (a secret: environment only) are both set.
PAYRUDDER_GOOGLE_ISSUER: "https://accounts.google.com"
# Addresses (comma separated) of the people who are platform operators. Empty by default: nobody. A listed person must also have verified the address.
PAYRUDDER_OPERATOR_EMAILS: ""
# Whether an operator's session needs two-factor sign-in (on/off). Not set here: unset it is on unless PAYRUDDER_ENV is local, ci or kind. A compose or Helm install on a real host runs as one of those: set it to on there.
# Networks (CIDRs, comma separated) of proxies whose X-Forwarded-For is believed even from a public address. Empty by default: only a private or loopback peer,
# and only with PAYRUDDER_TRUST_FORWARDED_FOR. For Cloudflare use PAYRUDDER_TRUSTED_PROXY_SECRET (environment only) instead: Worker egress addresses are not stable.
PAYRUDDER_TRUSTED_PROXIES: ""
# The domain of the invoice inbox addresses (invoices+<token>@<domain>) the mail provider receives for. Empty: the console shows the token only. The webhook that posts the mail to
# /inbound/invoices is protected by PAYRUDDER_INBOUND_SECRET (environment only); without it the endpoint answers 404.
PAYRUDDER_INBOUND_DOMAIN: ""
# The signing secret ("whsec_...", Svix) of the mail provider's webhook of delivery events (bounces, complaints) to /inbound/mail-events: PAYRUDDER_MAIL_WEBHOOK_SECRET (environment only).
# Without it the route answers 404 and the gateway logs at start that it is off; with it, PAYRUDDER_NOTIFIER_EVENTS_URL is required too (the events are handed to the notifier).

# Payrudder as a SaaS (phase 55, ADR 0024): "on" shows organisations their plan and refuses their events over the plan's hard events quota, metering the rest into the
# platform tenant. "off" (the default, and what a self-hoster wants): none of it. Set it the same as plans-svc. make setup and make dev switch it on.
PAYRUDDER_SAAS: "off"

# A gateway that serves one region only (plan 17, docs/runbooks/scaling.md). Empty (the default): this gateway serves every tenant. With a name, a request for a tenant whose
# home region (tenants.region) is another is answered 421 gateway.region.wrong, with the right region in X-Payrudder-Region; a tenant with no region is served anywhere.
PAYRUDDER_REGION: ""
# Where the gateway of each region is, for the X-Payrudder-Region-Url hint of that answer: eu=https://eu.api.example.com,us=https://us.api.example.com
PAYRUDDER_REGION_URLS: ""
