# Public settings of this service and their defaults. An environment variable of the same name overrides each; secrets are never listed here.
PAYRUDDER_GRPC_ADDR: ":7005"
PAYRUDDER_MIGRATE_ON_START: "false"
PAYRUDDER_PLANS_ADDR: "dns:///localhost:42701"
PAYRUDDER_INGEST_ADDR: "dns:///localhost:42702"
PAYRUDDER_AGGREGATOR_ADDR: "dns:///localhost:42703"
PAYRUDDER_SCHEDULER_INTERVAL: "1m"
PAYRUDDER_SWEEP_INTERVAL: "30s"
PAYRUDDER_STEP_TIMEOUT: "2m"
PAYRUDDER_TRANSFER_POLL: "6h"
PAYRUDDER_WATERMARK_DELAY: "30s"
PAYRUDDER_RELAY_WORKERS: "1"
PAYRUDDER_RELAY_BATCH_SIZE: "200"
S3_REGION: "us-east-1"
S3_BUCKET: "invoices"
S3_FORCE_PATH_STYLE: "false"
PAYRUDDER_DUNNING_LIVE: "24h,72h,168h"
PAYRUDDER_DUNNING_SANDBOX: "1m,3m,7m"
