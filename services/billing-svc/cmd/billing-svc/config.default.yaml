# Public settings of this service and their defaults. An environment variable of the same name overrides each; secrets are never listed here.
QUOTIFY_GRPC_ADDR: ":7005"
QUOTIFY_MIGRATE_ON_START: "false"
QUOTIFY_PLANS_ADDR: "dns:///localhost:42701"
QUOTIFY_INGEST_ADDR: "dns:///localhost:42702"
QUOTIFY_AGGREGATOR_ADDR: "dns:///localhost:42703"
QUOTIFY_SCHEDULER_INTERVAL: "1m"
QUOTIFY_SWEEP_INTERVAL: "30s"
QUOTIFY_STEP_TIMEOUT: "2m"
QUOTIFY_TRANSFER_POLL: "6h"
QUOTIFY_WATERMARK_DELAY: "30s"
QUOTIFY_RELAY_WORKERS: "1"
QUOTIFY_RELAY_BATCH_SIZE: "200"
S3_REGION: "us-east-1"
S3_BUCKET: "invoices"
S3_FORCE_PATH_STYLE: "false"
QUOTIFY_DUNNING_LIVE: "24h,72h,168h"
QUOTIFY_DUNNING_SANDBOX: "1m,3m,7m"
