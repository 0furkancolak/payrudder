# Public settings of this service and their defaults. An environment variable of the same name overrides each; secrets are never listed here.
PAYRUDDER_GRPC_ADDR: ":7001"
PAYRUDDER_MIGRATE_ON_START: "false"
PAYRUDDER_RELAY_WORKERS: "1"
PAYRUDDER_RELAY_BATCH_SIZE: "200"
PAYRUDDER_WEBHOOK_ALLOW_PRIVATE: "false"
PAYRUDDER_ALLOWED_ENVIRONMENTS: "sandbox,live"
# The platform's own mail path, for the mail Payrudder writes to people (e-mail verification, password reset, invitations). The default is the development
# Mailpit (SMTP port 42025 on the host, UI on http://localhost:42825); a deployment sets SMTP_ADDR to its relay. A tenant's mail to its own customers is
# the notifier's job and uses the tenant's mail switch.
SMTP_ADDR: "localhost:42025"
MAIL_FROM: "Payrudder <no-reply@payrudder.local>"
# The console's public address: mailed links open <PAYRUDDER_APP_URL>/verify, /reset and /invite.
PAYRUDDER_APP_URL: "http://localhost:42301"
# A sandbox nobody has touched for this long (no key used, no customer or subscription made, no reset) has its customers' side deleted: usage, invoices, payments.
# Its configuration stays. 0 switches it off.
PAYRUDDER_SANDBOX_RETENTION: "2160h"
# The least time between two resets of one sandbox that a person asks for.
PAYRUDDER_SANDBOX_RESET_COOLDOWN: "5m"
