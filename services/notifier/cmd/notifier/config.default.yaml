# Public settings of this service and their defaults. An environment variable of the same name overrides each; secrets are never listed here.
PAYRUDDER_MIGRATE_ON_START: "false"
PAYRUDDER_PLANS_ADDR: "dns:///localhost:42701"
SMTP_ADDR: "localhost:42025"
MAIL_FROM: "Payrudder <billing@payrudder.local>"
NOTIFIER_SENDING_STALE: "5m"
# How long a tenant's mail switch (plans-svc) is remembered; a change reaches the notifier within it.
NOTIFIER_MAIL_SWITCH_TTL: "15s"
# A tenant's own e-mail provider must be https:// and public. Development and tests only: allow http:// and private addresses.
NOTIFIER_MAIL_ALLOW_PRIVATE: "false"
PAYRUDDER_CONSUMER_GROUP: "notifier"
PAYRUDDER_DLQ_TOPIC: "usage.limit-exceeded.dlq.v1"
# Where the trial-ending facts (subscription.trial-will-end.v1) that can never be mailed go.
PAYRUDDER_TRIAL_DLQ_TOPIC: "subscription.trial-will-end.dlq.v1"
PAYRUDDER_PRICE_CHANGE_DLQ_TOPIC: "subscription.price-change.dlq.v1"
PAYRUDDER_CONSUMER_SESSION_TIMEOUT: "10s"
