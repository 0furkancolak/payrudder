# The operator console as a Worker with static assets (docs/adr/0021-console-on-cloudflare-workers.md, docs/runbooks/staging-and-production.md).
name = "payrudder-console"
main = "worker/index.ts"
compatibility_date = "2026-10-25"

[assets]
directory = "./dist"
binding = "ASSETS"
# A deep link such as /app/apps/1/keys answers with index.html; the router takes over in the browser.
not_found_handling = "single-page-application"
# Only these reach the Worker; every other path is a file (or the SPA fallback) served by the platform without running code.
# /gw/* is the path the console calls the API under; the others are gateway routes that customers open directly (invoice links, health).
run_worker_first = ["/gw/*", "/env.js", "/v1/*", "/auth/*", "/r/*", "/healthz"]

[vars]
# Where the gateway answers. Override per environment below; never put a secret here.
API_ORIGIN = "http://localhost:42800"
# The address developers call the API at; the Connect page puts it in the code it hands out. Usually the same as API_ORIGIN.
PUBLIC_API_URL = "http://localhost:42800"
BRAND_NAME = "Payrudder"
CONSOLE_DEMO = "false"

[observability]
enabled = true

# Staging: every push to main (.github/workflows/deploy-console.yml).
[env.staging]
name = "payrudder-console-staging"
routes = [{ pattern = "console-staging.payrudder.com", custom_domain = true }]

[env.staging.vars]
API_ORIGIN = "https://api-staging.payrudder.com"
PUBLIC_API_URL = "https://api-staging.payrudder.com"
BRAND_NAME = "Payrudder"
CONSOLE_DEMO = "false"

# Production: a published GitHub release.
[env.production]
name = "payrudder-console"
routes = [{ pattern = "console.payrudder.com", custom_domain = true }]

[env.production.vars]
API_ORIGIN = "https://api.payrudder.com"
PUBLIC_API_URL = "https://api.payrudder.com"
BRAND_NAME = "Payrudder"
CONSOLE_DEMO = "false"
