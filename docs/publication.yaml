# Who each document in docs/ is for, and how finished it is (plan 19). It is the one place to review before something is published: the developer site (docs-site/)
# builds only `public` documents, the MCP server (mcp/) serves only those as resources, and a test (docs-site/build.test.mjs) fails for a document that is not listed,
# for a published document that is not `public`, and for a `public` document that is not published. A new file under docs/ needs a line here; a file in one of the
# `directories` below is covered by its directory.
#
# audience  public    written for developers who integrate; safe to publish
#           internal  for the people who build and run Payrudder: design, decisions, operations, provider contracts. Never published.
# status    stable       describes behaviour that is built and covered by tests in this repository
#           preview      built, but not yet checked against a real provider account, a live deployment or a person; may still change
#           pre-release  not published or released (the SDKs, the MCP server): install from a checkout
#           draft        written, not yet reviewed by the owner
#           historical   a record of a decision or a phase; the code may have moved on
#
# Default (not agreed): everything except the three developer documents below is internal until the owner has read it for publication.

files:
  README.md: { audience: internal, status: stable }
