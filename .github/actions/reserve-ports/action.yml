name: Reserve the published ports
description: >
  The compose stack and the kind cluster publish fixed host ports (31xxx, 424xx, 428xx, 429xx) that lie inside Linux's ephemeral range (32768-60999).
  An outgoing connection of an image pull can take one of them as its source port a moment before Docker binds it, and the container then fails to start
  with "failed to bind host port ... address already in use". Reserving the ports keeps the kernel from handing them out.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo sysctl -w net.ipv4.ip_local_reserved_ports=31000-31999,42000-42999
        cat /proc/sys/net/ipv4/ip_local_reserved_ports
