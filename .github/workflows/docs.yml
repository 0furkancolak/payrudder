name: docs

# Builds the developer documentation (docs-site) and checks it: every operation of the tenant API has an entry, only the tenant API is documented, every internal
# link lands. The site is uploaded as an artifact; publishing it is a separate decision (where it is hosted).
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "api/openapi/v1.yaml"
      - "docs/16-webhooks.md"
      - "docs/18-sdks.md"
      - "docs/error-keys.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "api/openapi/v1.yaml"
      - "docs/16-webhooks.md"
      - "docs/18-sdks.md"
      - "docs/error-keys.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/dist
