name: nightly

# The full correctness run (docs/09-testing-strategy.md): 1M events, 50 tenants, replicas killed at random, Toxiproxy faults,
# a Redpanda stop and a Redis wipe. Fails on any single mismatch, and on a run that did not inject real chaos.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      events:
        description: Number of unique events
        default: "1000000"

permissions:
  contents: read

env:
  GOPRIVATE: github.com/0furkancolak/*
  # Both jobs push far more events through a tenant than a plan allows (the k6 tenants are live ones of an account on the Free plan, 10,000 events a month, a
  # hard limit: ingest_steady got exactly 100 batches per tenant accepted and the rest refused). They test the platform, not Payrudder's own plans, so the
  # stack runs without the SaaS mode (docs/adr/0024-payrudder-as-a-saas.md).
  PAYRUDDER_SAAS: "off"

jobs:
  chaos-1m:
    name: correctness (1M events, chaos monkey)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/reserve-ports
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: make chaos
        env:
          PAYRUDDER_CHAOS_TENANTS: "50"
          PAYRUDDER_CHAOS_MIN_KILLS: "30"
          PAYRUDDER_CHAOS_MIN_FAULTS: "10"
          PAYRUDDER_CHAOS_REPORT: ${{ github.workspace }}/chaos-report.json
        run: make chaos N=${{ github.event.inputs.events || '1000000' }}
      - name: Summary
        if: always()
        run: |
          test -f chaos-report.json && python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("chaos-report.json"))
          c = r["Chaos"]
          print("| | |\n|---|---|")
          print(f"| events (unique accepted) | {r['Unique']} |")
          print(f"| container kills | {c['kills']} |")
          print(f"| network faults | {c['network_faults']} |")
          print(f"| broker stops / redis restarts | {c['broker_stops']} / {c['redis_restarts']} |")
          print(f"| duration (s) | {r['Seconds']:.0f} |")
          for a in r["Assertions"]:
              print(f"| {a['id']} {a['name']} | {a['status']} {a.get('detail','')} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report-${{ github.run_id }}
          path: chaos-report.json
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.chaos.yaml --profile app --profile chaos ps -a && docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.chaos.yaml --profile app --profile chaos logs --tail 120 ingest-svc aggregator limits-svc billing-svc
      - if: always()
        run: make down

  k6:
    name: load scenarios (k6, short)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/reserve-ports
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: timeout 1500 make up
      # The design targets (p99 < 50 ms ingest, < 10 ms entitlement) are for the benchmark VM (docs/benchmarks.md). A shared 2-vCPU runner running the
      # whole stack next to k6 measured p99 164 ms (ingest, 2k events/s, 2026-10-25) and 210 ms (entitlement, 2026-10-24) with a median of a few ms, so
      # these steps use CI-scale budgets (P99_MS) that still catch an order-of-magnitude regression. Each scenario runs even if an earlier one failed.
      - name: ingest_steady
        run: make load S=ingest_steady K6_ENV="-e DURATION=3m -e EVENTS_PER_SEC=2000 -e P99_MS=300"
      - name: entitlement_reads
        if: ${{ !cancelled() }}
        run: make load S=entitlement_reads K6_ENV="-e DURATION=2m -e RATE=1000 -e P99_MS=400"
      - name: noisy_neighbor
        if: ${{ !cancelled() }}
        run: make load S=noisy_neighbor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summaries-${{ github.run_id }}
          path: tests/load/results/*.json
          if-no-files-found: ignore
      - if: always()
        run: make down

  # Cells mode (ADR 0018) and the transaction-mode pooler (docs/runbooks/scaling.md). ITEST_CELLS=1 puts every tenant of a service's integration suite in a cell database;
  # ITEST_POOLER=1 also puts a PgBouncer in transaction mode in front of the databases (the app role goes through it, the system and migrator roles stay direct). The pkg
  # row runs the move, doctor and residency tests across two Postgres containers and the pooler's own behaviour (pkg/cells, which skip without ITEST_POOLER). Neither switch
  # is set in the pull request's integration job: these suites start several containers each. Every cell is its own job so that one failure does not hide the others.
  cells:
    name: cells${{ matrix.pooler && ' behind PgBouncer' || '' }} (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pooler: ["", "1"]
        target:
          - { name: pkg, dir: pkg, packages: "./cells ./pgxx" }
          - { name: ingest-svc, dir: services/ingest-svc, packages: "./internal/itest" }
          - { name: payments-worker, dir: services/payments-worker, packages: "./internal/itest" }
          - { name: plans-svc, dir: services/plans-svc, packages: "./internal/itest" }
          - { name: aggregator, dir: services/aggregator, packages: "./internal/itest ./internal/replay ./internal/usage/query" }
          - { name: billing-svc, dir: services/billing-svc, packages: "./internal/itest" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: go test (ITEST_CELLS=1${{ matrix.pooler && ', ITEST_POOLER=1' || '' }})
        working-directory: ${{ matrix.target.dir }}
        env:
          ITEST_CELLS: "1"
          ITEST_POOLER: ${{ matrix.pooler }}
        run: go test -count=1 -p 1 -timeout 100m -tags integration ${{ matrix.target.packages }}
