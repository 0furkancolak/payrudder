name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/0furkancolak/*

jobs:
  static:
    name: lint, buf, generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/go.sum') }}
      - run: make tools
      - run: make lint
      - name: buf breaking
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if git cat-file -e "$base:buf.yaml" 2>/dev/null; then
            bin/buf breaking --against ".git#ref=$base"
          else
            echo "no buf.yaml at $base, skipping breaking check"
          fi
      - name: Generated code is up to date
        run: |
          make gen
          git diff --exit-code
          test -z "$(git status --porcelain)"

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make test
      - name: Alert rules
        run: make test-rules

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make test-integration

  compose:
    name: compose stack healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: make up-infra (every container healthy)
        run: timeout 300 make up-infra
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml ps -a && docker compose -f deploy/compose/compose.yaml logs --tail 50
      - if: always()
        run: make down

  e2e:
    name: end-to-end (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: make up (infra + obs + gateway + plans-svc + ingest-svc)
        run: timeout 1500 make up
        env:
          # Sandbox dunning on seconds and a quick sweeper, so the payment scenarios finish within the job.
          QUOTIFY_DUNNING_SANDBOX: 5s,5s,5s
          QUOTIFY_SWEEP_INTERVAL: 2s
      - run: make e2e
      - name: seed demo account
        run: make seed CURRENCY=TRY TIMEZONE=Europe/Istanbul GRACE=24h > /dev/null
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml --profile obs --profile app ps -a && docker compose -f deploy/compose/compose.yaml --profile obs --profile app logs --tail 80
      - if: always()
        run: make down

  chaos:
    name: correctness (100k events)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: make chaos N=100000
        run: timeout 1800 make chaos N=100000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: tests/chaos-report.json
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.chaos.yaml --profile app ps -a && docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.chaos.yaml --profile app logs --tail 80 ingest-svc aggregator
      - if: always()
        run: make down
