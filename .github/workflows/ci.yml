name: ci

on:
  push:
    branches: [main]
    # no run at all for a change that no job reads (it cannot replace a waiting run either)
    paths-ignore: ["docs/plans/**", "*.md"]
  pull_request:
    paths-ignore: ["docs/plans/**", "*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pull request's older run is cancelled by its next push. On main a run in progress is never cancelled, but only ONE run waits behind it: the next merge replaces the
  # waiting run, so after a burst of merges main is tested once more, on its newest commit, not once per commit (a cancelled run on main means "replaced by a newer commit",
  # never "green"). The jobs that boot the whole stack (Compose end to end, kind, 100k events) are in stack.yml, which collapses the same way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOPRIVATE: github.com/0furkancolak/*

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.c.outputs.go }}
      web: ${{ steps.c.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Only a pull request is filtered. A run on main may be the newest of several commits whose runs were replaced, so it tests everything; an empty list runs every job.
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=""
          if [ "$EVENT" = "pull_request" ]; then files=$(git diff --name-only "origin/$BASE_REF...HEAD") || files=""; fi
          echo "$files"
          printf '%s\n' "$files" | sh .github/scripts/changes.sh | tee -a "$GITHUB_OUTPUT"

  static:
    name: lint, buf, generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/go.sum') }}
      - run: make tools
      - run: make lint
      - name: buf breaking
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if git cat-file -e "$base:buf.yaml" 2>/dev/null; then
            bin/buf breaking --against ".git#ref=$base"
          else
            echo "no buf.yaml at $base, skipping breaking check"
          fi
      - name: Generated code is up to date
        run: |
          make gen
          git diff --exit-code
          test -z "$(git status --porcelain)"

  test:
    name: unit tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make test
      - name: Alert rules
        run: make test-rules

  integration:
    name: integration tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make test-integration

  compose:
    name: compose stack healthy
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/reserve-ports
      - name: make up-infra (every container healthy)
        run: timeout 300 make up-infra
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml ps -a && docker compose -f deploy/compose/compose.yaml logs --tail 50
      - if: always()
        run: make down

  web:
    name: operator console (lint, types, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The generated API types match api/openapi/v1.yaml
        run: |
          npm run gen
          git diff --exit-code src/shared/api/schema.d.ts
      - run: npm run build
      - name: Billing pages against a mocked gateway (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-e2e-mock-results
          path: web/admin/test-results
          if-no-files-found: ignore

  hosted-pages:
    name: customer-facing pages (axe, no sideways scroll)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: The gateway writes every hosted page in every language (docs/hosted-pages.md)
        working-directory: services/gateway
        env:
          HOSTED_PAGES_DIR: ${{ runner.temp }}/hosted-pages
        run: |
          mkdir -p "$HOSTED_PAGES_DIR"
          CGO_ENABLED=0 go test -count=1 ./internal/httpapi -run '^TestEveryPageRendersInEveryLanguage$'
          test "$(ls "$HOSTED_PAGES_DIR" | wc -l)" -ge 60
      - name: axe-core on each page, light and dark, at 1440, 768 and 360 px (the runner's Google Chrome)
        working-directory: web/admin
        run: |
          npm ci --no-audit --no-fund
          node scripts/hosted-pages.mjs "${{ runner.temp }}/hosted-pages" --axe

  backup:
    name: backup scripts and point-in-time recovery drill
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Scripts against a throwaway Postgres (make test-backup-scripts)
        run: make test-backup-scripts
      - name: The object and ClickHouse backups against throwaway servers (make test-store-backups)
        run: make test-store-backups
      - name: Restore to a chosen minute from WAL in MinIO, check the data, the migrations version and the service roles, measure the RTO (make backup-drill)
        run: make backup-drill

  helm:
    name: helm charts (lint, kubeconform, render tests)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make helm-lint
      - name: Render tests (sandbox has no live provider, external S3 has no MinIO, NetworkPolicies, migration hooks)
        run: cd tests && go test -count=1 ./helm/
      # ct's yamale breaks on Python 3.14 (ast.Num is gone), which the runner image now has by default.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: helm/chart-testing-action@v2.7.0
      - name: ct lint
        run: ct lint --config deploy/helm/ct.yaml
