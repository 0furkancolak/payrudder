name: deploy-console

# Deploys the operator console (web/admin) to Cloudflare Workers (docs/adr/0021-console-on-cloudflare-workers.md).
# Without the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID the job still builds, and the deploy step is skipped.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Wrangler environment
        type: choice
        options: [staging, production]
        default: staging
  push:
    branches: [main]
    paths:
      - "web/admin/**"
      - ".github/workflows/deploy-console.yml"

concurrency:
  group: deploy-console-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: web/admin
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Dry run (validates wrangler.jsonc and bundles the Worker)
        run: npx wrangler deploy --dry-run --env "$WRANGLER_ENV"
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy --env "$WRANGLER_ENV"
      - name: Deploy skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; nothing was deployed (docs/runbooks/console-first-deploy.md)."
