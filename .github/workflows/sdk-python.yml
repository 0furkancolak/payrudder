name: sdk-python

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "api/openapi/v1.yaml"
      - "docs/16-webhooks.md"
      - ".github/workflows/sdk-python.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "api/openapi/v1.yaml"
      - "docs/16-webhooks.md"
      - ".github/workflows/sdk-python.yml"

permissions:
  contents: read

concurrency:
  group: sdk-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Generated code is up to date with api/openapi/v1.yaml
        run: python tools/generate.py --check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Build and install the wheel in a clean environment
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -c "import payrudder; print(payrudder.__version__, payrudder.Payrudder, payrudder.AsyncPayrudder)"
