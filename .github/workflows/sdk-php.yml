name: sdk-php

on:
  push:
    branches: [main]
    paths:
      - "sdk/php/**"
      - "api/openapi/v1.yaml"
      - "docs/16-webhooks.md"
      - ".github/workflows/sdk-php.yml"
  pull_request:
    paths:
      - "sdk/php/**"
      - "api/openapi/v1.yaml"
      - "docs/16-webhooks.md"
      - ".github/workflows/sdk-php.yml"

permissions:
  contents: read

concurrency:
  group: sdk-php-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk/php

jobs:
  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: composer validate
        run: composer validate --strict
      - name: composer install
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: php-cs-fixer
        run: composer cs
      - name: phpstan
        run: composer stan
      - name: phpunit
        run: composer test
      - name: generated code is up to date
        # one leg is enough: the generator output does not depend on the PHP version
        if: matrix.php == '8.4'
        run: |
          composer generate
          git diff --exit-code -- .
