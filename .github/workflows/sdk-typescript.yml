name: sdk-typescript

on:
  push:
    branches: [main]
    paths:
      - "sdk/typescript/**"
      - "api/openapi/v1.yaml"
      - "docs/16-webhooks.md"
      - ".github/workflows/sdk-typescript.yml"
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "api/openapi/v1.yaml"
      - "docs/16-webhooks.md"
      - ".github/workflows/sdk-typescript.yml"

permissions:
  contents: read

concurrency:
  group: sdk-typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - name: Generated code is up to date
        run: npm run generate:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-import the ESM and CJS builds
        run: npm run smoke
