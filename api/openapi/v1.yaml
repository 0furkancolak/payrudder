        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        event_types: { type: array, items: { type: string } }
        active: { type: boolean }
        secret: { type: string, description: "whsec_…; only in the response of create and rotate-secret" }
        create_time: { type: string, format: date-time, nullable: true }
    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, endpoint_id, state, attempts, next_attempt_time, last_status, last_error, create_time, delivered_time]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid, description: "The id inside the delivered body and the Payrudder-Event-Id header" }
        event_type: { type: string, description: "A WebhookEventType, or ping for the test event" }
        endpoint_id: { type: string, format: uuid }
        state: { type: string, enum: [WEBHOOK_DELIVERY_STATE_PENDING, WEBHOOK_DELIVERY_STATE_DELIVERED, WEBHOOK_DELIVERY_STATE_FAILED] }
        attempts: { type: integer }
        next_attempt_time: { type: string, format: date-time, description: "Set while the delivery is pending", nullable: true }
        last_status: { type: integer, description: "HTTP status of the last attempt; 0 when no attempt got an answer" }
        last_error: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        delivered_time: { type: string, format: date-time, nullable: true, description: "Set once the endpoint answered 2xx" }
    WebhookEvent:
      description: "The body of a delivery: the common envelope plus data that depends on type. The signature and headers are described in docs/16-webhooks.md. Billing events (invoice, credit_note, payment_link, credits) send int64 values as strings except the credits and balance counts, which are JSON numbers; subscription events embed the subscription without its zero-valued fields."
      oneOf:
        - { $ref: "#/components/schemas/InvoiceFinalizedEvent" }
        - { $ref: "#/components/schemas/InvoicePaidEvent" }
        - { $ref: "#/components/schemas/InvoiceVoidedEvent" }
        - { $ref: "#/components/schemas/InvoiceUncollectibleEvent" }
        - { $ref: "#/components/schemas/CreditNoteCreatedEvent" }
        - { $ref: "#/components/schemas/CreditNoteRefundedEvent" }
        - { $ref: "#/components/schemas/CreditNoteRefundFailedEvent" }
        - { $ref: "#/components/schemas/SubscriptionCreatedEvent" }
        - { $ref: "#/components/schemas/SubscriptionChangedEvent" }
        - { $ref: "#/components/schemas/SubscriptionChangeScheduledEvent" }
        - { $ref: "#/components/schemas/SubscriptionCancelledEvent" }
        - { $ref: "#/components/schemas/SubscriptionCancellationScheduledEvent" }
        - { $ref: "#/components/schemas/SubscriptionCancellationWithdrawnEvent" }
        - { $ref: "#/components/schemas/SubscriptionPausedEvent" }
        - { $ref: "#/components/schemas/SubscriptionResumedEvent" }
        - { $ref: "#/components/schemas/SubscriptionMovedToProviderEvent" }
        - { $ref: "#/components/schemas/SubscriptionTrialWillEndEvent" }
        - { $ref: "#/components/schemas/PaymentLinkCreatedEvent" }
        - { $ref: "#/components/schemas/PaymentLinkPaidEvent" }
        - { $ref: "#/components/schemas/PaymentLinkExpiredEvent" }
        - { $ref: "#/components/schemas/CreditsPurchasedEvent" }
        - { $ref: "#/components/schemas/CreditsLowEvent" }
        - { $ref: "#/components/schemas/PingEvent" }
      discriminator:
        propertyName: type
        mapping:
          invoice.finalized: "#/components/schemas/InvoiceFinalizedEvent"
          invoice.paid: "#/components/schemas/InvoicePaidEvent"
          invoice.voided: "#/components/schemas/InvoiceVoidedEvent"
          invoice.uncollectible: "#/components/schemas/InvoiceUncollectibleEvent"
          credit_note.created: "#/components/schemas/CreditNoteCreatedEvent"
          credit_note.refunded: "#/components/schemas/CreditNoteRefundedEvent"
          credit_note.refund_failed: "#/components/schemas/CreditNoteRefundFailedEvent"
          subscription.created: "#/components/schemas/SubscriptionCreatedEvent"
          subscription.changed: "#/components/schemas/SubscriptionChangedEvent"
          subscription.change_scheduled: "#/components/schemas/SubscriptionChangeScheduledEvent"
          subscription.cancelled: "#/components/schemas/SubscriptionCancelledEvent"
          subscription.cancellation_scheduled: "#/components/schemas/SubscriptionCancellationScheduledEvent"
          subscription.cancellation_withdrawn: "#/components/schemas/SubscriptionCancellationWithdrawnEvent"
          subscription.paused: "#/components/schemas/SubscriptionPausedEvent"
          subscription.resumed: "#/components/schemas/SubscriptionResumedEvent"
          subscription.moved_to_provider: "#/components/schemas/SubscriptionMovedToProviderEvent"
          subscription.trial_will_end: "#/components/schemas/SubscriptionTrialWillEndEvent"
          payment_link.created: "#/components/schemas/PaymentLinkCreatedEvent"
          payment_link.paid: "#/components/schemas/PaymentLinkPaidEvent"
          payment_link.expired: "#/components/schemas/PaymentLinkExpiredEvent"
          credits.purchased: "#/components/schemas/CreditsPurchasedEvent"
          credits.low: "#/components/schemas/CreditsLowEvent"
          ping: "#/components/schemas/PingEvent"
