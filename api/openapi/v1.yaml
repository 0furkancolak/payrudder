  /admin/v1/tenants/{tenant_id}/replays:
    post:
      operationId: adminStartReplay
      summary: Rebuild a tenant's aggregates from the event log into a new generation
      description: |
        Creates generation N+1 next to the tenant's live one and rebuilds it from Kafka for the given periods, with the same code
        path as live aggregation. When it has caught up the live consumer writes the tenant into both generations; the job then
        verifies the difference and waits to be promoted. One open replay per tenant (409 otherwise). Live traffic is never paused.
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_period_id, reason]
              properties:
                from_period_id: { type: string, examples: ["2026-10"] }
                to_period_id: { type: string, description: Defaults to from_period_id }
                reason: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}:
    get:
      operationId: adminGetReplay
      summary: A replay job (status, offsets, and once ready the difference to the live generation)
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}/promote:
    post:
      operationId: adminPromoteReplay
      summary: Make the rebuilt generation the tenant's active one (one transaction, no pause). Idempotent
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}/discard:
    post:
      operationId: adminDiscardReplay
      summary: Abandon a generation that was not promoted and delete its rows. Idempotent
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/billing-runs/{period}/rerating:
    post:
      operationId: adminStartRerating
      summary: Price a closed period again under another plan version and bill the difference
      description: |
        Requires the period's billing run to be COMPLETED. Customers of the plan the version belongs to who were invoiced for the
        period are priced again on the same usage: a higher price becomes one CORRECTION invoice per customer (through the
        normal invoice saga), a lower one a credit balance applied as a CREDIT line to the customer's next regular invoice.
        Idempotent per tenant, period and plan version: a repeat returns the existing job (200).
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [plan_version_id], properties: { plan_version_id: { type: string, format: uuid } } }
      responses:
        "200": { description: The job already existed, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/rerating-jobs/{job_id}:
    get:
      operationId: adminGetRerating
      summary: A re-rating job
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/retry:
    post:
      operationId: adminRetryInvoice
      summary: Resume an invoice saga stuck in a *_FAILED state or PAYMENT_UNKNOWN
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tenant_id], properties: { tenant_id: { type: string, format: uuid } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSaga" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/void:
    post:
      operationId: adminVoidInvoice
      summary: Void an invoice, refunding it first when it was paid
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tenant_id], properties: { tenant_id: { type: string, format: uuid }, reason: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSaga" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/payments:
    post:
      operationId: adminRecordInvoicePayment
      summary: Record money received outside a payment provider (a bank transfer, cash, other) against an invoice
      description: >
        For an invoice that was not charged through Payrudder, or whose charge is stuck. Partial payments are recorded; the invoice is paid when they add up to the total.
        More than is outstanding is refused (`billing.payment.overpayment`). Allowed while the invoice is open or uncollectible and its saga is waiting for or has
        failed a payment. Idempotent per (invoice, method, reference) when a reference is given: the same call again answers 200 with `duplicate: true`.
        Who and when are recorded (X-Payrudder-Actor, `operator` when absent). An invoice charged by bank transfer is confirmed through its transfer endpoint instead.
      security: [{ operatorToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Payrudder-Actor, in: header, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, method, amount_minor]
              properties:
                tenant_id: { type: string, format: uuid }
                method: { type: string, enum: [bank_transfer, cash, other] }
                amount_minor: { type: string, description: int64 minor units as a string }
                received_at: { type: string, format: date-time, description: Default now; not in the future. }
                reference: { type: string, maxLength: 128 }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: The same payment was recorded before, content: { application/json: { schema: { $ref: "#/components/schemas/RecordInvoicePaymentResult" } } } }
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/RecordInvoicePaymentResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/credit-notes:
    post:
      operationId: adminCreateCreditNote
      summary: Correct a paid invoice with a numbered credit note, added to the customer's credit balance or refunded to the card
      description: >
        An issued invoice is never edited. The note's amount goes to the customer's credit balance in the invoice's currency and pays their next invoice, or, with refund_to_card, back to the card
        through the payment provider that took the payment (the note's refund_state says whether it went through; a refund nobody answers is sent again, and a failed one can be retried).
        The notes of an invoice never add up to more than the invoice. Only a paid invoice can be credited (an open one is voided).
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
                amount_minor: { type: string, description: "int64 minor units; 0 or absent = what is left of the invoice" }
                reason: { type: string, maxLength: 500 }
                refund_to_card: { type: boolean, description: "Refund the amount to the card instead of adding it to the credit balance" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreditNote" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/credit-notes/{id}/retry-refund:
    post:
      operationId: adminRetryCreditNoteRefund
      summary: Ask the payment provider again for a credit note refund that failed
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditNote" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key (takes effect on the next request)
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "qk_{test|live}_<prefix>_<secret>" }
    operatorToken: { type: http, scheme: bearer, description: "Operator access: the machine token (PAYRUDDER_OPERATOR_TOKEN, for the API, payrudderctl and tests) or the session token (qs_...) of a platform operator, a person with a verified address listed in PAYRUDDER_OPERATOR_EMAILS. A session of anybody else is refused with 403 identity.operator.forbidden." }
    sessionToken: { type: http, scheme: bearer, description: "A person's session token (qs_..., from /auth/signin). It also works on /v1 routes together with X-Payrudder-Tenant, for a tenant of one of the person's accounts (a viewer may only read)." }
  parameters:
    ExternalID: { name: external_id, in: path, required: true, schema: { type: string } }
    PlanCode: { name: code, in: path, required: true, schema: { type: string } }
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Asset:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        purpose: { type: string, enum: [PURPOSE_INVOICE_LOGO, PURPOSE_INVOICE_ATTACHMENT, PURPOSE_GENERAL] }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: string, description: int64 as a string }
        sha256: { type: string }
        status: { type: string, enum: [ASSET_STATUS_PENDING, ASSET_STATUS_UPLOADING, ASSET_STATUS_SCANNING, ASSET_STATUS_READY, ASSET_STATUS_REJECTED, ASSET_STATUS_ABORTED, ASSET_STATUS_CORRUPT, ASSET_STATUS_DELETED] }
        reject_reason: { type: string, examples: ["PART_MISMATCH"] }
        create_time: { type: string, format: date-time }
        complete_time: { type: string, format: date-time }
    PresignedPart:
      type: object
      properties:
        part_number: { type: integer }
        url: { type: string, format: uri }
    UploadFile:
      type: object
      properties:
        asset_id: { type: string }
        filename: { type: string }
        status: { type: string }
        reject_reason: { type: string }
        size: { type: string }
        part_size: { type: string }
        part_count: { type: integer }
        presigned_parts: { type: array, items: { $ref: "#/components/schemas/PresignedPart" } }
        uploaded_parts:
          type: array
          items:
            type: object
            properties:
              part_number: { type: integer }
              size: { type: string }
              etag: { type: string }
    UploadSession:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [OPEN, COMPLETED, EXPIRED, ABORTED] }
        expire_time: { type: string, format: date-time }
        files: { type: array, items: { $ref: "#/components/schemas/UploadFile" } }
    BillingRun:
      type: object
      properties:
        tenant_id: { type: string }
        period_id: { type: string }
        status: { type: string, enum: [RUN_STATUS_SCHEDULED, RUN_STATUS_WAITING_WATERMARK, RUN_STATUS_RATING, RUN_STATUS_INVOICING, RUN_STATUS_COMPLETED, RUN_STATUS_FAILED] }
        cutoff_time: { type: string, format: date-time }
        invoice_count: { type: integer }
        last_error: { type: string }
    SagaEvent:
      type: object
      properties:
        seq: { type: integer }
        from_state: { type: string }
        to_state: { type: string }
        cause: { type: string }
        command_id: { type: string }
        at: { type: string, format: date-time }
    ReplayJob:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        from_period_id: { type: string }
        to_period_id: { type: string }
        source_generation: { type: integer }
        target_generation: { type: integer }
        status: { type: string, enum: [REPLAY_STATUS_RUNNING, REPLAY_STATUS_CATCHING_UP, REPLAY_STATUS_READY, REPLAY_STATUS_PROMOTED, REPLAY_STATUS_DISCARDED, REPLAY_STATUS_FAILED] }
        reason: { type: string }
        start_offsets: { type: object, additionalProperties: { type: string } }
        end_offsets: { type: object, additionalProperties: { type: string } }
        dual_write_from: { type: object, additionalProperties: { type: string } }
        verification:
          type: object
          properties:
            rows_compared: { type: string }
            rows_changed: { type: string }
            rows_only_in_old: { type: string }
            rows_only_in_new: { type: string }
            diffs:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [usage, late] }
                  customer_id: { type: string }
                  meter_code: { type: string }
                  period_id: { type: string }
                  origin_period_id: { type: string }
                  old_quantity: { type: string }
                  new_quantity: { type: string }
                  old_event_count: { type: string }
                  new_event_count: { type: string }
        last_error: { type: string }
        create_time: { type: string, format: date-time }
        complete_time: { type: string, format: date-time }
    ReratingJob:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        period_id: { type: string }
        plan_version_id: { type: string }
        generation: { type: integer, description: The aggregate generation whose usage was priced }
        status: { type: string, enum: [RERATING_STATUS_RUNNING, RERATING_STATUS_COMPLETED, RERATING_STATUS_FAILED] }
        customers_rated: { type: integer }
        corrections: { type: integer }
        credits: { type: integer }
        correction_total_minor: { type: string, description: int64 as a string }
        credit_total_minor: { type: string, description: int64 as a string }
        last_error: { type: string }
        create_time: { type: string, format: date-time }
        complete_time: { type: string, format: date-time }
    InvoiceSaga:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string }
        state: { type: string }
        attempt: { type: integer }
        dunning_attempt: { type: integer }
        last_error: { type: string }
    InvoiceLine:
      type: object
      properties:
        line_no: { type: integer }
        kind: { type: string, enum: [BASE_FEE, USAGE, LATE_USAGE, CREDIT, CORRECTION, DISCOUNT, TAX] }
        meter_code: { type: string }
        origin_period_id: { type: string }
        quantity: { type: string, examples: ["1.250"] }
        amount_minor: { type: string, description: int64 minor units as a string }
        description: { type: string }
        service_from: { type: string, format: date-time, description: The service period the line covers }
        service_to: { type: string, format: date-time }
    Invoice:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        customer_external_id: { type: string }
        period_id: { type: string }
        kind: { type: string, enum: [REGULAR, CORRECTION, FEE, LINK], description: "FEE: a fixed fee invoiced in advance for one period, or what a plan change moved. LINK: made from an ad-hoc payment link" }
        number: { type: string, examples: ["INV-2026-000123"] }
        currency: { type: string }
        subtotal_minor: { type: string }
        total_minor: { type: string, description: int64 minor units as a string }
        status: { type: string, enum: [draft, open, paid, uncollectible, void] }
        saga_state: { type: string }
        create_time: { type: string, format: date-time }
        finalize_time: { type: string, format: date-time }
        lines: { type: array, items: { $ref: "#/components/schemas/InvoiceLine" } }
        payments:
          type: array
          description: Payments recorded by hand (POST /admin/v1/invoices/{id}/payments), oldest first. Only the single-invoice reads fill it.
          items: { $ref: "#/components/schemas/InvoicePayment" }
    InvoicePayment:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string }
        method: { type: string, enum: [bank_transfer, cash, other] }
        amount_minor: { type: string, description: int64 minor units as a string }
        currency: { type: string }
        received_at: { type: string, format: date-time }
        reference: { type: string }
        note: { type: string }
        recorded_by: { type: string }
        recorded_at: { type: string, format: date-time }
    RecordInvoicePaymentResult:
      type: object
      properties:
        payment: { $ref: "#/components/schemas/InvoicePayment" }
        duplicate: { type: boolean }
        paid_minor: { type: string, description: The sum of the payments recorded by hand }
        outstanding_minor: { type: string }
        settled: { type: boolean, description: The invoice is paid }
    BankTransferInstructions:
      type: object
      properties:
        bank_name: { type: string }
        account_holder: { type: string }
        iban: { type: string, description: "Normalised: capitals, no spaces" }
        bic: { type: string }
        reference: { type: string, description: What the customer writes on the transfer }
    TransferReceipt:
      type: object
      properties:
        id: { type: integer, description: The ledger row }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        received_at: { type: string, format: date-time }
        bank_reference: { type: string }
        note: { type: string }
        recorded_by: { type: string }
        recorded_at: { type: string, format: date-time }
    InvoiceTransfer:
      type: object
      properties:
        invoice_id: { type: string, format: uuid }
        state:
          type: string
          enum: [none, pending, paid, expired, rejected]
          description: "none: not charged by bank transfer. pending: waiting for the money (partial receipts included). paid: the receipts reach the total. expired and rejected: given up, dunning applies."
        reference: { type: string }
        instructions: { $ref: "#/components/schemas/BankTransferInstructions" }
        currency: { type: string }
        total_minor: { type: integer, format: int64 }
        received_minor: { type: integer, format: int64 }
        outstanding_minor: { type: integer, format: int64 }
        pending_since: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: When the payment window ends }
        closed_reason: { type: string }
        receipts: { type: array, items: { $ref: "#/components/schemas/TransferReceipt" } }
    TransferReceiptResult:
      type: object
      properties:
        receipt: { $ref: "#/components/schemas/TransferReceipt" }
        duplicate: { type: boolean }
        paid: { type: boolean, description: The receipts reach the total }
        saga_notified: { type: boolean, description: "False when billing-svc could not be told now; the saga notices at its next poll." }
        transfer: { $ref: "#/components/schemas/InvoiceTransfer" }
    EntitlementStatus:
      type: object
      properties:
        customer_external_id: { type: string }
        meter_code: { type: string }
        period_id: { type: string, examples: ["2026-11"] }
        used: { type: string, description: Exact decimal with the meter's scale, examples: ["10.500"] }
        limit: { type: [string, "null"], description: Exact decimal; null when unlimited, examples: ["10.500"] }
        unlimited: { type: boolean }
        allowed: { type: boolean, description: "unlimited, or used < limit" }
        as_of: { type: [string, "null"], format: date-time }
    IngestEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/IncomingEvent" }
    IncomingEvent:
      type: object
      required: [customer_external_id, meter_code, quantity, event_time]
      properties:
        idempotency_key: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$", description: Required for live keys. Optional in sandbox (then no dedup). }
        customer_external_id: { type: string }
        meter_code: { type: string }
        quantity:
          description: Non-negative decimal with at most the meter's quantity_scale decimal places. A string or a JSON number.
          oneOf: [{ type: string, examples: ["1500", "1.250"] }, { type: number }]
        event_time: { type: string, format: date-time, description: Not older than 35 days, not more than 5 minutes ahead. }
        properties: { type: object, additionalProperties: { type: string }, description: At most 32 entries and 4 KiB in total. }
    IngestEventsResponse:
      type: object
      properties:
        results:
          type: array
          description: One per request event, same order.
          items: { $ref: "#/components/schemas/EventResult" }
    EventResult:
      type: object
      properties:
        status: { type: string, enum: [accepted, duplicate, rejected] }
        event_id: { type: string, description: Set for accepted and duplicate (the original id). }
        error_code:
          type: string
          enum: [UNKNOWN_METER, UNKNOWN_CUSTOMER, EVENT_TOO_OLD, EVENT_IN_FUTURE, INVALID_EVENT_TIME, INVALID_QUANTITY,
                 INVALID_QUANTITY_PRECISION, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REUSED, INVALID_PROPERTIES]
        error_message: { type: string }
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        create_time: { type: string, format: date-time }
        email_verified: { type: boolean, description: "True once the person opened a mailed link for this address. Until then live API keys cannot be created." }
    Payment:
      type: object
      properties:
        id: { type: string, description: The ledger row that carries the outcome }
        invoice_id: { type: string }
        provider: { type: string }
        kind: { type: string, enum: [charge, refund] }
        status: { type: string, enum: [paid, processing, failed, refunded] }
        amount_minor: { type: string, description: int64 minor units as a string }
        currency: { type: string }
        occurred_at: { type: string, format: date-time }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, viewer] }
        invited_by_email: { type: string }
        invited_by_name: { type: string }
        create_time: { type: string, format: date-time }
        send_time: { type: string, format: date-time, description: When the mail last went out }
        expire_time: { type: string, format: date-time }
    InvitationLookup:
      type: object
      properties:
        account_name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, viewer] }
        has_account: { type: boolean }
        invited_by_name: { type: string }
    Accepted:
      type: object
      properties:
        status: { type: string, enum: [accepted] }
    Membership:
      type: object
      properties:
        account_id: { type: string, format: uuid }
        account_name: { type: string }
        role: { type: string, enum: [owner, admin, viewer] }
    SessionOpened:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
        token: { type: string, description: "qs_..., shown once; send as Authorization: Bearer" }
        expire_time: { type: string, format: date-time, description: 14 days from now; slides on use, never beyond 90 days from sign-in }
        operator: { type: boolean, description: "The server's verdict: the person is a platform operator (verified address listed in PAYRUDDER_OPERATOR_EMAILS). The page uses it only to show the operator console; every operator route decides again." }
    SessionInfo:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
        expire_time: { type: string, format: date-time }
        operator: { type: boolean, description: "The server's verdict: the person is a platform operator (verified address listed in PAYRUDDER_OPERATOR_EMAILS). The page uses it only to show the operator console; every operator route decides again." }
    MyAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, admin, viewer], description: The caller's own role }
        create_time: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              email: { type: string }
              display_name: { type: string }
              role: { type: string, enum: [owner, admin, viewer] }
              create_time: { type: string, format: date-time }
    OverviewCount:
      type: object
      properties:
        count: { type: integer }
        more: { type: boolean, description: The count stopped at its cap; there are more }
    DashboardRevenue:
      type: object
      description: Minor units of the block's currency.
      properties:
        gross_minor: { type: integer, format: int64 }
        tax_minor: { type: integer, format: int64 }
        refunds_minor: { type: integer, format: int64 }
        net_minor: { type: integer, format: int64, description: gross - tax - refunds }
        expenses_minor: { type: integer, format: int64 }
        profit_minor: { type: integer, format: int64 }
        paid_invoices: { type: integer, format: int64 }
    DashboardPayments:
      type: object
      properties:
        paid: { type: integer }
        failed: { type: integer, description: Failed attempts; a declined card that dunning retries counts each time }
        processing: { type: integer }
        refunds: { type: integer }
        paid_minor: { type: integer, format: int64 }
        failed_minor: { type: integer, format: int64 }
        refunded_minor: { type: integer, format: int64 }
        failed_rate_bp: { type: integer, nullable: true, description: failed / (paid + failed) in basis points; null when nothing settled }
    DashboardSubscriptions:
      type: object
      properties:
        month: { type: string, description: The month of the report (YYYY-MM) }
        active: { type: integer, format: int64 }
        trialing: { type: integer, format: int64 }
        paused: { type: integer, format: int64 }
        past_due: { type: integer, format: int64 }
        mrr_minor: { type: integer, format: int64 }
        arr_minor: { type: integer, format: int64, description: mrr x 12 }
        new: { type: integer, format: int64 }
        new_mrr_minor: { type: integer, format: int64 }
        churned: { type: integer, format: int64 }
        churned_mrr_minor: { type: integer, format: int64 }
        churn_rate_bp: { type: integer, nullable: true }
    DashboardCurrency:
      type: object
      description: Everything the dashboard knows in one currency. Nothing in it is in another currency.
      properties:
        currency: { type: string }
        revenue: { $ref: "#/components/schemas/DashboardRevenue" }
        prev_revenue: { allOf: [{ $ref: "#/components/schemas/DashboardRevenue" }], nullable: true }
        series:
          type: array
          description: Net income per bucket (day, or the first day of a month), with the bucket of the previous period at the same position
          items:
            type: object
            properties:
              date: { type: string, format: date }
              net_minor: { type: integer, format: int64 }
              prev_date: { type: string, format: date }
              prev_net_minor: { type: integer, format: int64, nullable: true }
        payments: { allOf: [{ $ref: "#/components/schemas/DashboardPayments" }], nullable: true }
        prev_payments: { allOf: [{ $ref: "#/components/schemas/DashboardPayments" }], nullable: true }
        subscriptions: { allOf: [{ $ref: "#/components/schemas/DashboardSubscriptions" }], nullable: true }
        prev_subscriptions: { allOf: [{ $ref: "#/components/schemas/DashboardSubscriptions" }], nullable: true }
        arpu_minor: { type: integer, format: int64, nullable: true, description: Net revenue per active subscriber }
        prev_arpu_minor: { type: integer, format: int64, nullable: true }
        top_customers:
          type: array
          items:
            type: object
            properties:
              customer_id: { type: string }
              customer_external_id: { type: string }
              name: { type: string }
              income_minor: { type: integer, format: int64 }
              invoices: { type: integer, format: int64 }
        top_packages:
          type: array
          items:
            type: object
            properties:
              plan_code: { type: string }
              active: { type: integer, format: int64 }
              mrr_minor: { type: integer, format: int64 }
        aging:
          type: array
          description: Open invoices by days open, in the order 0-7, 8-30, 31-60, 61+
          items:
            type: object
            properties:
              bucket: { type: string, enum: ["0-7", "8-30", "31-60", "61+"] }
              count: { type: integer, format: int64 }
              amount_minor: { type: integer, format: int64 }
        open_count: { type: integer, format: int64 }
        open_minor: { type: integer, format: int64 }
        renewals:
          type: array
          description: The next charges of this currency in the coming 30 days, soonest first (at most six)
          items:
            type: object
            properties:
              subscription_id: { type: string }
              customer_external_id: { type: string }
              plan_code: { type: string }
              interval: { type: string }
              renews_at: { type: string, format: date-time }
              state: { type: string }
    Dashboard:
      type: object
      properties:
        app_id: { type: string }
        environment: { type: string, enum: [live, sandbox] }
        tenant_id: { type: string, format: uuid }
        timezone: { type: string }
        default_currency: { type: string }
        range:
          type: object
          properties:
            period: { type: string }
            from: { type: string, format: date }
            to: { type: string, format: date }
            days: { type: integer }
            granularity: { type: string, enum: [day, month] }
            compare: { type: boolean }
            prev_from: { type: string, format: date }
            prev_to: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [ok, attention, degraded] }
        unavailable: { type: array, items: { type: string } }
        payments_truncated: { type: boolean, description: The period reaches past the newest 1000 ledger rows the gateway reads, so payment counts may be low }
        payments_prev_covered: { type: boolean, description: False when the ledger window does not reach back over the previous period, so it has no payment comparison }
        renewals_truncated: { type: boolean }
        currencies: { type: array, description: "The tenant's own currency first, then by net revenue", items: { $ref: "#/components/schemas/DashboardCurrency" } }
        customers:
          type: object
          nullable: true
          properties:
            total: { type: integer, format: int64 }
            new: { type: integer, format: int64 }
            prev_new: { type: integer, format: int64 }
        usage:
          type: object
          nullable: true
          description: Usage against the limits of up to ten customers who have a subscription
          properties:
            period_id: { type: string }
            sampled: { type: integer }
            meters:
              type: array
              items:
                type: object
                properties:
                  meter_code: { type: string }
                  customers: { type: integer }
                  over: { type: integer }
                  near: { type: integer, description: At or above 80 % of the limit }
                  top:
                    type: array
                    items:
                      type: object
                      properties:
                        customer_external_id: { type: string }
                        used: { type: string }
                        limit: { type: string }
                        percent: { type: number, description: For display only; the exact decimals are the entitlements endpoint's }
        activity:
          type: array
          description: The newest invoices, payments and subscriptions, newest first (at most twelve)
          items:
            type: object
            properties:
              kind: { type: string, enum: [invoice, payment, subscription] }
              at: { type: string, format: date-time }
              ref: { type: string }
              label: { type: string }
              customer: { type: string }
              status: { type: string }
              amount_minor: { type: integer, format: int64 }
              currency: { type: string }
        health:
          type: object
          properties:
            payments_reachable: { type: boolean }
            webhook_endpoints: { type: integer }
            webhook_failed: { type: integer }
            webhook_failed_more: { type: boolean }
            providers:
              type: array
              items:
                type: object
                properties:
                  provider: { type: string }
                  environment: { type: string }
                  is_default: { type: boolean }
    AppOverview:
      type: object
      properties:
        app_id: { type: string, format: uuid }
        environment: { type: string, enum: [live, sandbox] }
        tenant_id: { type: string, format: uuid }
        currency: { type: string, description: The environment's own currency }
        window_days: { type: integer, examples: [30] }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [ok, attention, degraded], description: "attention: a failed payment or webhook delivery; degraded: a section is unavailable" }
        unavailable: { type: array, items: { type: string, enum: [payments, invoices, customers, subscriptions, webhooks] } }
        payments:
          type: [object, "null"]
          properties:
            truncated: { type: boolean, description: The ledger window held more rows than the gateway reads }
            by_status:
              type: array
              items: { type: object, properties: { status: { type: string, enum: [paid, processing, failed, refunded] }, count: { type: integer } } }
            by_currency:
              type: array
              items:
                type: object
                properties:
                  currency: { type: string }
                  paid_count: { type: integer }
                  paid_minor: { type: integer }
                  failed_count: { type: integer }
                  failed_minor: { type: integer }
                  pending_count: { type: integer }
                  pending_minor: { type: integer }
                  refunded_minor: { type: integer }
            series:
              type: array
              description: Paid money per day of the window, per currency
              items:
                type: object
                properties:
                  currency: { type: string }
                  points: { type: array, items: { type: object, properties: { date: { type: string, format: date }, amount_minor: { type: integer } } } }
            recent:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  invoice_id: { type: string }
                  provider: { type: string }
                  kind: { type: string, enum: [charge, refund] }
                  status: { type: string, enum: [paid, processing, failed, refunded] }
                  amount_minor: { type: integer }
                  currency: { type: string }
                  occurred_at: { type: string, format: date-time }
        invoices:
          type: [object, "null"]
          properties:
            open: { $ref: "#/components/schemas/OverviewCount" }
            paid: { $ref: "#/components/schemas/OverviewCount" }
            revenue:
              type: array
              description: All periods, per currency
              items:
                type: object
                properties:
                  currency: { type: string }
                  billed_minor: { type: integer }
                  collected_minor: { type: integer }
                  outstanding_minor: { type: integer }
                  refunded_minor: { type: integer }
            recent:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  number: { type: string }
                  customer_id: { type: string }
                  customer_external_id: { type: string }
                  status: { type: string }
                  currency: { type: string }
                  total_minor: { type: integer }
                  create_time: { type: string, format: date-time }
                  finalize_time: { type: string, format: date-time }
        customers:
          oneOf: [{ $ref: "#/components/schemas/OverviewCount" }, { type: "null" }]
        subscriptions:
          type: array
          description: Recurring revenue of the current month per currency
          items:
            type: object
            properties:
              currency: { type: string }
              active: { type: integer }
              trialing: { type: integer }
              past_due: { type: integer }
              mrr_minor: { type: integer }
              new_mrr_minor: { type: integer }
              churned_mrr_minor: { type: integer }
        health:
          type: object
          properties:
            payments_reachable: { type: boolean }
            webhook_endpoints: { type: integer }
            webhook_failed: { type: integer }
            webhook_failed_more: { type: boolean }
            providers:
              type: array
              items: { type: object, properties: { provider: { type: string }, environment: { type: string }, is_default: { type: boolean } } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, key, message]
          properties:
            code: { type: string, examples: [INVALID_ARGUMENT, UNAUTHENTICATED, RESOURCE_EXHAUSTED] }
            key: { type: string, description: "Stable and dotted, service first (billing.credit_note.not_paid). Translate the key, not the message. The list is docs/error-keys.md; an error without its own key gets common.<reason>", examples: [billing.credit_note.not_paid, common.not_found] }
            message: { type: string }
            details:
              type: array
              items: { type: object, properties: { field: { type: string }, description: { type: string } } }
            request_id: { type: string }
    AffiliateProgram:
      type: object
      description: The rules of the partner program of one environment.
      properties:
        status: { type: string, enum: [draft, active, paused], description: "paused and draft earn nothing and turn the links off" }
        commission_kind: { type: string, enum: [percent_bps, fixed] }
        commission_value: { type: string, description: "Basis points of the net, pre-tax amount paid (1000 is 10 %), or minor units of currency for fixed" }
        currency: { type: string, description: "Only for fixed; a percentage follows the currency of each invoice" }
        commission_term: { type: string, enum: [first_invoices, months, lifetime] }
        commission_term_value: { type: integer, description: "N invoices or N months; absent for lifetime" }
        attribution_window_days: { type: integer, minimum: 1, maximum: 365, default: 30 }
        hold_days: { type: integer, minimum: 0, maximum: 180, description: "How long a commission waits (the refund window) before it can be paid" }
        min_payout_minor: { type: string }
        referred_coupon_code: { type: string, description: "Coupon a referred customer gets on their next checkout" }
        daily_click_cap: { type: integer, minimum: 1, maximum: 100000, default: 1000 }
        landing_url: { type: string, description: "Where /r/<code> sends the visitor; empty shows a plain page" }
        auto_approve: { type: boolean, description: "A partner who applies is active at once" }
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
    Affiliate:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        email: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, active, suspended] }
        payout_method: { type: string, enum: [manual, bank_transfer] }
        payout_details: { type: string }
        source: { type: string, enum: [owner, application] }
        signed_in: { type: boolean, description: The partner has signed in and claimed this affiliate }
        clicks: { type: string }
        referrals: { type: string }
        approve_time: { type: string, format: date-time }
        create_time: { type: string, format: date-time }
        link: { type: string, description: "The partner's public referral link, https://<gateway>/r/<code>" }
    AffiliateCommission:
      type: object
      properties:
        id: { type: string, format: uuid }
        affiliate_id: { type: string, format: uuid }
        affiliate_code: { type: string }
        customer_external_id: { type: string }
        kind: { type: string, enum: [commission, reversal] }
        invoice_id: { type: string, format: uuid }
        invoice_number: { type: string }
        currency: { type: string }
        invoice_total_minor: { type: string, description: "What the invoice came to, tax included" }
        net_minor: { type: string, description: "The base: the net, pre-tax amount actually paid" }
        amount_minor: { type: string, description: "The commission; negative on a reversal row" }
        reversed_minor: { type: string, description: How much of the commission has been taken back }
        status: { type: string, enum: [pending, approved, paid, reversed] }
        parent_id: { type: string, format: uuid }
        earn_time: { type: string, format: date-time }
        approve_after_time: { type: string, format: date-time }
        approve_time: { type: string, format: date-time }
        pay_time: { type: string, format: date-time }
        payout_id: { type: string, format: uuid }
    AffiliateBalance:
      type: object
      properties:
        affiliate_id: { type: string, format: uuid }
        currency: { type: string }
        pending_minor: { type: string }
        approved_minor: { type: string }
        paid_minor: { type: string }
        reversed_minor: { type: string }
    AffiliateFunnel:
      type: object
      properties:
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        clicks: { type: string }
        referrals: { type: string, description: Customers attributed in the period }
        paying_customers: { type: string, description: Customers with a commission earned in the period }
        commissions: { type: array, items: { type: object, properties: { currency: { type: string }, earned_minor: { type: string }, reversed_minor: { type: string } } } }
    AffiliatePayout:
      type: object
      properties:
        id: { type: string, format: uuid }
        affiliate_id: { type: string, format: uuid }
        affiliate_code: { type: string }
        currency: { type: string }
        total_minor: { type: string, description: "Open: what its commissions are worth now. Paid: what was paid" }
        commission_count: { type: integer }
        method: { type: string, enum: [manual, bank_transfer] }
        payout_details: { type: string }
        reference: { type: string }
        status: { type: string, enum: [open, paid, cancelled] }
        fake: { type: boolean, description: "A payout of a sandbox environment: nothing was or will be paid" }
        create_time: { type: string, format: date-time }
        pay_time: { type: string, format: date-time }
        cancel_time: { type: string, format: date-time }
    AffiliateJournalEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        payout_id: { type: string, format: uuid }
        affiliate_id: { type: string, format: uuid }
        post_time: { type: string, format: date-time }
        currency: { type: string }
        account: { type: string, enum: [commission_expense, commissions_payable, cash] }
        debit_minor: { type: string }
        credit_minor: { type: string }
        memo: { type: string }
        fake: { type: boolean }
    MyProgram:
      type: object
      properties:
        status: { type: string, enum: [draft, active, paused] }
        commission_kind: { type: string, enum: [percent_bps, fixed] }
        commission_value: { type: string }
        currency: { type: string }
        commission_term: { type: string, enum: [first_invoices, months, lifetime] }
        commission_term_value: { type: integer }
        attribution_window_days: { type: integer }
        hold_days: { type: integer }
        min_payout_minor: { type: string }
    MyAffiliation:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        environment: { type: string, enum: [sandbox, live], description: "A sandbox partner earns fake money" }
        seller_name: { type: string }
        code: { type: string }
        link: { type: string, description: "The partner's public referral link" }
        status: { type: string, enum: [pending, active, suspended] }
        name: { type: string }
        email: { type: string }
        payout_method: { type: string, enum: [manual, bank_transfer] }
        payout_details: { type: string }
        program: { $ref: "#/components/schemas/MyProgram" }
        create_time: { type: string, format: date-time }
    MyAffiliationDetail:
      type: object
      properties:
        affiliation: { $ref: "#/components/schemas/MyAffiliation" }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        clicks: { type: string }
        referrals: { type: string }
        paying_customers: { type: string }
        earned: { type: array, items: { type: object, properties: { currency: { type: string }, earned_minor: { type: string }, reversed_minor: { type: string } } } }
        balances: { type: array, items: { $ref: "#/components/schemas/AffiliateBalance" } }
    MyReferral:
      type: object
      properties:
        customer_email_masked: { type: string }
        source: { type: string, enum: [link, code, api] }
        attribute_time: { type: string, format: date-time }
    MyCommission:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [commission, reversal] }
        customer_email_masked: { type: string }
        currency: { type: string }
        amount_minor: { type: string }
        reversed_minor: { type: string }
        status: { type: string, enum: [pending, approved, paid, reversed] }
        earn_time: { type: string, format: date-time }
        approve_after_time: { type: string, format: date-time }
        pay_time: { type: string, format: date-time }
        payout_id: { type: string, format: uuid }
    MyPayout:
      type: object
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        total_minor: { type: string }
        status: { type: string, enum: [open, paid, cancelled] }
        reference: { type: string }
        fake: { type: boolean }
        create_time: { type: string, format: date-time }
        pay_time: { type: string, format: date-time }
    AffiliateReferral:
      type: object
      properties:
        affiliate_id: { type: string, format: uuid }
        affiliate_code: { type: string }
        customer_external_id: { type: string }
        customer_email_masked: { type: string }
        source: { type: string, enum: [link, code, api] }
        attribute_time: { type: string, format: date-time }
    CreateCustomerRequest:
      type: object
      required: [external_id, name, email]
      properties:
        external_id: { type: string, maxLength: 128 }
        name: { type: string }
        email: { type: string, format: email }
        payment_method: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2 }
        billing_currency: { type: string, description: ISO 4217; default is the tenant's currency }
        address: { $ref: "#/components/schemas/Address" }
        referral_code: { type: string, description: "The code of the partner whose link or code brought this customer (phase 47). A code that cannot attribute does not fail the creation." }
        referral_touch_time: { type: string, format: date-time, description: When the visitor followed that link; default now }
    Address:
      type: object
      description: A postal address as printed on an invoice. Every part is optional.
      properties:
        line1: { type: string, maxLength: 120 }
        line2: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 120 }
        region: { type: string, maxLength: 120, description: "State, province or county" }
        postal_code: { type: string, maxLength: 20 }
        country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2 }
    GeoCountry:
      type: object
      required: [iso2, iso3, name, continent, geoname_id]
      properties:
        iso2: { type: string, description: ISO 3166-1 alpha-2 (XK for Kosovo) }
        iso3: { type: string }
        name: { type: string, description: English name }
        continent: { type: string, enum: [AF, AN, AS, EU, NA, OC, SA] }
        geoname_id: { type: integer }
    GeoRegion:
      type: object
      required: [id, code, name, ascii_name, geoname_id]
      properties:
        id: { type: string, description: "GeoNames admin1 code, e.g. TR.34" }
        code: { type: string, description: The part of the id after the country }
        name: { type: string }
        ascii_name: { type: string }
        geoname_id: { type: integer }
    GeoDistrict:
      type: object
      required: [id, name, ascii_name, kind]
      properties:
        id: { type: string, description: "The admin2 code (TR.34.7732501) or the GeoNames id of a town" }
        name: { type: string }
        ascii_name: { type: string }
        kind: { type: string, enum: [admin2, city] }
    GeoCountries:
      type: object
      required: [version, attribution, countries]
      properties:
        version: { type: string, description: The GeoNames export the list was made from }
        attribution: { type: string }
        countries: { type: array, items: { $ref: "#/components/schemas/GeoCountry" } }
    GeoRegions:
      type: object
      required: [version, attribution, country, regions]
      properties:
        version: { type: string }
        attribution: { type: string }
        country: { type: string }
        regions: { type: array, items: { $ref: "#/components/schemas/GeoRegion" } }
    GeoDistricts:
      type: object
      required: [version, attribution, region, districts]
      properties:
        version: { type: string }
        attribution: { type: string }
        region: { type: string }
        districts: { type: array, items: { $ref: "#/components/schemas/GeoDistrict" } }
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: string }
        email: { type: string }
        payment_method: { type: string }
        create_time: { type: string, format: date-time }
        country: { type: string, description: ISO 3166-1 alpha-2 }
        billing_currency: { type: string, description: ISO 4217 }
        address: { $ref: "#/components/schemas/Address" }
        tax_id: { type: string }
        tax_office: { type: string }
        e_invoice_registered: { type: boolean }
    CreateMeterRequest:
      type: object
      required: [code, aggregation, unit_label]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        aggregation: { type: string, enum: [AGGREGATION_SUM, AGGREGATION_COUNT, AGGREGATION_MAX] }
        value_property: { type: string, description: Required for SUM and MAX }
        filter: { type: object, additionalProperties: { type: object, properties: { values: { type: array, items: { type: string } } } } }
        quantity_scale: { type: integer, minimum: 0, maximum: 6, description: Decimal places, fixed per code }
        unit_label: { type: string }
    Meter:
      allOf:
        - $ref: "#/components/schemas/CreateMeterRequest"
        - type: object
          properties:
            version: { type: integer }
            create_time: { type: string, format: date-time }
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        latest_version: { type: integer }
        create_time: { type: string, format: date-time }
    Price:
      type: object
      required: [meter_code]
      properties:
        meter_code: { type: string }
        per_unit: { type: object, properties: { unit_price: { type: string, examples: ["0.002"] } } }
        tiered:
          type: object
          properties:
            tiers:
              type: array
              items:
                type: object
                properties:
                  up_to: { type: string, description: Empty on the last (unbounded) tier }
                  unit_price: { type: string }
                  flat_fee_minor: { type: string }
        package:
          type: object
          properties:
            package_size: { type: string }
            package_price_minor: { type: string }
    Entitlement:
      type: object
      required: [meter_code, limit]
      properties:
        meter_code: { type: string }
        limit: { type: string, description: Decimal in meter units; "0" = unlimited }
        alert_thresholds_pct: { type: array, items: { type: integer } }
    PlanVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        plan_code: { type: string }
        version: { type: integer }
        base_fee_minor: { type: string }
        prices: { type: array, items: { $ref: "#/components/schemas/Price" } }
        entitlements: { type: array, items: { $ref: "#/components/schemas/Entitlement" } }
        publish_time: { type: string, format: date-time }
        fees:
          type: array
          description: Fixed fees other than the tenant currency's monthly one, per currency and interval
          items: { $ref: "#/components/schemas/CurrencyFee" }
    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        customer_external_id: { type: string }
        plan_version_id: { type: string, format: uuid }
        start_time: { type: string, format: date-time }
        end_time: { type: [string, "null"], format: date-time }
        create_time: { type: string, format: date-time }
        state: { type: string, enum: [SUBSCRIPTION_STATE_TRIALING, SUBSCRIPTION_STATE_ACTIVE, SUBSCRIPTION_STATE_PAST_DUE, SUBSCRIPTION_STATE_PAUSED, SUBSCRIPTION_STATE_CANCELLED] }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        currency: { type: string }
        trial_end_time: { type: [string, "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
        pause_time: { type: [string, "null"], format: date-time }
        provider: { type: string }
        provider_ref: { type: string, description: The provider's id of the subscription, once it is linked }
        owner: { type: string, enum: [quotify, provider], description: Who renews it and retries failed renewals; a provider-owned subscription is changed at the provider }
        plan_code: { type: string }
        plan_version: { type: integer }
        fee_timing: { type: string, enum: [FEE_TIMING_ADVANCE, FEE_TIMING_ARREARS] }
        scheduled_change: { $ref: "#/components/schemas/ScheduledChange" }
        coupon_code: { type: string }
    CreditNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: CN-2026-000007 (live) or SBX-CN-2026-000007 (sandbox) }
        invoice_id: { type: string, format: uuid }
        invoice_number: { type: string }
        customer_id: { type: string, format: uuid }
        customer_external_id: { type: string }
        currency: { type: string }
        total_minor: { type: string }
        reason: { type: string }
        create_time: { type: string, format: date-time }
        disposition: { type: string, enum: [CREDIT_NOTE_DISPOSITION_CREDIT, CREDIT_NOTE_DISPOSITION_REFUND], description: "Where the amount went: the credit balance, or back to the card" }
        refund_state: { type: string, enum: [REFUND_STATE_REQUESTED, REFUND_STATE_REFUNDED, REFUND_STATE_FAILED], description: "Only for a refund to the card" }
        refund_error: { type: string }
    CustomerTax:
      type: object
      properties:
        tax_id: { type: string, maxLength: 40, description: "VKN/TCKN (Turkey) or VAT id (EU)" }
        tax_office: { type: string, maxLength: 120, description: "Vergi dairesi (Turkey)" }
        e_invoice_registered: { type: boolean, description: The customer is registered for e-fatura }
    LegalInfo:
      type: object
      description: The seller's company data printed on invoices and sent in e-documents.
      properties:
        legal_name: { type: string, maxLength: 160 }
        tax_id: { type: string, maxLength: 40 }
        tax_office: { type: string, maxLength: 120 }
        mersis_no: { type: string, maxLength: 40 }
        trade_registry_no: { type: string, maxLength: 40 }
    EInvoiceDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [invoice, credit_note] }
        invoice_id: { type: string, format: uuid }
        credit_note_id: { type: [string, "null"], format: uuid }
        number: { type: string, description: Payrudder's invoice or credit note number }
        status: { type: string, enum: [pending, issued, failed, cancelled] }
        document_type: { type: string, enum: ["", e-fatura, e-arsiv, peppol], description: Empty until known }
        provider: { type: string }
        environment: { type: string, enum: [sandbox, live] }
        legal_number: { type: string }
        external_id: { type: string }
        attempts: { type: integer }
        next_attempt_at: { type: [string, "null"], format: date-time }
        last_error_key: { type: string, examples: [einvoice.provider.rejected] }
        last_error: { type: string, description: English text }
        has_xml: { type: boolean }
        has_pdf: { type: boolean }
        created_at: { type: string, format: date-time }
        issued_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
    EInvoiceList:
      type: object
      properties:
        documents: { type: array, items: { $ref: "#/components/schemas/EInvoiceDocument" } }
        next_page_token: { type: string }
        total: { type: integer }
    EInvoiceFileLink:
      type: object
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
    EInvoiceAccount:
      type: object
      properties:
        environment: { type: string, enum: [sandbox, live] }
        provider: { type: string, enum: [mock, nilvera, webhook] }
        mode: { type: string, enum: [test, production] }
        has_credentials: { type: boolean }
        updated_at: { type: string, format: date-time }
    PutEInvoiceAccount:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [mock, nilvera, webhook] }
        mode: { type: string, enum: [test, production] }
        credentials: { type: object, additionalProperties: { type: string }, description: "nilvera: api_key[, base_url]; webhook: url, secret. Never returned." }
    TaxRates:
      type: object
      properties:
        rates:
          type: array
          items:
            type: object
            properties:
              country: { type: string, description: "ISO 3166-1 alpha-2; empty for every country without a rate of its own" }
              name: { type: string, description: "Shown on the invoice, e.g. VAT" }
              rate_bps: { type: integer, minimum: 0, maximum: 10000, description: "2000 is 20 %" }
    DunningSettings:
      type: object
      properties:
        retry_hours:
          type: array
          maxItems: 6
          items: { type: integer, minimum: 1, maximum: 720 }
        defaults_in_use: { type: boolean, readOnly: true, description: "True when nothing was set and the service-wide delays apply" }
        update_time: { type: string, format: date-time, readOnly: true }
    CreditPackInput:
      type: object
      required: [name, credits, price_minor, currency]
      properties:
        name: { type: string, maxLength: 80 }
        credits: { type: string, description: "int64, above zero (a number is accepted too)" }
        price_minor: { type: string, description: "int64 minor units of the currency, above zero" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        validity_days: { type: integer, minimum: 0, maximum: 3650, description: "The credits bought expire after this many days; 0 or absent: they never expire" }
    CreditPack:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        credits: { type: string, description: int64 as a string }
        price_minor: { type: string, description: int64 as a string }
        currency: { type: string }
        active: { type: boolean }
        create_time: { type: string, format: date-time }
        validity_days: { type: integer, description: "0: the credits bought never expire" }
    CreditSettings:
      type: object
      properties:
        low_threshold: { type: string, description: "int64 credits; 0 turns credits.low off" }
    CreditPackList:
      type: object
      properties:
        packs: { type: array, items: { $ref: "#/components/schemas/CreditPack" } }
    CreditLot:
      type: object
      properties:
        id: { type: string, format: uuid }
        granted: { type: string, description: int64 as a string }
        remaining: { type: string, description: int64 as a string }
        source: { type: string, enum: [purchase, promo, manual] }
        expire_time: { type: string, format: date-time, nullable: true, description: "Null: the credits never expire" }
        create_time: { type: string, format: date-time }
    CreditBalance:
      type: object
      properties:
        balance: { type: string, description: int64 as a string }
        next_expire_time: { type: string, format: date-time, nullable: true, description: "When some of the credits run out; null when none does" }
        lots: { type: array, items: { $ref: "#/components/schemas/CreditLot" } }
    CreditGrantInput:
      type: object
      required: [credits, source]
      properties:
        credits: { type: string, description: "int64, above zero (a number is accepted too)" }
        source: { type: string, enum: [promo, manual] }
        expire_time: { type: string, format: date-time, description: "Must lie in the future; leave out for credits that never expire" }
        reason: { type: string, maxLength: 200 }
        idempotency_key: { type: string, maxLength: 128 }
    CreditConsumeInput:
      type: object
      required: [credits]
      properties:
        credits: { type: string, description: "int64, above zero (a number is accepted too)" }
        reason: { type: string, maxLength: 200 }
        idempotency_key: { type: string, maxLength: 128, description: "Required, here or in the Idempotency-Key header" }
    CreditResult:
      type: object
      properties:
        balance: { type: string, description: "int64 as a string: what the customer can spend after the call" }
        replayed: { type: boolean, description: "True when the key had been used: nothing changed" }
    CreditLedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        lot_id: { type: string, format: uuid }
        kind: { type: string, enum: [grant, consume, expire] }
        amount: { type: string, description: "int64 as a string; negative for consume and expire" }
        reason: { type: string }
        idempotency_key: { type: string }
        source: { type: string, enum: [purchase, promo, manual], description: "Where the credits it touched came from; a purchase is a credit pack that was paid for" }
        create_time: { type: string, format: date-time }
    CreditLedgerPage:
      type: object
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/CreditLedgerEntry" } }
        next_page_token: { type: string }
    ExpenseCategory:
      type: string
      enum: [infrastructure, payment_fees, marketing, payroll, tax, software, other]
    ExpenseInput:
      type: object
      required: [vendor, category, amount_minor, currency, incurred_on]
      properties:
        vendor: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        amount_minor: { type: string, description: "int64 minor units, above zero (a number is accepted too)" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        incurred_on: { type: string, format: date, description: "The day, or the first day of a recurring expense (UTC)" }
        note: { type: string, maxLength: 500 }
        app_id: { type: string, format: uuid, description: "The app of the account the cost belongs to; leave out for the whole tenant" }
        recurring: { type: string, enum: [none, monthly, yearly], default: none }
        recurring_until: { type: string, format: date, description: "Last day an occurrence may fall on; leave out for no end. Only for a recurring expense." }
    Expense:
      type: object
      properties:
        id: { type: string, format: uuid }
        app_id: { type: string }
        vendor: { type: string }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        amount_minor: { type: string, description: int64 as a string }
        currency: { type: string }
        incurred_on: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, yearly] }
        recurring_until: { type: string }
        void_time: { type: string, format: date-time, nullable: true }
        void_reason: { type: string }
        create_time: { type: string, format: date-time }
        update_time: { type: string, format: date-time }
    ExpensePage:
      type: object
      properties:
        expenses: { type: array, items: { $ref: "#/components/schemas/Expense" } }
        next_page_token: { type: string }
    AccountingPoint:
      type: object
      properties:
        bucket: { type: string, format: date, description: "The day, or the first day of the month" }
        gross_income_minor: { type: string }
        tax_minor: { type: string }
        refunds_minor: { type: string }
        net_income_minor: { type: string }
        expenses_minor: { type: string }
        profit_minor: { type: string }
        discounts_minor: { type: string, description: "What coupons took off the invoices paid in this bucket" }
    AccountingCurrency:
      type: object
      description: One currency of the period. Every amount is int64 minor units as a string.
      properties:
        currency: { type: string }
        gross_income_minor: { type: string, description: "Invoices paid in the period, tax included" }
        tax_minor: { type: string, description: "The tax lines of those invoices" }
        refunds_minor: { type: string, description: "Credit notes against paid invoices plus invoices refunded in full" }
        net_income_minor: { type: string, description: "gross - tax - refunds" }
        expenses_minor: { type: string, description: "Every live occurrence in the period, provider fees included" }
        provider_fees_minor: { type: string, description: "The payment_fees expenses; meaningful only when provider_fees_recorded" }
        provider_fees_recorded: { type: boolean, description: "False: no commission was entered, which is not the same as zero" }
        profit_minor: { type: string, description: "net income - expenses; negative for a loss" }
        paid_invoices: { type: string }
        expense_by_category:
          type: array
          items: { type: object, properties: { category: { $ref: "#/components/schemas/ExpenseCategory" }, amount_minor: { type: string } } }
        series: { type: array, items: { $ref: "#/components/schemas/AccountingPoint" } }
        discounts_minor: { type: string, description: "What coupons took off the paid invoices (contra-revenue, a positive number). gross_income_minor is already after it" }
        sales_minor: { type: string, description: "Revenue before discounts: gross - tax + discounts" }
        coupons: { type: array, items: { $ref: "#/components/schemas/AccountingCoupon" }, description: "Gross, discounts and net per coupon, most discount first" }
    AccountingCoupon:
      type: object
      properties:
        coupon_code: { type: string }
        invoices: { type: string }
        gross_minor: { type: string, description: "What those invoices came to before the coupon: positive lines, tax excluded" }
        discount_minor: { type: string }
        net_minor: { type: string, description: "gross - discount" }
    AccountingSummary:
      type: object
      properties:
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        granularity: { type: string, enum: [day, month] }
        app_id: { type: string }
        currencies: { type: array, items: { $ref: "#/components/schemas/AccountingCurrency" }, description: "Ordered by currency code; a currency with no income and no expenses has no block" }
    WebhookEndpointInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2000, description: "https only, a public address, no credentials" }
        description: { type: string, maxLength: 200 }
        event_types:
          type: array
          description: "Empty means every type"
          items: { $ref: "#/components/schemas/WebhookEventType" }
        active: { type: boolean, description: "Only on update; a new endpoint is active" }
    WebhookEventType:
      type: string
      enum:
        - invoice.finalized
        - invoice.paid
        - invoice.voided
        - invoice.uncollectible
        - credit_note.created
        - credit_note.refunded
        - credit_note.refund_failed
        - subscription.created
        - subscription.changed
        - subscription.change_scheduled
        - subscription.cancelled
        - subscription.cancellation_scheduled
        - subscription.cancellation_withdrawn
        - subscription.paused
        - subscription.resumed
        - subscription.moved_to_provider
        - payment_link.created
        - payment_link.paid
        - payment_link.expired
        - credits.purchased
        - credits.low
    PaymentLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [invoice, adhoc, credit_pack] }
        status: { type: string, enum: [active, paid, expired, revoked], description: "paid: a single-use link that was paid" }
        pack_id: { type: string, description: "kind credit_pack: the pack sold" }
        quantity: { type: integer, description: "kind credit_pack: how many packs one use buys" }
        credits: { type: string, description: "kind credit_pack: the credits one paid use grants (the pack's credits times the quantity, frozen when the link was made); int64 as a string" }
        promotion_code: { type: string, description: "The code the seller chose for the link (adhoc and credit_pack): applied when the payer continues, unless the payer types another" }
        invoice_id: { type: string, description: "kind invoice: the invoice; empty for an ad-hoc link (its invoices are made on use)" }
        customer_external_id: { type: string }
        single_use: { type: boolean }
        amount_minor: { type: string, description: "kind adhoc: int64 minor units as a string" }
        currency: { type: string }
        description: { type: string }
        create_time: { type: string, format: date-time }
        expire_time: { type: string, format: date-time }
        revoke_time: { type: [string, "null"], format: date-time }
        paid_count: { type: integer, description: "Invoices paid through the link" }
        last_paid_time: { type: [string, "null"], format: date-time }
        use_count: { type: integer, description: "Invoices the link created (ad hoc)" }
        idempotency_key: { type: string }
    CreatePaymentLinkRequest:
      type: object
      properties:
        kind: { type: string, enum: [invoice, adhoc, credit_pack], description: "Default: invoice when invoice_id is set, credit_pack when pack_id is set, else adhoc" }
        invoice_id: { type: string, format: uuid }
        pack_id: { type: string, format: uuid, description: "credit_pack: the active credit pack to sell. Its price and currency become the link's amount; they are never taken from the request" }
        quantity: { type: integer, minimum: 1, maximum: 1000, description: "credit_pack: how many packs one payment buys (default 1)" }
        amount_minor: { type: string, description: "adhoc: a positive int64 in minor units (a string or a number)" }
        currency: { type: string, description: "adhoc: ISO 4217; the tenant's currency when empty" }
        description: { type: string, maxLength: 200, description: "adhoc: what it is for; printed on the invoice" }
        customer_external_id: { type: string, description: "adhoc: make the invoice out to this customer. credit_pack: required, the customer who receives the credits" }
        single_use: { type: boolean, description: "Default true for adhoc, false for invoice" }
        promotion_code: { type: string, description: "adhoc and credit_pack, optional: a promotion code the payer gets without typing it (a one-off invoice with a discount). Checked against the link's own amount now (a coupon.* error if it does not work); claimed when the payer continues. An invoice that exists is not changed, so a kind invoice link takes none" }
        expires_in_days: { type: integer, minimum: 1, maximum: 365, description: "Default 30 for adhoc, 90 for invoice" }
        idempotency_key: { type: string, maxLength: 200 }
    CreatedPaymentLink:
      allOf:
        - { $ref: "#/components/schemas/PaymentLink" }
        - type: object
          properties:
            token: { type: string, description: "The secret part of the link; shown once, empty on a replay" }
            url: { type: string, description: "Absolute when the gateway knows its public address (PAYRUDDER_PUBLIC_URL); empty on a replay" }
            replayed: { type: boolean }
    CustomerPayment:
      type: object
      properties:
        invoice_id: { type: string, format: uuid }
        invoice_number: { type: string }
        kind: { type: string, enum: [charge, refund] }
        status: { type: string, enum: [succeeded, declined, failed, pending] }
        amount_minor: { type: string }
        currency: { type: string }
        provider: { type: string }
        environment: { type: string, enum: [sandbox, live] }
        occurred_at: { type: string, format: date-time }
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        event_types: { type: array, items: { type: string } }
        active: { type: boolean }
        secret: { type: string, description: "whsec_…; only in the response of create and rotate-secret" }
        create_time: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid, description: "The id inside the delivered body and the Payrudder-Event-Id header" }
        event_type: { type: string }
        endpoint_id: { type: string, format: uuid }
        state: { type: string, enum: [WEBHOOK_DELIVERY_STATE_PENDING, WEBHOOK_DELIVERY_STATE_DELIVERED, WEBHOOK_DELIVERY_STATE_FAILED] }
        attempts: { type: integer }
        next_attempt_time: { type: string, format: date-time, description: "While pending" }
        last_status: { type: integer, description: "HTTP status of the last attempt; absent if none got an answer" }
        last_error: { type: string }
        create_time: { type: string, format: date-time }
        delivered_time: { type: string, format: date-time }
    WebhookEvent:
      type: object
      description: "The body of a delivery. data depends on the type: credits.purchased carries the customer, the credits granted, the new balance and the invoice; credits.low the customer, the balance and the threshold; invoice.* carries the invoice's id, number, customer, period, currency, total_minor and status; credit_note.* the note, its invoice and (for a refund) its refund_state; subscription.* the subscription as the API returns it, plus previous_subscription_id for a change."
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/WebhookEventType" }
        created: { type: string, format: date-time }
        tenant_id: { type: string, format: uuid }
        data: { type: object }
    Coupon:
      type: object
      properties:
        code: { type: string, description: "2–40 letters, digits, - or _" }
        name: { type: string }
        id: { type: string, format: uuid, readOnly: true }
        percent_bps: { type: integer, minimum: 1, maximum: 10000, description: "1000 is 10 %. Use one of percent_bps, amount_minor and bonus_percent_bps" }
        amount_minor: { type: string, description: "Minor units of currency; applies only in that currency" }
        currency: { type: string }
        bonus_percent_bps: { type: integer, minimum: 1, maximum: 100000, description: "Extra credits on a credit purchase, in the same lot: 1000 is 10 % more. Credit purchases only" }
        applies_to: { type: array, items: { type: string, enum: [COUPON_TARGET_SUBSCRIPTION, COUPON_TARGET_CREDIT_PURCHASE, COUPON_TARGET_PAYMENT] }, description: "Where the coupon works; empty means all three (a bonus coupon: credit purchases)" }
        duration: { type: string, enum: [COUPON_DURATION_ONCE, COUPON_DURATION_REPEATING, COUPON_DURATION_FOREVER], description: "How long a subscription keeps the coupon; required when it applies to subscriptions" }
        duration_periods: { type: integer, description: "For a repeating coupon, how many fees" }
        max_redemptions: { type: integer, description: "0 or absent = unlimited. Counts the uses through all the coupon's codes" }
        redeemed: { type: integer, readOnly: true, description: "The uses that count against the limit" }
        expire_time: { type: string, format: date-time }
        active: { type: boolean, readOnly: true }
        create_time: { type: string, format: date-time, readOnly: true }
        promotion_code_count: { type: integer, readOnly: true }
        without_default_code: { type: boolean, writeOnly: true, description: "Do not make the promotion code with the coupon's own text that a new coupon gets" }
    PromotionCode:
      type: object
      description: What a customer types. Many codes point to one coupon, each with its own limit, expiry and restrictions.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        coupon_id: { type: string, format: uuid, readOnly: true }
        coupon_code: { type: string, readOnly: true }
        code: { type: string, readOnly: true }
        active: { type: boolean, readOnly: true }
        max_redemptions: { type: integer, description: "0 or absent = unlimited" }
        redeemed: { type: integer, readOnly: true }
        expire_time: { type: string, format: date-time }
        first_purchase_only: { type: boolean, description: Only a customer who has paid for nothing yet }
        one_per_customer: { type: boolean }
        min_amount_minor: { type: string, description: "A purchase under this amount cannot use the code; needs min_amount_currency" }
        min_amount_currency: { type: string }
        allowed_plans: { type: array, items: { type: string }, description: "Plan codes; empty means any" }
        allowed_packs: { type: array, items: { type: string }, description: "Credit pack ids; empty means any" }
        allowed_currencies: { type: array, items: { type: string }, description: "Empty means any" }
        restore_on_reversal: { type: boolean, description: "A void or full refund gives the use back to the count. Off by default" }
        create_time: { type: string, format: date-time, readOnly: true }
    CreatePromotionCodes:
      type: object
      properties:
        template: { $ref: "#/components/schemas/PromotionCode" }
        codes: { type: array, items: { type: string }, description: "Name the codes, or ask for count" }
        count: { type: integer, minimum: 1, maximum: 1000 }
        prefix: { type: string, description: "For random codes; at most 20 characters" }
    CouponRedemption:
      type: object
      properties:
        id: { type: string, format: uuid }
        coupon_code: { type: string }
        promotion_code: { type: string, description: Empty when an operator applied the coupon or it came from a grant }
        customer_external_id: { type: string }
        target: { type: string, enum: [COUPON_TARGET_SUBSCRIPTION, COUPON_TARGET_CREDIT_PURCHASE, COUPON_TARGET_PAYMENT] }
        target_id: { type: string, format: uuid, description: "The subscription, or the invoice" }
        invoice_id: { type: string, format: uuid }
        discount_minor: { type: string, description: "What it took off; a subscription's grows with each fee" }
        bonus_credits: { type: string }
        currency: { type: string }
        create_time: { type: string, format: date-time }
        reverse_time: { type: string, format: date-time, description: Set when a void or a full refund reversed it }
    PromotionQuoteRequest:
      type: object
      required: [code, target, amount_minor, currency]
      properties:
        code: { type: string }
        customer_external_id: { type: string, description: "Needed by codes that are first-purchase-only or one per customer" }
        target: { type: string, enum: [COUPON_TARGET_CREDIT_PURCHASE, COUPON_TARGET_PAYMENT] }
        amount_minor: { type: string, description: The price before the discount }
        currency: { type: string }
        item: { type: string, description: "The credit pack id, for codes restricted to some packs" }
        credits: { type: string, description: "The credits sold, for a bonus coupon" }
        prior_purchases: { type: boolean, description: The customer has paid for something before }
    PromotionQuote:
      type: object
      properties:
        applied: { type: boolean }
        coupon_code: { type: string }
        coupon_name: { type: string }
        promotion_code: { type: string }
        discount_minor: { type: string }
        bonus_credits: { type: string }
        total_minor: { type: string, description: The price after the discount, never below zero }
        currency: { type: string }
    ChangeRequest:
      type: object
      properties:
        plan_code: { type: string, description: Empty keeps the plan (to change the interval only) }
        plan_version: { type: integer, description: 0 = latest }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR], description: Default keeps the interval }
        timing: { type: string, enum: [CHANGE_TIMING_IMMEDIATELY, CHANGE_TIMING_PERIOD_END], description: Default depends on the direction of the change }
        proration: { type: string, enum: [CHANGE_PRORATION_PRORATE, CHANGE_PRORATION_FULL, CHANGE_PRORATION_NONE], description: "Default prorate. Prorate keeps the cycle within an interval; full starts a new cycle now; none moves no money now" }
        change_time: { type: string, format: date-time, description: Default now; not in the future }
    ChangeQuote:
      type: object
      properties:
        timing: { type: string, enum: [CHANGE_TIMING_IMMEDIATELY, CHANGE_TIMING_PERIOD_END] }
        proration: { type: string, enum: [CHANGE_PRORATION_PRORATE, CHANGE_PRORATION_FULL, CHANGE_PRORATION_NONE] }
        effective_time: { type: string, format: date-time }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        credit_minor: { type: string, description: The unused, prepaid part of the old fee }
        charge_minor: { type: string, description: What the new plan costs from the change }
        net_minor: { type: string, description: "charge - credit: positive is invoiced, negative becomes a credit balance" }
        currency: { type: string }
        next_renewal_time: { type: string, format: date-time }
        next_renewal_minor: { type: string }
        plan_code: { type: string }
        plan_version: { type: integer }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
    ScheduledChange:
      type: object
      properties:
        plan_code: { type: string }
        plan_version: { type: integer }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        effective_time: { type: string, format: date-time }
    CurrencyFee:
      type: object
      properties:
        currency: { type: string }
        base_fee_minor: { type: string }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR], description: Default month }
    MailSettings:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              category: { type: string, enum: [invoice_issued, payment_receipts, payment_failed, usage_alerts, system] }
              enabled: { type: boolean }
    RoutingRules:
      type: object
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2; empty matches any country }
              currency: { type: string, description: ISO 4217; empty matches any currency }
              provider: { type: string, enum: [iyzico, paddle, banktransfer] }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        address: { $ref: "#/components/schemas/Address" }
        legal: { $ref: "#/components/schemas/LegalInfo" }
        e_invoice_on: { type: string, enum: [off, finalized, paid], description: When an invoice becomes an e-document }
        environment: { type: string, enum: [ENVIRONMENT_SANDBOX, ENVIRONMENT_LIVE] }
        name: { type: string }
        tier: { type: string }
        currency: { type: string }
        timezone: { type: string }
        grace_period: { type: string }
        create_time: { type: string, format: date-time }
        status: { type: string, enum: [TENANT_STATUS_INACTIVE, TENANT_STATUS_ACTIVE, TENANT_STATUS_SUSPENDED], description: "A sandbox tenant is always active. A live tenant starts inactive: no keys, no webhook endpoints, no invoices, until the go-live checklist is complete." }
        activate_time: { type: string, format: date-time }
        terms_accept_time: { type: string, format: date-time }
    SandboxReset:
      type: object
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, done, failed] }
        kind: { type: string, enum: [manual, retention] }
        error: { type: string }
        create_time: { type: string, format: date-time }
        finish_time: { type: string, format: date-time }
        steps:
          type: array
          items:
            type: object
            properties:
              name: { type: string, enum: [plans, ingest, aggregator, analytics, billing, payments] }
              state: { type: string, enum: [pending, done, failed, skipped] }
              deleted: { type: object, additionalProperties: { type: integer }, description: Rows deleted, by table. }
              error: { type: string }
    GoLive:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        status: { type: string, enum: [TENANT_STATUS_INACTIVE, TENANT_STATUS_ACTIVE, TENANT_STATUS_SUSPENDED] }
        ready: { type: boolean, description: Every item is done. }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [email_verified, legal_profile, payment_provider, plan_published, terms_accepted] }
              done: { type: boolean }
    LiveProviders:
      type: object
      properties:
        ready: { type: boolean, description: At least one account works. }
        providers: { type: array, items: { type: string }, description: The providers whose accounts work. }
        accounts:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              default: { type: boolean, description: Live charges go to the default account unless a routing rule says otherwise. }
              working: { type: boolean }
              checked: { type: boolean, description: The provider itself was asked. }
              problem: { type: string, enum: [unreadable, refused, unreachable] }
              updated_at: { type: string, format: date-time }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenants: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
        apps: { type: array, items: { $ref: "#/components/schemas/App" } }
        create_time: { type: string, format: date-time }
    App:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        tenants: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
        create_time: { type: string, format: date-time }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        prefix: { type: string }
        environment: { type: string, enum: [ENVIRONMENT_SANDBOX, ENVIRONMENT_LIVE] }
        status: { type: string, enum: [STATUS_ACTIVE, STATUS_REVOKED] }
        create_time: { type: string, format: date-time }
        revoke_time: { type: string, format: date-time }
        scope: { type: string, enum: [SCOPE_FULL, SCOPE_INGEST, SCOPE_READ], description: "FULL: everything. INGEST: only POST /v1/events. READ: only GET requests. Others are 403 gateway.auth.scope_denied." }
        last_used_time: { type: string, format: date-time, description: Kept to within a few minutes. }
        expire_time: { type: string, format: date-time, description: The key stops working at this time although it is not revoked (the old key of a rotation). }
