  /admin/v1/tenants/{tenant_id}/replays:
    post:
      operationId: adminStartReplay
      summary: Rebuild a tenant's aggregates from the event log into a new generation
      description: |
        Creates generation N+1 next to the tenant's live one and rebuilds it from Kafka for the given periods, with the same code
        path as live aggregation. When it has caught up the live consumer writes the tenant into both generations; the job then
        verifies the difference and waits to be promoted. One open replay per tenant (409 otherwise). Live traffic is never paused.
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStartReplayRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}:
    get:
      operationId: adminGetReplay
      summary: A replay job (status, offsets, and once ready the difference to the live generation)
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}/promote:
    post:
      operationId: adminPromoteReplay
      summary: Make the rebuilt generation the tenant's active one (one transaction, no pause). Idempotent
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}/discard:
    post:
      operationId: adminDiscardReplay
      summary: Abandon a generation that was not promoted and delete its rows. Idempotent
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/billing-runs/{period}/rerating:
    post:
      operationId: adminStartRerating
      summary: Price a closed period again under another plan version and bill the difference
      description: |
        Requires the period's billing run to be COMPLETED. Customers of the plan the version belongs to who were invoiced for the
        period are priced again on the same usage: a higher price becomes one CORRECTION invoice per customer (through the
        normal invoice saga), a lower one a credit balance applied as a CREDIT line to the customer's next regular invoice.
        Idempotent per tenant, period and plan version: a repeat returns the existing job (200).
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStartReratingRequest" }
      responses:
        "200": { description: The job already existed, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/rerating-jobs/{job_id}:
    get:
      operationId: adminGetRerating
      summary: A re-rating job
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/retry:
    post:
      operationId: adminRetryInvoice
      summary: Resume an invoice saga stuck in a *_FAILED state or PAYMENT_UNKNOWN
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRetryInvoiceRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSaga" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/void:
    post:
      operationId: adminVoidInvoice
      summary: Void an invoice, refunding it first when it was paid
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVoidInvoiceRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSaga" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/payments:
    post:
      operationId: adminRecordInvoicePayment
      summary: Record money received outside a payment provider (a bank transfer, cash, other) against an invoice
      description: >
        For an invoice that was not charged through Payrudder, or whose charge is stuck. Partial payments are recorded; the invoice is paid when they add up to the total.
        More than is outstanding is refused (`billing.payment.overpayment`). Allowed while the invoice is open or uncollectible and its saga is waiting for or has
        failed a payment. Idempotent per (invoice, method, reference) when a reference is given: the same call again answers 200 with `duplicate: true`.
        Who and when are recorded (X-Payrudder-Actor, `operator` when absent). An invoice charged by bank transfer is confirmed through its transfer endpoint instead.
      security: [{ operatorToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Payrudder-Actor, in: header, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRecordInvoicePaymentRequest" }
      responses:
        "200": { description: The same payment was recorded before, content: { application/json: { schema: { $ref: "#/components/schemas/RecordInvoicePaymentResult" } } } }
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/RecordInvoicePaymentResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/credit-notes:
    post:
      operationId: adminCreateCreditNote
      summary: Correct a paid invoice with a numbered credit note, added to the customer's credit balance or refunded to the card
      description: >
        An issued invoice is never edited. The note's amount goes to the customer's credit balance in the invoice's currency and pays their next invoice, or, with refund_to_card, back to the card
        through the payment provider that took the payment (the note's refund_state says whether it went through; a refund nobody answers is sent again, and a failed one can be retried).
        The notes of an invoice never add up to more than the invoice. Only a paid invoice can be credited (an open one is voided).
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateCreditNoteRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreditNote" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/credit-notes/{id}/retry-refund:
    post:
      operationId: adminRetryCreditNoteRefund
      summary: Ask the payment provider again for a credit note refund that failed
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRetryCreditNoteRefundRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditNote" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key (takes effect on the next request)
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
        "404": { $ref: "#/components/responses/Error" }
webhooks:
  event:
    post:
      summary: A delivery to one of your webhook endpoints
      description: "Payrudder POSTs this body to every active endpoint that wants the event type. Answer with any 2xx within 10 seconds; anything else is retried (1m, 5m, 30m, 2h, 6h, 24h). Verify the Payrudder-Signature header before you trust it."
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEvent" } } }
      responses:
        "200": { description: Received }

components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "qk_{test|live}_<prefix>_<secret>" }
    operatorToken: { type: http, scheme: bearer, description: "Operator access: the machine token (PAYRUDDER_OPERATOR_TOKEN, for the API, payrudderctl and tests) or the session token (qs_...) of a platform operator, a person with a verified address listed in PAYRUDDER_OPERATOR_EMAILS. A session of anybody else is refused with 403 identity.operator.forbidden." }
    sessionToken: { type: http, scheme: bearer, description: "A person's session token (qs_..., from /auth/signin). It also works on /v1 routes together with X-Payrudder-Tenant, for a tenant of one of the person's accounts (a viewer may only read)." }
  parameters:
    ExternalID: { name: external_id, in: path, required: true, schema: { type: string } }
    PlanCode: { name: code, in: path, required: true, schema: { type: string } }
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, description: "Makes a retry safe: a repeat with the same key and the same payload does not do the work twice (credits answer the current balance with replayed: true, a payment link answers the first link without its token, an upload session answers the first session); the same key with another payload is a 409. The body field idempotency_key, where the operation has one, wins over the header.", schema: { type: string, minLength: 1, maxLength: 200 } }
  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Asset:
      type: object
      required: [id, session_id, purpose, filename, content_type, size_bytes, sha256, status, reject_reason, create_time, complete_time]
      properties:
        id: { type: string }
        session_id: { type: string }
        purpose: { type: string, enum: [PURPOSE_INVOICE_LOGO, PURPOSE_INVOICE_ATTACHMENT, PURPOSE_GENERAL] }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: string, format: int64 }
        sha256: { type: string }
        status: { type: string, enum: [ASSET_STATUS_PENDING, ASSET_STATUS_UPLOADING, ASSET_STATUS_SCANNING, ASSET_STATUS_READY, ASSET_STATUS_REJECTED, ASSET_STATUS_ABORTED, ASSET_STATUS_CORRUPT, ASSET_STATUS_DELETED] }
        reject_reason: { type: string, examples: ["PART_MISMATCH"] }
        create_time: { type: string, format: date-time, nullable: true }
        complete_time: { type: string, format: date-time, nullable: true }
    PresignedPart:
      type: object
      required: [part_number, url]
      properties:
        part_number: { type: integer }
        url: { type: string, format: uri }
    UploadFile:
      type: object
      required: [asset_id, filename, status, reject_reason, size, part_size, part_count, presigned_parts, uploaded_parts]
      properties:
        asset_id: { type: string }
        filename: { type: string }
        status: { type: string }
        reject_reason: { type: string }
        size: { type: string, format: int64 }
        part_size: { type: string, format: int64 }
        part_count: { type: integer }
        presigned_parts: { type: array, items: { $ref: "#/components/schemas/PresignedPart" } }
        uploaded_parts:
          type: array
          items:
            type: object
            required: [part_number, size, etag]
            properties:
              part_number: { type: integer }
              size: { type: string, format: int64 }
              etag: { type: string }
    UploadSession:
      type: object
      required: [id, status, expire_time, files]
      properties:
        id: { type: string }
        status: { type: string, enum: [OPEN, COMPLETED, EXPIRED, ABORTED] }
        expire_time: { type: string, format: date-time, nullable: true }
        files: { type: array, items: { $ref: "#/components/schemas/UploadFile" } }
    BillingRun:
      type: object
      required: [tenant_id, period_id, status, cutoff_time, invoice_count, last_error, generation, start_time, complete_time]
      properties:
        tenant_id: { type: string }
        period_id: { type: string }
        status: { type: string, enum: [RUN_STATUS_SCHEDULED, RUN_STATUS_WAITING_WATERMARK, RUN_STATUS_RATING, RUN_STATUS_INVOICING, RUN_STATUS_COMPLETED, RUN_STATUS_FAILED] }
        cutoff_time: { type: string, format: date-time, nullable: true }
        invoice_count: { type: integer }
        last_error: { type: string }
        generation: { type: integer }
        start_time: { type: string, format: date-time, nullable: true }
        complete_time: { type: string, format: date-time, nullable: true }
    SagaEvent:
      type: object
      required: [seq, from_state, to_state, cause, command_id, at]
      properties:
        seq: { type: integer }
        from_state: { type: string }
        to_state: { type: string }
        cause: { type: string }
        command_id: { type: string }
        at: { type: string, format: date-time, nullable: true }
    ReplayJob:
      type: object
      required: [id, tenant_id, from_period_id, to_period_id, source_generation, target_generation, status, reason, start_offsets, end_offsets, dual_write_from, verification, last_error, create_time, complete_time]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        from_period_id: { type: string }
        to_period_id: { type: string }
        source_generation: { type: integer }
        target_generation: { type: integer }
        status: { type: string, enum: [REPLAY_STATUS_RUNNING, REPLAY_STATUS_CATCHING_UP, REPLAY_STATUS_READY, REPLAY_STATUS_PROMOTED, REPLAY_STATUS_DISCARDED, REPLAY_STATUS_FAILED] }
        reason: { type: string }
        start_offsets: { type: object, additionalProperties: { type: string, format: int64 } }
        end_offsets: { type: object, additionalProperties: { type: string, format: int64 } }
        dual_write_from: { type: object, additionalProperties: { type: string, format: int64 } }
        verification:
          type: object
          required: [rows_compared, rows_changed, rows_only_in_old, rows_only_in_new, diffs]
          properties:
            rows_compared: { type: string, format: int64 }
            rows_changed: { type: string, format: int64 }
            rows_only_in_old: { type: string, format: int64 }
            rows_only_in_new: { type: string, format: int64 }
            diffs:
              type: array
              items:
                type: object
                required: [kind, customer_id, meter_code, period_id, origin_period_id, old_quantity, new_quantity, old_event_count, new_event_count]
                properties:
                  kind: { type: string, enum: [usage, late] }
                  customer_id: { type: string }
                  meter_code: { type: string }
                  period_id: { type: string }
                  origin_period_id: { type: string }
                  old_quantity: { type: string }
                  new_quantity: { type: string }
                  old_event_count: { type: string, format: int64 }
                  new_event_count: { type: string, format: int64 }
        last_error: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        complete_time: { type: string, format: date-time, nullable: true }
    ReratingJob:
      type: object
      required: [id, tenant_id, period_id, plan_version_id, generation, status, customers_rated, corrections, credits, correction_total_minor, credit_total_minor, last_error, create_time, complete_time]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        period_id: { type: string }
        plan_version_id: { type: string }
        generation: { type: integer, description: The aggregate generation whose usage was priced }
        status: { type: string, enum: [RERATING_STATUS_RUNNING, RERATING_STATUS_COMPLETED, RERATING_STATUS_FAILED] }
        customers_rated: { type: integer }
        corrections: { type: integer }
        credits: { type: integer }
        correction_total_minor: { type: string, format: int64 }
        credit_total_minor: { type: string, format: int64 }
        last_error: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        complete_time: { type: string, format: date-time, nullable: true }
    InvoiceSaga:
      type: object
      required: [id, invoice_id, state, attempt, dunning_attempt, last_error, version]
      properties:
        id: { type: string }
        invoice_id: { type: string }
        state: { type: string }
        attempt: { type: integer }
        dunning_attempt: { type: integer }
        last_error: { type: string }
        version: { type: integer }
    InvoiceLine:
      type: object
      required: [line_no, kind, meter_code, origin_period_id, quantity, amount_minor, description, service_from, service_to]
      properties:
        line_no: { type: integer }
        kind: { type: string, enum: [BASE_FEE, USAGE, LATE_USAGE, CREDIT, CORRECTION, DISCOUNT, TAX] }
        meter_code: { type: string }
        origin_period_id: { type: string }
        quantity: { type: string, examples: ["1.250"] }
        amount_minor: { type: string, format: int64 }
        description: { type: string }
        service_from: { type: string, format: date-time, description: The service period the line covers, nullable: true }
        service_to: { type: string, format: date-time, nullable: true }
    Invoice:
      type: object
      required: [id, customer_id, customer_external_id, period_id, kind, number, currency, subtotal_minor, total_minor, status, saga_state, create_time, finalize_time, lines, payments, plan_version_id, pdf_object_key]
      properties:
        id: { type: string }
        customer_id: { type: string }
        customer_external_id: { type: string }
        period_id: { type: string }
        kind: { type: string, enum: [REGULAR, CORRECTION, FEE, LINK], description: "FEE: a fixed fee invoiced in advance for one period, or what a plan change moved. LINK: made from an ad-hoc payment link" }
        number: { type: string, examples: ["INV-2026-000123"] }
        currency: { type: string }
        subtotal_minor: { type: string, format: int64 }
        total_minor: { type: string, format: int64 }
        status: { type: string, enum: [draft, open, paid, uncollectible, void] }
        saga_state: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        finalize_time: { type: string, format: date-time, nullable: true }
        lines: { type: array, items: { $ref: "#/components/schemas/InvoiceLine" } }
        payments:
          type: array
          description: Payments recorded by hand (POST /admin/v1/invoices/{id}/payments), oldest first. Only the single-invoice reads fill it.
          items: { $ref: "#/components/schemas/InvoicePayment" }
        plan_version_id: { type: string }
        pdf_object_key: { type: string }
    InvoicePayment:
      type: object
      required: [id, invoice_id, method, amount_minor, currency, received_at, reference, note, recorded_by, recorded_at]
      properties:
        id: { type: string }
        invoice_id: { type: string }
        method: { type: string, enum: [bank_transfer, cash, other] }
        amount_minor: { type: string, format: int64 }
        currency: { type: string }
        received_at: { type: string, format: date-time, nullable: true }
        reference: { type: string }
        note: { type: string }
        recorded_by: { type: string }
        recorded_at: { type: string, format: date-time, nullable: true }
    RecordInvoicePaymentResult:
      type: object
      required: [payment, duplicate, paid_minor, outstanding_minor, settled]
      properties:
        payment: { allOf: [{ $ref: "#/components/schemas/InvoicePayment" }], nullable: true }
        duplicate: { type: boolean }
        paid_minor: { type: string, description: The sum of the payments recorded by hand, format: int64 }
        outstanding_minor: { type: string, format: int64 }
        settled: { type: boolean, description: The invoice is paid }
    BankTransferInstructions:
      type: object
      required: [bank_name, account_holder, iban, reference]
      properties:
        bank_name: { type: string }
        account_holder: { type: string }
        iban: { type: string, description: "Normalised: capitals, no spaces" }
        bic: { type: string }
        reference: { type: string, description: What the customer writes on the transfer }
    TransferReceipt:
      type: object
      required: [id, amount_minor, currency, received_at, bank_reference, recorded_by, recorded_at]
      properties:
        id: { type: integer, description: The ledger row, format: int64 }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        received_at: { type: string, format: date-time }
        bank_reference: { type: string }
        note: { type: string }
        recorded_by: { type: string }
        recorded_at: { type: string, format: date-time }
    InvoiceTransfer:
      type: object
      required: [invoice_id, state, received_minor, receipts]
      properties:
        invoice_id: { type: string, format: uuid }
        state:
          type: string
          enum: [none, pending, paid, expired, rejected]
          description: "none: not charged by bank transfer. pending: waiting for the money (partial receipts included). paid: the receipts reach the total. expired and rejected: given up, dunning applies."
        reference: { type: string }
        instructions: { $ref: "#/components/schemas/BankTransferInstructions" }
        currency: { type: string }
        total_minor: { type: integer, format: int64 }
        received_minor: { type: integer, format: int64 }
        outstanding_minor: { type: integer, format: int64 }
        pending_since: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: When the payment window ends }
        closed_reason: { type: string }
        receipts: { type: array, items: { $ref: "#/components/schemas/TransferReceipt" } }
    TransferReceiptResult:
      type: object
      required: [receipt, duplicate, paid, saga_notified, transfer]
      properties:
        receipt: { $ref: "#/components/schemas/TransferReceipt" }
        duplicate: { type: boolean }
        paid: { type: boolean, description: The receipts reach the total }
        saga_notified: { type: boolean, description: "False when billing-svc could not be told now; the saga notices at its next poll." }
        transfer: { $ref: "#/components/schemas/InvoiceTransfer" }
    EntitlementStatus:
      type: object
      required: [customer_external_id, meter_code, period_id, used, limit, unlimited, allowed, as_of, window, window_id, resets_at, mode, over_limit, overridden]
      properties:
        customer_external_id: { type: string }
        meter_code: { type: string }
        period_id: { type: string, examples: ["2026-11"] }
        used: { type: string, description: Exact decimal with the meter's scale, examples: ["10.500"] }
        limit: { type: [string, "null"], description: Exact decimal; null when unlimited, examples: ["10.500"] }
        unlimited: { type: boolean }
        allowed: { type: boolean, description: "unlimited, used < limit, or a soft or notify limit" }
        as_of: { type: [string, "null"], format: date-time }
        window: { type: string, enum: [hour, day, week, month, year, lifetime], description: What the limit counts over; month for a meter without a limit }
        window_id: { type: string, description: "The window used counts in: period_id for a month, 2026-11-05T13, 2026-11-05, 2026-W45, 2026 for a year or all for the lifetime", examples: ["2026-11-05"] }
        resets_at: { type: [string, "null"], format: date-time, description: When the window ends and used starts again from zero; null for the lifetime window }
        mode: { type: string, enum: [hard, soft, notify] }
        over_limit: { type: boolean, description: "not unlimited and used >= limit, whatever the mode" }
        overridden: { type: boolean, description: "The limit is the customer's own override, not its package's" }
    IngestEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/IncomingEvent" }
    IncomingEvent:
      type: object
      required: [customer_external_id, meter_code, quantity, event_time]
      properties:
        idempotency_key: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$", description: Required for live keys. Optional in sandbox (then no dedup). }
        customer_external_id: { type: string }
        meter_code: { type: string }
        quantity:
          description: Non-negative decimal with at most the meter's quantity_scale decimal places. A string or a JSON number.
          oneOf: [{ type: string, examples: ["1500", "1.250"] }, { type: number }]
        event_time: { type: string, format: date-time, description: "Not older than 35 days, not more than 5 minutes ahead." }
        properties: { type: object, additionalProperties: { type: string }, description: At most 32 entries and 4 KiB in total. }
    IngestEventsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One per request event, same order.
          items: { $ref: "#/components/schemas/EventResult" }
    EventResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, duplicate, rejected] }
        event_id: { type: string, description: Set for accepted and duplicate (the original id). }
        error_code:
          type: string
          enum: [UNKNOWN_METER, UNKNOWN_CUSTOMER, EVENT_TOO_OLD, EVENT_IN_FUTURE, INVALID_EVENT_TIME, INVALID_QUANTITY, INVALID_QUANTITY_PRECISION, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REUSED, INVALID_PROPERTIES]
        error_message: { type: string }
    AuthUser:
      type: object
      required: [id, email, display_name, create_time, email_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        email_verified: { type: boolean, description: "True once the person opened a mailed link for this address. Until then live API keys cannot be created." }
    Payment:
      type: object
      required: [id, invoice_id, provider, kind, status, amount_minor, currency, occurred_at]
      properties:
        id: { type: string, description: The ledger row that carries the outcome }
        invoice_id: { type: string }
        provider: { type: string }
        kind: { type: string, enum: [charge, refund] }
        status: { type: string, enum: [paid, processing, failed, refunded] }
        amount_minor: { type: string, format: int64 }
        currency: { type: string }
        occurred_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, email, role, invited_by_email, invited_by_name, create_time, send_time, expire_time]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, viewer] }
        invited_by_email: { type: string }
        invited_by_name: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        send_time: { type: string, format: date-time, description: When the mail last went out, nullable: true }
        expire_time: { type: string, format: date-time, nullable: true }
    InvitationLookup:
      type: object
      required: [account_name, email, role, has_account, invited_by_name]
      properties:
        account_name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, viewer] }
        has_account: { type: boolean }
        invited_by_name: { type: string }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    Membership:
      type: object
      required: [account_id, account_name, role]
      properties:
        account_id: { type: string, format: uuid }
        account_name: { type: string }
        role: { type: string, enum: [owner, admin, viewer] }
    OnboardingWizard:
      type: object
      description: The first-run wizard's progress. As a request body every field is optional and only those present are written.
      required: [status, step, currency, timezone, app, meter, plan, customer, event, hidden]
      properties:
        status: { type: string, enum: [active, skipped, done], nullable: true }
        step: { type: string, enum: [welcome, organisation, app, meter, package, event, done], nullable: true }
        currency: { type: string, description: "Chosen in the organisation step", example: TRY, nullable: true }
        timezone: { type: string, example: Europe/Istanbul, nullable: true }
        app: { type: string, description: "Id of the app the wizard made", nullable: true }
        meter: { type: string, description: "Code of the meter it made", nullable: true }
        plan: { type: string, description: "Code of the package it made", nullable: true }
        customer: { type: boolean, description: "The test customer exists", nullable: true }
        event: { type: boolean, description: "The test event was sent", nullable: true }
        hidden: { type: boolean, description: "The person closed the Getting started card", nullable: true }
    OnboardingWizardInput:
      type: object
      description: The first-run wizard's progress. As a request body every field is optional and only those present are written.
      properties:
        status: { type: string, enum: [active, skipped, done] }
        step: { type: string, enum: [welcome, organisation, app, meter, package, event, done] }
        currency: { type: string, description: "Chosen in the organisation step", example: TRY }
        timezone: { type: string, example: Europe/Istanbul }
        app: { type: string, description: "Id of the app the wizard made" }
        meter: { type: string, description: "Code of the meter it made" }
        plan: { type: string, description: "Code of the package it made" }
        customer: { type: boolean, description: "The test customer exists" }
        event: { type: boolean, description: "The test event was sent" }
        hidden: { type: boolean, description: "The person closed the Getting started card" }
    Onboarding:
      type: object
      required: [wizard, seen_tours]
      properties:
        wizard: { allOf: [{ $ref: "#/components/schemas/OnboardingWizard" }], nullable: true }
        seen_tours: { type: array, items: { type: string } }
    SessionOpened:
      type: object
      required: [user, memberships, token, expire_time]
      properties:
        user: { allOf: [{ $ref: "#/components/schemas/AuthUser" }], nullable: true }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
        token: { type: string, description: "qs_..., shown once; send as Authorization: Bearer" }
        expire_time: { type: string, format: date-time, description: "14 days from now; slides on use, never beyond 90 days from sign-in", nullable: true }
        operator: { type: boolean, description: "The server's verdict: the person is a platform operator (verified address listed in PAYRUDDER_OPERATOR_EMAILS). The page uses it only to show the operator console; every operator route decides again." }
    SessionInfo:
      type: object
      required: [user, memberships, expire_time, operator]
      properties:
        user: { allOf: [{ $ref: "#/components/schemas/AuthUser" }], nullable: true }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
        expire_time: { type: string, format: date-time, nullable: true }
        operator: { type: boolean, description: "The server's verdict: the person is a platform operator (verified address listed in PAYRUDDER_OPERATOR_EMAILS). The page uses it only to show the operator console; every operator route decides again." }
    PlanLimit:
      type: object
      required: [resource, limit, mode]
      properties:
        resource: { type: string, enum: [events, apps, members, api_keys] }
        limit: { type: integer, format: int64, description: 0 is unlimited }
        mode: { type: string, enum: [hard, soft, notify] }
    PlanOffer:
      type: object
      required: [code, name, version, base_fee_minor, currency, interval, trial_days, limits, current]
      properties:
        code: { type: string }
        name: { type: string }
        version: { type: integer }
        base_fee_minor: { type: integer, format: int64 }
        currency: { type: string }
        interval: { type: string, enum: [month] }
        trial_days: { type: integer }
        limits: { type: array, items: { $ref: "#/components/schemas/PlanLimit" } }
        current: { type: boolean }
    PlanQuota:
      type: object
      required: [resource, used, limit, unlimited, mode, over_limit, overridden]
      properties:
        resource: { type: string, enum: [events, apps, members, api_keys] }
        used: { type: integer, format: int64 }
        limit: { type: integer, format: int64 }
        unlimited: { type: boolean }
        mode: { type: string, enum: [hard, soft, notify] }
        over_limit: { type: boolean }
        overridden: { type: boolean, description: "The limit is the organisation's own, set by the operator" }
        resets_time: { type: string, format: date-time, description: Only the events quota resets }
    PlatformInfo:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        tenant_id: { type: string, format: uuid }
        environment: { type: string, enum: [sandbox, live] }
        currency: { type: string }
    OrganizationPlan:
      type: object
      required: [enabled, overridden, quotas, offers, can_manage]
      properties:
        enabled: { type: boolean }
        account_id: { type: string, format: uuid }
        plan: { $ref: "#/components/schemas/PlanOffer" }
        state: { type: string, enum: [none, active, trialing, past_due, paused] }
        trial_end_time: { type: string, format: date-time }
        overridden: { type: boolean }
        quotas: { type: array, items: { $ref: "#/components/schemas/PlanQuota" } }
        offers: { type: array, items: { $ref: "#/components/schemas/PlanOffer" } }
        can_manage: { type: boolean }
        customer_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
    PlanInvoice:
      type: object
      required: [id, number, status, currency, total_minor]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { type: string, description: "open, paid, void ..." }
        currency: { type: string }
        total_minor: { type: integer, format: int64 }
        create_time: { type: string, format: date-time }
        finalize_time: { type: string, format: date-time }
    OrganizationRow:
      type: object
      required: [account_id, name, owner_email, plan_code, plan_name, state, overridden, apps, members, api_keys, events_used, events_limit]
      properties:
        account_id: { type: string, format: uuid }
        name: { type: string }
        owner_email: { type: string }
        plan_code: { type: string }
        plan_name: { type: string }
        state: { type: string }
        overridden: { type: boolean }
        apps: { type: integer, format: int64 }
        members: { type: integer, format: int64 }
        api_keys: { type: integer, format: int64 }
        events_used: { type: integer, format: int64 }
        events_limit: { type: integer, format: int64, description: 0 is unlimited }
        create_time: { type: string, format: date-time }
    MyAccount:
      type: object
      required: [id, name, role, create_time, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, admin, viewer], description: The caller's own role }
        create_time: { type: string, format: date-time, nullable: true }
        members:
          type: array
          items:
            type: object
            required: [user_id, email, display_name, role, create_time]
            properties:
              user_id: { type: string, format: uuid }
              email: { type: string }
              display_name: { type: string }
              role: { type: string, enum: [owner, admin, viewer] }
              create_time: { type: string, format: date-time, nullable: true }
    OverviewCount:
      type: object
      required: [count, more]
      properties:
        count: { type: integer }
        more: { type: boolean, description: The count stopped at its cap; there are more }
    DashboardRevenue:
      type: object
      description: Minor units of the block's currency.
      required: [gross_minor, tax_minor, refunds_minor, net_minor, expenses_minor, profit_minor, paid_invoices]
      properties:
        gross_minor: { type: integer, format: int64 }
        tax_minor: { type: integer, format: int64 }
        refunds_minor: { type: integer, format: int64 }
        net_minor: { type: integer, format: int64, description: gross - tax - refunds }
        expenses_minor: { type: integer, format: int64 }
        profit_minor: { type: integer, format: int64 }
        paid_invoices: { type: integer, format: int64 }
    DashboardPayments:
      type: object
      required: [paid, failed, processing, refunds, paid_minor, failed_minor, refunded_minor, failed_rate_bp]
      properties:
        paid: { type: integer }
        failed: { type: integer, description: Failed attempts; a declined card that dunning retries counts each time }
        processing: { type: integer }
        refunds: { type: integer }
        paid_minor: { type: integer, format: int64 }
        failed_minor: { type: integer, format: int64 }
        refunded_minor: { type: integer, format: int64 }
        failed_rate_bp: { type: integer, nullable: true, description: failed / (paid + failed) in basis points; null when nothing settled }
    DashboardSubscriptions:
      type: object
      required: [month, active, trialing, paused, past_due, mrr_minor, arr_minor, new, new_mrr_minor, churned, churned_mrr_minor, churn_rate_bp]
      properties:
        month: { type: string, description: The month of the report (YYYY-MM) }
        active: { type: integer, format: int64 }
        trialing: { type: integer, format: int64 }
        paused: { type: integer, format: int64 }
        past_due: { type: integer, format: int64 }
        mrr_minor: { type: integer, format: int64 }
        arr_minor: { type: integer, format: int64, description: mrr x 12 }
        new: { type: integer, format: int64 }
        new_mrr_minor: { type: integer, format: int64 }
        churned: { type: integer, format: int64 }
        churned_mrr_minor: { type: integer, format: int64 }
        churn_rate_bp: { type: integer, nullable: true }
    DashboardCurrency:
      type: object
      description: Everything the dashboard knows in one currency. Nothing in it is in another currency.
      required: [currency, revenue, prev_revenue, series, payments, prev_payments, subscriptions, prev_subscriptions, arpu_minor, prev_arpu_minor, top_customers, top_packages, aging, open_count, open_minor, renewals]
      properties:
        currency: { type: string }
        revenue: { $ref: "#/components/schemas/DashboardRevenue" }
        prev_revenue: { allOf: [{ $ref: "#/components/schemas/DashboardRevenue" }], nullable: true }
        series:
          type: array
          description: Net income per bucket (day, or the first day of a month), with the bucket of the previous period at the same position
          items:
            type: object
            required: [date, net_minor]
            properties:
              date: { type: string, format: date }
              net_minor: { type: integer, format: int64 }
              prev_date: { type: string, format: date }
              prev_net_minor: { type: integer, format: int64, nullable: true }
        payments: { allOf: [{ $ref: "#/components/schemas/DashboardPayments" }], nullable: true }
        prev_payments: { allOf: [{ $ref: "#/components/schemas/DashboardPayments" }], nullable: true }
        subscriptions: { allOf: [{ $ref: "#/components/schemas/DashboardSubscriptions" }], nullable: true }
        prev_subscriptions: { allOf: [{ $ref: "#/components/schemas/DashboardSubscriptions" }], nullable: true }
        arpu_minor: { type: integer, format: int64, nullable: true, description: Net revenue per active subscriber }
        prev_arpu_minor: { type: integer, format: int64, nullable: true }
        top_customers:
          type: array
          items:
            type: object
            required: [customer_id, customer_external_id, name, income_minor, invoices]
            properties:
              customer_id: { type: string }
              customer_external_id: { type: string }
              name: { type: string }
              income_minor: { type: integer, format: int64 }
              invoices: { type: integer, format: int64 }
        top_packages:
          type: array
          items:
            type: object
            required: [plan_code, active, mrr_minor]
            properties:
              plan_code: { type: string }
              active: { type: integer, format: int64 }
              mrr_minor: { type: integer, format: int64 }
        aging:
          type: array
          description: Open invoices by days open, in the order 0-7, 8-30, 31-60, 61+
          items:
            type: object
            required: [bucket, count, amount_minor]
            properties:
              bucket: { type: string, enum: ["0-7", "8-30", "31-60", "61+"] }
              count: { type: integer, format: int64 }
              amount_minor: { type: integer, format: int64 }
        open_count: { type: integer, format: int64 }
        open_minor: { type: integer, format: int64 }
        renewals:
          type: array
          description: The next charges of this currency in the coming 30 days, soonest first (at most six)
          items:
            type: object
            required: [subscription_id, customer_external_id, plan_code, interval, renews_at, state]
            properties:
              subscription_id: { type: string }
              customer_external_id: { type: string }
              plan_code: { type: string }
              interval: { type: string }
              renews_at: { type: string, format: date-time }
              state: { type: string }
    Dashboard:
      type: object
      required: [app_id, environment, tenant_id, timezone, default_currency, range, generated_at, status, unavailable, payments_truncated, payments_prev_covered, renewals_truncated, currencies, customers, usage, activity, health]
      properties:
        app_id: { type: string }
        environment: { type: string, enum: [live, sandbox] }
        tenant_id: { type: string, format: uuid }
        timezone: { type: string }
        default_currency: { type: string }
        range:
          type: object
          required: [period, from, to, days, granularity, compare]
          properties:
            period: { type: string }
            from: { type: string, format: date }
            to: { type: string, format: date }
            days: { type: integer }
            granularity: { type: string, enum: [day, month] }
            compare: { type: boolean }
            prev_from: { type: string, format: date }
            prev_to: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [ok, attention, degraded] }
        unavailable: { type: array, items: { type: string } }
        payments_truncated: { type: boolean, description: "The period reaches past the newest 1000 ledger rows the gateway reads, so payment counts may be low" }
        payments_prev_covered: { type: boolean, description: "False when the ledger window does not reach back over the previous period, so it has no payment comparison" }
        renewals_truncated: { type: boolean }
        currencies: { type: array, description: "The tenant's own currency first, then by net revenue", items: { $ref: "#/components/schemas/DashboardCurrency" } }
        customers:
          type: object
          nullable: true
          required: [total, new, prev_new]
          properties:
            total: { type: integer, format: int64 }
            new: { type: integer, format: int64 }
            prev_new: { type: integer, format: int64 }
        usage:
          type: object
          nullable: true
          description: Usage against the limits of up to ten customers who have a subscription
          required: [period_id, sampled, meters]
          properties:
            period_id: { type: string }
            sampled: { type: integer }
            meters:
              type: array
              items:
                type: object
                required: [meter_code, customers, over, near, top]
                properties:
                  meter_code: { type: string }
                  customers: { type: integer }
                  over: { type: integer }
                  near: { type: integer, description: At or above 80 % of the limit }
                  top:
                    type: array
                    items:
                      type: object
                      required: [customer_external_id, used, limit, percent]
                      properties:
                        customer_external_id: { type: string }
                        used: { type: string }
                        limit: { type: string }
                        percent: { type: number, description: For display only; the exact decimals are the entitlements endpoint's }
        activity:
          type: array
          description: The newest invoices, payments and subscriptions, newest first (at most twelve)
          items:
            type: object
            required: [kind, at, ref, label, status]
            properties:
              kind: { type: string, enum: [invoice, payment, subscription] }
              at: { type: string, format: date-time }
              ref: { type: string }
              label: { type: string }
              customer: { type: string }
              status: { type: string }
              amount_minor: { type: integer, format: int64 }
              currency: { type: string }
        health:
          type: object
          required: [payments_reachable, webhook_endpoints, webhook_failed, webhook_failed_more, providers]
          properties:
            payments_reachable: { type: boolean }
            webhook_endpoints: { type: integer }
            webhook_failed: { type: integer }
            webhook_failed_more: { type: boolean }
            providers:
              type: array
              items:
                type: object
                required: [provider, environment, is_default]
                properties:
                  provider: { type: string }
                  environment: { type: string }
                  is_default: { type: boolean }
    AppOverview:
      type: object
      required: [app_id, environment, tenant_id, currency, window_days, generated_at, status, unavailable, payments, invoices, customers, subscriptions, health]
      properties:
        app_id: { type: string, format: uuid }
        environment: { type: string, enum: [live, sandbox] }
        tenant_id: { type: string, format: uuid }
        currency: { type: string, description: The environment's own currency }
        window_days: { type: integer, examples: [30] }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [ok, attention, degraded], description: "attention: a failed payment or webhook delivery; degraded: a section is unavailable" }
        unavailable: { type: array, items: { type: string, enum: [payments, invoices, customers, subscriptions, webhooks] } }
        payments:
          type: [object, "null"]
          required: [truncated, by_status, by_currency, series, recent]
          properties:
            truncated: { type: boolean, description: The ledger window held more rows than the gateway reads }
            by_status:
              type: array
              items: { type: object, required: [status, count], properties: { status: { type: string, enum: [paid, processing, failed, refunded] }, count: { type: integer } } }
            by_currency:
              type: array
              items:
                type: object
                required: [currency, paid_count, paid_minor, failed_count, failed_minor, pending_count, pending_minor, refunded_minor]
                properties:
                  currency: { type: string }
                  paid_count: { type: integer }
                  paid_minor: { type: integer, format: int64 }
                  failed_count: { type: integer }
                  failed_minor: { type: integer, format: int64 }
                  pending_count: { type: integer }
                  pending_minor: { type: integer, format: int64 }
                  refunded_minor: { type: integer, format: int64 }
            series:
              type: array
              description: Paid money per day of the window, per currency
              items:
                type: object
                required: [currency, points]
                properties:
                  currency: { type: string }
                  points: { type: array, items: { type: object, required: [date, amount_minor], properties: { date: { type: string, format: date }, amount_minor: { type: integer, format: int64 } } } }
            recent:
              type: array
              items:
                type: object
                required: [id, invoice_id, provider, kind, status, amount_minor, currency, occurred_at]
                properties:
                  id: { type: string }
                  invoice_id: { type: string }
                  provider: { type: string }
                  kind: { type: string, enum: [charge, refund] }
                  status: { type: string, enum: [paid, processing, failed, refunded] }
                  amount_minor: { type: integer, format: int64 }
                  currency: { type: string }
                  occurred_at: { type: string, format: date-time }
        invoices:
          type: [object, "null"]
          required: [open, paid, revenue, recent]
          properties:
            open: { $ref: "#/components/schemas/OverviewCount" }
            paid: { $ref: "#/components/schemas/OverviewCount" }
            revenue:
              type: array
              description: All periods, per currency
              items:
                type: object
                required: [currency, billed_minor, collected_minor, outstanding_minor, refunded_minor]
                properties:
                  currency: { type: string }
                  billed_minor: { type: integer, format: int64 }
                  collected_minor: { type: integer, format: int64 }
                  outstanding_minor: { type: integer, format: int64 }
                  refunded_minor: { type: integer, format: int64 }
            recent:
              type: array
              items:
                type: object
                required: [id, number, customer_id, customer_external_id, status, currency, total_minor, create_time, finalize_time]
                properties:
                  id: { type: string }
                  number: { type: string }
                  customer_id: { type: string }
                  customer_external_id: { type: string }
                  status: { type: string }
                  currency: { type: string }
                  total_minor: { type: integer, format: int64 }
                  create_time: { type: string, format: date-time }
                  finalize_time: { type: string, format: date-time }
        customers:
          oneOf: [{ $ref: "#/components/schemas/OverviewCount" }, { type: "null" }]
          nullable: true
        subscriptions:
          type: array
          description: Recurring revenue of the current month per currency
          items:
            type: object
            required: [currency, active, trialing, past_due, mrr_minor, new_mrr_minor, churned_mrr_minor]
            properties:
              currency: { type: string }
              active: { type: integer, format: int64 }
              trialing: { type: integer, format: int64 }
              past_due: { type: integer, format: int64 }
              mrr_minor: { type: integer, format: int64 }
              new_mrr_minor: { type: integer, format: int64 }
