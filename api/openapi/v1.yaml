        tax_minor: { type: string, description: "The tax lines of those invoices", format: int64 }
        refunds_minor: { type: string, description: "Credit notes against paid invoices plus invoices refunded in full", format: int64 }
        net_income_minor: { type: string, description: "gross - tax - refunds", format: int64 }
        expenses_minor: { type: string, description: "Every live occurrence in the period, provider fees included", format: int64 }
