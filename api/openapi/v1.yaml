                        status: { type: string, enum: [succeeded, declined, failed, pending] }
                        amount_minor: { type: integer }
                        currency: { type: string }
                        provider_ref: { type: string }
                        source: { type: string, enum: [command, webhook, reconciliation] }
                        detail: { type: string }
                        occurred_at: { type: string, format: date-time }
        "503": { $ref: "#/components/responses/Error" }
  /webhooks/{provider}:
    post:
      operationId: providerWebhook
      summary: A payment provider's notification. Public; the body is never believed, the provider is asked to confirm it
      security: []
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, examples: [iyzico] } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Understood (processed, duplicate or ignored) }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /webhooks/{provider}/{tenant_id}/{environment}:
    post:
      operationId: tenantProviderWebhook
      summary: A payment provider's notification for one tenant's account (Paddle sends one per account). Public; verified with the account's webhook secret
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, examples: [paddle] } }
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: path, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Understood (processed, duplicate or ignored) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-subscriptions:
    get:
      operationId: listProviderSubscriptions
      summary: Subscriptions a payment provider runs for the tenant, as its notifications report them
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        environment: { type: string }
                        provider_ref: { type: string }
                        quotify_subscription_id: { type: string, format: uuid }
                        status: { type: string }
                        next_billed_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/checkouts:
    post:
      operationId: createProviderCheckout
      summary: A hosted checkout page where a customer subscribes at a provider that hosts one (Paddle)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, price_ref]
              properties:
                provider: { type: string, examples: [paddle] }
                price_ref: { type: string, description: The provider's id of what is sold, examples: [pri_01] }
                quantity: { type: integer, minimum: 1 }
                quotify_subscription_id: { type: string, format: uuid, description: Ties the provider's subscription to ours }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  ref: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-migrations:
    post:
      operationId: startProviderMigration
      summary: Move a subscription to another payment provider without charging the customer twice
      description: >
        To a provider that runs subscriptions itself (Paddle) a checkout is returned and the old subscription is untouched until the customer has subscribed
        there. To a provider Quotify runs (iyzico) the new subscription takes over at once, or from a provider-run subscription at the end of the period
        the old provider was paid for; the old provider is told to stop renewing first.
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, to_provider]
              properties:
                subscription_id: { type: string, format: uuid }
                to_provider: { type: string, enum: [iyzico, paddle] }
                price_ref: { type: string, description: The target provider's catalogue price, for a provider that runs subscriptions itself }
      responses:
        "201":
          description: Started (checkout_url, state started) or done (new_subscription, cutover, state completed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  migration: { type: string, format: uuid }
                  state: { type: string, enum: [started, completed] }
                  checkout_url: { type: string }
                  new_subscription: { type: string, format: uuid }
                  cutover: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-migrations/{migration_id}/abort:
    post:
      operationId: abortProviderMigration
      summary: Give up a migration that has not completed; the subscription stays as it was
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: migration_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Aborted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/providers/{provider}/catalogue/sync:
    post:
      operationId: syncProviderCatalogue
      summary: Make the provider hold a plan version, so it can be sold there
      description: >
        Creates the plan's product at the provider once and a recurring price for every interval and currency the plan version has a fee in. What is there already is
        left alone, so syncing twice is syncing once. A price in a currency the provider cannot bill is reported under `skipped`. Prices are immutable at the provider, which
        suits plan versions: a new version is new prices. Needs a provider whose adapter has a catalogue (Paddle).
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code: { type: string }
                plan_version: { type: integer, description: 0 = latest }
                product_name: { type: string }
                tax_category: { type: string, description: Default saas }
      responses:
        "200":
          description: What was created, what was there already and what was skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_version_id: { type: string }
                  product_ref: { type: string }
                  created: { type: object, additionalProperties: { type: string }, description: Quotify's key of each price created to the provider's id }
                  existing: { type: object, additionalProperties: { type: string } }
                  skipped: { type: object, additionalProperties: { type: string }, description: Key to the reason }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/providers/{provider}/catalogue:
    get:
      operationId: listProviderCatalogue
      summary: What Quotify has created at the provider (products, prices, discounts)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, key: { type: string }, ref: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/providers/{provider}/customers/{external_id}:
    post:
      operationId: ensureProviderCustomer
      summary: Make sure the customer exists at the provider, with an address for their country
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: external_id, in: path, required: true, schema: { type: string } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
