openapi: 3.1.0
info:
  title: Quotify API
  version: v1
  description: |
    Public HTTP/JSON API of the Quotify gateway (docs/03-services/gateway.md).

    - Tenant routes authenticate with `Authorization: Bearer qk_{test|live}_<prefix>_<secret>`. `qk_test_` keys act on the
      account's sandbox tenant, `qk_live_` keys on its live tenant.
    - `/admin/v1` routes require `Authorization: Bearer <operator token>`.
    - Field names are snake_case. Enums are strings. Per the protobuf JSON mapping, int64 values (`*_minor`) are
      rendered as JSON strings and accepted as strings or numbers. Decimal quantities and prices are strings.
    - Errors always use the `Error` envelope. 429 responses carry `Retry-After` (seconds).

    This file is hand-maintained. A contract test fails if a route in the gateway's route table is missing here or vice versa.
servers:
  - url: http://localhost:8000
security:
  - apiKey: []

paths:
  /v1/events:
    post:
      operationId: ingestEvents
      summary: Ingest usage events (1..500 per request, at most 1 MiB)
      description: |
        Answers `202` with one result per event, in request order, for any structurally valid batch. A bad event does not
        fail the batch: it comes back `rejected` with an `error_code`. Live keys must send an `idempotency_key` per event;
        a retry with the same key and payload returns `duplicate` with the original `event_id`. `quantity` may be a JSON
        string or number and is parsed as an exact decimal (never as a float).
        The `ingest` rate limit is charged per event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestEventsRequest" }
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestEventsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      operationId: listCustomers
      summary: List customers (ordered by external_id)
      parameters:
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers: { type: array, items: { $ref: "#/components/schemas/Customer" } }
                  next_page_token: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}:
    get:
      operationId: getCustomer
      summary: Get a customer by external id
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/payment-method:
    put:
      operationId: setPaymentMethod
      summary: Set the customer's PSP token (sandbox accepts only pm_sandbox_* tokens)
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [payment_method], properties: { payment_method: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/meters:
    post:
      operationId: createMeter
      summary: Create a meter, or the next version of an existing code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMeterRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Meter" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      operationId: listMeters
      summary: List meters (latest version of each code)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { meters: { type: array, items: { $ref: "#/components/schemas/Meter" } } } }
  /v1/meters/{code}:
    get:
      operationId: getMeter
      summary: Get the latest version of a meter
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Meter" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/customers/{external_id}/usage:
    get:
      operationId: getCustomerUsage
      summary: On-time usage of a customer in a period, per meter
      description: |
        Quantities are exact decimals with the meter's scale. Usage that arrived after the period's cutoff is not
        included here: it is billed on a later invoice as late usage. `period` defaults to the current period in the
        tenant's time zone.
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", examples: ["2026-11"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_external_id: { type: string }
                  period_id: { type: string }
                  usage:
                    type: array
                    items:
                      type: object
                      properties:
                        meter_code: { type: string }
                        quantity: { type: string, examples: ["1500.250"] }
                        event_count: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/entitlements:
    get:
      operationId: listEntitlements
      summary: Usage against the limits of every meter the customer has an entitlement on
      description: See `getEntitlement` for the semantics of each item.
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", examples: ["2026-11"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EntitlementStatus" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/entitlements/{meter}:
    get:
      operationId: getEntitlement
      summary: Usage of one meter against the customer's limit
      description: |
        Answered from near-real-time counters. They are eventually consistent (typically well under 2 s behind ingest):
        `as_of` is the ingest time of the newest event reflected in `used`. Quotify never blocks ingest on a limit; call
        this before serving your customer and decide what to do. A customer without an entitlement on the meter is
        `unlimited`. `period` defaults to the current period in the tenant's time zone.
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: meter, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", examples: ["2026-11"] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementStatus" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/plans:
    post:
      operationId: createPlan
      summary: Create a plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listPlans
      summary: List plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { plans: { type: array, items: { $ref: "#/components/schemas/Plan" } } } }
  /v1/plans/{code}/versions:
    post:
      operationId: publishPlanVersion
      summary: Publish the next immutable plan version
      parameters: [{ $ref: "#/components/parameters/PlanCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_fee_minor: { type: string, description: int64 minor units }
                fees:
                  type: array
                  description: Fixed fee in currencies other than the tenant's (no duplicates)
                  items: { type: object, properties: { currency: { type: string }, base_fee_minor: { type: string } } }
                prices: { type: array, items: { $ref: "#/components/schemas/Price" } }
                entitlements: { type: array, items: { $ref: "#/components/schemas/EntitlementStatus" } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PlanVersion" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/plans/{code}/versions/{version}:
    get:
      operationId: getPlanVersion
      summary: Get a plan version (a number or "latest")
      parameters:
        - { $ref: "#/components/parameters/PlanCode" }
        - { name: version, in: path, required: true, schema: { type: string, examples: ["1", "latest"] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanVersion" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: Subscriptions, newest first
      parameters:
        - { name: customer, in: query, description: Customer external id, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions: { type: array, items: { $ref: "#/components/schemas/Subscription" } }
                  next_page_token: { type: string }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSubscription
      summary: Subscribe a customer to a plan version (at most one overlapping subscription per customer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_external_id, plan_code]
              properties:
                customer_external_id: { type: string }
                plan_code: { type: string }
                plan_version: { type: integer, description: 0 = latest }
                start_time: { type: string, format: date-time }
                trial_days: { type: integer, minimum: 0, maximum: 365 }
                interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
                currency: { type: string, description: Default is the customer's billing currency, then the tenant's }
                provider: { type: string, description: The payment provider that sells it (for example paddle); default is the tenant's default account }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      summary: One subscription with its state
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelSubscription
      summary: End a subscription (now, or at end_time)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: end_time, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/pause:
    post:
      operationId: pauseSubscription
      summary: Stop the fixed fee until the subscription is resumed (usage is still billed)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/resume:
    post:
      operationId: resumeSubscription
      summary: Resume a paused subscription
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/cancel-at-period-end:
    post:
      operationId: scheduleCancellation
      summary: End the subscription at the end of its current billing period
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: withdrawCancellation
      summary: Withdraw a scheduled cancellation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/change-plan:
    post:
      operationId: changePlan
      summary: Move the subscription to another plan version now, prorating the fixed fee
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code]
              properties:
                plan_code: { type: string }
                plan_version: { type: integer, description: 0 = latest }
                change_time: { type: string, format: date-time, description: Default now }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: "#/components/schemas/Subscription" }
                  credit_minor: { type: string, description: Unused part of the old fixed fee }
                  charge_minor: { type: string, description: Remaining part of the new fixed fee }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/reports/revenue:
    get:
      operationId: getRevenueReport
      summary: Invoices summed by period, payment provider, customer country and currency (currencies are never added together)
      parameters:
        - { name: from, in: query, description: First period, YYYY-MM, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: to, in: query, description: Last period, YYYY-MM, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: group_by, in: query, description: "Comma-separated: period, provider, country (default period). Currency is always split", schema: { type: string, examples: ["period,provider"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        period: { type: string }
                        provider: { type: string }
                        country: { type: string }
                        currency: { type: string }
                        invoices: { type: string }
                        billed_minor: { type: string, description: Finalized invoices that are not void }
                        collected_minor: { type: string, description: Paid }
                        refunded_minor: { type: string, description: Invoices that were refunded }
                        outstanding_minor: { type: string, description: Open }
                        uncollectible_minor: { type: string }
                        void_minor: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /v1/reports/dunning:
    get:
      operationId: getDunningReport
      summary: Invoices whose payment has not gone through (declined and retrying, outcome unknown, given up)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      type: object
                      properties:
                        invoice_id: { type: string, format: uuid }
                        number: { type: string }
                        customer_external_id: { type: string }
                        period: { type: string }
                        provider: { type: string }
                        currency: { type: string }
                        total_minor: { type: string }
                        state: { type: string, enum: [PAYMENT_DECLINED, PAYMENT_UNKNOWN, UNCOLLECTIBLE] }
                        dunning_attempt: { type: integer }
                        next_attempt_time: { type: string, format: date-time }
                        last_error: { type: string }
                  summary:
                    type: array
                    items:
                      type: object
                      properties:
                        state: { type: string }
                        provider: { type: string }
                        currency: { type: string }
                        invoices: { type: string }
                        total_minor: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /v1/reports/subscriptions:
    get:
      operationId: getSubscriptionReport
      summary: Subscriptions and monthly recurring revenue at the end of a month, with the new and the churned, by provider, country and currency
      parameters:
        - { name: month, in: query, description: YYYY-MM in the tenant's time zone; default the current month, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: group_by, in: query, description: "Comma-separated: provider, country. Currency is always split", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        country: { type: string }
                        currency: { type: string }
                        active: { type: string }
                        trialing: { type: string }
                        paused: { type: string }
                        past_due: { type: string }
                        mrr_minor: { type: string, description: Fixed fees per month of active and past due subscriptions }
                        new_subscriptions: { type: string }
                        new_mrr_minor: { type: string }
                        churned: { type: string, description: Ended with no successor; a plan change or provider migration is not churn }
                        churned_mrr_minor: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /v1/routing-rules:
    get:
      operationId: getRoutingRules
      summary: The ordered rules that choose a new subscription's payment provider from the customer's country and the subscription's currency
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoutingRules" } } } }
    put:
      operationId: setRoutingRules
      summary: Replace the rules (first match wins; a rule with neither country nor currency is the catch-all and must be last). Existing subscriptions keep their provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutingRules" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoutingRules" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/routing-rules/preview:
    post:
      operationId: previewRouting
      summary: Where a customer in a country paying in a currency would go, without creating anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country: { type: string, examples: [TR] }
                currency: { type: string, examples: [TRY] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, description: Empty when no rule matches (the tenant's default account) }
                  rule_index: { type: integer, description: "-1 when no rule matches" }
                  owner: { type: string, enum: [quotify, provider] }
                  can_charge: { type: boolean }

  /v1/invoices:
    get:
      operationId: listInvoices
      summary: List invoices (ordered by id)
      parameters:
        - { name: customer, in: query, description: Customer external id, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: status, in: query, schema: { type: string, enum: [draft, open, paid, uncollectible, void] } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
                  next_page_token: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      summary: One invoice with its lines
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/invoices/{id}/pdf:
    get:
      operationId: getInvoicePdf
      summary: A presigned link to the invoice PDF (valid for 5 minutes)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads:
    post:
      operationId: createUploadSession
      summary: Open a direct multipart upload session for up to 50 files
      description: |
        Returns, for each file, presigned S3 `UploadPart` URLs for its first (up to 100) parts. Upload the parts in parallel
        straight to S3 (PUT, each part `part_size` bytes except the last), keep the `ETag` of each answer, then call
        `complete`. The session lasts 24 hours. `Idempotency-Key` makes retries return the same session.
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [filename, content_type, size, purpose]
                    properties:
                      filename: { type: string }
                      content_type: { type: string, examples: ["application/pdf"] }
                      size: { type: integer, format: int64 }
                      purpose: { type: string, enum: [invoice_logo, invoice_attachment, general] }
                      sha256: { type: string, description: Optional hex sha256 of the whole file }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads/{session}:
    delete:
      operationId: abortUploadSession
      summary: Abort a session and every unfinished file in it
      parameters: [{ name: session, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads/{session}/files/{asset}:
    get:
      operationId: getUploadFile
      summary: State of one file, including the parts S3 already holds (to resume an interrupted upload)
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UploadFile" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: abortUploadFile
      summary: Abort one file of a session
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads/{session}/files/{asset}/parts:
    post:
      operationId: presignParts
      summary: More (or refreshed) presigned part URLs of a file
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts: { type: array, items: { $ref: "#/components/schemas/PresignedPart" } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads/{session}/files/{asset}/complete:
    post:
      operationId: completeUploadFile
      summary: Verify the uploaded parts, assemble the object and make the asset READY
      description: |
        Idempotent. If the parts do not match what S3 holds (a missing part or a wrong ETag), the asset comes back
        `REJECTED` with `reject_reason: PART_MISMATCH` and nothing is left in storage.
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    required: [part_number, etag]
                    properties:
                      part_number: { type: integer }
                      etag: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets:
    post:
      operationId: uploadAssets
      summary: Upload up to 20 small files in one multipart/form-data request
      description: |
        Files are streamed through the gateway into storage (at most 25 MiB each, 100 MiB per request); use an upload
        session for larger files. An optional first part `metadata` picks each file's purpose:
        `{"files": {"logo.png": {"purpose": "invoice_logo"}}}` (default `general`). The answer is `200` with one result per
        file, in order: a bad file is `rejected` with an `error_code` and does not fail the others. The `write` rate limit
        is charged per file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata: { type: string, description: JSON }
                file: { type: array, items: { type: string, format: binary } }
      responses:
        "200":
          description: Per-file results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        status: { type: string, enum: [created, rejected] }
                        asset: { $ref: "#/components/schemas/Asset" }
                        error_code: { type: string, examples: ["CONTENT_TYPE_MISMATCH"] }
                        message: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      operationId: listAssets
      summary: List READY assets
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [invoice_logo, invoice_attachment, general] } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets: { type: array, items: { $ref: "#/components/schemas/Asset" } }
                  next_page_token: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /v1/tenant/invoice-logo:
    put:
      operationId: setInvoiceLogo
      summary: Draw a READY invoice_logo asset on the tenant's invoice PDFs
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [asset_id], properties: { asset_id: { type: string, format: uuid } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { invoice_logo_asset_id: { type: string } } } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: clearInvoiceLogo
      summary: Remove the invoice logo
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { invoice_logo_asset_id: { type: string } } } } } }
  /v1/assets/{id}:
    get:
      operationId: getAsset
      summary: One asset
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAsset
      summary: Delete a READY asset (its bytes leave the storage quota)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/{id}/download:
    get:
      operationId: downloadAsset
      summary: A presigned link (5 minutes) that downloads the file as an attachment
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/analytics/usage:
    get:
      operationId: getAnalyticsUsage
      summary: Usage series of one meter (estimates; invoices come from billing)
      description: |
        Near-real-time, from ClickHouse. The default series comes from an hourly rollup that may over-count by the duplicate
        delivery rate (`precision: estimated`); `exact=true` recomputes it from deduplicated events and covers at most one day
        (`precision: exact`).
      parameters:
        - { name: meter, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day], default: hour } }
        - { name: customer, in: query, description: Customer external id, schema: { type: string } }
        - { name: exact, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  precision: { type: string, enum: [estimated, exact] }
                  quantity_scale: { type: integer }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: string, format: date-time }
                        quantity: { type: string, examples: ["1.500"] }
                        event_count: { type: string, description: int64 as a string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/analytics/top-customers:
    get:
      operationId: getTopCustomers
      summary: Customers ranked by usage of a meter in a billing period (deduplicated)
      parameters:
        - { name: meter, in: query, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  precision: { type: string }
                  quantity_scale: { type: integer }
                  customers:
                    type: array
                    items:
                      type: object
                      properties:
                        customer_id: { type: string }
                        customer_external_id: { type: string }
                        quantity: { type: string }
                        event_count: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandbox/close-period:
    post:
      operationId: sandboxClosePeriod
      summary: Sandbox only — close a period now and run the real billing flow
      description: |
        Lowers the period's cutoff to now + 5 s, then billing runs exactly as at month end: watermark (starting 30 s after
        the new cutoff), rating, numbering (`SBX-…`) and the invoice saga with mock payments. Poll `GET /v1/invoices`.
        `period` defaults to the current period. Live keys get 403.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { period: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/BillingRun" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/sandbox/customers/{external_id}/payment-scenario:
    post:
      operationId: setPaymentScenario
      summary: Sandbox only — choose the mock payment outcome for a customer
      description: '`{"scenario": "declined"}` sets `pm_sandbox_declined`. Live keys get 403.'
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  type: string
                  enum: [success, declined, insufficient_funds_once, error_then_success, timeout_committed, timeout_not_committed]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "403": { $ref: "#/components/responses/Error" }

  /admin/v1/accounts:
    post:
      operationId: createAccount
      summary: Create an account with its sandbox and live tenants
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency, timezone, grace_period]
              properties:
                name: { type: string }
                currency: { type: string, enum: [CHF, EUR, GBP, JPY, KWD, TRY, USD], description: Required, no default. Immutable. }
                timezone: { type: string, examples: [Europe/Istanbul], description: Required IANA name, no default. Immutable. }
                grace_period: { type: string, examples: ["86400s"], description: "Required, protobuf Duration JSON, 0s..604800s" }
                tier: { type: string, enum: [TENANT_TIER_FREE, TENANT_TIER_STANDARD, TENANT_TIER_ENTERPRISE] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants:
    get:
      operationId: adminListTenants
      summary: Every tenant, ordered by id (the operator console's first view)
      security: [{ operatorToken: [] }]
      parameters:
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
                  next_page_token: { type: string }
  /admin/v1/tenants/{tenant_id}/invoices:
    get:
      operationId: adminListInvoices
      summary: A tenant's invoices (operator view of GET /v1/invoices)
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: status, in: query, schema: { type: string, enum: [draft, open, paid, uncollectible, void] } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
                  next_page_token: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/invoices/{invoice_id}:
    get:
      operationId: adminGetInvoice
      summary: One invoice of a tenant, with its lines
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/invoices/{invoice_id}/pdf:
    get:
      operationId: adminGetInvoicePdf
      summary: A presigned link to the invoice PDF (5 minutes)
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string }, expires_at: { type: string, format: date-time } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/invoices/{invoice_id}/saga:
    get:
      operationId: adminGetInvoiceSaga
      summary: The saga of an invoice with its transition log
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  saga: { $ref: "#/components/schemas/InvoiceSaga" }
                  events: { type: array, items: { $ref: "#/components/schemas/SagaEvent" } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-accounts:
    get:
      operationId: listProviderAccounts
      summary: A tenant's payment provider accounts (credentials are never returned)
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        environment: { type: string, enum: [sandbox, live] }
                        is_default: { type: boolean }
                        updated_at: { type: string, format: date-time }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-accounts/{provider}:
    put:
      operationId: putProviderAccount
      summary: Store or replace a tenant's account at a payment provider (sealed at rest, validated by building the adapter)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, examples: [iyzico] } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
        - { name: default, in: query, description: Make it the account live charges go to, schema: { type: boolean } }
      requestBody:
        required: true
        description: The provider's settings (for iyzico api_key, secret_key, base_url and the buyer defaults)
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProviderAccount
      summary: Remove a tenant's account at a payment provider
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/ledger:
    get:
      operationId: listPaymentLedger
      summary: The tenant's most recent payment ledger rows (charges, refunds) across providers, newest first
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        invoice_id: { type: string, format: uuid }
                        provider: { type: string }
                        environment: { type: string }
                        kind: { type: string, enum: [charge, refund, dispute, payout] }
                        status: { type: string, enum: [succeeded, declined, failed, pending] }
                        amount_minor: { type: integer }
                        currency: { type: string }
                        provider_ref: { type: string }
                        source: { type: string, enum: [command, webhook, reconciliation] }
                        detail: { type: string }
                        occurred_at: { type: string, format: date-time }
        "503": { $ref: "#/components/responses/Error" }
  /webhooks/{provider}:
    post:
      operationId: providerWebhook
      summary: A payment provider's notification. Public; the body is never believed, the provider is asked to confirm it
      security: []
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, examples: [iyzico] } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Understood (processed, duplicate or ignored) }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /webhooks/{provider}/{tenant_id}/{environment}:
    post:
      operationId: tenantProviderWebhook
      summary: A payment provider's notification for one tenant's account (Paddle sends one per account). Public; verified with the account's webhook secret
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, examples: [paddle] } }
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: path, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Understood (processed, duplicate or ignored) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-subscriptions:
    get:
      operationId: listProviderSubscriptions
      summary: Subscriptions a payment provider runs for the tenant, as its notifications report them
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        environment: { type: string }
                        provider_ref: { type: string }
                        quotify_subscription_id: { type: string, format: uuid }
                        status: { type: string }
                        next_billed_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/checkouts:
    post:
      operationId: createProviderCheckout
      summary: A hosted checkout page where a customer subscribes at a provider that hosts one (Paddle)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, price_ref]
              properties:
                provider: { type: string, examples: [paddle] }
                price_ref: { type: string, description: The provider's id of what is sold, examples: [pri_01] }
                quantity: { type: integer, minimum: 1 }
                quotify_subscription_id: { type: string, format: uuid, description: Ties the provider's subscription to ours }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  ref: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-migrations:
    post:
      operationId: startProviderMigration
      summary: Move a subscription to another payment provider without charging the customer twice
      description: >
        To a provider that runs subscriptions itself (Paddle) a checkout is returned and the old subscription is untouched until the customer has subscribed
        there. To a provider Quotify runs (iyzico) the new subscription takes over at once, or from a provider-run subscription at the end of the period
        the old provider was paid for; the old provider is told to stop renewing first.
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, to_provider]
              properties:
                subscription_id: { type: string, format: uuid }
                to_provider: { type: string, enum: [iyzico, paddle] }
                price_ref: { type: string, description: The target provider's catalogue price, for a provider that runs subscriptions itself }
      responses:
        "201":
          description: Started (checkout_url, state started) or done (new_subscription, cutover, state completed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  migration: { type: string, format: uuid }
                  state: { type: string, enum: [started, completed] }
                  checkout_url: { type: string }
                  new_subscription: { type: string, format: uuid }
                  cutover: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-migrations/{migration_id}/abort:
    post:
      operationId: abortProviderMigration
      summary: Give up a migration that has not completed; the subscription stays as it was
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: migration_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Aborted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/reconciliation:
    get:
      operationId: reconcilePayments
      summary: Compare the invoices billing calls paid in a period with the successful charges in the payment ledger
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  paid_invoices: { type: integer }
                  successful_charges: { type: integer }
                  discrepancy_counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: By kind - paid_without_charge, amount_mismatch, duplicate_charge, charge_without_paid, conflicting_outcomes
                  discrepancies:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        invoice_id: { type: string }
                        number: { type: string }
                        provider: { type: string }
                        provider_ref: { type: string }
                        currency: { type: string }
                        billed_minor: { type: integer }
                        ledger_minor: { type: integer }
                        detail: { type: string }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/dead-letters:
    get:
      operationId: adminListDeadLetters
      summary: RabbitMQ dead-letter queues, and a peek at one queue's messages
      security: [{ operatorToken: [] }]
      parameters:
        - { name: queue, in: query, description: "A command or reply queue name, e.g. payment.charge. Omit for the depths only", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues: { type: array, items: { type: object, properties: { queue: { type: string }, messages: { type: string, description: int64 as a string } } } }
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id: { type: string }
                        delivery_count: { type: string }
                        reason: { type: string }
                        body_bytes: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /admin/v1/dead-letters/redrive:
    post:
      operationId: adminRedriveDeadLetters
      summary: Move dead letters of one queue back to where they came from (retry counter reset)
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [queue], properties: { queue: { type: string }, limit: { type: integer, minimum: 1, maximum: 1000, default: 100 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { redriven: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{id}:
    get:
      operationId: getTenant
      summary: Get a tenant
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTenant
      summary: Change grace period or tier (currency and time zone are immutable)
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_period: { type: string, examples: ["172800s"] }
                tier: { type: string, enum: [TENANT_TIER_FREE, TENANT_TIER_STANDARD, TENANT_TIER_ENTERPRISE] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{id}/api-keys:
    post:
      operationId: createApiKey
      summary: Create an API key (qk_test_ for sandbox tenants, qk_live_ for live). The plaintext is returned once.
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { $ref: "#/components/schemas/ApiKey" }
                  plaintext: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/analytics/ingest-stats:
    get:
      operationId: adminIngestStats
      summary: Events per second, late % and duplicate % per tenant over a window
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: window_seconds, in: query, schema: { type: integer, minimum: 1, maximum: 86400, default: 300 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
  /admin/v1/billing/close-period:
    post:
      operationId: adminClosePeriod
      summary: Close a tenant's period now (after its cutoff). Idempotent per tenant and period
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tenant_id, period_id], properties: { tenant_id: { type: string, format: uuid }, period_id: { type: string } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/BillingRun" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/billing-runs/{period}:
    get:
      operationId: adminGetBillingRun
      summary: A billing run
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BillingRun" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays:
    post:
      operationId: adminStartReplay
      summary: Rebuild a tenant's aggregates from the event log into a new generation
      description: |
        Creates generation N+1 next to the tenant's live one and rebuilds it from Kafka for the given periods, with the same code
        path as live aggregation. When it has caught up the live consumer writes the tenant into both generations; the job then
        verifies the difference and waits to be promoted. One open replay per tenant (409 otherwise). Live traffic is never paused.
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_period_id, reason]
              properties:
                from_period_id: { type: string, examples: ["2026-10"] }
                to_period_id: { type: string, description: Defaults to from_period_id }
                reason: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}:
    get:
      operationId: adminGetReplay
      summary: A replay job (status, offsets, and once ready the difference to the live generation)
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}/promote:
    post:
      operationId: adminPromoteReplay
      summary: Make the rebuilt generation the tenant's active one (one transaction, no pause). Idempotent
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/replays/{job_id}/discard:
    post:
      operationId: adminDiscardReplay
      summary: Abandon a generation that was not promoted and delete its rows. Idempotent
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/billing-runs/{period}/rerating:
    post:
      operationId: adminStartRerating
      summary: Price a closed period again under another plan version and bill the difference
      description: |
        Requires the period's billing run to be COMPLETED. Customers of the plan the version belongs to who were invoiced for the
        period are priced again on the same usage: a higher price becomes one CORRECTION invoice per customer (through the
        normal invoice saga), a lower one a credit balance applied as a CREDIT line to the customer's next regular invoice.
        Idempotent per tenant, period and plan version: a repeat returns the existing job (200).
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [plan_version_id], properties: { plan_version_id: { type: string, format: uuid } } }
      responses:
        "200": { description: The job already existed, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/rerating-jobs/{job_id}:
    get:
      operationId: adminGetRerating
      summary: A re-rating job
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReratingJob" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/retry:
    post:
      operationId: adminRetryInvoice
      summary: Resume an invoice saga stuck in a *_FAILED state or PAYMENT_UNKNOWN
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tenant_id], properties: { tenant_id: { type: string, format: uuid } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSaga" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/invoices/{id}/void:
    post:
      operationId: adminVoidInvoice
      summary: Void an invoice, refunding it first when it was paid
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tenant_id], properties: { tenant_id: { type: string, format: uuid }, reason: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSaga" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key (takes effect on the next request)
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "qk_{test|live}_<prefix>_<secret>" }
    operatorToken: { type: http, scheme: bearer, description: Operator token (QUOTIFY_OPERATOR_TOKEN) }
  parameters:
    ExternalID: { name: external_id, in: path, required: true, schema: { type: string } }
    PlanCode: { name: code, in: path, required: true, schema: { type: string } }
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Asset:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        purpose: { type: string, enum: [PURPOSE_INVOICE_LOGO, PURPOSE_INVOICE_ATTACHMENT, PURPOSE_GENERAL] }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: string, description: int64 as a string }
        sha256: { type: string }
        status: { type: string, enum: [ASSET_STATUS_PENDING, ASSET_STATUS_UPLOADING, ASSET_STATUS_SCANNING, ASSET_STATUS_READY, ASSET_STATUS_REJECTED, ASSET_STATUS_ABORTED, ASSET_STATUS_CORRUPT, ASSET_STATUS_DELETED] }
        reject_reason: { type: string, examples: ["PART_MISMATCH"] }
        create_time: { type: string, format: date-time }
        complete_time: { type: string, format: date-time }
    PresignedPart:
      type: object
      properties:
        part_number: { type: integer }
        url: { type: string, format: uri }
    UploadFile:
      type: object
      properties:
        asset_id: { type: string }
        filename: { type: string }
        status: { type: string }
        reject_reason: { type: string }
        size: { type: string }
        part_size: { type: string }
        part_count: { type: integer }
        presigned_parts: { type: array, items: { $ref: "#/components/schemas/PresignedPart" } }
        uploaded_parts:
          type: array
          items:
            type: object
            properties:
              part_number: { type: integer }
              size: { type: string }
              etag: { type: string }
    UploadSession:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [OPEN, COMPLETED, EXPIRED, ABORTED] }
        expire_time: { type: string, format: date-time }
        files: { type: array, items: { $ref: "#/components/schemas/UploadFile" } }
    BillingRun:
      type: object
      properties:
        tenant_id: { type: string }
        period_id: { type: string }
        status: { type: string, enum: [RUN_STATUS_SCHEDULED, RUN_STATUS_WAITING_WATERMARK, RUN_STATUS_RATING, RUN_STATUS_INVOICING, RUN_STATUS_COMPLETED, RUN_STATUS_FAILED] }
        cutoff_time: { type: string, format: date-time }
        invoice_count: { type: integer }
        last_error: { type: string }
    SagaEvent:
      type: object
      properties:
        seq: { type: integer }
        from_state: { type: string }
        to_state: { type: string }
        cause: { type: string }
        command_id: { type: string }
        at: { type: string, format: date-time }
    ReplayJob:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        from_period_id: { type: string }
        to_period_id: { type: string }
        source_generation: { type: integer }
        target_generation: { type: integer }
        status: { type: string, enum: [REPLAY_STATUS_RUNNING, REPLAY_STATUS_CATCHING_UP, REPLAY_STATUS_READY, REPLAY_STATUS_PROMOTED, REPLAY_STATUS_DISCARDED, REPLAY_STATUS_FAILED] }
        reason: { type: string }
        start_offsets: { type: object, additionalProperties: { type: string } }
        end_offsets: { type: object, additionalProperties: { type: string } }
        dual_write_from: { type: object, additionalProperties: { type: string } }
        verification:
          type: object
          properties:
            rows_compared: { type: string }
            rows_changed: { type: string }
            rows_only_in_old: { type: string }
            rows_only_in_new: { type: string }
            diffs:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [usage, late] }
                  customer_id: { type: string }
                  meter_code: { type: string }
                  period_id: { type: string }
                  origin_period_id: { type: string }
                  old_quantity: { type: string }
                  new_quantity: { type: string }
                  old_event_count: { type: string }
                  new_event_count: { type: string }
        last_error: { type: string }
        create_time: { type: string, format: date-time }
        complete_time: { type: string, format: date-time }
    ReratingJob:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        period_id: { type: string }
        plan_version_id: { type: string }
        generation: { type: integer, description: The aggregate generation whose usage was priced }
        status: { type: string, enum: [RERATING_STATUS_RUNNING, RERATING_STATUS_COMPLETED, RERATING_STATUS_FAILED] }
        customers_rated: { type: integer }
        corrections: { type: integer }
        credits: { type: integer }
        correction_total_minor: { type: string, description: int64 as a string }
        credit_total_minor: { type: string, description: int64 as a string }
        last_error: { type: string }
        create_time: { type: string, format: date-time }
        complete_time: { type: string, format: date-time }
    InvoiceSaga:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string }
        state: { type: string }
        attempt: { type: integer }
        dunning_attempt: { type: integer }
        last_error: { type: string }
    InvoiceLine:
      type: object
      properties:
        line_no: { type: integer }
        kind: { type: string, enum: [BASE_FEE, USAGE, LATE_USAGE, CREDIT, CORRECTION] }
        meter_code: { type: string }
        origin_period_id: { type: string }
        quantity: { type: string, examples: ["1.250"] }
        amount_minor: { type: string, description: int64 minor units as a string }
        description: { type: string }
    Invoice:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        customer_external_id: { type: string }
        period_id: { type: string }
        kind: { type: string, enum: [REGULAR, CORRECTION] }
        number: { type: string, examples: ["INV-2026-000123"] }
        currency: { type: string }
        subtotal_minor: { type: string }
        total_minor: { type: string, description: int64 minor units as a string }
        status: { type: string, enum: [draft, open, paid, uncollectible, void] }
        saga_state: { type: string }
        create_time: { type: string, format: date-time }
        finalize_time: { type: string, format: date-time }
        lines: { type: array, items: { $ref: "#/components/schemas/InvoiceLine" } }
    EntitlementStatus:
      type: object
      properties:
        customer_external_id: { type: string }
        meter_code: { type: string }
        period_id: { type: string, examples: ["2026-11"] }
        used: { type: string, description: Exact decimal with the meter's scale, examples: ["10.500"] }
        limit: { type: [string, "null"], description: Exact decimal; null when unlimited, examples: ["10.500"] }
        unlimited: { type: boolean }
        allowed: { type: boolean, description: "unlimited, or used < limit" }
        as_of: { type: [string, "null"], format: date-time }
    IngestEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/IncomingEvent" }
    IncomingEvent:
      type: object
      required: [customer_external_id, meter_code, quantity, event_time]
      properties:
        idempotency_key: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$", description: Required for live keys. Optional in sandbox (then no dedup). }
        customer_external_id: { type: string }
        meter_code: { type: string }
        quantity:
          description: Non-negative decimal with at most the meter's quantity_scale decimal places. A string or a JSON number.
          oneOf: [{ type: string, examples: ["1500", "1.250"] }, { type: number }]
        event_time: { type: string, format: date-time, description: Not older than 35 days, not more than 5 minutes ahead. }
        properties: { type: object, additionalProperties: { type: string }, description: At most 32 entries and 4 KiB in total. }
    IngestEventsResponse:
      type: object
      properties:
        results:
          type: array
          description: One per request event, same order.
          items: { $ref: "#/components/schemas/EventResult" }
    EventResult:
      type: object
      properties:
        status: { type: string, enum: [accepted, duplicate, rejected] }
        event_id: { type: string, description: Set for accepted and duplicate (the original id). }
        error_code:
          type: string
          enum: [UNKNOWN_METER, UNKNOWN_CUSTOMER, EVENT_TOO_OLD, EVENT_IN_FUTURE, INVALID_EVENT_TIME, INVALID_QUANTITY,
                 INVALID_QUANTITY_PRECISION, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REUSED, INVALID_PROPERTIES]
        error_message: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [INVALID_ARGUMENT, UNAUTHENTICATED, RESOURCE_EXHAUSTED] }
            message: { type: string }
            details:
              type: array
              items: { type: object, properties: { field: { type: string }, description: { type: string } } }
            request_id: { type: string }
    CreateCustomerRequest:
      type: object
      required: [external_id, name, email]
      properties:
        external_id: { type: string, maxLength: 128 }
        name: { type: string }
        email: { type: string, format: email }
        payment_method: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2 }
        billing_currency: { type: string, description: ISO 4217; default is the tenant's currency }
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: string }
        email: { type: string }
        payment_method: { type: string }
        create_time: { type: string, format: date-time }
        country: { type: string, description: ISO 3166-1 alpha-2 }
        billing_currency: { type: string, description: ISO 4217 }
    CreateMeterRequest:
      type: object
      required: [code, aggregation, unit_label]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        aggregation: { type: string, enum: [AGGREGATION_SUM, AGGREGATION_COUNT, AGGREGATION_MAX] }
        value_property: { type: string, description: Required for SUM and MAX }
        filter: { type: object, additionalProperties: { type: object, properties: { values: { type: array, items: { type: string } } } } }
        quantity_scale: { type: integer, minimum: 0, maximum: 6, description: Decimal places, fixed per code }
        unit_label: { type: string }
    Meter:
      allOf:
        - $ref: "#/components/schemas/CreateMeterRequest"
        - type: object
          properties:
            version: { type: integer }
            create_time: { type: string, format: date-time }
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        latest_version: { type: integer }
        create_time: { type: string, format: date-time }
    Price:
      type: object
      required: [meter_code]
      properties:
        meter_code: { type: string }
        per_unit: { type: object, properties: { unit_price: { type: string, examples: ["0.002"] } } }
        tiered:
          type: object
          properties:
            tiers:
              type: array
              items:
                type: object
                properties:
                  up_to: { type: string, description: Empty on the last (unbounded) tier }
                  unit_price: { type: string }
                  flat_fee_minor: { type: string }
        package:
          type: object
          properties:
            package_size: { type: string }
            package_price_minor: { type: string }
    Entitlement:
      type: object
      required: [meter_code, limit]
      properties:
        meter_code: { type: string }
        limit: { type: string, description: Decimal in meter units; "0" = unlimited }
        alert_thresholds_pct: { type: array, items: { type: integer } }
    PlanVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        plan_code: { type: string }
        version: { type: integer }
        base_fee_minor: { type: string }
        prices: { type: array, items: { $ref: "#/components/schemas/Price" } }
        entitlements: { type: array, items: { $ref: "#/components/schemas/Entitlement" } }
        publish_time: { type: string, format: date-time }
        fees:
          type: array
          description: Fixed fee in currencies other than the tenant's
          items: { type: object, properties: { currency: { type: string }, base_fee_minor: { type: string } } }
    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        customer_external_id: { type: string }
        plan_version_id: { type: string, format: uuid }
        start_time: { type: string, format: date-time }
        end_time: { type: [string, "null"], format: date-time }
        create_time: { type: string, format: date-time }
        state: { type: string, enum: [SUBSCRIPTION_STATE_TRIALING, SUBSCRIPTION_STATE_ACTIVE, SUBSCRIPTION_STATE_PAST_DUE, SUBSCRIPTION_STATE_PAUSED, SUBSCRIPTION_STATE_CANCELLED] }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        currency: { type: string }
        trial_end_time: { type: [string, "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
        pause_time: { type: [string, "null"], format: date-time }
        provider: { type: string }
        provider_ref: { type: string, description: The provider's id of the subscription, once it is linked }
        owner: { type: string, enum: [quotify, provider], description: Who renews it and retries failed renewals; a provider-owned subscription is changed at the provider }
        plan_code: { type: string }
        plan_version: { type: integer }
    RoutingRules:
      type: object
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2; empty matches any country }
              currency: { type: string, description: ISO 4217; empty matches any currency }
              provider: { type: string, enum: [iyzico, paddle] }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        environment: { type: string, enum: [ENVIRONMENT_SANDBOX, ENVIRONMENT_LIVE] }
        name: { type: string }
        tier: { type: string }
        currency: { type: string }
        timezone: { type: string }
        grace_period: { type: string }
        create_time: { type: string, format: date-time }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenants: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
        create_time: { type: string, format: date-time }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        prefix: { type: string }
        environment: { type: string, enum: [ENVIRONMENT_SANDBOX, ENVIRONMENT_LIVE] }
        status: { type: string, enum: [STATUS_ACTIVE, STATUS_REVOKED] }
        create_time: { type: string, format: date-time }
        revoke_time: { type: string, format: date-time }
