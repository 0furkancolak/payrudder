  /admin/v1/tenants/{tenant_id}/providers/{provider}/subscriptions/{id}/change:
    post:
      operationId: changeProviderSubscription
      summary: Change the plan or interval of a subscription the provider runs, at the provider, and let Payrudder's copy follow
      description: >
        200 when the provider applied the change and Payrudder followed; 202 when the provider applied it and Payrudder will follow when the provider's notification arrives.
        A payment that fails prevents the change.
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } }
      responses:
        "200": { description: Changed and followed }
        "202": { description: Changed at the provider; Payrudder follows later }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
