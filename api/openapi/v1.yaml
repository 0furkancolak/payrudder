        e_invoice_registered: { type: boolean }
    CreateMeterRequest:
      type: object
      required: [code, aggregation, unit_label]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        aggregation:
          type: string
          enum: [AGGREGATION_SUM, AGGREGATION_COUNT, AGGREGATION_MAX, AGGREGATION_UNIQUE, AGGREGATION_LAST]
          description: |
            How a customer's events of a billing period combine into one quantity. SUM adds the quantities, COUNT counts the events, MAX keeps the
            largest quantity. UNIQUE counts the distinct values of the event property named by value_property (an event without the property is not
            counted; quantity_scale must be 0). LAST is the quantity of the latest event of the period by event_time, ties broken by event id; an
            event that arrives after the period's cutoff never changes it. A code cannot change into or out of UNIQUE or LAST in a later version.
        value_property: { type: string, description: "Required for SUM, MAX and LAST (the event property holding the quantity) and for UNIQUE (the property whose distinct values are counted)" }
        filter: { type: object, additionalProperties: { type: object, properties: { values: { type: array, items: { type: string } } } } }
        quantity_scale: { type: integer, minimum: 0, maximum: 6, description: "Decimal places, fixed per code" }
        unit_label: { type: string, maxLength: 32, description: "Any unit of your choice: tokens, GB-h, seats, minutes", examples: ["tokens"] }
        category: { type: string, maxLength: 64, description: "Any group of your choice to file the meter under (compute, storage, AI); changes nothing in metering or billing", examples: ["AI"] }
    Meter:
      type: object
      required: [code, aggregation, value_property, filter, quantity_scale, unit_label, category, version, create_time]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        aggregation: { type: string, enum: [AGGREGATION_SUM, AGGREGATION_COUNT, AGGREGATION_MAX] }
        value_property: { type: string, description: Required for SUM and MAX }
        filter: { type: object, additionalProperties: { type: object, required: [values], properties: { values: { type: array, items: { type: string } } } } }
        quantity_scale: { type: integer, minimum: 0, maximum: 6, description: "Decimal places, fixed per code" }
        unit_label: { type: string, maxLength: 32, description: "Any unit of your choice: tokens, GB-h, seats, minutes", examples: ["tokens"] }
        category: { type: string, maxLength: 64, description: "Any group of your choice to file the meter under (compute, storage, AI); changes nothing in metering or billing", examples: ["AI"] }
        version: { type: integer }
        create_time: { type: string, format: date-time, nullable: true }
    Plan:
      type: object
      required: [id, code, name, latest_version, create_time]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        latest_version: { type: integer }
        create_time: { type: string, format: date-time, nullable: true }
    Price:
      type: object
      required: [meter_code, included]
      properties:
        meter_code: { type: string }
        per_unit: { type: object, required: [unit_price], properties: { unit_price: { type: string, examples: ["0.002"] } } }
        tiered:
          type: object
          required: [tiers]
          properties:
            tiers:
              type: array
              items:
                type: object
                required: [up_to, unit_price, flat_fee_minor]
                properties:
                  up_to: { type: string, description: Empty on the last (unbounded) tier }
                  unit_price: { type: string }
                  flat_fee_minor: { type: string, format: int64 }
        package:
          type: object
          required: [package_size, package_price_minor]
          properties:
            package_size: { type: string }
            package_price_minor: { type: string, format: int64 }
        included: { type: string, description: "Quantity of every billing period that is free: the model prices only what is above it. Empty or 0 = none", examples: ["1000"] }
    PriceInput:
      type: object
      required: [meter_code]
      properties:
        meter_code: { type: string }
        per_unit: { type: object, properties: { unit_price: { type: string, examples: ["0.002"] } } }
        tiered:
          type: object
          properties:
            tiers:
              type: array
              items:
                type: object
                properties:
                  up_to: { type: string, description: Empty on the last (unbounded) tier }
                  unit_price: { type: string }
                  flat_fee_minor: { type: string, format: int64 }
        package:
          type: object
          properties:
            package_size: { type: string }
            package_price_minor: { type: string, format: int64 }
        included: { type: string, description: "Quantity of every billing period that is free: the model prices only what is above it. Empty or 0 = none", examples: ["1000"] }
    QuotaWindow:
      type: string
      description: What a limit counts over, in the tenant's time zone. Unspecified is the month (the billing period). A year is the calendar year (twelve billing periods); a lifetime limit never starts again.
      enum: [QUOTA_WINDOW_UNSPECIFIED, QUOTA_WINDOW_MONTH, QUOTA_WINDOW_HOUR, QUOTA_WINDOW_DAY, QUOTA_WINDOW_WEEK, QUOTA_WINDOW_YEAR, QUOTA_WINDOW_LIFETIME]
    QuotaMode:
      type: string
      description: |
        What reaching the limit means for `allowed` (Payrudder never refuses usage events). HARD (also unspecified): allowed turns false at the
        limit. SOFT: allowed stays true and the usage over the limit is billed at the meter's price, which the package must have. NOTIFY: allowed
        stays true; only the alerts are sent.
      enum: [QUOTA_MODE_UNSPECIFIED, QUOTA_MODE_HARD, QUOTA_MODE_SOFT, QUOTA_MODE_NOTIFY]
    EntitlementTerms:
      type: object
      required: [limit]
      properties:
        limit: { type: string, description: Decimal in meter units; "0" = unlimited }
        alert_thresholds_pct: { type: array, maxItems: 10, items: { type: integer, minimum: 1, maximum: 1000 }, description: "Strictly ascending percentages of the limit at which an alert fires; empty = 80 and 100", examples: [[50, 80, 100]] }
        window: { $ref: "#/components/schemas/QuotaWindow" }
        mode: { $ref: "#/components/schemas/QuotaMode" }
    Entitlement:
      type: object
      required: [meter_code, limit, alert_thresholds_pct, window, mode]
      properties:
        meter_code: { type: string }
        limit: { type: string, description: Decimal in meter units; "0" = unlimited }
        alert_thresholds_pct: { type: array, maxItems: 10, items: { type: integer, minimum: 1, maximum: 1000 }, description: "Strictly ascending percentages of the limit at which an alert fires; empty = 80 and 100", examples: [[50, 80, 100]] }
        window: { $ref: "#/components/schemas/QuotaWindow" }
        mode: { $ref: "#/components/schemas/QuotaMode" }
    EntitlementInput:
      type: object
      required: [meter_code, limit]
      properties:
        meter_code: { type: string }
        limit: { type: string, description: Decimal in meter units; "0" = unlimited }
        alert_thresholds_pct: { type: array, maxItems: 10, items: { type: integer, minimum: 1, maximum: 1000 }, description: "Strictly ascending percentages of the limit at which an alert fires; empty = 80 and 100", examples: [[50, 80, 100]] }
        window: { $ref: "#/components/schemas/QuotaWindow" }
        mode: { $ref: "#/components/schemas/QuotaMode" }
    EntitlementOverride:
      type: object
      required: [customer_external_id, meter_code, create_time, update_time, limit, alert_thresholds_pct, window, mode]
      properties:
        customer_external_id: { type: string }
        meter_code: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        update_time: { type: string, format: date-time, nullable: true }
        limit: { type: string, description: Decimal in meter units; "0" = unlimited }
        alert_thresholds_pct: { type: array, maxItems: 10, items: { type: integer, minimum: 1, maximum: 1000 }, description: "Strictly ascending percentages of the limit at which an alert fires; empty = 80 and 100", examples: [[50, 80, 100]] }
        window: { $ref: "#/components/schemas/QuotaWindow" }
        mode: { $ref: "#/components/schemas/QuotaMode" }
    PlanVersion:
      type: object
