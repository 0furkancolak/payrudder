      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        customer_external_id: { type: string }
        plan_version_id: { type: string, format: uuid }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        create_time: { type: string, format: date-time }
        state: { type: string, enum: [SUBSCRIPTION_STATE_TRIALING, SUBSCRIPTION_STATE_ACTIVE, SUBSCRIPTION_STATE_PAST_DUE, SUBSCRIPTION_STATE_PAUSED, SUBSCRIPTION_STATE_CANCELLED] }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        currency: { type: string }
        trial_end_time: { type: string, format: date-time }
        cancel_at_period_end: { type: boolean }
        pause_time: { type: string, format: date-time }
        provider: { type: string }
        provider_ref: { type: string, description: "The provider's id of the subscription, once it is linked" }
        owner: { type: string, enum: [payrudder, provider], description: Who renews it and retries failed renewals; a provider-owned subscription is changed at the provider }
        plan_code: { type: string }
        plan_version: { type: integer }
        fee_timing: { type: string, enum: [FEE_TIMING_ADVANCE, FEE_TIMING_ARREARS] }
        scheduled_change: { $ref: "#/components/schemas/WebhookScheduledChange" }
        coupon_code: { type: string }
        quantity: { type: integer, description: "Seats: a plain multiplier of the plan's fixed fee, 1 unless set" }
