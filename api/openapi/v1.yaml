  /admin/v1/tenants/{tenant_id}/ledger:
    get:
      operationId: listPaymentLedger
      summary: The tenant's most recent payment ledger rows (charges, refunds) across providers, newest first
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        invoice_id: { type: string, format: uuid }
                        provider: { type: string }
                        environment: { type: string }
                        kind: { type: string, enum: [charge, refund, dispute, payout] }
                        status: { type: string, enum: [succeeded, declined, failed, pending] }
                        amount_minor: { type: integer }
                        currency: { type: string }
                        provider_ref: { type: string }
                        source: { type: string, enum: [command, webhook, reconciliation, manual] }
                        detail: { type: string }
                        occurred_at: { type: string, format: date-time }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/invoices/{invoice_id}/transfer:
    get:
      operationId: getInvoiceTransfer
      summary: The bank transfer state of an invoice (what is awaited, what has arrived)
      description: >
        For an invoice charged through the tenant's bank transfer account: the payment reference and bank details, the receipts recorded so far, and whether the
        transfer is pending, paid, expired or rejected. `state` is `none` when the invoice was not charged by bank transfer.
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceTransfer" } } } }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/invoices/{invoice_id}/transfer/receipts:
    post:
      operationId: confirmInvoiceTransfer
      summary: Confirm money that arrived by bank transfer for an invoice
      description: >
        Records one transfer. It is idempotent per (invoice, bank_reference): the same reference again answers 200 with `duplicate: true` (409
        `payments.transfer.reference_reused` when the amount differs). The currency must be the invoice's and the amount positive and at most what is outstanding
        (`payments.transfer.overpayment` otherwise: record what the invoice needs and handle the rest outside Payrudder). A partial amount is recorded and the invoice
        stays unpaid; when the receipts add up to the total the invoice saga is told and the invoice is paid. The actor is taken from the X-Payrudder-Actor header.
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Payrudder-Actor, in: header, description: Who confirms it (shown in the audit trail); "operator" when absent, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, currency, bank_reference]
              properties:
                amount_minor: { type: integer, format: int64, minimum: 1 }
                currency: { type: string, examples: [TRY] }
                received_at: { type: string, format: date-time, description: When the bank booked it. Default now; not in the future. }
                bank_reference: { type: string, maxLength: 128, description: "The bank's transaction or statement reference; it makes the call idempotent." }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: The same receipt was recorded before, content: { application/json: { schema: { $ref: "#/components/schemas/TransferReceiptResult" } } } }
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/TransferReceiptResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/invoices/{invoice_id}/transfer/reject:
    post:
      operationId: rejectInvoiceTransfer
      summary: Give up waiting for a bank transfer (it was refused or its time is up)
      description: >
        Marks the pending transfer declined and tells the invoice saga, so the tenant's dunning schedule applies at once (a new payment window, or uncollectible when no
        retry is left). Receipts already recorded stay recorded.
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Payrudder-Actor, in: header, schema: { type: string, maxLength: 120 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome: { type: string, enum: [rejected, expired], default: rejected }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceTransfer" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /webhooks/{provider}:
    post:
      operationId: providerWebhook
      summary: A payment provider's notification. Public; the body is never believed, the provider is asked to confirm it
      security: []
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, examples: [iyzico] } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Understood (processed, duplicate or ignored) }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /webhooks/{provider}/{tenant_id}/{environment}:
    post:
      operationId: tenantProviderWebhook
      summary: A payment provider's notification for one tenant's account (Paddle sends one per account). Public; verified with the account's webhook secret
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, examples: [paddle] } }
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: path, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Understood (processed, duplicate or ignored) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-subscriptions:
    get:
      operationId: listProviderSubscriptions
      summary: Subscriptions a payment provider runs for the tenant, as its notifications report them
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        environment: { type: string }
                        provider_ref: { type: string }
                        quotify_subscription_id: { type: string, format: uuid }
                        status: { type: string }
                        next_billed_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/checkouts:
    post:
      operationId: createProviderCheckout
      summary: A hosted checkout page where a customer subscribes at a provider that hosts one (Paddle)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, price_ref]
              properties:
                provider: { type: string, examples: [paddle] }
                price_ref: { type: string, description: The provider's id of what is sold, examples: [pri_01] }
                quantity: { type: integer, minimum: 1 }
                quotify_subscription_id: { type: string, format: uuid, description: Ties the provider's subscription to ours }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  ref: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-migrations:
    post:
      operationId: startProviderMigration
      summary: Move a subscription to another payment provider without charging the customer twice
      description: >
        To a provider that runs subscriptions itself (Paddle) a checkout is returned and the old subscription is untouched until the customer has subscribed
        there. To a provider Payrudder runs (iyzico) the new subscription takes over at once, or from a provider-run subscription at the end of the period
        the old provider was paid for; the old provider is told to stop renewing first.
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, to_provider]
              properties:
                subscription_id: { type: string, format: uuid }
                to_provider: { type: string, enum: [iyzico, paddle, banktransfer] }
                price_ref: { type: string, description: The target provider's catalogue price, for a provider that runs subscriptions itself }
      responses:
        "201":
          description: Started (checkout_url, state started) or done (new_subscription, cutover, state completed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  migration: { type: string, format: uuid }
                  state: { type: string, enum: [started, completed] }
                  checkout_url: { type: string }
                  new_subscription: { type: string, format: uuid }
                  cutover: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/provider-migrations/{migration_id}/abort:
    post:
      operationId: abortProviderMigration
      summary: Give up a migration that has not completed; the subscription stays as it was
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: migration_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Aborted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/providers/{provider}/catalogue/sync:
    post:
      operationId: syncProviderCatalogue
      summary: Make the provider hold a plan version, so it can be sold there
      description: >
        Creates the plan's product at the provider once and a recurring price for every interval and currency the plan version has a fee in. What is there already is
        left alone, so syncing twice is syncing once. A price in a currency the provider cannot bill is reported under `skipped`. Prices are immutable at the provider, which
        suits plan versions: a new version is new prices. Needs a provider whose adapter has a catalogue (Paddle).
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code: { type: string }
                plan_version: { type: integer, description: 0 = latest }
                product_name: { type: string }
                tax_category: { type: string, description: Default saas }
      responses:
        "200":
          description: What was created, what was there already and what was skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_version_id: { type: string }
                  product_ref: { type: string }
                  created: { type: object, additionalProperties: { type: string }, description: Payrudder's key of each price created to the provider's id }
                  existing: { type: object, additionalProperties: { type: string } }
                  skipped: { type: object, additionalProperties: { type: string }, description: Key to the reason }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/providers/{provider}/catalogue:
    get:
      operationId: listProviderCatalogue
      summary: What Payrudder has created at the provider (products, prices, discounts)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, key: { type: string }, ref: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/providers/{provider}/customers/{external_id}:
    post:
      operationId: ensureProviderCustomer
      summary: Make sure the customer exists at the provider, with an address for their country
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: external_id, in: path, required: true, schema: { type: string } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      responses:
        "200":
          description: The provider's ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_ref: { type: string }
                  address_ref: { type: string }
                  business_ref: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/providers/{provider}/customers/{external_id}/portal:
    post:
      operationId: createProviderPortalLink
      summary: A page where the customer manages payment methods and sees invoices at the provider
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: external_id, in: path, required: true, schema: { type: string } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/providers/{provider}/subscriptions/{id}/change-preview:
    post:
      operationId: previewProviderSubscriptionChange
      summary: What the provider would bill for a change of plan or interval of a subscription it runs
      description: Needs the plan version's price in the catalogue (sync it first). The provider applies a change at once; a change for the end of the period is refused.
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } }
      responses:
        "200":
          description: The provider's figures, in the shape of a tenant change quote
          content: { application/json: { schema: { $ref: "#/components/schemas/ChangeQuote" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
