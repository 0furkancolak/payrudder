openapi: 3.1.0
info:
  title: Payrudder API
  version: v1
  description: |
    Public HTTP/JSON API of the Payrudder gateway (docs/03-services/gateway.md).

    - Tenant routes authenticate with `Authorization: Bearer qk_{test|live}_<prefix>_<secret>`. `qk_test_` keys act on the
      account's sandbox tenant, `qk_live_` keys on its live tenant.
    - `/admin/v1` routes require `Authorization: Bearer <operator token>` (the machine credential `PAYRUDDER_OPERATOR_TOKEN`, for scripts, `payrudderctl` and tests;
      it is never typed into a page) **or** the session token of a platform operator: a person who signed in and verified an address listed in
      `PAYRUDDER_OPERATOR_EMAILS`. The server decides this on every request.
    - Field names are snake_case. Enums are strings. Per the protobuf JSON mapping, int64 values (`*_minor`, counts, sizes) are
      rendered as JSON strings (`type: string, format: int64`) and accepted as strings or numbers. Decimal quantities and prices are strings.
      The few objects the gateway builds by hand for the console and the operator (dashboards, overview, organization tables, the payment ledger,
      bank-transfer receipts) send their int64 values as JSON numbers; their schemas say `type: integer, format: int64`.
    - Objects that come from protobuf messages always carry every field (they are `required` in the schema): a number is `0`, a string `""`, a list `[]`,
      and a timestamp or nested object that is not set is `null` (marked `nullable`). A field that can be left out of an object is not in `required`.
    - Lists that take `page_size` and `page_token` answer `next_page_token` (an empty string on the last page). A list without `page_token` returns its
      whole set (or, for `limit`, the newest rows up to that limit) and says so.
    - Idempotency: `POST /v1/events` takes an `idempotency_key` per event; credits (`grantCredits`, `consumeCredits`), `createPaymentLink` and `createUploadSession`
      also take it in the `Idempotency-Key` header. Every other write is not deduplicated by a key: a repeated create answers `409` where the object has a natural
      unique key (customer, meter, plan, coupon, ...).
    - Errors always use the `Error` envelope. 429 responses carry `Retry-After` (seconds).

    This file is hand-maintained. A contract test fails if a route in the gateway's route table is missing here or vice versa.
servers:
  - url: http://localhost:42800
security:
  - apiKey: []

paths:
  /v1/events:
    post:
      operationId: ingestEvents
      summary: Ingest usage events (1..500 per request, at most 1 MiB)
      description: |
        Answers `202` with one result per event, in request order, for any structurally valid batch. A bad event does not
        fail the batch: it comes back `rejected` with an `error_code`. Live keys must send an `idempotency_key` per event;
        a retry with the same key and payload returns `duplicate` with the original `event_id`. `quantity` may be a JSON
        string or number and is parsed as an exact decimal (never as a float).
        The `ingest` rate limit is charged per event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestEventsRequest" }
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestEventsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      operationId: listCustomers
      summary: List customers (ordered by external_id)
      parameters:
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListCustomersResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}:
    get:
      operationId: getCustomer
      summary: Get a customer by external id
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/payment-method:
    put:
      operationId: setPaymentMethod
      summary: Set the customer's PSP token (sandbox accepts only pm_sandbox_* tokens)
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPaymentMethodRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/customers/{external_id}/address:
    put:
      operationId: setCustomerAddress
      summary: Replace the customer's billing address
      description: The address is printed on the customer's invoices (PDF and hosted page). Its country becomes the customer's country, which provider routing and tax read. An empty object clears the address and keeps the country.
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/customers/{external_id}/tax:
    put:
      operationId: setCustomerTax
      summary: Replace the customer's tax data used on e-invoices
      description: Tax id (VKN/TCKN in Turkey, VAT id in the EU), tax office (Turkey) and whether the customer is registered for e-fatura. Empty values clear them. Error key plans.customer.tax_invalid.
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CustomerTax" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/e-invoices:
    get:
      operationId: listEInvoices
      summary: The legal e-documents (e-fatura, e-arşiv, Peppol) of invoices and credit notes, newest first
      parameters:
        - { name: invoice_id, in: query, schema: { type: string, format: uuid } }
        - { name: credit_note_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, issued, failed, cancelled] } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EInvoiceList" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/e-invoices/{id}:
    get:
      operationId: getEInvoice
      summary: One e-document
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EInvoiceDocument" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/e-invoices/{id}/files/{kind}:
    get:
      operationId: getEInvoiceFile
      summary: A presigned link to the UBL XML or the PDF of an issued e-document (5 minutes)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [xml, pdf] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignedUrl" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/meters:
    post:
      operationId: createMeter
      summary: Create a meter, or the next version of an existing code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMeterRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Meter" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      operationId: listMeters
      summary: List meters (latest version of each code)
      description: "Not paged: the response is the complete list."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListMetersResponse" }
  /v1/meters/{code}:
    get:
      operationId: getMeter
      summary: Get the latest version of a meter
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Meter" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/customers/{external_id}/usage:
    get:
      operationId: getCustomerUsage
      summary: On-time usage of a customer in a period, per meter
      description: |
        Quantities are exact decimals with the meter's scale. Usage that arrived after the period's cutoff is not
        included here: it is billed on a later invoice as late usage. `period` defaults to the current period in the
        tenant's time zone.
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", examples: ["2026-11"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetCustomerUsageResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/entitlements:
    get:
      operationId: listEntitlements
      summary: Usage against the limits of every meter the customer has an entitlement on
      description: 'See `getEntitlement` for the semantics of each item. Not paged: the response is the complete list.'
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", examples: ["2026-11"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntitlementsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/entitlements/{meter}:
    get:
      operationId: getEntitlement
      summary: Usage of one meter against the customer's limit
      description: |
        Answered from near-real-time counters. They are eventually consistent (typically well under 2 s behind ingest):
        `as_of` is the ingest time of the newest event reflected in `used`. Payrudder never blocks ingest on a limit; call
        this before serving your customer and decide what to do. A customer without an entitlement on the meter is
        `unlimited`. `period` defaults to the current period in the tenant's time zone.

        A limit counts over its `window`: the billing month, or an hour, a day, an ISO week, a calendar year or the customer's
        whole lifetime, in the tenant's time zone. `period` picks the month of a monthly limit; every other window always
        reports its current one (`window_id`, ending at `resets_at`, which a lifetime window does not have). `allowed` follows
        the limit's `mode`: a `hard` limit stops allowing at the limit, a `soft` or `notify` one keeps allowing and says
        `over_limit`. Every window's counter is reconciled against the aggregator every few minutes, so an event delivered
        twice stops counting twice within one cycle.
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: meter, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", examples: ["2026-11"] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementStatus" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/entitlement-overrides:
    get:
      operationId: listEntitlementOverrides
      summary: The customer's own limits, which replace its package's on their meters
      description: "Not paged: the response is the complete list."
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntitlementOverridesResponse" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/entitlement-overrides/{meter}:
    put:
      operationId: setEntitlementOverride
      summary: Give the customer its own limit on a meter
      description: |
        Replaces the entitlement the customer's package gives on the meter, or adds one on a meter the package does not limit, for every
        subscription of the customer until the override is deleted. limits-svc applies it within seconds. `QUOTA_MODE_SOFT` needs every
        current package of the customer to price the meter (the usage over the limit is billed at that price).
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: meter, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementTerms" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementOverride" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEntitlementOverride
      summary: Return the customer to its package's limit on the meter
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: meter, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/plans:
    post:
      operationId: createPlan
      summary: Create a plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listPlans
      summary: List plans
      description: "Not paged: the response is the complete list."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListPlansResponse" }
  /v1/plans/{code}/versions:
    post:
      operationId: publishPlanVersion
      summary: Publish the next immutable plan version
      parameters: [{ $ref: "#/components/parameters/PlanCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishPlanVersionRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PlanVersion" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/plans/{code}/versions/{version}:
    get:
      operationId: getPlanVersion
      summary: Get a plan version (a number or "latest")
      parameters:
        - { $ref: "#/components/parameters/PlanCode" }
        - { name: version, in: path, required: true, schema: { type: string, examples: ["1", "latest"] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanVersion" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: Subscriptions, newest first
      parameters:
        - { name: customer, in: query, description: Customer external id, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSubscriptionsResponse" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSubscription
      summary: Subscribe a customer to a plan version (at most one overlapping subscription per customer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSubscriptionRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      summary: One subscription with its state
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelSubscription
      summary: End a subscription (now, or at end_time)
      description: >
        With credit_unused=true the fee paid in advance for the rest of the current period is credited to the customer's balance (for a subscription billed in
        advance that Payrudder runs, ended now, without a coupon). The response is always {subscription, credited_minor}; credited_minor is "0" when
        nothing was credited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: end_time, in: query, schema: { type: string, format: date-time } }
        - { name: credit_unused, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelSubscriptionResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/pause:
    post:
      operationId: pauseSubscription
      summary: Stop the fixed fee until the subscription is resumed (usage is still billed)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/resume:
    post:
      operationId: resumeSubscription
      summary: Resume a paused subscription
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/cancel-at-period-end:
    post:
      operationId: scheduleCancellation
      summary: End the subscription at the end of its current billing period
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: withdrawCancellation
      summary: Withdraw a scheduled cancellation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/change-plan:
    post:
      operationId: changePlan
      summary: Move the subscription to another plan version now, prorating the fixed fee
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePlanRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePlanResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/change-preview:
    post:
      operationId: previewSubscriptionChange
      summary: What a change of plan or interval would cost, without making it
      description: The same calculation as the change itself, so the preview is what is then billed. For subscriptions whose fee is invoiced in advance.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeQuote" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/change:
    post:
      operationId: changeSubscription
      summary: Move a subscription to another plan version and/or interval, now or at the end of the paid period
      description: |
        An upgrade or monthly-to-yearly change is immediate and prorated; a downgrade or yearly-to-monthly change waits for the end of the period the customer has paid for
        (a scheduled change, shown on the subscription). A change of `quantity` alone is immediate and prorated, more seats or fewer. Whatever moves money is invoiced, or becomes a credit balance when the new plan costs less than the unused old time was worth.
        Answers 409 `ABORTED` if the fee of the current period has not been invoiced yet; try again in a moment.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSubscriptionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/coupon:
    post:
      operationId: applyCoupon
      summary: Redeem a coupon on a subscription that has none
      description: A coupon takes something off a fixed fee Payrudder invoices in advance. A subscription a provider renews uses a discount at the provider instead.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApplyCouponRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeCoupon
      summary: Take the coupon off a subscription (the redemption is not given back)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/tax-rates:
    get:
      operationId: getTaxRates
      summary: The tax Payrudder adds to the invoices it raises, by customer country
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaxRates" } } } }
    put:
      operationId: setTaxRates
      summary: Replace the tax rates
      description: >
        Payrudder applies the rates as given, exclusive of the price, to the invoices it raises (monthly usage, fees in advance, plan changes) for customers whose country has a rate, or the
        rate with an empty country. It does not work out what is due where; the rates and their correctness are the tenant's. Invoices of a subscription a provider runs are taxed by the provider.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaxRatesInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaxRates" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/dunning-settings:
    get:
      operationId: getDunningSettings
      summary: How long Payrudder waits before it retries a declined payment
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DunningSettings" } } } }
    put:
      operationId: setDunningSettings
      summary: Replace the retry delays
      description: >
        Up to six delays, each 1 to 720 hours (minutes in a sandbox tenant). A declined charge is retried after the first delay, then the second, and so on; when
        the delays run out the invoice is given up as uncollectible. An empty list gives up on the first decline.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DunningSettingsInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DunningSettings" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/credit-packs:
    get:
      operationId: listCreditPacks
      summary: The credit packs the tenant sells
      description: "Not paged: the response is the complete list."
      parameters: [{ name: active, in: query, schema: { type: boolean }, description: "true leaves out packs withdrawn from sale" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditPackList" } } } }
    post:
      operationId: createCreditPack
      summary: Add a credit pack
      description: A pack is a number of credits for a price in one currency. A customer buys it through a payment link; the credits are granted when the payment is confirmed.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditPackInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreditPack" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/credit-packs/{id}/activate:
    post:
      operationId: activateCreditPack
      summary: Put a credit pack back on sale
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EmptyObject" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/credit-packs/{id}/deactivate:
    post:
      operationId: deactivateCreditPack
      summary: Withdraw a credit pack from sale
      description: Credits already sold are not touched.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EmptyObject" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/credits:
    get:
      operationId: getCreditBalance
      summary: What a customer can spend now
      description: The balance leaves out credits whose time has passed. `lots` shows where it comes from, the credits that expire first at the top.
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditBalance" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/credits/grant:
    post:
      operationId: grantCredits
      summary: Add credits to a customer
      description: >
        For a promotion, a goodwill gesture or a sale made outside Payrudder. With an `idempotency_key` (or the `Idempotency-Key` header) a repeat of the call adds nothing and
        returns `replayed: true`; the same key with other values is `billing.credits.key_reused`.
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditGrantInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/credits/consume:
    post:
      operationId: consumeCredits
      summary: Spend credits
      description: >
        Takes the credits that expire first. With too few credits nothing is taken and the answer is 409 `billing.credits.insufficient`. An `idempotency_key` (or the
        `Idempotency-Key` header) is required: a retried call returns the first result with `replayed: true` instead of charging twice.
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditConsumeInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/credits/ledger:
    get:
      operationId: listCreditLedger
      summary: Every change to a customer's credits, newest first
      parameters:
        - { $ref: "#/components/parameters/ExternalID" }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditLedgerPage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/expenses:
    get:
      operationId: listExpenses
      summary: The expenses the tenant recorded, newest first
      description: A recurring expense is one entry, listed at its first day. Voided expenses are left out unless `include_voided` is true.
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/ExpenseCategory" } }
        - { name: app_id, in: query, schema: { type: string, format: uuid } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Only entries whose (first) day is on or after this day" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Only entries whose (first) day is on or before this day" }
        - { name: include_voided, in: query, schema: { type: boolean } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExpensePage" } } } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: createExpense
      summary: Record an expense
      description: >
        Money the tenant spent, in one currency. A monthly or yearly expense is one entry that falls on the same day of every month or year from `incurred_on`
        (on the last day of a shorter month) until `recurring_until`; its occurrences are worked out when a summary is asked for.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/expenses/{id}:
    put:
      operationId: updateExpense
      summary: Replace an expense
      description: The body replaces the whole record; a recurring expense changes in all its occurrences. A voided expense is not edited (`billing.accounting.expense_voided`).
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: voidExpense
      summary: Void an expense
      description: >
        The expense is not deleted: it leaves every summary and keeps its reason. The reason (1 to 200 characters) comes in the body `{"reason": "..."}` or in `?reason=`.
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: reason, in: query, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/VoidExpenseRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/expense-inbox:
    get:
      operationId: getExpenseInbox
      summary: The tenant's invoice inbox address
      description: >
        Invoices received by mail are forwarded to `invoices+<token>@<inbound domain>`. The attachments wait as items to review; the console reads them in the browser.
        Made on first use. `address` is empty until the deployment sets an inbound domain (PAYRUDDER_INBOUND_DOMAIN).
      parameters: [{ name: app_id, in: query, schema: { type: string, format: uuid }, description: "The inbox of one app instead of the whole tenant" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseInbox" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/expense-inbox/rotate:
    post:
      operationId: rotateExpenseInbox
      summary: Give the invoice inbox a new address
      description: Mail sent to the old address is dropped.
      parameters: [{ name: app_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseInbox" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/expense-inbox/items:
    get:
      operationId: listInboxItems
      summary: The attachments received by mail, newest first
      description: "Not paged: the newest page_size items; there is no page_token, so older items come into view once the newer ones are resolved."
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [to_review, accepted, dismissed], default: to_review } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InboxItemPage" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/expense-inbox/items/{id}/file:
    get:
      operationId: getInboxItemFile
      summary: The bytes of a received attachment
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: "The file as it came (PDF, PNG or JPEG)", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/expense-inbox/items/{id}/resolve:
    post:
      operationId: resolveInboxItem
      summary: Mark a received attachment accepted or dismissed
      description: An item is resolved once. Accepting records the expense that was made from it.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveInboxItemRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InboxItem" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/expense-rules:
    get:
      operationId: listExpenseRules
      summary: The recurring-vendor rules
      description: "Not paged: the response is the complete list."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListExpenseRulesResponse" } } } }
    post:
      operationId: createExpenseRule
      summary: Add a recurring-vendor rule
      description: >
        A vendor whose name contains `vendor_match` gets the category, currency and tax of the rule. With `auto_approve` the console records the expense on its own when the
        amount read from the document is within `tolerance_bps` of `expected_amount_minor`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseRuleInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseRule" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/expense-rules/{id}:
    put:
      operationId: updateExpenseRule
      summary: Replace a recurring-vendor rule
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseRuleInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseRule" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteExpenseRule
      summary: Delete a recurring-vendor rule
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /inbound/invoices:
    post:
      operationId: inboundInvoices
      summary: A forwarded mail from the mail provider. Public; protected by a shared secret
      description: >
        The webhook of the mail provider's inbound address (Resend, Nafru or alike) posts each received mail here. The body is the mail, or `{"type": "email.received", "data": {...}}`
        around it: `from`, `to` (a string, a list of strings or of `{email}`), `subject` and `attachments` (`filename`, `content_type`, `content` base64). The tenant is the token in
        the recipient `invoices+<token>@<domain>`. PDF, PNG and JPEG attachments (judged by their bytes) up to 3 MiB in all become items to review; the rest are skipped. Authenticate
        with `Authorization: Bearer <secret>`, `X-Inbound-Secret` or `?secret=`. Answers 200 for an unknown address too. 404 until PAYRUDDER_INBOUND_SECRET is set.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InboundInvoicesRequest" } } }
      responses:
        "200": { description: Understood, content: { application/json: { schema: { $ref: "#/components/schemas/InboundInvoicesResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: Wrong secret }
        "404": { $ref: "#/components/responses/Error" }
  /v1/accounting/summary:
    get:
      operationId: getAccountingSummary
      summary: Income and expenses of a period, one block per currency
      description: >
        Currencies are never converted or added together. Income is read from the invoices: an invoice counts on the UTC day its payment succeeded (gross is its total, tax its TAX lines),
        credit notes against paid invoices and invoices refunded in full are the refunds. Provider commission is not recorded by Payrudder; `provider_fees_minor` is what the tenant entered as
        `payment_fees` expenses, and `provider_fees_recorded` is false when there is none. `expenses_minor` includes those fees. `profit_minor` is net income minus expenses.
        The series has one point for every day (or month) of the period. `app_id` limits the expenses, not the income.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date }, description: "First day, inside the period" }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: "Last day, inside the period; at most five years after `from`" }
        - { name: app_id, in: query, schema: { type: string, format: uuid } }
        - { name: granularity, in: query, schema: { type: string, enum: [day, month] }, description: "Default: day up to 62 days, month beyond. Day is allowed for at most 366 days." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountingSummary" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/accounting/export.csv:
    get:
      operationId: exportAccountingCsv
      summary: The accounting series as CSV
      description: >
        The query of the summary. One row per currency and day (or month), then a `total` row per currency; amounts are minor units. The `provider_fees_minor` of a total row is
        `not_recorded` when no `payment_fees` expense exists. `discounts_minor` is what coupons took off (contra-revenue) and `sales_before_discounts_minor` is gross - tax + discounts.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: app_id, in: query, schema: { type: string, format: uuid } }
        - { name: granularity, in: query, schema: { type: string, enum: [day, month] } }
      responses:
        "200": { description: OK, content: { text/csv: { schema: { type: string } } } }
  /v1/accounting/coupons.csv:
    get:
      operationId: exportAccountingCouponsCsv
      summary: Gross sales, discounts and net per coupon as CSV
      description: >
        The query of the summary. One row per currency and coupon over the invoices paid in the period: their number, what they came to before the coupon (positive lines, tax excluded),
        what the coupon took off, and the net. Currencies are never added together.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: app_id, in: query, schema: { type: string, format: uuid } }
        - { name: granularity, in: query, schema: { type: string, enum: [day, month] } }
      responses:
        "200": { description: OK, content: { text/csv: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/credits/settings:
    get:
      operationId: getCreditSettings
      summary: The low-balance threshold of the credits.low event
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditSettings" } } } }
    put:
      operationId: setCreditSettings
      summary: Set the low-balance threshold
      description: >
        A consume that takes a customer's balance from at least `low_threshold` credits to fewer announces `credits.low` once (the webhook event). 0, the default, turns it off.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditSettingsInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditSettings" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/webhook-endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Register an HTTPS endpoint that receives Payrudder's events
      description: >
        Payrudder sends a signed JSON POST to the endpoint for each event of the types it asks for (all types if none). The response carries the signing secret, once; it cannot be
        read again, only rotated. Verify each delivery with the `Payrudder-Signature` header: `t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>" with the secret>` (two `v1` while a
        rotated secret is still accepted); reject a timestamp more than five minutes from your clock. Answer 2xx within 10 seconds; anything else is retried after 1 minute, 5 minutes, 30 minutes,
        2 hours, 6 hours and 24 hours, then given up (a delivery can be sent again by hand). Events are delivered at least once and not in order: use the event `id` to ignore repeats.
        The URL must be https and public; at most 20 endpoints.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listWebhookEndpoints
      summary: The tenant's webhook endpoints
      description: "Not paged: the response is the complete list."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListWebhookEndpointsResponse" } } } }
  /v1/webhook-endpoints/{id}:
    put:
      operationId: updateWebhookEndpoint
      summary: Replace an endpoint's url, description, event types and active flag
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpointInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhookEndpoint
      summary: Delete an endpoint and its delivery history
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/webhook-endpoints/{id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      summary: Make a new signing secret (returned once); the old one keeps signing for 24 hours
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/webhook-endpoints/{id}/test:
    post:
      operationId: sendTestWebhook
      summary: Send a ping event to one endpoint
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: Deliveries, newest first, with how each attempt went
      parameters:
        - { name: endpoint_id, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [pending, delivered, failed] } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListWebhookDeliveriesResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/webhook-deliveries/{id}/redeliver:
    post:
      operationId: redeliverWebhook
      summary: Send a delivery again from the start, whatever became of it
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/coupons:
    post:
      operationId: createCoupon
      summary: Make a coupon
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CouponInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Coupon" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listCoupons
      summary: Coupons, newest first
      description: "Not paged: the response is the complete list."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListCouponsResponse" } } } }
  /v1/coupons/{code}:
    delete:
      operationId: deactivateCoupon
      summary: Stop new redemptions of a coupon (subscriptions that have it keep it)
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Coupon" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/coupons/{code}/promotion-codes:
    post:
      operationId: createPromotionCodes
      summary: Make promotion codes for a coupon
      description: "Name the codes (2-40 letters, digits, - or _; the same in any case) or ask for count random ones (1-1000, prefix + 8 characters without 0, O, 1, I, L). Every code gets the template's limit, expiry and restrictions."
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreatePromotionCodes" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePromotionCodesResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/promotion-codes:
    get:
      operationId: listPromotionCodes
      summary: Promotion codes, newest first
      parameters:
        - { name: coupon, in: query, schema: { type: string }, description: Only the codes of this coupon }
        - { name: state, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: search, in: query, schema: { type: string }, description: Part of the code }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListPromotionCodesResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/promotion-codes/{code}:
    delete:
      operationId: deactivatePromotionCode
      summary: Stop new redemptions of one code (the coupon and its other codes keep working)
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromotionCode" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/coupon-redemptions:
    get:
      operationId: listCouponRedemptions
      summary: Uses of coupons, newest first
      description: "One row per use: the coupon and the code, the customer, what it was used on (the subscription, or the invoice of the purchase) and what it took off. A void or a full refund marks the row reversed."
      parameters:
        - { name: coupon, in: query, schema: { type: string } }
        - { name: promotion_code, in: query, schema: { type: string } }
        - { name: customer_external_id, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListCouponRedemptionsResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/promotions/quote:
    post:
      operationId: quotePromotion
      summary: What a code would take off a purchase (claims nothing)
      description: "For a checkout page of your own. The answer is the discount or the bonus credits, or an error with a coupon.* key: coupon.expired, coupon.exhausted, coupon.not_applicable, coupon.currency_mismatch, coupon.already_used and the others in the error key list."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PromotionQuoteRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromotionQuote" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/coupons:
    post:
      operationId: grantCustomerCoupon
      summary: Give a customer a coupon that their next eligible checkout uses without a code
      description: One grant per (customer, source, source_ref); repeating it grants nothing more.
      parameters: [{ name: external_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GrantCustomerCouponRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GrantCustomerCouponResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/affiliates/program:
    get:
      operationId: getAffiliateProgram
      summary: The partner program of this environment
      description: "One program per environment, so the sandbox and live have their own. 404 with the key affiliate.program.not_set before one is set."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AffiliateProgram" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setAffiliateProgram
      summary: Set the rules of the partner program
      description: "Replaces the program. A change applies to commissions earned from then on, never to those already earned. A commission is a share of the net, pre-tax amount of a paid invoice (percent_bps) or a fixed amount in one currency (fixed, earned only on invoices in that currency)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AffiliateProgramInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AffiliateProgram" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/affiliates:
    post:
      operationId: createAffiliate
      summary: Add a partner
      description: "The code (3 to 32 letters, numbers, - or _) is unique across the whole platform because the public link /r/<code> carries no tenant; leave it out for a random one. A partner you add is active unless you ask for pending."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAffiliateRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Affiliate" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listAffiliates
      summary: Partners, newest first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, active, suspended] } }
        - { name: search, in: query, schema: { type: string }, description: "Part of the code, e-mail address or name" }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListAffiliatesResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/affiliates/referrals:
    get:
      operationId: listAffiliateReferrals
      summary: The customers partners brought, newest first
      description: The customer's e-mail address is masked (j***@example.com).
      parameters:
        - { name: affiliate_id, in: query, schema: { type: string, format: uuid }, description: Only this partner's }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListAffiliateReferralsResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/affiliates/commissions:
    get:
      operationId: listAffiliateCommissions
      summary: Commissions and the reversal rows that net against them, newest first
      description: "One commission per paid invoice of a customer a partner brought, in the invoice's currency, on the net, pre-tax amount paid. It is pending for the program's hold (the refund window), then approved, then paid by a payout. A refund, void or credit note takes it back (reversed_minor); one already paid is netted by a negative row of kind reversal that the next payout takes."
      parameters:
        - { name: affiliate_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, paid, reversed] } }
        - { name: kind, in: query, schema: { type: string, enum: [commission, reversal] } }
        - { name: invoice_id, in: query, schema: { type: string, format: uuid } }
        - { name: payout_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Earned at or after }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Earned before }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListAffiliateCommissionsResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/affiliates/commissions/reverse:
    post:
      operationId: reverseAffiliateCommission
      summary: Take a commission back for a chargeback, or by hand
      description: "Refunds, voids and credit notes reverse on their own. The same (invoice, reason, reference) takes back once. A commission that was paid is netted from the partner's next payout."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReverseAffiliateCommissionRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReverseAffiliateCommissionResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/affiliates/balances:
    get:
      operationId: getAffiliateBalances
      summary: What each partner has, per currency
      description: "pending (in the hold), approved (available for a payout, net of reversals), paid (paid out, net of what was netted) and reversed (taken back in all). Currencies are never added together."
      parameters: [{ name: affiliate_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GetAffiliateBalancesResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/affiliates/funnel:
    get:
      operationId: getAffiliateFunnel
      summary: Clicks, referred customers, paying customers and commissions over a period
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day, UTC; default 30 days before to" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day, UTC; default today" }
        - { name: affiliate_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AffiliateFunnel" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/affiliates/payouts:
    get:
      operationId: listAffiliatePayouts
      summary: Payouts to partners, newest first
      description: "A payout is the approved commissions of one partner in one currency (no conversion), with the negative rows that net earlier payments taken back. An open payout is worth what its commissions are worth now."
      parameters:
        - { name: affiliate_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, paid, cancelled] } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListAffiliatePayoutsResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAffiliatePayouts
      summary: Batch the approved commissions into open payouts
      description: "For one partner or for every active partner, one payout per currency. A batch below the program's minimum payout, or not above zero, is skipped and reported; what is approved later joins a payout that is still open. A suspended partner is not paid; their balance is kept. A live environment that is not active pays nobody (affiliate.payout.tenant_not_active)."
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAffiliatePayoutsRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreateAffiliatePayoutsResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/affiliates/payouts/{id}/pay:
    post:
      operationId: markAffiliatePayoutPaid
      summary: Record that you paid a payout, and post it
      description: "Payrudder moves no money: pay by hand or bank transfer, then say so. The commissions become paid and the journal gets the commission expense against the payable, and the payable against cash, balanced in the payout's currency. Doing it again changes nothing. In the sandbox the payout is fake and its postings say so."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/MarkAffiliatePayoutPaidRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AffiliatePayout" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/affiliates/payouts/{id}/cancel:
    post:
      operationId: cancelAffiliatePayout
      summary: Drop an open payout
      description: Its commissions go back to being payable in another payout.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AffiliatePayout" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/affiliates/journal:
    get:
      operationId: listAffiliateJournal
      summary: The postings of paid payouts, with debit and credit totals per currency
      description: "totals cover the whole filter, not only the page. The books balance when debits equal credits in every currency; the database refuses to commit postings that do not."
      parameters:
        - { name: payout_id, in: query, schema: { type: string, format: uuid } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListAffiliateJournalResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/affiliates/journal.csv:
    get:
      operationId: exportAffiliateJournal
      summary: The same postings as a CSV file, with a total line per currency
      parameters:
        - { name: payout_id, in: query, schema: { type: string, format: uuid } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { text/csv: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/affiliates/{id}:
    get:
      operationId: getAffiliate
      summary: One partner with their click and referral counts
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Affiliate" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAffiliate
      summary: Change a partner's name, payout details or status
      description: "status active approves a pending partner or reinstates a suspended one; suspended stops new attributions and commissions but keeps what was approved. Nothing returns to pending."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAffiliateRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Affiliate" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/affiliates/{id}/promotion-code:
    put:
      operationId: linkAffiliatePromotionCode
      summary: Make a promotion code the partner's
      description: A customer who redeems the code at a checkout is attributed to the partner, as if they had followed the link.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LinkAffiliatePromotionCodeRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Affiliate" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/referral:
    post:
      operationId: attributeCustomer
      summary: Say which partner brought a customer
      description: "For your own sign-up, which reads the ?ref= of the link. First touch wins: a customer who has an attribution keeps it. A refusal is a normal answer (attributed false and a reason), not an error: already_attributed, unknown_code, program_inactive, affiliate_inactive, expired, same_email, same_domain, same_payment_method."
      parameters: [{ name: external_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AttributeCustomerRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttributeCustomerResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/scheduled-change:
    delete:
      operationId: cancelScheduledChange
      summary: Withdraw the change waiting for the end of the period
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/reports/revenue:
    get:
      operationId: getRevenueReport
      summary: Invoices summed by period, payment provider, customer country and currency (currencies are never added together)
      parameters:
        - { name: from, in: query, description: "First period, YYYY-MM", schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: to, in: query, description: "Last period, YYYY-MM", schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: group_by, in: query, description: "Comma-separated: period, provider, country (default period). Currency is always split", schema: { type: string, examples: ["period,provider"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetRevenueReportResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/reports/dunning:
    get:
      operationId: getDunningReport
      summary: Invoices whose payment has not gone through (declined and retrying, outcome unknown, given up)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetDunningReportResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/reports/subscriptions:
    get:
      operationId: getSubscriptionReport
      summary: Subscriptions and monthly recurring revenue at the end of a month, with the new and the churned, by provider, country and currency
      parameters:
        - { name: month, in: query, description: "YYYY-MM in the tenant's time zone; default the current month", schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: group_by, in: query, description: "Comma-separated: provider, country. Currency is always split", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetSubscriptionReportResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/routing-rules:
    get:
      operationId: getRoutingRules
      summary: The ordered rules that choose a new subscription's payment provider from the customer's country and the subscription's currency
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoutingRules" } } } }
    put:
      operationId: setRoutingRules
      summary: Replace the rules (first match wins; a rule with neither country nor currency is the catch-all and must be last). Existing subscriptions keep their provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutingRulesInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoutingRules" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/mail-settings:
    get:
      operationId: getMailSettings
      summary: Which kinds of e-mail Payrudder sends for the tenant (all on until switched off)
      description: |
        Categories: `invoice_issued`, `payment_receipts`, `payment_failed`, `usage_alerts`, `system`. A mail of a category that is off is dropped by the notifier
        (counted in `notifier_mail_dropped_total`), not retried. Whether a provider sends its own receipts is a separate rule (Paddle does, so Payrudder sends none for its payments).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MailSettings" } } } }
    put:
      operationId: setMailSettings
      summary: Switch the listed categories on or off; the others keep their setting
      description: An unknown category is rejected with the error key `plans.mail.unknown_category`. A category listed twice takes its last value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailSettingsInput" }
      responses:
        "200": { description: Every category with its new state, content: { application/json: { schema: { $ref: "#/components/schemas/MailSettings" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/routing-rules/preview:
    post:
      operationId: previewRouting
      summary: Where a customer in a country paying in a currency would go, without creating anything
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewRoutingRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewRoutingResponse" }

  /v1/invoices:
    get:
      operationId: listInvoices
      summary: List invoices (ordered by id)
      parameters:
        - { name: customer, in: query, description: Customer external id, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: status, in: query, schema: { type: string, enum: [draft, open, paid, uncollectible, void] } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListInvoicesResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/credit-notes:
    get:
      operationId: listCreditNotes
      summary: Credit notes, newest first
      parameters:
        - { name: invoice_id, in: query, schema: { type: string, format: uuid } }
        - { name: customer, in: query, description: Customer external id, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListCreditNotesResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/credit-notes/{id}:
    get:
      operationId: getCreditNote
      summary: A credit note
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CreditNote" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      summary: One invoice with its lines
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/invoices/{id}/links:
    post:
      operationId: createInvoiceLink
      summary: Make a link to the invoice that its customer can open without signing in
      description: >
        The link shows the finalized invoice as a page, and its PDF once it is rendered. It is unguessable (256 random bits; only a hash is kept), works until expires_in_days
        (default 90, at most 365) or until revoked, and the token is returned once. The page is not indexed or cached, loads nothing from elsewhere, and is available in
        English, Turkish, German, French, Spanish and Arabic (`?lang=` or the browser's language). The url is absolute when the gateway knows its public address (PAYRUDDER_PUBLIC_URL).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateInvoiceLinkRequest" } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInvoiceLinkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeInvoiceLinks
      summary: Make every link to the invoice stop working
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RevokeInvoiceLinksResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /r/{code}:
    get:
      operationId: affiliateLink
      summary: "A partner's public link (public)"
      description: "Counts one visit for the partner (per day, no visitor kept), sets the first-party cookie payrudder_ref (the partner's code and the time of the visit, for the program's attribution window) and sends the visitor to the program's landing page with ?ref=<code> added, or shows a thank-you page. The payment pages (/i/..., /c/...) accept ?ref=<code> the same way and read the cookie when a payment starts. A code that is not an active partner's of an active program answers the usual 404 page. The code is unique across the platform, so the link carries no tenant. At most 60 requests a minute per address."
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, tr, de, fr, es, ar] } }
      responses:
        "200": { description: "A thank-you page, when the program has no landing page", content: { text/html: { schema: { type: string } } } }
        "302": { description: "Redirect to the program's landing page, with the cookie set" }
        "404": { description: "No such partner", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /privacy:
    get:
      operationId: privacyPage
      summary: "What the referral cookie holds, what is counted and what a visitor can do (public)"
      security: []
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [en, tr, de, fr, es, ar] } }
      responses:
        "200": { description: "The privacy page", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /i/{token}:
    get:
      operationId: hostedInvoicePage
      summary: "The invoice as a page (public, the token in the path is the credential)"
      description: An unknown, expired or revoked token answers the same 404 page. At most 60 requests a minute per address.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, tr, de, fr, es, ar] } }
      responses:
        "200": { description: "The invoice page", content: { text/html: { schema: { type: string } } } }
        "404": { description: "The link does not exist or has expired", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /i/{token}/pdf:
    get:
      operationId: hostedInvoicePdf
      summary: A redirect to the invoice PDF (a link that works for five minutes)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "302": { description: "Redirect to the download link" }
        "404": { description: "The link does not exist or has expired" }
        "409": { description: "The PDF is not rendered yet" }
  /i/{token}/start:
    post:
      operationId: hostedLinkStart
      summary: First use of an ad-hoc payment link — makes the invoice and continues on its page
      description: The payer presses *Continue*. This is the point at which the invoice gets its number, not when the page is fetched. A redirect to the invoice page. Form field `code`, optional, is a promotion code; it takes something off the price (a DISCOUNT line on the invoice; the amount of a payment link is the total the payer pays) or adds bonus credits to a credit purchase, and is claimed here. A code that cannot be used shows the page again with the reason (422) and makes no invoice. At most 10 a minute per address.
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { code: { type: string, maxLength: 40 } } }
      responses:
        "303": { description: "Redirect to the invoice page (/i/{invoice token})" }
        "422": { description: "The promotion code cannot be used; the page is shown again with the reason", content: { text/html: { schema: { type: string } } } }
        "404": { description: "The link does not exist, has expired, or a single-use link was already paid", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /i/{token}/promo:
    post:
      operationId: hostedLinkPromo
      summary: Check a promotion code on an ad-hoc or credit-pack payment link and show the new total
      description: Form field `code`. The page is shown again with what the code takes off (or the bonus credits), or the reason it cannot be used (422). Nothing is claimed until *Continue*. At most 10 a minute per address.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, tr, de, fr, es, ar] } }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { code: { type: string, maxLength: 40 } } }
      responses:
        "200": { description: "The page with the discounted total", content: { text/html: { schema: { type: string } } } }
        "422": { description: "The promotion code cannot be used", content: { text/html: { schema: { type: string } } } }
        "404": { description: "The link does not exist or has expired" }
        "429": { description: "Too many requests" }
  /i/{token}/pay:
    post:
      operationId: hostedInvoicePay
      summary: Pay the invoice by one of the methods the page offers
      description: >
        Form field `method`: `mock` (sandbox and demo only), `checkout` (a redirect to the provider's page) or an `instructions:<provider>` method (the page shows the payment details and a reference).
        Paying never marks the invoice paid by itself: the provider's confirmed notification does. At most 10 a minute per address.
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { method: { type: string } }, required: [method] }
      responses:
        "303": { description: "Redirect to the provider's page, or back to the invoice page" }
        "200": { description: "Payment instructions", content: { text/html: { schema: { type: string } } } }
        "404": { description: "The link does not exist or has expired", content: { text/html: { schema: { type: string } } } }
        "409": { description: "The invoice cannot be paid now", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /i/{token}/receipt:
    get:
      operationId: hostedInvoiceReceipt
      summary: A printable receipt of a paid invoice
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "The receipt", content: { text/html: { schema: { type: string } } } }
        "404": { description: "The link does not exist, has expired, or the invoice is not paid", content: { text/html: { schema: { type: string } } } }
  /i/{token}/logo:
    get:
      operationId: hostedInvoiceLogo
      summary: The seller's logo
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "The logo image", content: { image/png: { schema: { type: string, format: binary } } } }
        "404": { description: "No logo, or the link does not exist" }
  /c/{token}:
    get:
      operationId: portalPage
      summary: A customer's invoices and payments (public, the token in the path is the credential)
      description: >
        Read-only, for one customer of one tenant: their finalized invoices, the payments recorded for them (charges and refunds), PDFs and receipts, and a pay button on what is open.
        Expires and can be revoked like a payment link. At most 60 requests a minute per address.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, tr, de, fr, es, ar] } }
      responses:
        "200": { description: "The page", content: { text/html: { schema: { type: string } } } }
        "404": { description: "The link does not exist or has expired", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /c/{token}/logo:
    get:
      operationId: portalLogo
      summary: The seller's logo
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "The logo image", content: { image/png: { schema: { type: string, format: binary } } } }
        "404": { description: "No logo, or the link does not exist" }
  /c/{token}/credits/buy:
    post:
      operationId: portalCreditsBuy
      summary: Start buying a credit pack from the customer's portal
      description: >
        Form fields `pack_id` and, optionally, `quantity` (1 to 1000). Makes a credit-pack payment link for the portal's customer (or continues the one an earlier press made
        and nobody paid), makes its invoice, and redirects to the invoice page to pay. The price comes from the pack, never from the form. The credits are granted once, when the
        payment is confirmed. At most 10 a minute per address.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, tr, de, fr, es, ar] } }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { pack_id: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 1000 }, code: { type: string, maxLength: 40, description: "A promotion code" } }, required: [pack_id] }
      responses:
        "303": { description: "Redirect to the invoice page (/i/{invoice token})" }
        "404": { description: "The link does not exist or has expired, or the pack is not on sale", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /c/{token}/invoices/{invoice_id}:
    get:
      operationId: portalInvoicePage
      summary: One of the customer's invoices, with its payment state and the ways to pay it
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lang, in: query, schema: { type: string, enum: [en, tr, de, fr, es, ar] } }
      responses:
        "200": { description: "The page", content: { text/html: { schema: { type: string } } } }
        "404": { description: "Not the customer's invoice, or the link does not exist", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /c/{token}/invoices/{invoice_id}/pdf:
    get:
      operationId: portalInvoicePdf
      summary: A redirect to the invoice PDF
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "302": { description: "Redirect to the download link" }
        "404": { description: "Not the customer's invoice, or the link does not exist" }
        "409": { description: "The PDF is not rendered yet" }
  /c/{token}/invoices/{invoice_id}/receipt:
    get:
      operationId: portalInvoiceReceipt
      summary: A printable receipt of a paid invoice
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "The receipt", content: { text/html: { schema: { type: string } } } }
        "404": { description: "Not the customer's paid invoice, or the link does not exist", content: { text/html: { schema: { type: string } } } }
  /c/{token}/invoices/{invoice_id}/pay:
    post:
      operationId: portalInvoicePay
      summary: Pay one of the customer's open invoices
      description: Same as the payment link's pay, scoped to the portal's customer. At most 10 a minute per address.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: invoice_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { method: { type: string } }, required: [method] }
      responses:
        "303": { description: "Redirect to the provider's page, or back to the invoice page" }
        "200": { description: "Payment instructions", content: { text/html: { schema: { type: string } } } }
        "404": { description: "Not the customer's invoice, or the link does not exist", content: { text/html: { schema: { type: string } } } }
        "409": { description: "The invoice cannot be paid now", content: { text/html: { schema: { type: string } } } }
        "429": { description: "Too many requests" }
  /v1/payment-links:
    post:
      operationId: createPaymentLink
      summary: Make a payment link for an open invoice, or ad hoc for a fixed amount
      description: >
        `kind: invoice` (needs `invoice_id`, a finalized unpaid invoice) or `kind: adhoc` (needs `amount_minor`, optionally `currency` — the tenant's by default — `description` and a
        `customer_external_id`; the invoice is made when the customer first presses Continue). The token is returned once. `Idempotency-Key` (or `idempotency_key`) makes a retry return the link made
        the first time, without the token (`replayed: true`); the same key with other parameters is refused. Single-use links stop after one paid invoice; a reusable ad-hoc link makes one invoice per use.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreatePaymentLinkRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedPaymentLink" } } } }
        "200": { description: "Replayed: the link made the first time, without the token", content: { application/json: { schema: { $ref: "#/components/schemas/CreatedPaymentLink" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listPaymentLinks
      summary: List payment links
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [invoice, adhoc] } }
        - { name: status, in: query, schema: { type: string, enum: [active, paid, expired, revoked] } }
        - { name: invoice_id, in: query, schema: { type: string, format: uuid } }
        - { name: customer, in: query, schema: { type: string }, description: "The customer's external id" }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListPaymentLinksResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/payment-links/{id}:
    get:
      operationId: getPaymentLink
      summary: One payment link
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentLink" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokePaymentLink
      summary: Revoke a payment link
      description: The link and the invoice links it handed out stop working. Unpaid invoices made from an ad-hoc link are voided; paid ones are untouched. Revoking twice is not an error.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentLink" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/portal-links:
    post:
      operationId: createPortalLink
      summary: Make the link to a customer's payment page
      description: Shows the customer's invoices, payments, PDFs and receipts, read-only, with a pay button on open invoices. Works until expires_in_days (default 30, at most 365) or until revoked; the token is returned once.
      parameters: [{ name: external_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/CreatePortalLinkRequest" } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatePortalLinkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokePortalLinks
      summary: Make every portal link of the customer stop working
      parameters: [{ name: external_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RevokePortalLinksResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/customers/{external_id}/payments:
    get:
      operationId: listCustomerPayments
      summary: The customer's invoices and the payments recorded for them
      description: The same rows the customer sees on their payment page, newest first (charges and refunds from the ledger; an invoice may have several attempts).
      parameters:
        - { name: external_id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 }, description: "How many invoices to read; there is no page_token, so a customer with more invoices cannot be listed completely" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListCustomerPaymentsResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/invoices/{id}/pdf:
    get:
      operationId: getInvoicePdf
      summary: A presigned link to the invoice PDF (valid for 5 minutes)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUrl" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payments:
    get:
      operationId: listPayments
      summary: The tenant's payments (charges and refunds), newest first
      description: >
        Reads the tenant's own payment ledger from the payment service and folds it: the rows one provider reference left behind (a charge that was pending
        and then succeeded) are one payment with its most settled outcome. Amounts are minor-unit strings, each in its own currency; they are never summed
        across currencies. `truncated` says the newest 1000 ledger rows were all read, so older payments may exist. The operator's
        `/admin/v1/tenants/{tenant_id}/ledger` stays operator-only: it also carries provider references and decline details. `503` when the payment service
        does not answer.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 }, description: "The answer folds the newest 1000 ledger rows and returns the first limit payments; there is no page_token (truncated says when the window was full)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListPaymentsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads:
    post:
      operationId: createUploadSession
      summary: Open a direct multipart upload session for up to 50 files
      description: |
        Returns, for each file, presigned S3 `UploadPart` URLs for its first (up to 100) parts. Upload the parts in parallel
        straight to S3 (PUT, each part `part_size` bytes except the last), keep the `ETag` of each answer, then call
        `complete`. The session lasts 24 hours. `Idempotency-Key` makes retries return the same session.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadSessionRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads/{session}:
    delete:
      operationId: abortUploadSession
      summary: Abort a session and every unfinished file in it
      parameters: [{ name: session, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads/{session}/files/{asset}:
    get:
      operationId: getUploadFile
      summary: State of one file, including the parts S3 already holds (to resume an interrupted upload)
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UploadFile" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: abortUploadFile
      summary: Abort one file of a session
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads/{session}/files/{asset}/parts:
    post:
      operationId: presignParts
      summary: More (or refreshed) presigned part URLs of a file
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignPartsResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/uploads/{session}/files/{asset}/complete:
    post:
      operationId: completeUploadFile
      summary: Verify the uploaded parts, assemble the object and make the asset READY
      description: |
        Idempotent. If the parts do not match what S3 holds (a missing part or a wrong ETag), the asset comes back
        `REJECTED` with `reject_reason: PART_MISMATCH` and nothing is left in storage.
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteUploadFileRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets:
    post:
      operationId: uploadAssets
      summary: Upload up to 20 small files in one multipart/form-data request
      description: |
        Files are streamed through the gateway into storage (at most 25 MiB each, 100 MiB per request); use an upload
        session for larger files. An optional first part `metadata` picks each file's purpose:
        `{"files": {"logo.png": {"purpose": "invoice_logo"}}}` (default `general`). The answer is `200` with one result per
        file, in order: a bad file is `rejected` with an `error_code` and does not fail the others. The `write` rate limit
        is charged per file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata: { type: string, description: JSON }
                file: { type: array, items: { type: string, format: binary } }
      responses:
        "200":
          description: Per-file results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadAssetsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      operationId: listAssets
      summary: List READY assets
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [invoice_logo, invoice_attachment, general] } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListAssetsResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/tenant/invoice-logo:
    put:
      operationId: setInvoiceLogo
      summary: Draw a READY invoice_logo asset on the tenant's invoice PDFs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetInvoiceLogoRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SetInvoiceLogoResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: clearInvoiceLogo
      summary: Remove the invoice logo
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClearInvoiceLogoResponse" } } } }
  /v1/assets/{id}:
    get:
      operationId: getAsset
      summary: One asset
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAsset
      summary: Delete a READY asset (its bytes leave the storage quota)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/{id}/download:
    get:
      operationId: downloadAsset
      summary: A presigned link (5 minutes) that downloads the file as an attachment
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUrl" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/analytics/usage:
    get:
      operationId: getAnalyticsUsage
      summary: Usage series of one meter (estimates; invoices come from billing)
      description: |
        Near-real-time, from ClickHouse. The default series comes from an hourly rollup that may over-count by the duplicate
        delivery rate (`precision: estimated`); `exact=true` recomputes it from deduplicated events and covers at most one day
        (`precision: exact`).
      parameters:
        - { name: meter, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day], default: hour } }
        - { name: customer, in: query, description: Customer external id, schema: { type: string } }
        - { name: exact, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetAnalyticsUsageResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/analytics/top-customers:
    get:
      operationId: getTopCustomers
      summary: Customers ranked by usage of a meter in a billing period (deduplicated)
      parameters:
        - { name: meter, in: query, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetTopCustomersResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandbox/close-period:
    post:
      operationId: sandboxClosePeriod
      summary: Sandbox only — close a period now and run the real billing flow
      description: |
        Lowers the period's cutoff to now + 5 s, then billing runs exactly as at month end: watermark (starting 30 s after
        the new cutoff), rating, numbering (`SBX-…`) and the invoice saga with mock payments. Poll `GET /v1/invoices`.
        `period` defaults to the current period. Live keys get 403.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxClosePeriodRequest" }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/BillingRun" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/sandbox/customers/{external_id}/payment-scenario:
    post:
      operationId: setPaymentScenario
      summary: Sandbox only — choose the mock payment outcome for a customer
      description: '`{"scenario": "declined"}` sets `pm_sandbox_declined`. Live keys get 403.'
      parameters: [{ $ref: "#/components/parameters/ExternalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPaymentScenarioRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "403": { $ref: "#/components/responses/Error" }

  /auth/signup:
    post:
      operationId: signUp
      tags: [Product]
      summary: Sign up a person with a new account (organisation)
      description: >
        Creates the user, an account and the owner membership in one step and mails a verification link (valid 24 hours). It opens **no session**: the person
        signs in with the password just chosen. The answer is `202` for a free and for a taken address alike (for a taken one the existing owner is mailed a
        warning instead, at most once an hour), so the route does not tell who has an account. Public and rate limited per client address (5 a minute).
        The answer is `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Accepted" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/methods:
    get:
      operationId: authMethods
      tags: [Product]
      summary: Which sign-in methods this deployment offers
      description: >
        The page asks this to show only buttons that work. `password` and `otp` are always on; `google` is on when `PAYRUDDER_GOOGLE_CLIENT_ID` and
        `PAYRUDDER_GOOGLE_CLIENT_SECRET` are set. Public.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMethodsResponse" }
  /auth/otp/request:
    post:
      operationId: requestLoginCode
      tags: [Product]
      summary: Mail a one-time sign-in code
      description: >
        Mails a six-digit code to the address. Always `202` for a well-formed address, whether or not it has an account and whether or not a code was sent
        (at most one a minute and five an hour per address). The code lives 10 minutes, works once and is burned after 5 wrong tries. Public; rate limited per
        client address (5 a minute). The answer is `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestLoginCodeRequest" }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Accepted" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/otp/verify:
    post:
      operationId: verifyLoginCode
      tags: [Product]
      summary: Sign in with a one-time code
      description: >
        A wrong, expired, used, burned or never-sent code is `400 identity.otp.invalid`. The right code opens a session; the code proved the mailbox, so the
        address counts as verified. An address without an account gets one (a user and an organisation named `account_name`, else the part of the address
        before the `@`). Public; rate limited per client address (10 a minute).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyLoginCodeRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionOpened" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/google/start:
    get:
      operationId: googleStart
      tags: [Product]
      summary: Start "Continue with Google"
      description: >
        Redirects the browser to Google's consent page (authorization-code flow with PKCE, state and nonce) and sets a short-lived signed HttpOnly cookie that
        holds the login's secrets. `404 identity.oauth.not_configured` when Google is not set up. Public; rate limited per client address (20 a minute).
      security: []
      parameters:
        - { name: locale, in: query, required: false, schema: { type: string, enum: [en, tr, de, fr, es, ar] }, description: The language of the mails to a person this login creates }
      responses:
        "302": { description: Redirect to Google }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/google/callback:
    get:
      operationId: googleCallback
      tags: [Product]
      summary: Where Google returns the browser
      description: >
        Checks the cookie and `state`, exchanges the code (with the PKCE verifier), verifies the ID token (signature against Google's keys, issuer, audience,
        expiry, nonce) and requires `email_verified`. Then the user is found by Google's stable subject, else linked by the verified address, else created.
        Always answers a redirect to the console: success is `/signin/complete#token=qs_...&expires=...` (a fragment, so no server or proxy sees the token);
        a refusal is `/signin?oauth_error=` with one of `state`, `denied`, `token`, `email_unverified`, `unavailable`, `failed`. Public.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302": { description: Redirect to the console }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/verify:
    post:
      operationId: verifyEmail
      tags: [Product]
      summary: Confirm an e-mail address with the token of the mailed link
      description: >
        The token is single use and expires 24 hours after it was mailed; a used, expired, replaced or unknown token is the same `400 identity.token.invalid`.
        Public; rate limited per client address (20 a minute). The link in the mail carries the token in the URL fragment (`/verify#token=...`), which browsers
        never send to a server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { $ref: "#/components/schemas/VerifyEmailResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [Product]
      summary: Mail a new verification link to the signed-in person
      description: >
        At most one a minute (`429 identity.verify.throttled`); the older link stops working. Does nothing when the address is verified already.
      security: [{ sessionToken: [] }]
      responses:
        "204": { description: Sent }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/forgot:
    post:
      operationId: forgotPassword
      tags: [Product]
      summary: Mail a password reset link
      description: >
        Always `202` for a well-formed address, whether or not it has an account; a link is mailed only when it has (and at most one a minute per address).
        The link is valid one hour. Public; rate limited per client address (5 a minute).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Accepted" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/reset:
    post:
      operationId: resetPassword
      tags: [Product]
      summary: Set a new password with the token of the mailed link
      description: >
        Single use, valid one hour. It sets the password, clears the sign-in lock, marks the address as verified (the person has just proven the mailbox) and
        **revokes every session** of the user. It opens no session; the person signs in. Public; rate limited per client address (20 a minute).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/invitations/lookup:
    post:
      operationId: lookupInvitation
      tags: [Product]
      summary: What a live invitation is for
      description: >
        Public: the token is the credential and travels in the body, never in the URL. Answers the account, the address and the role, and whether the address
        already has an account (then the person signs in instead of choosing a password). A used, expired, revoked or unknown token is `400 identity.token.invalid`.
        Rate limited per client address (20 a minute).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LookupInvitationRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationLookup" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [Product]
      summary: Join an account as a new person
      description: >
        Creates the user (the address counts as verified: the token was mailed to it), makes them a member with the invited role and opens a session. An address
        that has an account is `409 identity.invite.sign_in_required`: that person signs in and uses `/app/v1/invitations/accept`. Single use. Public; rate limited
        per client address (20 a minute). The answer is `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionOpened" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/signin:
    post:
      operationId: signIn
      tags: [Product]
      summary: Sign in with e-mail and password
      description: >
        One of the three ways to sign in (with a one-time code, `/auth/otp/*`, and Google, `/auth/google/*`). An account that has no password (it signs in
        by code or by Google) answers like a wrong password.
        A wrong password, an unknown e-mail and a locked account all answer 401 `identity.auth.invalid_credentials`. Five wrong passwords lock the account for
        fifteen minutes. Public and rate limited per client address (10 a minute).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionOpened" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/signout:
    post:
      operationId: signOut
      tags: [Product]
      summary: Revoke the session of the token
      security: [{ sessionToken: [] }]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      operationId: me
      tags: [Product]
      summary: The person behind the session token, with their accounts
      security: [{ sessionToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /app/v1/me/onboarding:
    get:
      operationId: getMyOnboarding
      tags: [Product]
      summary: What the console remembers for the person - the first-run wizard's progress and the tours they have seen
      description: Kept per person, not per account or browser, so a second browser does not start the wizard or a tour again. A person who has stored nothing gets no `wizard` and no tours.
      security: [{ sessionToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Onboarding" } } } }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMyOnboarding
      tags: [Product]
      summary: Merge a change into it
      description: >
        A merge, never a replacement, so two browsers writing lose nothing. The `wizard` fields given overwrite the stored ones and the others stay; a flag that is
        set (customer, event, hidden) stays set. `seen_tours` are added to the stored set. `forget_tours` removes tours (a person asking to see one again) and is applied
        after the additions. The answer is the merged record.
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMyOnboardingRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Onboarding" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /app/v1/accounts:
    post:
      operationId: appCreateAccount
      tags: [Product]
      summary: Start another organisation, owned by the person (at most 20 owned)
      description: The new account is empty (no apps). It is in the session's memberships from the next request on.
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCreateAccountRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/account:
    get:
      operationId: appGetAccount
      tags: [Product]
      summary: An account of the person (default the first) with its members
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyAccount" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: appRenameAccount
      tags: [Product]
      summary: Rename the account (owners only)
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppRenameAccountRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppRenameAccountResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/account/plan:
    get:
      operationId: appGetPlan
      tags: [Product]
      summary: The plan of the account with its quotas and the plans on offer (Payrudder as a SaaS)
      description: >
        With `PAYRUDDER_SAAS=off` the answer is `{"enabled": false}` and nothing is limited. The events quota counts the events accepted by the organisation's live tenants in
        the calendar month; the other quotas are counted where the resource is created.
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationPlan" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: appChangePlan
      tags: [Product]
      summary: Move the account to another plan (owners and administrators)
      description: >
        A paid plan starts with its trial when the account never had one; the first invoice follows when the trial ends. A move to a plan the usage does not fit is refused
        with `plans.saas.downgrade_blocked`; asking for the plan the account is on is `plans.saas.same_plan`.
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppChangePlanRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationPlan" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /app/v1/account/plan/invoices:
    get:
      operationId: appListPlanInvoices
      tags: [Product]
      summary: The invoices Payrudder issued to the organisation for its plan
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppListPlanInvoicesResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/account/plan/invoices/{id}/pay-link:
    post:
      operationId: appPlanInvoicePayLink
      tags: [Product]
      summary: A payment link for an unpaid invoice of the plan (owners and administrators)
      description: The link is the hosted payment page of the platform tenant's own payment-link machinery; asking again for the same invoice returns a new link.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AppPlanInvoicePayLinkResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /app/v1/account/plan/portal-link:
    post:
      operationId: appPlanPortalLink
      tags: [Product]
      summary: A link to the customer portal of the plan (payment method, invoices) (owners and administrators)
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AppPlanPortalLinkResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/account/invitations:
    get:
      operationId: appListInvitations
      tags: [Product]
      summary: The open invitations of the account (owners and administrators)
      description: An invitation whose seven days ran out is still listed, marked by its `expire_time`, until somebody revokes it. The token is never returned; it exists only in the mail.
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppListInvitationsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: appInviteMember
      tags: [Product]
      summary: Invite a person by e-mail
      description: >
        Mails a single-use link (valid seven days) to the address. Owners and administrators may invite; only an owner may invite an owner; the inviter's own
        address must be verified (`403 identity.email.not_verified`). An address that is a member already is `409 identity.invite.already_member`. A second
        invitation to an address with an open one refreshes it (new link, old one dead) at most once a minute (`429 identity.invite.throttled`); an account
        has at most 50 open invitations and makes at most 30 a day (`429 identity.invite.quota`).
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppInviteMemberRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/account/invitations/{id}:
    delete:
      operationId: appRevokeInvitation
      tags: [Product]
      summary: Cancel an open invitation; its link stops working
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/account/invitations/{id}/resend:
    post:
      operationId: appResendInvitation
      tags: [Product]
      summary: Mail a new link for an open invitation (at most one a minute); the old link stops working
      security: [{ sessionToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/account/members/{user_id}:
    patch:
      operationId: appUpdateMemberRole
      tags: [Product]
      summary: Change a member's role
      description: >
        Owners and administrators may; an administrator may not touch owners nor make one. The last owner of an account cannot be demoted
        (`409 identity.member.last_owner`).
      security: [{ sessionToken: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppUpdateMemberRoleRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppUpdateMemberRoleResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: appRemoveMember
      tags: [Product]
      summary: Remove a member, or leave the account (your own user id)
      description: The last owner cannot be removed (`409 identity.member.last_owner`). Owners and administrators remove others (an administrator not an owner); anybody may leave.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /app/v1/invitations/accept:
    post:
      operationId: appAcceptInvitation
      tags: [Product]
      summary: Join the account an invitation was sent for, as the signed-in person
      description: The invitation must have been sent to the person's own address (`403 identity.invite.wrong_user` otherwise). Accepting proves the address.
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppAcceptInvitationRequest" }
      responses:
        "200": { description: Joined, content: { application/json: { schema: { $ref: "#/components/schemas/AppAcceptInvitationResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /app/v1/apps:
    get:
      operationId: appListApps
      tags: [Product]
      summary: The apps of an account of the person, with their sandbox and live tenants
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppListAppsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: appCreateApp
      tags: [Product]
      summary: Create an app (a sandbox and a live tenant) in an account the person owns or administers
      description: Free tier and no grace period. Currency and time zone cannot be changed afterwards. At most 20 apps per account.
      security: [{ sessionToken: [] }]
      parameters: [{ name: account_id, in: query, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCreateAppRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/App" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}:
    get:
      operationId: appGetApp
      tags: [Product]
      summary: One app of the person, with the person's role
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppGetAppResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: appRenameApp
      tags: [Product]
      summary: Rename the app (owners and admins)
      description: >
        Renames the app and with it its sandbox and live tenants; the slug stays. Invoices already issued keep the name they were issued under, new ones carry the new
        name. A viewer is answered 403; an app that was deleted is answered 404.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppRenameAppRequest" }
      responses:
        "200": { description: The app, content: { application/json: { schema: { $ref: "#/components/schemas/App" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: appDeleteApp
      tags: [Product]
      summary: Delete the app (owners only)
      description: >
        Nothing is erased. The app is archived: it leaves the lists and every route of the account, its API keys are revoked at once (the gateway refuses them, so no
        event is ingested), no key can be made for it again, and its slug is freed. Its customers, subscriptions, invoices, payments and usage stay for accounting and
        retention, and billing keeps working on what already exists (a customer who owes is still invoiced and charged), so cancel the subscriptions first when
        the app should stop billing. An admin or a viewer is answered 403; deleting twice is answered 404. The action is logged (`app_audit`).
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Archived }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/overview:
    get:
      operationId: appOverview
      tags: [Product]
      summary: Payments, invoices, customers, subscriptions and health of one environment of an app
      description: >
        Composed from the services that own the facts, with the environment's tenant as the caller. Payments cover the last 30 days. Money is never added across
        currencies. A section whose service did not answer is `null` and named in `unavailable`; `status` is then `degraded`.
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: environment, in: query, schema: { type: string, enum: [live, sandbox], default: live } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppOverview" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/dashboard:
    get:
      operationId: appDashboard
      tags: [Product]
      summary: "The dashboard of one environment of an app: a period, compared with the one before, per currency"
      description: >
        The overview's facts over a period (7, 30 or 90 days, the year so far, or a custom range of at most two years) with the equal period before it to compare
        with, one block per currency: money is never added, converted or compared across currencies. Revenue, refunds, tax, expenses and the series are billing's
        accounting summary (an invoice counts on the day its payment settled, so this agrees with the accounting page); payments are the payment ledger's attempts
        (a declined card that is retried is several failed attempts; refunds are counted apart); subscriptions, MRR, new and churned are the subscription report
        of the month the period ends in and the month before it; new customers are counted over the period and the one before. The series is daily up to 92
        days, monthly beyond. A section whose service did not answer is left out and named in `unavailable`. Answers are remembered for 15 seconds.
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: environment, in: query, schema: { type: string, enum: [live, sandbox], default: live } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d, ytd, custom], default: 30d } }
        - { name: from, in: query, description: "First day of a custom period (YYYY-MM-DD, the tenant's days)", schema: { type: string, format: date } }
        - { name: to, in: query, description: Last day of a custom period; not after today, schema: { type: string, format: date } }
        - { name: compare, in: query, description: "0 leaves out the comparison with the period before", schema: { type: string, enum: ["0", "1"], default: "1" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/api-keys:
    get:
      operationId: appListApiKeys
      tags: [Product]
      summary: The API keys of both environments of an app (never their secrets)
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppListApiKeysResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: appCreateApiKey
      tags: [Product]
      summary: Create an API key for the sandbox or the live environment of an app
      description: The plaintext is in the answer once and never stored. At most 10 active keys per environment.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCreateApiKeyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppCreateApiKeyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/sandbox/reset:
    get:
      operationId: appSandboxResetStatus
      tags: [Product]
      summary: The latest reset of the app's sandbox, running or finished
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK (an empty object when the sandbox was never reset), content: { application/json: { schema: { $ref: "#/components/schemas/AppSandboxResetStatusResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: appSandboxReset
      tags: [Product]
      summary: Reset the app's sandbox
      description: >
        Queues a job that deletes the sandbox's customers, subscriptions, usage, invoices, payments and their history in every service, and keeps its configuration (meters,
        plans, prices, tax rates, coupons, webhook endpoints, mail settings, keys). Owners and admins. One reset runs at a time (asking again returns it); a person can
        ask once every few minutes (429 identity.sandbox.reset_rate_limited). The live environment is never touched. Poll the GET for the steps.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202": { description: Queued (or the one already running), content: { application/json: { schema: { $ref: "#/components/schemas/AppSandboxResetResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandbox/scenarios:
    get:
      operationId: sandboxScenarios
      tags: [Sandbox]
      summary: The payment scenarios of a sandbox customer
      description: What each pm_sandbox_* payment method does. Sandbox keys only.
      security: [{ apiKey: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxScenariosResponse" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/sandbox/invoices/{id}/simulate:
    post:
      operationId: sandboxSimulateInvoice
      tags: [Sandbox]
      summary: Run an invoice's payment again under a scenario
      description: >
        Sets the invoice's customer to the scenario (it stays their payment method) and retries the invoice's payment. When the payment cannot run again now (paid, or in
        progress) the scenario is still set and `retried` is false with the reason in `retry_error`. Sandbox keys only.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxSimulateInvoiceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxSimulateInvoiceResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/promote:
    post:
      operationId: appPromote
      tags: [Product]
      summary: Copy the app's sandbox configuration to its live environment
      description: >
        Meters, plans and their prices, tax rates, coupons, mail settings and webhook endpoints. Never customers, usage, invoices or payments. It only adds: an object
        that exists in live and differs is a conflict, reported and left alone. Objects are matched by a stable key (meter code, plan code, tax country, coupon code,
        webhook URL), so running it again does nothing. A new webhook endpoint gets a new signing secret, in the answer once; the sandbox's is never copied. An
        inactive live environment takes no webhook endpoints (they are skipped). Owners and admins only. With dry_run it returns the diff and writes nothing;
        send its plan_hash back to apply exactly that diff (409 identity.promote.stale if the configuration moved since).
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppPromoteRequest" }
      responses:
        "200":
          description: The changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppPromoteResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/api-keys/{key_id}/rotate:
    post:
      operationId: appRotateApiKey
      tags: [Product]
      summary: Replace an API key; the old one keeps working for an overlap window
      description: >
        Issues a key with the same scope and environment and sets an end time on the old one, so a deployment can switch without a gap. The plaintext of the new key is in the
        answer once. A revoked key, or one that already ends, cannot be rotated (409 identity.api_key.not_active, identity.api_key.already_rotating).
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: key_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppRotateApiKeyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppRotateApiKeyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /app/v1/affiliate/affiliations:
    get:
      operationId: myAffiliations
      tags: [Affiliate portal]
      summary: The partner's own affiliations
      description: "One per seller environment the person is a partner of (live ones first). A partner sees only their own data: the records made for their verified e-mail address are linked to them by claim, or they apply."
      security: [{ sessionToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyAffiliationsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /app/v1/affiliate/claim:
    post:
      operationId: claimMyAffiliations
      tags: [Affiliate portal]
      summary: Link the partner records a seller made for your verified e-mail address to you
      description: "Needs a verified address (403 identity.email.not_verified otherwise). Repeating it only takes records nobody has claimed. The person becomes a member of the seller's account with the role affiliate, which sees none of the account."
      security: [{ sessionToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimMyAffiliationsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /app/v1/affiliate/programs/{tenant_id}:
    get:
      operationId: lookupAffiliateProgram
      tags: [Affiliate portal]
      summary: A seller's program terms, for someone about to apply
      description: "404 affiliate.portal.program_unavailable for a seller without a program that is open to applications, whatever the reason: the answer reveals nothing about whether the id exists."
      security: [{ sessionToken: [] }]
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LookupAffiliateProgramResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/affiliate/applications:
    post:
      operationId: applyAsAffiliate
      tags: [Affiliate portal]
      summary: Apply to a seller's program
      description: "With the person's verified address. The application is pending until the seller approves it, or active at once if the program approves applications automatically. 409 affiliate.portal.already_applied when the person is a partner of this seller already."
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApplyAsAffiliateRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MyAffiliation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /app/v1/affiliate/affiliations/{id}:
    get:
      operationId: myAffiliation
      tags: [Affiliate portal]
      summary: "One affiliation: link, clicks, referrals and earnings"
      description: "The figures cover the period (default the last 30 days); balances are as of now, per currency (pending, approved, paid, taken back)."
      security: [{ sessionToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyAffiliationDetail" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMyAffiliation
      tags: [Affiliate portal]
      summary: Change the partner's name and payout details
      security: [{ sessionToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateMyAffiliationRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyAffiliation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/affiliate/affiliations/{id}/referrals:
    get:
      operationId: myReferrals
      tags: [Affiliate portal]
      summary: Who the partner brought, newest first
      description: "The customer is a masked e-mail address (j***@example.com)."
      security: [{ sessionToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }, { name: page_token, in: query, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyReferralsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/affiliate/affiliations/{id}/commissions:
    get:
      operationId: myCommissions
      tags: [Affiliate portal]
      summary: The partner's commissions, newest first
      description: "pending commissions wait out the seller's hold; a refund takes back in proportion; one already paid is netted by a negative row."
      security: [{ sessionToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: status, in: query, schema: { type: string, enum: [pending, approved, paid, reversed] } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }, { name: page_token, in: query, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyCommissionsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/affiliate/affiliations/{id}/payouts:
    get:
      operationId: myPayouts
      tags: [Affiliate portal]
      summary: Payouts made to the partner, newest first
      description: "A payout of a sandbox environment is fake (fake true): nothing was paid."
      security: [{ sessionToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }, { name: page_token, in: query, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyPayoutsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/go-live:
    get:
      operationId: appGoLive
      tags: [Product]
      summary: The go-live checklist of the app's live environment
      description: >
        A live environment is created inactive and has no API keys and no webhook endpoints until every item is done: the owner's e-mail address is verified, the legal
        profile (name, country, tax id where the country needs one) is complete, a payment provider is connected in live mode and works, a plan is published, and the
        terms are accepted. The list is computed on the server; the answer is the same for every member of the account.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppGoLiveResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: appActivateLive
      tags: [Product]
      summary: Activate the live environment (the owner only)
      description: Passes only when the checklist is complete (409 identity.go_live.incomplete otherwise). Idempotent. A suspended environment is not activated by its owner (identity.go_live.suspended).
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppActivateLiveRequest" }
      responses:
        "200": { description: Activated, content: { application/json: { schema: { $ref: "#/components/schemas/AppActivateLiveResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/billing-profile:
    put:
      operationId: appSaveBillingProfile
      tags: [Product]
      summary: Save the seller's legal and billing profile of the live environment (the owner only)
      description: >
        The legal name, tax id and address the live environment's invoices print as the seller, and what the go-live checklist reads. The profile replaces the
        stored one. A tax id is required in Turkey and the EU member states; the legal name, the country and the first address line and city always. Each missing part
        is refused with its own key (identity.billing_profile.legal_name_required, country_required, address_required, tax_id_required). The change is recorded in the
        audit trail (the country and whether a tax id was given, never the values). The sandbox environment is not changed.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSaveBillingProfileRequest" }
      responses:
        "200": { description: The live tenant as saved, content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/go-live/terms:
    post:
      operationId: appAcceptTerms
      tags: [Product]
      summary: Accept the terms of service for the live environment (the owner only)
      description: The first acceptance is kept; accepting again changes nothing. The go-live checklist item terms_accepted follows.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/AppAcceptTermsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/go-live/providers:
    get:
      operationId: appLiveProviders
      tags: [Product]
      summary: The payment providers connected to the live environment, and whether each works
      description: >
        Any member reads it. No setting or secret is in the answer. working is what the go-live checklist counts: the stored credentials open, and for a provider that
        can be asked (iyzico, Paddle) the provider accepts them now (checked true). A bank transfer account is only bank details (checked false). problem says why an account
        does not work: unreadable, refused or unreachable.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LiveProviders" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/go-live/providers/{provider}:
    put:
      operationId: appConnectLiveProvider
      tags: [Product]
      summary: Connect the live environment to a payment provider (the owner only)
      description: >
        The body is the provider's settings (iyzico: api_key, secret_key, buyer; Paddle: api_key, webhook_secret, usage_product_id; bank transfer: bank details). The
        environment is live whatever the request says. The settings are sealed, shown once and never echoed back. The provider is asked to accept the credentials
        before they are stored (400 payments.account.health_check_failed when it does not, 502 payments.account.health_check_unreachable when it cannot be asked), a
        base_url other than the provider's own live host is refused (payments.account.endpoint_not_allowed), and so is the provider's test host
        (payments.account.livemode_mismatch). The first live account becomes the default. The change is recorded for the person.
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [banktransfer, iyzico, paddle] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppConnectLiveProviderRequest" }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/AppConnectLiveProviderResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      operationId: appRemoveLiveProvider
      tags: [Product]
      summary: Remove the live environment's account at a payment provider (the owner only)
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [banktransfer, iyzico, paddle] } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/sandbox/providers:
    get:
      operationId: appSandboxProviders
      tags: [Product]
      summary: The payment providers connected to the sandbox environment (their test mode), and whether each works
      description: >
        Any member reads it. Same shape as the live list; no setting or secret is in the answer. Without a connection the sandbox runs on the built-in simulator.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LiveProviders" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/sandbox/providers/{provider}:
    put:
      operationId: appConnectSandboxProvider
      tags: [Product]
      summary: Connect the sandbox environment to a payment provider's test mode (the owner only)
      description: >
        The body is the provider's settings (iyzico: api_key, secret_key, buyer; Paddle: api_key, webhook_secret, usage_product_id), as for the live connection, with the
        provider's sandbox credentials. base_url is the provider's test host unless the body names one; the environment is sandbox whatever the request says. The
        provider is asked to accept the credentials before they are stored (400 payments.account.health_check_failed, 502 payments.account.health_check_unreachable),
        a host that is not the provider's own is refused (payments.account.endpoint_not_allowed), and so are the provider's live host and a key in the live format
        (payments.account.livemode_mismatch). The first sandbox account becomes the default. A sandbox charge that carries the provider's own token goes to it;
        the pm_sandbox_ scenario tokens keep going to the simulator. A bank transfer has no test mode (400 payments.provider.not_supported). The settings are
        sealed, shown once and never echoed back; the change is recorded for the person.
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: The provider's settings. }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { type: object, properties: { provider: { type: string }, environment: { type: string, enum: [sandbox] }, default: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      operationId: appRemoveSandboxProvider
      tags: [Product]
      summary: Remove the sandbox environment's account at a payment provider (the owner only)
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/integrations/e-invoice:
    get:
      operationId: appGetEInvoiceIntegration
      tags: [Product]
      summary: The e-invoice integrator of the app's live environment (any member; no credential is in the answer)
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGetEInvoiceIntegrationResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      operationId: appPutEInvoiceIntegration
      tags: [Product]
      summary: Connect (or replace) the live environment's e-invoice integrator (the owner only)
      description: The integrator is nilvera or webhook, never the mock. The credentials are sealed, shown once and never echoed back. The change is recorded for the person.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppPutEInvoiceIntegrationRequest" }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/EInvoiceAccount" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: appRemoveEInvoiceIntegration
      tags: [Product]
      summary: Disconnect the live environment's e-invoice integrator (the owner only)
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/integrations/e-invoice/test:
    post:
      operationId: appTestEInvoiceIntegration
      tags: [Product]
      summary: Ask the integrator whether the stored credentials work now (the owner only)
      description: "Nothing is issued. A provider problem is ok false with its kind, not an HTTP error."
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppTestEInvoiceIntegrationRequest" }
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTestEInvoiceIntegrationResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/integrations/mail:
    get:
      operationId: appGetMailIntegration
      tags: [Product]
      summary: The tenant's own e-mail provider (Nafru Email) for the app's live environment, if one is connected (any member; the key is never in the answer)
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGetMailIntegrationResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: appPutMailIntegration
      tags: [Product]
      summary: Connect (or replace) the live environment's own e-mail provider (the owner only)
      description: |
        From then on the customer mail of the live environment (invoices, receipts, alerts) is sent through it, from the given address. The provider is asked
        to accept the key before anything is stored (400 plans.mail_integration.refused, 503 plans.mail_integration.unreachable). The key is sealed, shown once
        and never echoed back. The sandbox has none: its mail always goes to the sandbox inbox.
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppPutMailIntegrationRequest" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppPutMailIntegrationResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: appRemoveMailIntegration
      tags: [Product]
      summary: Disconnect the own e-mail provider; the mail goes through Payrudder's built-in sender again (the owner only)
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/integrations/mail/test:
    post:
      operationId: appTestMailIntegration
      tags: [Product]
      summary: Check the stored key at the provider and send one test mail through it (the owner only)
      description: "A provider problem is ok false with its kind, not an HTTP error."
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppTestMailIntegrationRequest" }
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTestMailIntegrationResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/apps/{id}/api-keys/{key_id}:
    delete:
      operationId: appRevokeApiKey
      tags: [Product]
      summary: Revoke an API key of the app
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: key_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/geo/countries:
    get:
      operationId: appGeoCountries
      tags: [Product]
      summary: Every country (GeoNames, CC BY 4.0), for the address forms
      description: The same for every caller; cached for a day (Cache-Control private, max-age=86400) and revalidated by ETag. Names are English; show them in the page's language with Intl.DisplayNames.
      security: [{ sessionToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GeoCountries" } } } }
        "304": { description: Not modified (If-None-Match) }
        "401": { $ref: "#/components/responses/Error" }
  /app/v1/geo/countries/{iso2}/regions:
    get:
      operationId: appGeoRegions
      tags: [Product]
      summary: The first-level divisions of a country (states, provinces, counties), sorted by name
      description: A country may have none (the list is then empty and the form takes the region as text). 404 gateway.geo.country_not_found for an unknown code.
      security: [{ sessionToken: [] }]
      parameters:
        - { name: iso2, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z]{2}$" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GeoRegions" } } } }
        "304": { description: Not modified (If-None-Match) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /app/v1/geo/regions/{id}/districts:
    get:
      operationId: appGeoDistricts
      tags: [Product]
