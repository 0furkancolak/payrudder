        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/reconciliation:
    get:
      operationId: reconcilePayments
      summary: Compare the invoices billing calls paid in a period with the successful charges in the payment ledger
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  paid_invoices: { type: integer }
                  successful_charges: { type: integer }
                  discrepancy_counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: By kind - paid_without_charge, amount_mismatch, duplicate_charge, charge_without_paid, conflicting_outcomes
                  discrepancies:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        invoice_id: { type: string }
                        number: { type: string }
                        provider: { type: string }
                        provider_ref: { type: string }
                        currency: { type: string }
                        billed_minor: { type: integer }
                        ledger_minor: { type: integer }
                        detail: { type: string }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/v1/dead-letters:
    get:
      operationId: adminListDeadLetters
      summary: RabbitMQ dead-letter queues, and a peek at one queue's messages
      security: [{ operatorToken: [] }]
      parameters:
        - { name: queue, in: query, description: "A command or reply queue name, e.g. payment.charge. Omit for the depths only", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues: { type: array, items: { type: object, properties: { queue: { type: string }, messages: { type: string, description: int64 as a string } } } }
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id: { type: string }
                        delivery_count: { type: string }
                        reason: { type: string }
                        body_bytes: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /admin/v1/dead-letters/redrive:
    post:
      operationId: adminRedriveDeadLetters
      summary: Move dead letters of one queue back to where they came from (retry counter reset)
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [queue], properties: { queue: { type: string }, limit: { type: integer, minimum: 1, maximum: 1000, default: 100 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { redriven: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{tenant_id}/dashboard:
    get:
      operationId: adminTenantDashboard
      summary: The dashboard of any tenant, for the operator
      description: >
        The overview's facts over a period (7, 30 or 90 days, the year so far, or a custom range of at most two years) with the equal period before it to compare
        with, one block per currency: money is never added, converted or compared across currencies. Revenue, refunds, tax, expenses and the series are billing's
        accounting summary (an invoice counts on the day its payment settled, so this agrees with the accounting page); payments are the payment ledger's attempts
        (a declined card that is retried is several failed attempts; refunds are counted apart); subscriptions, MRR, new and churned are the subscription report
        of the month the period ends in and the month before it; new customers are counted over the period and the one before. The series is daily up to 92
        days, monthly beyond. A section whose service did not answer is left out and named in `unavailable`. Answers are remembered for 15 seconds.
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d, ytd, custom], default: 30d } }
        - { name: from, in: query, description: First day of a custom period (YYYY-MM-DD, the tenant's days), schema: { type: string, format: date } }
        - { name: to, in: query, description: Last day of a custom period; not after today, schema: { type: string, format: date } }
        - { name: compare, in: query, description: "0 leaves out the comparison with the period before", schema: { type: string, enum: ["0", "1"], default: "1" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/v1/tenants/{id}:
    get:
      operationId: getTenant
