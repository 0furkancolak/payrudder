        content: { application/json: { schema: { $ref: "#/components/schemas/PutEInvoiceAccount" } } }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/EInvoiceAccount" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEInvoiceAccount
      summary: Remove the tenant's e-invoice account for an environment
      security: [{ operatorToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environment, in: path, required: true, schema: { type: string, enum: [sandbox, live] } }
      responses:
        "204": { description: Removed }
