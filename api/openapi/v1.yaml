        allowed_plans: { type: array, items: { type: string }, description: "Plan codes; empty means any" }
        allowed_packs: { type: array, items: { type: string }, description: "Credit pack ids; empty means any" }
        allowed_currencies: { type: array, items: { type: string }, description: "Empty means any" }
        restore_on_reversal: { type: boolean, description: "A void or full refund gives the use back to the count. Off by default" }
        create_time: { type: string, format: date-time, readOnly: true }
    CreatePromotionCodes:
      type: object
      properties:
        template: { $ref: "#/components/schemas/PromotionCodeInput" }
        codes: { type: array, items: { type: string }, description: "Name the codes, or ask for count" }
        count: { type: integer, minimum: 1, maximum: 1000 }
        prefix: { type: string, description: "For random codes; at most 20 characters" }
    CouponRedemption:
      type: object
      required: [id, coupon_code, promotion_code, customer_external_id, target, target_id, invoice_id, discount_minor, bonus_credits, currency, create_time, reverse_time]
      properties:
        id: { type: string, format: uuid }
        coupon_code: { type: string }
        promotion_code: { type: string, description: Empty when an operator applied the coupon or it came from a grant }
        customer_external_id: { type: string }
        target: { type: string, enum: [COUPON_TARGET_SUBSCRIPTION, COUPON_TARGET_CREDIT_PURCHASE, COUPON_TARGET_PAYMENT] }
        target_id: { type: string, format: uuid, description: "The subscription, or the invoice" }
        invoice_id: { type: string, format: uuid }
        discount_minor: { type: string, description: "What it took off; a subscription's grows with each fee", format: int64 }
        bonus_credits: { type: string, format: int64 }
        currency: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        reverse_time: { type: string, format: date-time, description: Set when a void or a full refund reversed it, nullable: true }
    PromotionQuoteRequest:
      type: object
      required: [target, currency]
      properties:
        code: { type: string }
        customer_external_id: { type: string, description: "Needed by codes that are first-purchase-only or one per customer" }
        target: { type: string, enum: [COUPON_TARGET_CREDIT_PURCHASE, COUPON_TARGET_PAYMENT] }
        amount_minor: { type: string, description: The price before the discount, format: int64 }
        currency: { type: string }
        item: { type: string, description: "The credit pack id, for codes restricted to some packs" }
        credits: { type: string, description: "The credits sold, for a bonus coupon" }
        prior_purchases: { type: boolean, description: The customer has paid for something before }
    PromotionQuote:
      type: object
      required: [applied, coupon_code, coupon_name, promotion_code, discount_minor, bonus_credits, total_minor, currency, redemption_id]
      properties:
        applied: { type: boolean }
        coupon_code: { type: string }
        coupon_name: { type: string }
        promotion_code: { type: string }
        discount_minor: { type: string, format: int64 }
        bonus_credits: { type: string, format: int64 }
        total_minor: { type: string, description: "The price after the discount, never below zero", format: int64 }
        currency: { type: string }
        redemption_id: { type: string }
    ChangeRequest:
      type: object
      properties:
        plan_code: { type: string, description: Empty keeps the plan (to change the interval only) }
        plan_version: { type: integer, description: 0 = latest }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR], description: Default keeps the interval }
        timing: { type: string, enum: [CHANGE_TIMING_IMMEDIATELY, CHANGE_TIMING_PERIOD_END], description: Default depends on the direction of the change }
        proration: { type: string, enum: [CHANGE_PRORATION_PRORATE, CHANGE_PRORATION_FULL, CHANGE_PRORATION_NONE], description: "Default prorate. Prorate keeps the cycle within an interval; full starts a new cycle now; none moves no money now" }
        change_time: { type: string, format: date-time, description: Default now; not in the future }
        quantity: { type: integer, minimum: 1, maximum: 100000, description: "The new number of seats; 0 or absent keeps it. A change of seats alone is immediate and prorated in either direction unless timing says otherwise: the unused time of the old seats is credited and the new seats are charged for the rest of the period" }
    ChangeQuote:
      type: object
      required: [timing, proration, effective_time, period_start, period_end, credit_minor, charge_minor, net_minor, currency, next_renewal_time, next_renewal_minor, plan_code, plan_version, interval, quantity]
      properties:
        timing: { type: string, enum: [CHANGE_TIMING_IMMEDIATELY, CHANGE_TIMING_PERIOD_END] }
        proration: { type: string, enum: [CHANGE_PRORATION_PRORATE, CHANGE_PRORATION_FULL, CHANGE_PRORATION_NONE] }
        effective_time: { type: string, format: date-time, nullable: true }
        period_start: { type: string, format: date-time, nullable: true }
        period_end: { type: string, format: date-time, nullable: true }
        credit_minor: { type: string, description: "The unused, prepaid part of the old fee", format: int64 }
        charge_minor: { type: string, description: What the new plan costs from the change, format: int64 }
        net_minor: { type: string, description: "charge - credit: positive is invoiced, negative becomes a credit balance", format: int64 }
        currency: { type: string }
        next_renewal_time: { type: string, format: date-time, nullable: true }
        next_renewal_minor: { type: string, format: int64 }
        plan_code: { type: string }
        plan_version: { type: integer }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        quantity: { type: integer, description: The seats after the change }
    WebhookChangeQuote:
      type: object
      properties:
        timing: { type: string, enum: [CHANGE_TIMING_IMMEDIATELY, CHANGE_TIMING_PERIOD_END] }
        proration: { type: string, enum: [CHANGE_PRORATION_PRORATE, CHANGE_PRORATION_FULL, CHANGE_PRORATION_NONE] }
        effective_time: { type: string, format: date-time }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        credit_minor: { type: string, description: "The unused, prepaid part of the old fee", format: int64 }
        charge_minor: { type: string, description: What the new plan costs from the change, format: int64 }
        net_minor: { type: string, description: "charge - credit: positive is invoiced, negative becomes a credit balance", format: int64 }
        currency: { type: string }
        next_renewal_time: { type: string, format: date-time }
        next_renewal_minor: { type: string, format: int64 }
        plan_code: { type: string }
        plan_version: { type: integer }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        quantity: { type: integer, description: The seats after the change }
      description: "Marshalled without unpopulated fields: a field at its zero value (empty string, 0, false, unset timestamp) is left out."
    ProviderChangeQuote:
      type: object
      required: [timing, credit_minor, charge_minor, net_minor, currency, next_renewal_minor, interval, by_provider]
      properties:
        timing: { type: string, enum: [CHANGE_TIMING_IMMEDIATELY, CHANGE_TIMING_PERIOD_END] }
        credit_minor: { type: string, description: "The unused, prepaid part of the old fee", format: int64 }
        charge_minor: { type: string, description: What the new plan costs from the change, format: int64 }
        net_minor: { type: string, description: "charge - credit: positive is invoiced, negative becomes a credit balance", format: int64 }
        currency: { type: string }
        next_renewal_time: { type: string, format: date-time }
        next_renewal_minor: { type: string, format: int64 }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        by_provider: { type: boolean }
      description: "The preview of a change at the payment provider (the provider subscription routes of the operator API)"
    ScheduledChange:
      type: object
      required: [plan_code, plan_version, interval, effective_time, quantity]
      properties:
        plan_code: { type: string }
        plan_version: { type: integer }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        effective_time: { type: string, format: date-time, nullable: true }
        quantity: { type: integer, description: The seats the subscription has from then }
    WebhookScheduledChange:
      type: object
      properties:
        plan_code: { type: string }
        plan_version: { type: integer }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR] }
        effective_time: { type: string, format: date-time }
        quantity: { type: integer, description: The seats the subscription has from then }
      description: "Marshalled without unpopulated fields: a field at its zero value (empty string, 0, false, unset timestamp) is left out."
    CurrencyFee:
      type: object
      required: [currency, base_fee_minor, interval]
      properties:
        currency: { type: string }
        base_fee_minor: { type: string, format: int64 }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR], description: Default month }
    CurrencyFeeInput:
      type: object
      properties:
        currency: { type: string }
        base_fee_minor: { type: string, format: int64 }
        interval: { type: string, enum: [SUBSCRIPTION_INTERVAL_MONTH, SUBSCRIPTION_INTERVAL_YEAR], description: Default month }
    MailSettings:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [category, enabled]
            properties:
              category: { type: string, enum: [invoice_issued, payment_receipts, payment_failed, usage_alerts, system] }
              enabled: { type: boolean }
    MailSettingsInput:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              category: { type: string, enum: [invoice_issued, payment_receipts, payment_failed, usage_alerts, system] }
              enabled: { type: boolean }
    RoutingRules:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [country, currency, provider]
            properties:
              country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2; empty matches any country }
              currency: { type: string, description: ISO 4217; empty matches any currency }
              provider: { type: string, enum: [iyzico, paddle, banktransfer] }
    RoutingRulesInput:
      type: object
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2; empty matches any country }
              currency: { type: string, description: ISO 4217; empty matches any currency }
              provider: { type: string, enum: [iyzico, paddle, banktransfer] }
    Tenant:
      type: object
      required: [id, account_id, app_id, address, legal, e_invoice_on, environment, name, tier, currency, timezone, grace_period, create_time, status, activate_time, terms_accept_time, invoice_logo_asset_id]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        address: { allOf: [{ $ref: "#/components/schemas/Address" }], nullable: true }
        legal: { allOf: [{ $ref: "#/components/schemas/LegalInfo" }], nullable: true }
        e_invoice_on: { type: string, enum: ["off", finalized, paid], description: When an invoice becomes an e-document }
        environment: { type: string, enum: [ENVIRONMENT_SANDBOX, ENVIRONMENT_LIVE] }
        name: { type: string }
        tier: { type: string }
        currency: { type: string }
        timezone: { type: string }
        grace_period: { type: string, nullable: true }
        create_time: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [TENANT_STATUS_INACTIVE, TENANT_STATUS_ACTIVE, TENANT_STATUS_SUSPENDED], description: "A sandbox tenant is always active. A live tenant starts inactive: no keys, no webhook endpoints, no invoices, until the go-live checklist is complete." }
        activate_time: { type: string, format: date-time, nullable: true }
        terms_accept_time: { type: string, format: date-time, nullable: true }
        invoice_logo_asset_id: { type: string }
    SandboxReset:
      type: object
      required: [id, state, kind, error, create_time, finish_time, steps]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, done, failed] }
        kind: { type: string, enum: [manual, retention] }
        error: { type: string }
        create_time: { type: string, format: date-time, nullable: true }
        finish_time: { type: string, format: date-time, nullable: true }
        steps:
          type: array
          items:
            type: object
            required: [name, state, deleted, error]
            properties:
              name: { type: string, enum: [plans, ingest, aggregator, analytics, billing, payments] }
              state: { type: string, enum: [pending, done, failed, skipped] }
              deleted: { type: object, additionalProperties: { type: string, format: int64 }, description: "Rows deleted, by table." }
              error: { type: string }
    GoLive:
      type: object
      required: [tenant_id, status, ready, items]
      properties:
        tenant_id: { type: string, format: uuid }
        status: { type: string, enum: [TENANT_STATUS_INACTIVE, TENANT_STATUS_ACTIVE, TENANT_STATUS_SUSPENDED] }
        ready: { type: boolean, description: Every item is done. }
        items:
          type: array
          items:
            type: object
            required: [key, done]
            properties:
              key: { type: string, enum: [email_verified, legal_profile, payment_provider, plan_published, terms_accepted] }
              done: { type: boolean }
    LiveProviders:
      type: object
      required: [ready, providers, accounts]
      properties:
        ready: { type: boolean, description: At least one account works. }
        providers: { type: array, items: { type: string }, description: The providers whose accounts work. }
        accounts:
          type: array
          items:
            type: object
            required: [provider, default, working, checked, updated_at]
            properties:
              provider: { type: string }
              default: { type: boolean, description: Live charges go to the default account unless a routing rule says otherwise. }
              working: { type: boolean }
              checked: { type: boolean, description: The provider itself was asked. }
              problem: { type: string, enum: [unreadable, refused, unreachable] }
              updated_at: { type: string, format: date-time }
    Account:
      type: object
      required: [id, name, tenants, apps, create_time]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenants: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
        apps: { type: array, items: { $ref: "#/components/schemas/App" } }
        create_time: { type: string, format: date-time, nullable: true }
    App:
      type: object
      required: [id, account_id, name, slug, tenants, create_time, archive_time]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        tenants: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
        create_time: { type: string, format: date-time, nullable: true }
        archive_time: { type: string, format: date-time, description: Set once the app was deleted (archived); only the operator API lists such an app., nullable: true }
    ApiKeyRole:
      type: string
      enum: [admin, billing, read_only, ingest_only, custom]
      description: "admin: every permission. billing: customers, subscriptions, credits and invoices, with events, the catalogue and usage to read. read_only: every :read. ingest_only: events:write. custom: the permissions chosen."
    ApiKeyPermission:
      type: string
      enum: [events:write, customers:read, customers:write, subscriptions:read, subscriptions:write, catalog:read, catalog:write, usage:read, credits:read, credits:write, invoices:read, invoices:write, reports:read, accounting:read, accounting:write, webhooks:read, webhooks:write, affiliates:read, affiliates:write, settings:read, settings:write, assets:read, assets:write, sandbox:write]
      description: "resource:action. The route /v1/{resource}... with GET is :read, any other method :write; /v1/events needs events:write and /v1/sandbox/* sandbox:write."
    MailIntegration:
      type: object
      description: The tenant's own e-mail provider. The key is never returned.
      required: [provider, base_url, from, key_hint, update_time, checked_time, check_problem]
      properties:
        provider: { type: string, enum: [nafru] }
        base_url: { type: string }
        from: { type: string }
        key_hint: { type: string, description: The last four characters of the stored key }
        update_time: { type: string, format: date-time, nullable: true }
        checked_time: { type: string, format: date-time, description: When the provider last accepted the key, nullable: true }
        check_problem: { type: string, enum: ["", unreachable, refused] }
    ApiKey:
      type: object
      required: [id, tenant_id, prefix, environment, status, create_time, revoke_time, scope, role, permissions, last_used_time, expire_time]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        prefix: { type: string }
        environment: { type: string, enum: [ENVIRONMENT_SANDBOX, ENVIRONMENT_LIVE] }
        status: { type: string, enum: [STATUS_ACTIVE, STATUS_REVOKED] }
        create_time: { type: string, format: date-time, nullable: true }
        revoke_time: { type: string, format: date-time, nullable: true }
        scope: { type: string, enum: [SCOPE_FULL, SCOPE_INGEST, SCOPE_READ], description: "Older summary of the role: INGEST for ingest_only, READ for read_only, FULL for the rest. Nothing enforces it; the permissions do." }
        role: { $ref: "#/components/schemas/ApiKeyRole" }
        permissions: { type: array, items: { $ref: "#/components/schemas/ApiKeyPermission" }, description: "What the key may do. A request that needs one the key lacks is 403 gateway.auth.permission_denied." }
        last_used_time: { type: string, format: date-time, description: Kept to within a few minutes., nullable: true }
        expire_time: { type: string, format: date-time, description: The key stops working at this time although it is not revoked (the old key of a rotation)., nullable: true }
