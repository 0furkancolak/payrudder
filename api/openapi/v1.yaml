      summary: Change the plan or interval of a subscription the provider runs, at the provider, and let Payrudder's copy follow
      description: >
        200 when the provider applied the change and Payrudder followed; 202 when the provider applied it and Payrudder will follow when the provider's notification arrives.
        A payment that fails prevents the change.
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [iyzico, paddle] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: environment, in: query, required: true, schema: { type: string, enum: [sandbox, live] } }
